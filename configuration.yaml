homeassistant:
  # Load packages
  packages: !include_dir_named integrations/
  allowlist_external_dirs:
    - "/config/"
    - "/config/notifs"
# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

script: !include scripts.yaml
scene: !include scenes.yaml

# Pour script python
# python_script: 

# Pour powercalc
powercalc:

# Pour Cloudflared
http:
  use_x_forwarded_for: true

  trusted_proxies:
    - 172.30.0.0/16   # tous les add-ons / ingress / tunnels
    - 192.168.1.0/24  # ton LAN local
  # Protège l’accès à HA
  ip_ban_enabled: true
  # bannissement IP"
  login_attempts_threshold: 3
  # seuil de tentatives
  #clé privé / public
  #ssl_certificate: /ssl/local.crt
  #ssl_key: /ssl/local.key

#renvoi au fichier automations.yaml
automation: !include automations.yaml

#renvoi au fichier répertoire automations/
#automation: !include_dir_merge_list automations/

#renvoi au fichier répertoire sensors/
sensor: !include_dir_merge_list sensors/
# renvoi au fichier sensors.yaml
#sensor: !include sensors.yaml

#renvoi au fichier répertoire templates/
template: !include_dir_merge_list templates/

#renvoi au fichier répertoire utility_meter/
utility_meter: !include_dir_merge_list utility_meter/
#renvoi au fichier utility_meter.yaml
#utility_meter: !include utility_meter.yaml

# renvoi au fichier commad_line.yaml
command_line: !include command_line.yaml

#renvoi au fichier camera.yaml -> carte meteo france alerte
camera: !include camera.yaml

#renvoi au fichier groupe
group: !include group.yaml

#revoin au fuchier input_number.yaml
input_number: !include input_number.yaml

#revoin au fuchier input_boolean.yaml
input_boolean: !include input_boolean.yaml

#renvoi au fichier shell_command.yaml
# Services shell_command (NOUVEAU)
shell_command: !include shell_command.yaml

#renvoi au fichier input_text.yaml
input_text: !include input_text.yaml

#renvoi au fichier input_select.yaml
input_select: !include input_select.yaml

#renvoi au fichier sql.yaml
sql: !include sql.yaml

# Amazon
alexa_media:
  accounts:
    - email: !secret amazon_user
      password: !secret amazon_password
      url: amazon.fr

# ==========================================================================
# Zone NOTIFY
# ==========================================================================
notify:
# diag_conso_elec.txt
  - platform: file
    name: diag_log_file
    filename: diag_conso_elec.txt

# ==========================================================================
# BASE DE DONNEE MariaDB
# ==========================================================================
recorder:
  db_url: mysql://homeassistant:MariaDB@core-mariadb/homeassistant?charset=utf8mb4
  purge_keep_days: 7
  auto_purge: true
  auto_repack: true
  exclude:
    domains:
      - update
      - persistent_notification
      - sun
      - input_text

    event_types:
      - call_service

    entity_globs:
      - sensor.127_0_0_1*
      - sensor.*linkquality
      - sensor.*last_seen
      - sensor.date*
      - sensor.time*
      - sensor.toshiba*
      - sensor.sandisk*
      - sensor.samsung_ssd_970_evo_plus*
      - sensor.nvidia_nvidia_geforce_rtx_3060*
      - sensor.gigabyte_b450_aorus_elite*
      - sensor.generic_memory*
      - sensor.ethernet*
      - sensor.amd_ryzen_9_5900x*

#openai_conversation:
#  api_key: !secret chat_gpt_api_key
#  model: "gpt-4o-mini"

bluetooth:

#Speed Test
speedtestdotnet:
  scan_interval:
    minutes: 30  # Lance un test toutes les 30 minutes
  monitored_conditions:
    - ping
    - download
    - upload

#smartIR
climate:
  - platform: smartir
    name: Clim Bureau RM4-Mini
    unique_id: clim_bureau_rm4_mini
    device_code: 1108
    controller_data: remote.clim_bureau
    temperature_sensor: sensor.th_bureau_temperature
    humidity_sensor: sensor.th_bureau_humidity

  - platform: smartir
    name: Clim Chambre RM4-Mini
    unique_id: clim_chambre_rm4_mini
    device_code: 1108
    controller_data: remote.clim_chambre
    temperature_sensor: sensor.th_chambre_temperature
    humidity_sensor: sensor.th_chambre_humidity

  - platform: smartir
    name: Clim Salon RM4-Mini
    unique_id: clim_salon_rm4_mini
    device_code: 1082
    controller_data: remote.clim_salon
    temperature_sensor: sensor.th_salon_temperature
    humidity_sensor: sensor.th_salon_humidity