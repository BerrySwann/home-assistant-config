homeassistant:
  # Load packages
  packages: !include_dir_named integrations/
  allowlist_external_dirs:
    - "/config/"
    - "/config/notifs"
# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

script: !include scripts.yaml
scene: !include scenes.yaml

# Pour script python
# python_script: 

# Pour powercalc
powercalc:

# Pour Cloudflared
http:
  use_x_forwarded_for: true

  trusted_proxies:
    - 172.30.0.0/16   # tous les add-ons / ingress / tunnels
    - 192.168.1.0/24  # ton LAN local
  # Protège l’accès à HA
  ip_ban_enabled: true
  # bannissement IP"
  login_attempts_threshold: 3
  # seuil de tentatives
  #clé privé / public
  #ssl_certificate: /ssl/local.crt
  #ssl_key: /ssl/local.key

#renvoi au fichier automations.yaml
automation: !include automations.yaml

#renvoi au fichier répertoire automations/
#automation: !include_dir_merge_list automations/

#renvoi au fichier répertoire template/
template: !include_dir_merge_list templates/

# renvoi au fichier commad_line.yaml
command_line: !include command_line.yaml

#renvoi au fichier camera.yaml -> carte meteo france alerte
camera: !include camera.yaml

#renvoi au fichier utility_meter.yaml
utility_meter: !include utility_meter.yaml

#renvoi au fichier groupe
group: !include group.yaml

#revoin au fuchier input_number.yaml
input_number: !include input_number.yaml

#revoin au fuchier input_boolean.yaml
input_boolean: !include input_boolean.yaml

sensor: !include sensors.yaml

#renvoi au fichier shell_command.yaml
# Services shell_command (NOUVEAU)
shell_command: !include shell_command.yaml

#renvoi au fichier input_text.yaml
input_text: !include input_text.yaml

#renvoi au fichier input_select.yaml
input_select: !include input_select.yaml

# Amazon
alexa_media:
  accounts:
    - email: !secret amazon_user
      password: !secret amazon_password
      url: amazon.fr

# Telegram
telegram_bot:
  - platform: polling
    api_key: !secret telegram_token
    allowed_chat_ids: 
    - !secret id_telegram_HA-Bot

# ==========================================================================
# Zone NOTIFY
# ==========================================================================
notify:
# diag_conso_elec.txt
  - platform: file
    name: diag_log_file
    filename: diag_conso_elec.txt

# Telegram
  - platform: telegram
    name: Telegram
    chat_id: !secret id_telegram_HA-Bot

# ==========================================================================
# BASE DE DONNEE MariaDB
# ==========================================================================
recorder:
  db_url: mysql://homeassistant:MariaDB@core-mariadb/homeassistant?charset=utf8mb4
  purge_keep_days: 7
  auto_purge: true
  auto_repack: true
  include:
    # --- ON AUTORISE L'HISTORIQUE POUR LES GRAPHIQUES DU DASHBOARD ---
    entity_globs:
      # PÔLE 1 : PRISES (Consommations majeures)
      - sensor.entree_box_internet_power # [L8] modif
      - sensor.salon_pc_s_gege_power     # [L9] modif
      - sensor.cuisine_*_power           # [L10] modif : (Lave-linge, Vaisselle, Four, etc.)
      - sensor.bureau_bureau_pc_power    # [L11] modif
      - sensor.chambre_tv_power          # [L12] modif
      - sensor.standby_*_power           # [L13] modif : Pour puissance de croisière
      
      # PÔLE 2 : CHAUFFAGE / CLIM
      - sensor.clim_*_power              # [L16] modif : Salon, Bureau, Chambre
      - sensor.radiateur_cuisine_power   # [L17] modif
      - sensor.sdb_soufflant_power       # [L18] modif
      - sensor.sdb_seche_serv_power      # [L19] modif
      
      # STATISTIQUES ÉNERGIE (Séries 11, 17, 18)
      - sensor.*_daily                   # [L22] modif : Consos journalières
      - sensor.*_avg_watts_daily         # [L23] modif : Moyennes de croisière
      - sensor.linky_* # [L24] modif : Données Ecojoko/Linky

  exclude:
    # --- ON BLOQUE LE RESTE POUR PROTÉGER LE SSD ---
    domains:
      - remote                  # Broadlink
      - update                  # Updates système
      - weather                 # Météo (trop d'attributs)
      - scene                   # Scènes Hue
      - persistent_notification # Notifications
      - sun                     # Soleil
      - device_tracker          # GPS (Gros pollueur)
      - automation              # On garde uniquement le Logbook
      - button                  # Appuis boutons
      - group                   # États de groupes

    entity_globs:
      # SIGNAL & RÉSEAU (Très bruyant)
      - sensor.*_lqi
      - sensor.*_rssi
      - sensor.*linkquality
      - sensor.*last_seen
      
      # BATTERIES & ÉLECTRIQUE SECONDAIRE
      - sensor.*_battery        # Pas besoin de courbe pour les piles
      - sensor.*_voltage        # Tension 230V inutile en graphique
      
      # ON EXCLUT LE RESTE DU POWER/CURRENT NON LISTÉ DANS LE INCLUDE
      - sensor.*_power          # [L51] modif : Bloque les petites prises non critiques
      - sensor.*_current        # [L52] modif : Bloque l'intensité (sauf si besoin spécifique)

    entities:
      - sun.sun
      - sensor.date
      - sensor.time
      - sensor.uptime

