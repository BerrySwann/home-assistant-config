homeassistant:
  # Load packages
  packages: !include_dir_named integrations/
  allowlist_external_dirs:
    - "/config/"
    - "/config/notifs"
# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

script: !include scripts.yaml
scene: !include scenes.yaml

# Pour script python
# python_script: 

# Pour powercalc
powercalc:

# Pour Cloudflared
http:
  use_x_forwarded_for: true

  trusted_proxies:
    - 172.30.0.0/16   # tous les add-ons / ingress / tunnels
    - 192.168.1.0/24  # ton LAN local
  # Protège l’accès à HA
  ip_ban_enabled: true
  # bannissement IP"
  login_attempts_threshold: 3
  # seuil de tentatives
  #clé privé / public
  #ssl_certificate: /ssl/local.crt
  #ssl_key: /ssl/local.key

#renvoi au fichier automations.yaml
automation: !include automations.yaml

#renvoi au fichier répertoire automations/
#automation: !include_dir_merge_list automations/

#renvoi au fichier répertoire template/
template: !include_dir_merge_list templates/

# renvoi au fichier commad_line.yaml
command_line: !include command_line.yaml

#renvoi au fichier camera.yaml -> carte meteo france alerte
camera: !include camera.yaml

#renvoi au fichier utility_meter.yaml
utility_meter: !include utility_meter.yaml

#renvoi au fichier groupe
group: !include group.yaml

#revoin au fuchier input_number.yaml
input_number: !include input_number.yaml

#revoin au fuchier input_boolean.yaml
input_boolean: !include input_boolean.yaml

sensor: !include sensors.yaml

#renvoi au fichier shell_command.yaml
# Services shell_command (NOUVEAU)
shell_command: !include shell_command.yaml

#renvoi au fichier input_text.yaml
input_text: !include input_text.yaml

#renvoi au fichier input_select.yaml
input_select: !include input_select.yaml

# Amazon
alexa_media:
  accounts:
    - email: !secret amazon_user
      password: !secret amazon_password
      url: amazon.fr

# Telegram
telegram_bot:
  - platform: polling
    api_key: !secret telegram_token
    allowed_chat_ids: 
    - !secret id_telegram_HA-Bot

# ==========================================================================
# Zone NOTIFY
# ==========================================================================
notify:
# diag_conso_elec.txt
  - platform: file
    name: diag_log_file
    filename: diag_conso_elec.txt

# Telegram
  - platform: telegram
    name: Telegram
    chat_id: !secret id_telegram_HA-Bot

# ==========================================================================
# BASE DE DONNEE MariaDB
# ==========================================================================
recorder:
  db_url: mysql://homeassistant:MariaDB@core-mariadb/homeassistant?charset=utf8mb4
  purge_keep_days: 7
  auto_purge: true
  auto_repack: true
  exclude:
    domains:
      - remote                  # Vos 3 Broadlink RM4 Mini
      - update                  # Mises à jour (Spook, etc.)
      - weather                 # Météo (très lourd en attributs)
      - scene                   # Scènes Hue
      - persistent_notification # Notifications système
      - sun                     # Domaine soleil
      - input_text              # Zones de texte
      - device_tracker          # Suivi GPS/Réseau (le plus gros pollueur)
      - automation              # Historique des déclenchements (on garde le Logbook)
      - button                  # Appuis sur boutons virtuels
      - group                   # États des groupes
      - zone                    # Définition des zones

    event_types:
      - call_service            # Évite de noter chaque appel de service

    entity_globs:
      # --- PRÉSENCE & RÉSEAU (LE BRUIT GPS / SIGNAL) ---
      - sensor.*_estimated_distance  # Distance estimée (App Mobile)
      - sensor.*_force_du_signal     # Signal WiFi/Zigbee (Français)
      - sensor.*_lqi                 # Qualité lien Zigbee
      - sensor.*_rssi                # Signal Wi-Fi (Anglais)
      - sensor.*_linkquality         # Qualité de lien
      - sensor.*_last_seen           # Horodatage de dernière vue
      - sensor.*_device_tracker      # Capteurs de suivi dérivés
      - binary_sensor.*_connectivity # Tests de connexion

      # --- ÉLECTRICITÉ & BATTERIES ---
      - sensor.*_battery             # Niveaux de piles (Sonoff, IKEA, etc.)
      - sensor.*_power               # Puissance Watts (très bruyant/instable)
      - sensor.*_voltage             # Tension (V)
      - sensor.*_current             # Intensité (A)
      
      # --- CALCULS & STATS (VOS 8 SECTIONS) ---
      - sensor.*_avg_watts_daily     # Vos moyennes journalières
      - sensor.eclairage_*_um        # Vos Utility Meters sources (Calculs internes)
      - binary_sensor.contact_fenetre_* # État des ouvertures Sonoff

      # --- HARDWARE & SYSTÈME (VOTRE PC) ---
      - sensor.127_0_0_1* # Monitoring Localhost
      - sensor.sun* # Position soleil
      - sensor.date* # Date (change inutilement en base)
      - sensor.time* # Heure (écrit toutes les minutes !)
      - sensor.toshiba* # Disque Dur
      - sensor.sandisk* # SSD
      - sensor.samsung_ssd_970_evo_plus*
      - sensor.nvidia_nvidia_geforce_rtx_3060*
      - sensor.gigabyte_b450_aorus_elite*
      - sensor.generic_memory*
      - sensor.ethernet*
      - sensor.amd_ryzen_9_5900x*
      - sensor.*_uptime              # Temps de fonctionnement (change sans cesse)

    entities:
      - sensor.lights                         # Compteur global
      - sensor.direction_de_l_eclair_label    # Blitzortung
      - sensor.blitzortung_lightning_azimuth  # Blitzortung
      - sun.sun                               # Entité racine soleil

sql:
  - name: Taille DB Home Assistant
    # Crée sensor.taille_db_home_assistant"
    db_url: mysql://homeassistant:MariaDB@core-mariadb/homeassistant?charset=utf8mb4
    # core-mariadb : URL de la DB de l’add-on MariaDB"
    query: >
      SELECT Round(Sum(data_length + index_length) / POWER(1024,2), 1) AS value
      FROM information_schema.tables
      WHERE table_schema = "homeassistant";
    # Requête 'Database size' (doc officielle MariaDB/MySQL)"
    column: value
    unit_of_measurement: MiB
    device_class: data_size
    unique_id: taille_db_home_assistant

