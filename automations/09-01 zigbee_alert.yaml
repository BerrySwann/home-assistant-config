- id: '1746961812704'
  alias: Z2M last_seen
  description: ''
  triggers:
    - at: 06:00:00
      trigger: time
    - trigger: time_pattern
      minutes: /15
  conditions:
    - condition: template
      value_template: '{{ sensors != '''' and (day | int == 0 or day | int == now().isoweekday()) }}'
  actions:
    - choose: []
      default:
        - action: notify.mobile_app_poco_x7_pro
          metadata: {}
          data:
            message: 'Des capteurs Zigbee ne sont plus joignables : {% set result = namespace(sensors=[]) %} {% for state in states.sensor | selectattr(''attributes.device_class'', ''=='', ''timestamp'') %} {% if ''last_seen'' in state.entity_id and (states(state.entity_id) == ''unavailable'' or ((as_timestamp(now()) - as_timestamp(states(state.entity_id))) > ((24 | int) * 60 * 60))) %} {% set result.sensors = [state.name | regex_replace(find=''_last_seen'', replace='''') ~ '' ('' ~ relative_time(strptime(states(state.entity_id), ''%Y-%m-%dT%H:%M:%S%z'', ''unavailable'')) ~ '')''] %} {{ "*" }}{{ result.sensors | join('', '') }}{{ "*" }} {% endif %} {% endfor %}'
            title: Problème capteur Zigbee
  variables:
    day: 0
    hours: 24
    exclude:
      entity_id: []
    sensors: '{% set result = namespace(sensors=[]) %} {% for state in states.sensor | rejectattr(''attributes.device_class'', ''undefined'') | selectattr(''attributes.device_class'', ''=='', ''timestamp'') %}   {% if ''last_seen'' in state.entity_id and not state.entity_id in exclude.entity_id and (states(state.entity_id) == ''unavailable'' or ((as_timestamp(now()) - as_timestamp(states(state.entity_id))) > ((hours | int) * 60 * 60))) %}     {% set result.sensors = result.sensors + [state.name | regex_replace(find='' last seen'', replace='''') ~ '' ('' ~ relative_time(strptime(states(state.entity_id), ''%Y-%m-%dT%H:%M:%S%z'', ''unavailable'')) ~ '')''] %}   {% endif %} {% endfor %} {{ result.sensors | join('', '') }}'
  mode: single
