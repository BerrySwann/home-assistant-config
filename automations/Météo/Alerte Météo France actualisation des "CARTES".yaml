alias: Alerte Météo France actualisation des "CARTES"
description: ""
triggers:
  - event: start
    id: Start
    trigger: homeassistant
  - at: "06:32:00"
    id: Heure632
    trigger: time
  - at: "16:32:00"
    id: Heure1632
    trigger: time
  - minutes: /5
    id: Toutesles5minutes
    trigger: time_pattern
conditions:
  - condition: or
    conditions:
      - condition: trigger
        id:
          - Start
      - condition: trigger
        id:
          - Heure632
      - condition: trigger
        id:
          - Heure1632
      - condition: and
        conditions:
          - condition: trigger
            id:
              - Toutesles5minutes
          - condition: state
            entity_id: sensor.meteo_france_alertes_image_today
            state: unavailable
        alias: 5minutesETtoday
      - condition: and
        conditions:
          - condition: trigger
            id:
              - Toutesles5minutes
          - condition: state
            entity_id: sensor.meteo_france_alertes_image_tomorrow
            state: unavailable
        alias: 5minutesETtomorrow
actions:
  - data: {}
    target:
      entity_id: sensor.meteo_france_alertes_image_today
    action: homeassistant.update_entity
  - data: {}
    target:
      entity_id:
        - sensor.meteo_france_alertes_image_tomorrow
    action: homeassistant.update_entity
  - delay:
      hours: 0
      minutes: 0
      seconds: 5
      milliseconds: 0
  - alias: Répéter MAJ Today
    repeat:
      count: 1
      sequence:
        - if:
            - condition: state
              entity_id: sensor.meteo_france_alertes_image_today
              state: unavailable
          then:
            - target:
                entity_id: sensor.meteo_france_alertes_image_today
              data: {}
              action: homeassistant.update_entity
            - delay:
                hours: 0
                minutes: 0
                seconds: 5
                milliseconds: 0
  - alias: Répéter MAJ Tomorrow
    repeat:
      count: 1
      sequence:
        - if:
            - condition: state
              entity_id: sensor.meteo_france_alertes_image_tomorrow
              state: unavailable
          then:
            - data: {}
              target:
                entity_id: sensor.meteo_france_alertes_image_tomorrow
              action: homeassistant.update_entity
            - delay:
                hours: 0
                minutes: 0
                seconds: 5
                milliseconds: 0
  - data: {}
    target:
      entity_id:
        - camera.mf_alerte_today
        - camera.mf_alerte_tomorrow
    action: homeassistant.update_entity
mode: single
