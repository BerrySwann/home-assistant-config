- id: '1757248609691'
  alias: '[Backup] Git hourly H+10'
  description: Push Git toutes les heures à H+10
  triggers:
    - minutes: '10'
      trigger: time_pattern
  actions:
    - action: shell_command.git_backup_push
    - data:
        level: info
        message: '[Backup] H+10 exécuté'
      action: system_log.write
  mode: single

- id: '1757248630379'
  alias: '[Backup] Git weekly (dim 03:40)'
  description: Push + tag weekly chaque dimanche à 03:40
  triggers:
    - at: 03:40:00
      trigger: time
  conditions:
    - condition: time
      weekday:
        - sun
  actions:
    - action: shell_command.git_backup_push_weekly
    - data:
        level: info
        message: '[Backup] Weekly exécuté'
      action: system_log.write
  mode: single

- id: '1757248648416'
  alias: '[Backup] Git au démarrage HA'
  description: Push Git immédiatement au boot de Home Assistant
  triggers:
    - event: start
      trigger: homeassistant
  actions:
    - action: shell_command.git_backup_push
    - data:
        level: info
        message: '[Backup] Exécuté au démarrage HA'
      action: system_log.write
  mode: single
