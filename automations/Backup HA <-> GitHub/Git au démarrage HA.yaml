- id: '1757248648416'
  alias: '[Backup] Git au démarrage HA'
  description: Push Git immédiatement au boot de Home Assistant
  triggers:
  - event: start
    trigger: homeassistant
  conditions: []
  actions:
  - action: shell_command.git_backup_push
  - data:
      level: info
      message: '[Backup] Exécuté au démarrage HA'
    action: system_log.write
  mode: single
- id: '1757254231540'
  alias: '[Backup] Alerte si KO 15 min'
  description: Notification si le backup reste en KO pendant 15 minutes
  triggers:
  - entity_id: sensor.backup_github_status
    to: KO
    for: 00:15:00
    trigger: state
  conditions: []
  actions:
  - data:
      title: Backup GitHub
      message: Échec ou pas de commit depuis 15 min. Vérifie /config/.logs/ha_git_backup.log
    action: persistent_notification.create
  mode: single
- &id001
  id: restart_studio_code_server_daily
  alias: Redémarrage quotidien Studio Code Server
  description: ''
  triggers:
  - at: '22:00:00'
    trigger: time
  actions:
  - data:
      addon: a0d7b954_vscode
    action: hassio.addon_restart
  mode: single