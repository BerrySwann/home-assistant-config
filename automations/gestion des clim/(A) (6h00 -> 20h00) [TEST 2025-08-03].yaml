    if:
      - condition: and
        conditions:
          - condition: time
            after: "06:00:00"
            before: "20:00:00"
          - condition: state
            entity_id: binary_sensor.contact_fenetre_salon_ikea_contact
            state: "off"
          - condition: state
            entity_id: binary_sensor.contact_fenetre_cuisine_ikea_contact
            state: "off"
          - condition: state
            entity_id: binary_sensor.contact_fenetre_bureau_ikea_contact
            state: "off"
          - condition: state
            entity_id: binary_sensor.contact_fenetre_chambre_ikea_contact
            state: "off"
          - condition: state
            entity_id: sensor.ne2213_mamour_network_type
            state: wifi
          - condition: state
            entity_id: sensor.ne2213_mamour_wi_fi_connection
            state: Freebox_GG
          - condition: state
            entity_id: sensor.poco_x7_pro_network_type
            state: wifi
          - condition: state
            entity_id: sensor.poco_x7_pro_wi_fi_connection
            state: Freebox_GG
