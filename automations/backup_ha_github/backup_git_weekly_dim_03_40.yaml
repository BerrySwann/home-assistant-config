id: "1757248630379"
alias: "[Backup] Git weekly (dim 03:40)"
description: Push + tag weekly chaque dimanche à 03:40
triggers:
  - at: "03:40:00"
    trigger: time
conditions:
  - condition: time
    weekday:
      - sun
actions:
  - action: shell_command.git_backup_push_weekly
  - data:
      level: info
      message: "[Backup] Weekly exécuté"
    action: system_log.write
mode: single