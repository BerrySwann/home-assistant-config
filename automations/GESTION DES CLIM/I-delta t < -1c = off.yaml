- id: '1754491576463'
  alias: (I) [CLIM 'off' si delta < -1 et T°Ext > 15] Coupe toutes les clim si delta < -1°C et T°Ext > 15°C
  description: 'Éteint toutes les climatisations si le delta (intérieur - extérieur) est < -1°C pendant 10 minutes, que la température extérieure est > 15°C, et que les 3 prises extérieures sont ON. Gère la répartition équilibrée des modes (cool/heat) et la consommation électrique.'
  triggers:
    - entity_id: sensor.temperature_delta_valeur
      below: -1
      for: 00:10:00
      trigger: numeric_state
    - trigger: state
      entity_id:
        - automation.i_clim_off_a_26degext_coupe_les_clim_si_la_tdegext_26deg
  conditions:
    - condition: and
      conditions:
        - condition: template
          value_template: '{{ states(''sensor.th_balcon_nord_temperature'') | float > states(''sensor.temperature_hors_gel_hiver'') | float }}'
        - condition: state
          entity_id: switch.clim_salon_nous
          state: 'on'
        - condition: state
          entity_id: switch.clim_du_bureau_nous
          state: 'on'
        - condition: state
          entity_id: switch.clim_chambre_nous
          state: 'on'
        - condition: time
          after: 08:00:00
          before: '17:00:00'
          weekday:
            - mon
            - tue
            - wed
            - thu
            - fri
            - sat
            - sun
          enabled: false
  actions:
    - data:
        hvac_mode: 'off'
      target:
        entity_id:
          - climate.clim_salon_rm4_mini
          - climate.clim_bureau_rm4_mini
          - climate.clim_chambre_rm4_mini
      action: climate.set_hvac_mode
    - data:
        title: Delta T° < -1°C
        message: Les clim ont été éteintes.
      action: notify.mobile_app_poco_x7_pro
    - delay:
        hours: 1
        minutes: 0
        seconds: 0
        milliseconds: 0
  mode: queued
