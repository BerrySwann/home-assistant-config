- id: '1752138633943'
  alias: (G) [CLIM ] Notification de changement de mode Été/Fan/Hiver
  description: Notification lorsque le mode change entre Été, Ventilateur ou Hiver
    (cool / fan_only / heat)
  triggers:
  - entity_id: sensor.mode_ete_hiver
    trigger: state
  conditions: []
  actions:
  - delay: 00:00:03
  - data:
      message: 'Le mode a changé pour: {{ states(''sensor.mode_ete_hiver_etat'') }}'
      title: CHANGEMENT DE MODE
    action: notify.mobile_app_poco_x7_pro
  mode: single
- id: '1754214931347'
  alias: (E) [CLIM] Notification de fermeture des fenêtres
  description: Envoie une notification lorsqu'une fenêtre est fermée.
  triggers:
  - entity_id:
    - binary_sensor.contact_fenetre_salon_ikea_contact
    - binary_sensor.contact_fenetre_cuisine_ikea_contact
    - binary_sensor.contact_fenetre_bureau_ikea_contact
    - binary_sensor.contact_fenetre_chambre_ikea_contact
    from: 'on'
    to: 'off'
    trigger: state
  actions:
  - data:
      title: Fermeture en cours
      message: "{% if trigger.entity_id == 'binary_sensor.contact_fenetre_salon_ikea_contact'
        %}\n  La fenêtre du Salon a été fermée.\n{% elif trigger.entity_id == 'binary_sensor.contact_fenetre_cuisine_ikea_contact'
        %}\n  La fenêtre de la Cuisine a été fermée.\n{% elif trigger.entity_id ==
        'binary_sensor.contact_fenetre_bureau_ikea_contact' %}\n  La fenêtre du Bureau
        a été fermée.\n{% elif trigger.entity_id == 'binary_sensor.contact_fenetre_chambre_ikea_contact'
        %}\n  La fenêtre de la Chambre a été fermée.\n{% endif %} {% if states('sensor.nbre_de_fenetres_fermees')
        == '4' %}\n  Toutes les fenêtres sont maintenant fermées.\n{% endif %}"
    action: notify.mobile_app_poco_x7_pro
  mode: queued