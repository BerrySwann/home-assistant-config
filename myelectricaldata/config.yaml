# annotations_log:
# - "[NET1] home_assistant_ws.url: ajout 'http://'"
# - "[SEC1] Remplacer le token HA (sécurité)"
# - "[INF1] influxdb.enable → false (éviter le doublon)"
# - "[REF1] cache → false pour refill"
# - "[REF2] consumption_detail_max_date → 1970-01-01"
# - "[REF3] consumption_max_date → 1970-01-01"
# - "[PRC1..3] Tarifs TTC BASE/HC/HP"
# - "[HPHC1..7] Plages HC au format '01H00-07H30;13H00-14H30'"
# - "[META1] refresh_addresse → refresh_address"
# - "[META2] refresh_contract → true pour resynchroniser le contrat"
# - "[SEC2] Token Enedis en placeholder"
