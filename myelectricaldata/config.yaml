cycle: 14400
debug: true

home_assistant:
  discovery: true
  discovery_prefix: homeassistant
  enable: true

home_assistant_ws:
  enable: true
  ssl: false
  url: 192.168.1.96:8123
  # "[NET1] Ajout du schéma 'http://' "
  token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJhYzc5OGYzOTFiZjE0ZjdiOTViY2M5ZjAxZmQ5M2I4MCIsImlhdCI6MTc1NzI0NDY2NCwiZXhwIjoyMDcyNjA0NjY0fQ.n5XPcR09JOHHGNo1DZoV781D8ycCV6oUIS7M7RVLeAw
  # "[SEC1] Remplace par un nouveau token HA (tu as exposé l'ancien)"

influxdb:
  enable: false
  # "[INF1] InfluxDB désactivé (évite le doublon avec MariaDB)"
  bucket: myelectricaldata
  hostname: influxdb
  port: 8086
  org: myelectricaldata
  token: myelectricaldata
  method: synchronous
  batching_options:
    batch_size: 1000
    exponential_base: 2
    flush_interval: 1000
    jitter_interval: 0
    max_retries: 5
    max_retry_delay: 125000
    max_retry_time: 180000
    retry_interval: 5000

log2file: false

mqtt:
  client_id: myelectricaldata
  enable: true
  hostname: core-mosquitto
  password: mqtt
  port: 1883
  prefix: myelectricaldata
  qos: 0
  retain: true
  username: mqtt

myelectricaldata:
  '25481620821301':
    addresses: true
    cache: false
    # "[REF1] Purge logique: désactive le cache pendant le refill"
    consumption: true
    consumption_detail: true
    consumption_detail_max_date: '1970-01-01'
    # "[REF2] Reset historique 30 min pour recalcul HP/HC"
    consumption_max_date: '1970-01-01'
    # "[REF3] Reset calcul puissance max"
    consumption_max_power: true

    # --- Tarifs ---
    consumption_price_base: 0.1952
    # "[PRC1] Prix TTC BASE"
    consumption_price_hc: 0.1635
    # "[PRC2] Prix HC TTC"
    consumption_price_hp: 0.2081
    # "[PRC3] Prix HP TTC"

    enable: true
    name: Appartement
    plan: HC/HP

    # --- Heures Creuses (format strict avec 'H') ---
    offpeak_hours_0: "01H00-07H30;13H00-14H30"
    # "[HPHC1] Lundi au format H (01H00-07H30;13H00-14H30)"
    offpeak_hours_1: "01H00-07H30;13H00-14H30"
    # "[HPHC2] Mardi"
    offpeak_hours_2: "01H00-07H30;13H00-14H30"
    # "[HPHC3] Mercredi"
    offpeak_hours_3: "01H00-07H30;13H00-14H30"
    # "[HPHC4] Jeudi"
    offpeak_hours_4: "01H00-07H30;13H00-14H30"
    # "[HPHC5] Vendredi"
    offpeak_hours_5: "01H00-07H30;13H00-14H30"
    # "[HPHC6] Samedi"
    offpeak_hours_6: "01H00-07H30;13H00-14H30"
    # "[HPHC7] Dimanche"

    production: false
    production_detail: false
    production_detail_max_date: '2021-06-01'
    production_max_date: '2021-06-01'
    production_price: 0.0

    refresh_address: true
    # "[META1] Était 'refresh_addresse' → corrigé"
    refresh_contract: true
    # "[META2] Forcer la maj du contrat (activationDate, etc.)"

    token: GkEdiXHoaXODj3rp_iRCSHYH10cFuJcKUBqq_b1NjZE=
    # "[SEC2] Remplace par ton vrai token Enedis (ne pas publier)"

  "Désactivé":
    cache: false
    consumption: false
    consumption_detail: false
    consumption_detail_max_date: '1970-01-01'
    consumption_max_date: '1970-01-01'
    consumption_price_base: 0
    consumption_price_hc: 0
    consumption_price_hp: 0
    enable: false
    name: "Désactivé"
    offpeak_hours_0: ""
    offpeak_hours_1: ""
    offpeak_hours_2: ""
    offpeak_hours_3: ""
    offpeak_hours_4: ""
    offpeak_hours_5: ""
    offpeak_hours_6: ""
    plan: BASE
    production: false
    production_detail: false
    production_detail_max_date: '1970-01-01'
    production_max_date: '1970-01-01'
    production_price: 0
    refresh_address: false
    refresh_contract: false
    token: TOKEN_DE_MON_PDL_2

wipe_influxdb: false

