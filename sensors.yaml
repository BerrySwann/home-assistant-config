# ╭──────────────────────────────────────────────────────────────────────────╮
# │ SENSOR : NOTIFICATIONS ET SYSTÈME                                        │
# ╰──────────────────────────────────────────────────────────────────────────╯

# --- blitzortung_lightning_localisation ---
  - platform: rest
    name: "Blitzortung Lightning Localisation"
    unique_id: blitzortung_lightning_localisation
    scan_interval: 3600
    resource_template: >-
      {%- set lat = state_attr('sensor.blitzortung_lightning_distance', 'lat') -%}
      {%- set lon = state_attr('sensor.blitzortung_lightning_distance', 'lon') -%}
      https://nominatim.openstreetmap.org/reverse?format=geocodejson&lat={{lat}}&lon={{lon}}
    value_template: '{{ value_json.features | length }}'
    json_attributes:
      - features

# --- mini_pc_charge_moyenne_24h_w ---
  - platform: statistics
    name: "Mini PC Charge Moyenne 24h (W)"
    unique_id: mini_pc_charge_moyenne_24h_w
    entity_id: sensor.prise_mini_pc_ikea_power
    state_characteristic: mean
    max_age: { hours: 24 }
    precision: 1

# --- ping_https_vscode ---
  - platform: rest
    name: "Ping HTTPS VSCode"
    unique_id: ping_https_vscode
    resource: "https://erodi-ha.com/a0d7b954_vscode/ingress"
    method: GET
    timeout: 15
    value_template: "{{ value_json is defined or value is defined }}"
    scan_interval: 60

