#==========================================================================
# Notification FOUDRES Blitzortung
#==========================================================================
- platform: rest
  name: Blitzortung Lightning Localisation
  unique_id: blitzortung_lightning_localisation
  scan_interval: 3600  # Mise à jour toutes les heures au lieu de 24h
  resource_template: >-
    {%- set lat = state_attr('sensor.blitzortung_lightning_distance', 'lat') -%}
    {%- set lon = state_attr('sensor.blitzortung_lightning_distance', 'lon') -%}
    https://nominatim.openstreetmap.org/reverse?format=geocodejson&lat={{lat}}&lon={{lon}}
  value_template: '{{ value_json.features | length }}'
  json_attributes:
    - features

#==========================================================================
# STATISTIQUES MINI-PC (Cerveau du système)
#==========================================================================

# 1. Charge moyenne (Pour savoir si le PC "force" sur 24h)
- platform: statistics
  name: "Mini PC Charge moyenne 24h (W)"
  unique_id: mini_pc_charge_moyenne_24h_w
  entity_id: sensor.prise_mini_pc_ikea_power
  state_characteristic: mean  # <--- Ici le "mean" est BON car on veut la moyenne des Watts
  max_age: { hours: 24 }
  precision: 1

# 2. Consommation réelle sur 24h (Ce qu'il a bouffé en électricité)
- platform: statistics
  name: "Mini PC conso 24h (Wh)"
  unique_id: mini_pc_conso_24h_wh
  entity_id: sensor.prise_mini_pc_ikea_energy # <--- On pointe sur l'énergie
  state_characteristic: change               # <--- On veut la variation réelle
  max_age: { hours: 24 }
  precision: 1

# 3. Consommation réelle sur 30 jours (730h)
- platform: statistics
  name: "Mini PC conso 730h (kWh)"
  unique_id: mini_pc_conso_730h_kwh
  entity_id: sensor.prise_mini_pc_ikea_energy
  state_characteristic: change
  max_age: { hours: 730 }
  precision: 1

#==========================================================================
# Ping VSCode sur erodi-ha.com Mini-PC
#==========================================================================
- platform: rest
  name: "Ping HTTPS VSCode"
  resource: "https://erodi-ha.com/a0d7b954_vscode/ingress"
  method: GET
  timeout: 15
  value_template: "{{ value_json is defined or value is defined }}"
  scan_interval: 60

#==========================================================================
# Calcul moyen ECOJOKO
#==========================================================================
- platform: statistics
  name: Ecojoko mean 730h kWh
  unique_id: ecojoko_mean_730h_kwh
  entity_id: sensor.ecojoko_consommation_reseau
  state_characteristic: mean
  max_age:
    hours: 730
  precision: 1

