#==========================================================================
#
# Notification FOUDRES Blitzortung
#
#==========================================================================

- platform: rest
  name: Blitzortung Lightning Localisation
  unique_id: blitzortung_lightning_localisation
  #entity_id: sensor.blitzortung_lightning_localisation
  scan_interval: 86400
  resource_template: >-
    {%- set lat = state_attr('sensor.blitzortung_lightning_distance', 'lat') -%}
    {%- set lon = state_attr('sensor.blitzortung_lightning_distance', 'lon') -%}
    https://nominatim.openstreetmap.org/reverse?format=geocodejson&lat={{lat}}&lon={{lon}}
  value_template: '{{ value_json.features | length }}'
  json_attributes:
    - features

#==========================================================================
#
# Calcul moyen Prise Mini-PC
#
#==========================================================================

- platform: statistics
  name: Mini PC mean 24h Wh
  unique_id: mini_pc_mean_24h_wh
  entity_id: sensor.prise_mini_pc_ikea_power
  state_characteristic: mean
  max_age:
    hours: 24
  precision: 1
  keep_last_sample: true

- platform: statistics
  name: Mini PC mean 730h Wh
  unique_id: mini_pc_mean_730h_wh
  entity_id: sensor.prise_mini_pc_ikea_energy
  state_characteristic: mean
  max_age:
    hours: 730
  precision: 1
  keep_last_sample: true

#==========================================================================
#
# Calcul moyen ECOJOKO
#
#==========================================================================

- platform: statistics
  name: Ecojoko mean 730h_kWh
  unique_id: ecojoko_mean_730h_kwh
  entity_id: sensor.ecojoko_consommation_reseau
  state_characteristic: mean
  max_age:
    hours: 730
  precision: 1
  keep_last_sample: true

