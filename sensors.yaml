# ╭──────────────────────────────────────────────────────────────────────────╮
# │ SENSOR : NOTIFICATION FOUDRES BLITZORTUNG (SÉRIE 01)                     │
# ╰──────────────────────────────────────────────────────────────────────────╯
- platform: rest
  name: Blitzortung Lightning Localisation
  unique_id: blitzortung_lightning_localisation
  scan_interval: 3600
  resource_template: >-
    {%- set lat = state_attr('sensor.blitzortung_lightning_distance', 'lat') -%}
    {%- set lon = state_attr('sensor.blitzortung_lightning_distance', 'lon') -%}
    https://nominatim.openstreetmap.org/reverse?format=geocodejson&lat={{lat}}&lon={{lon}}
  value_template: '{{ value_json.features | length }}'
  json_attributes:
    - features

# ╭──────────────────────────────────────────────────────────────────────────╮
# │ SENSOR : TEMPS ÉCOULÉ FOUDRE (SÉRIE 01)                                  │
# ╰──────────────────────────────────────────────────────────────────────────╯
    - name: "Dernier Impact de Foudre Temps Ecoule" # [L17] modif
      unique_id: dernier_impact_de_foudre_temps_ecoule # [L18] modif
      icon: mdi:lightning-bolt
      state: >
        {% set last_lightning = states('input_datetime.dernier_eclair') %}
        {% if last_lightning | has_value %}
          {% set last_lightning_ts = as_timestamp(last_lightning) %}
          {% set time_since_last = as_timestamp(now()) - last_lightning_ts %}
          {% set minutes = ((time_since_last % 3600) // 60) | int %}
          {% set hours = ((time_since_last // 3600) % 24) | int %}
          {% set days = (time_since_last // 86400) | int %}
          {% if days > 0 %}
            Dernier impact il y a {{ days }} jours, {{ hours }} h et {{ minutes }} min
          {% elif hours > 0 %}
            Dernier impact il y a {{ hours }} h et {{ minutes }} min
          {% else %}
            Dernier impact il y a {{ minutes }} min
          {% endif %}
        {% else %}
          Dernier impact de foudre : Inconnu
        {% endif %}

# ╭──────────────────────────────────────────────────────────────────────────╮
# │ SENSOR : STATISTIQUES MINI-PC (SANTÉ SYSTÈME)                            │
# ╰──────────────────────────────────────────────────────────────────────────╯
- platform: statistics
  name: "Mini PC Charge moyenne 24h (W)"
  unique_id: mini_pc_charge_moyenne_24h_w
  entity_id: sensor.prise_mini_pc_ikea_power
  state_characteristic: mean
  max_age: { hours: 24 }
  precision: 1

- platform: integration
  source: sensor.prise_mini_pc_ikea_power
  name: prise_mini_pc_ikea_kwh
  method: left
  unit_prefix: k
  unit_time: h
  round: 3

# ╭──────────────────────────────────────────────────────────────────────────╮
# │ SENSOR : PING HTTPS VSCODE (ERODI-HA.COM)                                │
# ╰──────────────────────────────────────────────────────────────────────────╯
- platform: rest
  name: "Ping HTTPS VSCode"
  unique_id: ping_https_vscode # [L65] modif
  resource: "https://erodi-ha.com/a0d7b954_vscode/ingress"
  method: GET
  timeout: 15
  value_template: "{{ value_json is defined or value is defined }}"
  scan_interval: 60

