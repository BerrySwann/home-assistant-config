#==========================================================================
# Notification FOUDRES Blitzortung
#==========================================================================
- platform: rest
  name: Blitzortung Lightning Localisation
  unique_id: blitzortung_lightning_localisation
  scan_interval: 3600  # Mise à jour toutes les heures au lieu de 24h
  resource_template: >-
    {%- set lat = state_attr('sensor.blitzortung_lightning_distance', 'lat') -%}
    {%- set lon = state_attr('sensor.blitzortung_lightning_distance', 'lon') -%}
    https://nominatim.openstreetmap.org/reverse?format=geocodejson&lat={{lat}}&lon={{lon}}
  value_template: '{{ value_json.features | length }}'
  json_attributes:
    - features

#==========================================================================
# Calcul moyen Prise Mini-PC
#==========================================================================
- platform: statistics
  name: Mini PC mean 24h Wh
  unique_id: mini_pc_mean_24h_wh
  entity_id: sensor.prise_mini_pc_ikea_power
  state_characteristic: mean
  max_age:
    hours: 24
  precision: 1

- platform: statistics
  name: Mini PC mean 730h Wh
  unique_id: mini_pc_mean_730h_wh
  entity_id: sensor.prise_mini_pc_ikea_energy
  state_characteristic: mean
  max_age:
    hours: 730
  precision: 1

#==========================================================================
# Ping VSCode sur erodi-ha.com Mini-PC
#==========================================================================
- platform: rest
  name: "Ping HTTPS VSCode"
  resource: "https://erodi-ha.com/a0d7b954_vscode/ingress"
  method: GET
  timeout: 15
  value_template: "{{ value_json is defined or value is defined }}"
  scan_interval: 60

#==========================================================================
# TOP PROCESSUS (Surveillance CPU Mini-PC x86)
#==========================================================================
- platform: command_line
  name: "Top Processus Direct"
  unique_id: top_process_direct
  # Cette commande liste les processus par CPU et rend le nom du premier immédiatement
  command: "ps -eo pcpu,comm --sort=-pcpu | head -n 2 | tail -n 1 | awk '{print $2}'"
  value_template: "{{ value }}"
  scan_interval: 30
  
#==========================================================================
# Calcul moyen ECOJOKO
