#==========================================================================
#
# Notification FOUDRES Blitzortung
#
#==========================================================================

- platform: rest
  # "[L008] Déclaration sensor REST pour géocodage inverse (Blitzortung)"
  name: Blitzortung Lightning Localisation
  # "[L009] Nom lisible pour la localisation des impacts (Nominatim)"
  unique_id: blitzortung_lightning_localisation
  # "[L010] ID unique stable pour ce capteur"
  #entity_id: sensor.blitzortung_lightning_localisation
  scan_interval: 86400
  # "[L012] Fréquence de rafraîchissement (1/jour) – Nominatim tolérant mais à ne pas sur-solliciter"
  resource_template: >-
    {%- set lat = state_attr('sensor.blitzortung_lightning_distance', 'lat') -%} 
    {%- set lon = state_attr('sensor.blitzortung_lightning_distance', 'lon') -%} 
    https://nominatim.openstreetmap.org/reverse?format=geocodejson&lat={{lat}}&lon={{lon}}
  # "[L015] URL Nominatim construite à partir des attributs lat/lon du capteur de distance"
  value_template: '{{value_json.features | length}}'
  # "[L016] État = nb de features retournées (diagnostic simple de réponse)"
  json_attributes:
    - features
  # "[L017] On expose l'objet 'features' complet en attributs pour exploitation UI/templates"

#==========================================================================
#
# Calcul moyen Prise Mini-PC
#
#==========================================================================

- platform: statistics
  name: Mini PC mean 24h Wh
  # "[L026] Moyenne glissante ~30 jours (730h) sur la conso réseau Ecojoko"
  unique_id: mini_pc_mean_24h_wh
  # "[L027] ID unique pour la moyenne 730h"
  entity_id: sensor.prise_mini_pc_ikea_power
  state_characteristic: mean 
  max_age:
    hours: 24
  precision: 1
  keep_last_sample: true

- platform: statistics
  name: Mini PC mean 730h Wh
  # "[L026] Moyenne glissante ~30 jours (730h) sur la conso réseau Ecojoko"
  unique_id: mini_pc_mean_730h_wh
  # "[L027] ID unique pour la moyenne 730h"
  entity_id: sensor.prise_mini_pc_ikea_energy
  state_characteristic: mean 
  max_age:
    hours: 730
  precision: 1
  keep_last_sample: true

