esphome:
  name: capteur-pression-vence
  friendly_name: Capteur Pression Vence

esp32:
  board: esp32-h2-devkitm-1
  variant: esp32h2
  framework:
    type: esp-idf

openthread:
  network_key: "#F72B"

api:
  
ota:
  platform: esphome

i2c:
  sda: GPIO0
  scl: GPIO1
  scan: true

sensor:
  - platform: bme280_i2c
    address: 0x76
    temperature:
      name: "Température Balcon"
    pressure:
      name: "Pression Balcon"
    humidity:
      name: "Humidité Balcon"
    update_interval: 60s

logger:
  level: INFO