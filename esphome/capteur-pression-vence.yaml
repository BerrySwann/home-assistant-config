esphome:
  name: capteur-pression-vence
  friendly_name: Barometre Vence

esp32:
  board: esp32dev
  framework:
    type: arduino

wifi:
  ssid: "Freebox_GG"
  password: "130419701975"

api:

ota:
  - platform: esphome

logger:

i2c:
  sda: 21
  scl: 22
  scan: true

sensor:
  - platform: bmp280_i2c
    address: 0x76
    temperature:
      name: "Température Vence"
      id: temp_vence
    pressure:
      name: "Pression Absolue Vence"
      id: pres_abs
    update_interval: 60s

  - platform: template
    name: "Pression Niveau Mer (Météo)"
    unit_of_measurement: "hPa"
    device_class: "pressure"
    state_class: "measurement"
    lambda: |-
      if (id(pres_abs).has_state()) {
        const float altitude = 325.0; 
        return id(pres_abs).state * powf(1 - 0.0065 * altitude / (id(temp_vence).state + 0.0065 * altitude + 273.15), -5.257);
      } else {
        return NAN;
      }
    update_interval: 60s