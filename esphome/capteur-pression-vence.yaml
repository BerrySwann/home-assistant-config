esphome:
  name: capteur-pression-vence

esp32:
  board: esp32-h2-devkitm-1
  variant: esp32h2
  framework:
    type: esp-idf

# Le composant Zigbee qui ne devrait plus réclamer de nrf52 ici
zigbee:

i2c:
  sda: 0
  scl: 1
  scan: true

sensor:
  - platform: bme280_i2c
    address: 0x76
    temperature:
      name: "Température Balcon"
    pressure:
      name: "Pression Balcon"

logger:
  level: INFO