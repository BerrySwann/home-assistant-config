esphome:
  name: test-h2-vence
  friendly_name: Capteur H2 Zigbee

esp32:
  board: esp32-h2-devkitm-1
  variant: esp32h2
  framework:
    type: esp-idf # Obligatoire pour la radio Zigbee

# On remplace le bloc "zigbee:" qui plante par l'intégration IEEE 802.15.4
# C'est ce qui permet au H2 de "parler" physiquement aux autres
esp32_ble: # On l'active souvent car la radio est partagée
  
# Configuration de la couche Zigbee via ESP-IDF
# Note : ESPHome utilise actuellement des composants externes pour ça
external_components:
  - source: github://oxan/esphome-components@zigbee
    components: [ zigbee ]

zigbee:
  # Cette fois ça passera car on a importé le composant externe