esphome:
  name: capteur-pression-vence
  friendly_name: Capteur Pression Vence

esp32:
  board: esp32-h2-devkitm-1
  variant: esp32h2
  framework:
    type: esp-idf

network:
  enable_ipv6: true

openthread:
  tlv: "0e080000000000010000000300000f4a0300000b35060004001fffe00208bfdddcb70e9f16fe0708fd1e0194dc47d47e0510f2cd981c6046516c443cdb0e2156d392030e68612d7468726561642d626538640102be8d04101558a672a1109f167194144263e0e5a30c0402a0f7f8"

api:

ota:
  platform: esphome

logger:
  level: DEBUG
  baud_rate: 115200

i2c:
  sda: GPIO0
  scl: GPIO1
  scan: true
  frequency: 100kHz

sensor:
  - platform: bmp280_i2c
    address: 0x76
    temperature:
      name: "Température Balcon"
    pressure:
      name: "Pression Balcon"
    update_interval: 60s