# Commande pour le PUSH MANUEL (permet de passer le message via 'data')
git_backup_push_manual: >-
  bash -lc '/config/.scripts/ha_git_backup.sh "{{ custom_message }}" >> /config/.logs/ha_git_backup.log 2>&1'

# Commande pour le PUSH AUTOMATIQUE (générique, sans argument)
git_backup_push: "bash -lc '/config/.scripts/ha_git_backup.sh >> /config/.logs/ha_git_backup.log 2>&1'"

# Commande pour le PUSH WEEKLY (utilise l'argument "weekly")
git_backup_push_weekly: "bash -lc '/config/.scripts/ha_git_backup.sh weekly >> /config/.logs/ha_git_backup.log 2>&1'"

# Commande pour le PULL (pour mettre à jour la configuration locale)
git_pull_ff: >-
  bash -lc 'cd /config &&
  git fetch origin --prune &&
  if git pull --ff-only; then
    echo "✅ Git pull OK: $(date "+%F %T %Z")" >> /config/.logs/ha_git_backup.log;
  else
    echo "❌ Git pull KO: $(date "+%F %T %Z")" >> /config/.logs/ha_git_backup.log;
  fi'

# Ecrire dans le fichier analyse.log pour gimini
# On utilise des guillemets simples ' autour du message pour protéger le JSON
write_to_analyse_log: "echo '{{ message }}' >> /config/analyse.log"