#========================================================================
#
# RÉSEAU — SpeedTest CLI (version optimisée)
#
#========================================================================

- sensor:
  - name: 'SpeedTest Ping'
    unique_id: speedtest_ping
    icon: mdi:speedometer
    unit_of_measurement: ms
    state_class: measurement
    state: >
      {% if states('sensor.speedtest_cli_data') not in ['unknown', 'unavailable'] %}
        {{ (states('sensor.speedtest_cli_data') | from_json).ping.latency | round(2) }}
      {% else %}
        {{ states('sensor.speedtest_cli_ping') }}
      {% endif %}

  - name: 'SpeedTest Download'
    unique_id: speedtest_download
    icon: mdi:download
    unit_of_measurement: Mbit/s
    state_class: measurement
    state: >
      {% if states('sensor.speedtest_cli_data') not in ['unknown', 'unavailable'] %}
        {{ ((states('sensor.speedtest_cli_data') | from_json).download.bandwidth * 8 / 1e6) | round(2) }}
      {% else %}
        {{ states('sensor.speedtest_cli_download') }}
      {% endif %}

