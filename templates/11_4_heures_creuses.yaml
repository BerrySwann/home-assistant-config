#========================================================================
# ALIAS : GESTION DES TARIFS - HEURES CREUSES ÉLECTRIQUES
#========================================================================

- sensor:
  - name: "Heures Creuses Électriques"
    unique_id: heures_creuses_electriques
    state: >
      {% set current_time = now().strftime('%H:%M') %}
      {{ ('01:00' <= current_time < '07:30') or ('13:00' <= current_time < '14:30') }}
    icon: >
      {% if is_state('sensor.heures_creuses_electriques', 'True') %}
        mdi:flash
      {% else %}
        mdi:flash-outline
      {% endif %}