- sensor:
      - name: "Statut Clim Hiver"
        state: "{{ states('sensor.groupe_clim') }}"
        icon: >
          {% if is_state('weather.vence', 'snowy') %}
            mdi:snowflake
          {% elif states('sensor.temperature_exterieure') | float < 15 %}
            mdi:snowflake-thermometer
          {% elif states('sensor.temperature_exterieure') | float > 21 %}
            mdi:weather-sunny
          {% elif states('sensor.temperature_exterieure') | float < 32 %}
            mdi:weather-sunny-alert
          {% else %}
            mdi:weather-sunny
          {% endif %}