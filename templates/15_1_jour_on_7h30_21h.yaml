# ╭────────────────────────────────────────────────────────────────────────╮
# │ BINARY_SENSOR : SÉRIE 15. TEMPS — JOUR (7H30-21H)                      │
# ╰────────────────────────────────────────────────────────────────────────╯

- binary_sensor:
    # ┌───────────────────────────────────┐
    # │ 1. PÉRIODE                        │
    # └───────────────────────────────────┘
    # --- est_jour_7h30_21h ---
    - name: "Est jour (7h30-21h)"
      unique_id: est_jour_7h30_21h
      state: >
        {{ today_at("07:30") <= now() < today_at("21:00") }}

