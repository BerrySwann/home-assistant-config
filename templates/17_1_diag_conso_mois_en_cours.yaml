#========================================================================
# DIAGNOSTIC ÉNERGÉTIQUE - 6 POSTES (CUISSON & FROID SÉPARÉS)
#========================================================================

- sensor:
    #--- POSTE 1 : HYGIÈNE (Linge, Vaisselle, Repassage) ---
    - name: "Diag Poste 1 Hygiene mensuel"
      unique_id: diag_poste_1_hygiene_mensuel
      unit_of_measurement: "kWh"
      device_class: energy
      state_class: total_increasing
      icon: mdi:washing-machine
      state: >
        {{ (states('sensor.prise_lave_linge_nous_monthly') | float(0) + 
            states('sensor.prise_lave_vaisselle_nous_monthly') | float(0) +
            states('sensor.prise_bureau_fer_a_repasser_nous_monthly') | float(0)) | round(3) }}

    #--- POSTE 2 : CUISSON (Four, Plaques, Micro-ondes, Airfryer) ---
    - name: "Diag Poste 2 Cuisson mensuel"
      unique_id: diag_poste_2_cuisson_mensuel
      unit_of_measurement: "kWh"
      device_class: energy
      state_class: total_increasing
      icon: mdi:stove
      state: >
        {{ (states('sensor.prise_four_micro_ondes_nous_monthly') | float(0) +
            states('sensor.prise_airfryer_ninja_nous_monthly') | float(0) +
            states('sensor.four_et_plaque_de_cuisson_monthly') | float(0)) | round(3) }}

    #--- POSTE 3 : FROID (Frigo, Congélateur) ---
    - name: "Diag Poste 3 Froid mensuel"
      unique_id: diag_poste_3_froid_mensuel
      unit_of_measurement: "kWh"
      device_class: energy
      state_class: total_increasing
      icon: mdi:fridge
      state: >
        {{ (states('sensor.prise_frigo_cuisine_nous_monthly') | float(0) + 
            states('sensor.prise_congelateur_cuisine_nous_monthly') | float(0)) | round(3) }}

    #--- POSTE 4 : CHAUFFAGE (Total Clim + Rads) ---
    - name: "Diag Poste 4 Chauffage mensuel"
      unique_id: diag_poste_4_chauffage_mensuel
      unit_of_measurement: "kWh"
      device_class: energy
      state_class: total_increasing
      icon: mdi:fire
      state: >
        {{ states('sensor.conso_clim_rad_total_mensuel') | float(0) | round(3) }}

    #--- POSTE 5 : MULTIMÉDIA (PC, Box, TV) ---
    - name: "Diag Poste 5 Multimedia mensuel"
      unique_id: diag_poste_5_multimedia_mensuel
      unit_of_measurement: "kWh"
      device_class: energy
      state_class: total_increasing
      icon: mdi:monitor-dashboard
      state: >
        {{ (states('sensor.prise_box_internet_ikea_monthly') | float(0) + 
            states('sensor.prise_pc_s_gege_ikea_monthly') | float(0) + 
            states('sensor.prise_bureau_pc_ikea_monthly') | float(0) +
            states('sensor.prise_tv_chambre_nous_monthly') | float(0)) | round(3) }}

    #--- POSTE 6 : LUMIÈRE (Total Éclairage) ---
    - name: "Diag Poste 6 Lumiere mensuel"
      unique_id: diag_poste_6_lumiere_mensuel
      unit_of_measurement: "kWh"
      device_class: energy
      state_class: total_increasing
      icon: mdi:lightbulb
      state: >
        {{ states('sensor.conso_eclairage_total_mensuel') | float(0) | round(3) }}
            
    #--- TOTAL GÉNÉRAL IDENTIFIÉ ---
    - name: "Diag Conso Totale Identifiee mensuelne"
      unique_id: diag_conso_totale_identifiee_mensuelne
      unit_of_measurement: "kWh"
      device_class: energy
      state: >
        {{ (states('sensor.diag_poste_1_hygiene_mensuel') | float(0) + 
            states('sensor.diag_poste_2_cuisson_mensuel') | float(0) + 
            states('sensor.diag_poste_3_froid_mensuel') | float(0) + 
            states('sensor.diag_poste_4_chauffage_mensuel') | float(0) + 
            states('sensor.diag_poste_5_multimedia_mensuel') | float(0) + 
            states('sensor.diag_poste_6_lumiere_mensuel') | float(0)) | round(2) }}