#========================================================================
# DIAGNOSTIC ÉNERGÉTIQUE - SYNTHÈSE DES PÔLES
#========================================================================

- sensor:
    #--- PÔLE 1 : CHAUFFAGE & CLIM (Somme des climatisations et radiateurs) ---
    - name: "Diag Conso Chauffage Quotidien"
      unique_id: diag_conso_chauffage_quotidien
      unit_of_measurement: "kWh"
      device_class: energy
      state_class: total_increasing
      icon: mdi:fire
      state: >
        {{ (states('sensor.clim_salon_quotidien') | float(0) +
            states('sensor.radiateur_elec_cuisine_quotidien') | float(0) +
            states('sensor.clim_du_bureau_5_quotidien') | float(0) +
            states('sensor.radiateur_sdb_2_quotidien') | float(0) +
            states('sensor.seche_serv_sdb_quotidien') | float(0) +
            states('sensor.clim_chambre_4_quotidien') | float(0)) | round(3) }}

    #--- PÔLE 2 : LOISIRS NUMÉRIQUES (Le pôle qui consomme plus que le chauffage !) ---
    - name: "Diag Conso Numérique Quotidien"
      unique_id: diag_conso_numerique_quotidien
      unit_of_measurement: "kWh"
      device_class: energy
      state_class: total_increasing
      icon: mdi:computer
      state: >
        {{ (states('sensor.prise_pc_e_daily') | float(0) + 
            states('sensor.prise_pc_g_daily') | float(0) + 
            states('sensor.prise_box_internet_ikea_daily') | float(0) +
            states('sensor.prise_tv_chambre_nous_daily') | float(0)) | round(3) }}

    #--- PÔLE 3 : ÉCLAIRAGE TOTAL (Basé sur tes compteurs par pièces) ---
    - name: "Diag Conso Eclairage Quotidien"
      unique_id: diag_conso_eclairage_quotidien
      unit_of_measurement: "kWh"
      device_class: energy
      state_class: total_increasing
      icon: mdi:lightbulb-outline
      state: >
        {{ (states('sensor.eclairage_salon_5_quotidien') | float(0) +
            states('sensor.eclairage_cuisine_1_quotidien') | float(0) +
            states('sensor.eclairage_appart_2_quotidien') | float(0) +
            states('sensor.eclairage_bureau_5_quotidien') | float(0) +
            states('sensor.eclairage_sdb_2_quotidien') | float(0) +
            states('sensor.eclairage_chambre_4_quotidien') | float(0)) | round(3) }}

    #--- PÔLE 4 : VIE DOMESTIQUE (Froid et machines) ---
    - name: "Diag Conso Domestique Quotidien"
      unique_id: diag_conso_domestique_quotidien
      unit_of_measurement: "kWh"
      device_class: energy
      state_class: total_increasing
      icon: mdi:home-lightning-bolt
      state: >
        {{ (states('sensor.prise_frigo_cuisine_nous_daily') | float(0) + 
            states('sensor.prise_congelateur_cuisine_nous_daily') | float(0) +
            states('sensor.prise_lave_linge_nous_daily') | float(0) +
            states('sensor.prise_lave_vaisselle_nous_daily') | float(0)) | round(3) }}

    #--- TOTAL GÉNÉRAL IDENTIFIÉ (Pour le suivi global) ---
    - name: "Diag Conso Totale Identifiee Quotidienne"
      unique_id: diag_conso_totale_identifiee_quotidienne
      unit_of_measurement: "kWh"
      device_class: energy
      icon: mdi:sigma
      state: >
        {% set chauffage = states('sensor.diag_conso_chauffage_quotidien') | float(0) %}
        {% set numerique = states('sensor.diag_conso_numerique_quotidien') | float(0) %}
        {% set lumiere = states('sensor.diag_conso_eclairage_quotidien') | float(0) %}
        {% set domestique = states('sensor.diag_conso_domestique_quotidien') | float(0) %}
        {{ (chauffage + numerique + lumiere + domestique) | round(2) }}