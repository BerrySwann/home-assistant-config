#========================================================================
#
# RÉSEAU — SpeedTest CLI (version corrigée)
#
#========================================================================
- sensor:
  - name: 'SpeedTest CLI Ping'
    unique_id: speedtest_cli_ping
    icon: mdi:speedometer
    unit_of_measurement: ms
    state_class: measurement
    device_class: duration
    state: >
      {% if states('sensor.speedtest_cli_data') not in ['unknown', 'unavailable'] %}
        {{ (states('sensor.speedtest_cli_data') | from_json).ping | round(2) }}
      {% else %}
        {{ states('sensor.speedtest_cli_ping') }}
      {% endif %}

  - name: 'SpeedTest CLI Download'
    unique_id: speedtest_cli_download
    icon: mdi:download
    unit_of_measurement: Mbit/s
    state_class: measurement
    device_class: data_rate
    state: >
      {% if states('sensor.speedtest_cli_data') not in ['unknown', 'unavailable'] %}
        {{ ((states('sensor.speedtest_cli_data') | from_json).download * 8 / 1e6) | round(2) }}
      {% else %}
        {{ states('sensor.speedtest_cli_download') }}
      {% endif %}

  - name: 'SpeedTest CLI Upload'
