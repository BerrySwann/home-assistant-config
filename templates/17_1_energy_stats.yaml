- sensor:

# --- ENTRÉE (Box Internet & Horloge) ---
  # Box Internet - Consommation 24h
  - name: prise_box_internet_ikea Conso 24h kWh
    unique_id: prise_box_internet_ikea_conso_24h_kwh
    unit_of_measurement: kWh
    device_class: energy
    state_class: measurement
    state: >
      {% set start = now() - timedelta(hours=24) %}
      {% set history = history_func('sensor.prise_box_internet_ikea_kwh', start) %}
      {% set states = history | map(attribute='state') | reject('eq', 'unavailable') | reject('eq', 'unknown') | map('float', default=0) | list %}
      {% if states | length > 1 %}
        {{ (states | last - states | first) | round(3) }}
      {% else %}
        {{ 0 | float }} 
      {% endif %}

  # Box Internet - Moyenne 730h
  - name: prise_box_internet_ikea mean 730h (kWh)
    unique_id: prise_box_internet_ikea_mean_730h_kwh
    unit_of_measurement: kWh
    device_class: energy
    state_class: measurement
    state: >
      {% set start = now() - timedelta(hours=730) %}
      {% set history = history_func('sensor.prise_box_internet_ikea_daily', start) %}
      {% set states = history | map(attribute='state') | reject('eq', 'unavailable') | reject('eq', 'unknown') | map('float', default=0) | list %}
      {% if states | length > 0 %}
        {{ (states | sum / states | length) | round(2) }}
      {% else %}
        {{ 0.00 | float }} 
      {% endif %}
      
