

# =========================================================================
# TEMPLATE ENERGY STATS (Remplace l'intégration statistics - SANS BUGS YAML)
# Utilisation: history_func pour calculer la consommation glissante (24h) 
# et la moyenne (730h).
# =========================================================================
- sensor:
# --------------------------------------------------------------------------
# --- ENTRÉE (Box Internet & Horloge)
# --------------------------------------------------------------------------

  # Box Internet - Consommation 24h
  - name: prise_box_internet_ikea Conso 24h kWh
    unique_id: prise_box_internet_ikea_conso_24h_kwh
    unit_of_measurement: kWh
    device_class: energy
    state_class: measurement
    state: "{{ consumption_change('sensor.prise_box_internet_ikea_kwh', 24, 3) }}"

  # Box Internet - Moyenne 730h
  - name: prise_box_internet_ikea mean 730h (kWh)
    unique_id: prise_box_internet_ikea_mean_730h_kwh
    unit_of_measurement: kWh
    device_class: energy
    state_class: measurement
    state: "{{ mean_daily('sensor.prise_box_internet_ikea_daily', 730, 2) }}"
    
