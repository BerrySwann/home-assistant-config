- sensor:
    - name: "Message Clim personnalisé 20h <-> 6h"
      unique_id: message_clim_personnalise_20h_6h
      state: >
        {# --- Vérification des dépendances critiques --- #}
        {%- if states('sensor.poco_x7_pro_mamour_network_type') in ['unknown', 'unavailable'] or
              states('sensor.poco_x7_pro_network_type') in ['unknown', 'unavailable'] or
              states('sensor.th_balcon_nord_temperature') in ['unknown', 'unavailable'] %}
          "En attente des capteurs..."
        {%- else %}
          {# --- Définition des variables --- #}
          {%- set home_ssid = "Freebox_GG" %}
          {%- set mamour_network = states('sensor.poco_x7_pro_mamour_network_type') %}
          {%- set mamour_wifi = states('sensor.poco_x7_pro_mamour_wi_fi_connection') %}
          {%- set eric_network = states('sensor.poco_x7_pro_network_type') %}
          {%- set eric_wifi = states('sensor.poco_x7_pro_wi_fi_connection') %}
          {%- set tendance = states('sensor.th_balcon_nord_temperature_trend') %}
          {%- set temp_ext = states('sensor.th_balcon_nord_temperature') | float %}
          {%- set temp_cible = states('sensor.temperature_cible') | float %}
          {%- set temp_diff = states('sensor.temperature_differentielle') | float %}
          {%- set temp_eco = states('sensor.temperature_eco_hiver') | float %}
          {%- set mode = states('sensor.mode_ete_hiver') %}
          {%- set prise_salon = is_state('switch.clim_salon_nous', 'on') %}
          {%- set prise_bureau = is_state('switch.clim_du_bureau_nous', 'on') %}
          {%- set prise_chambre = is_state('switch.clim_chambre_nous', 'on') %}
          {%- set clims_alimentees = prise_salon or prise_bureau or prise_chambre %}
          {# --- Détermination des scénarios de présence --- #}
          {%- set both_cellular = (mamour_network == 'cellular' and eric_network == 'cellular') %}
          {%- set both_wifi_not_home = (mamour_network == 'wifi' and mamour_wifi != home_ssid and eric_network == 'wifi' and eric_wifi != home_ssid) %}
          {%- set mamour_wifi_home = (mamour_network == 'wifi' and mamour_wifi == home_ssid) %}
          {%- set eric_wifi_home = (eric_network == 'wifi' and eric_wifi == home_ssid) %}
          {%- set mamour_wifi_not_home = (mamour_network == 'wifi' and mamour_wifi != home_ssid) %}
          {%- set eric_wifi_not_home = (eric_network == 'wifi' and eric_wifi != home_ssid) %}
          {# --- Message de tendance --- #}
          {%- if tendance == 'increasing' %}
            {%- set message_tendance = "T°Ext Up >>> " ~ temp_ext ~ "°" %}
          {%- elif tendance == 'decreasing' %}
            {%- set message_tendance = "T°Ext Down <<< " ~ temp_ext ~ "°" %}
          {%- else %}
            {%- set message_tendance = "Temp. stable " ~ temp_ext ~ "°" %}
          {%- endif %}
          {# --- Logique principale pour 20h-6h (priorité à la chambre) --- #}
          {%- if both_cellular %}
            {%- set message_header = "T° [2] en [CELLULAR]" %}
            {%- if clims_alimentees %}
              {%- if mode == 'heat' %}
                {%- set message_mode = "3 clim " ~ temp_eco ~ "° [éCO HEAT]" %}
              {%- elif mode == 'cool' %}
                {%- set message_mode = "3 clim " ~ temp_cible ~ "° [COOL]" %}
              {%- elif mode == 'fan_only' %}
                {%- set message_mode = "3 clim [FAN ONLY]" %}
              {%- endif %}
            {%- else %}
              {%- set message_mode = "[UNITS OFF]" %}
            {%- endif %}
          {%- elif both_wifi_not_home %}
            {%- set message_header = "T° [2] en [WIFI_?!]" %}
            {%- if clims_alimentees %}
              {%- if mode == 'heat' %}
                {%- set message_mode = "3 clim " ~ temp_eco ~ "° [éCO HEAT]" %}
              {%- elif mode == 'cool' %}
                {%- set message_mode = "3 clim " ~ temp_cible ~ "° [COOL]" %}
              {%- elif mode == 'fan_only' %}
                {%- set message_mode = "3 clim [FAN ONLY]" %}
              {%- endif %}
            {%- else %}
              {%- set message_mode = "[UNITS OFF]" %}
            {%- endif %}
          {%- elif mamour_wifi_home and eric_network == 'cellular' %}
            {%- set message_header = "T° [MAMOUR] en [WIFI/CELL]" %}
            {%- if clims_alimentees %}
              {%- if mode == 'heat' %}
                {%- set message_mode = "Chambre " ~ temp_diff ~ "° - Salon/Bureau " ~ temp_cible ~ "° [HEAT]" %}
              {%- elif mode == 'cool' %}
                {%- set message_mode = "Chambre " ~ temp_diff ~ "° - Salon/Bureau " ~ temp_cible ~ "° [COOL]" %}
              {%- elif mode == 'fan_only' %}
                {%- set message_mode = "Chambre [FAN ONLY] - Salon/Bureau [FAN ONLY]" %}
              {%- endif %}
            {%- else %}
              {%- set message_mode = "[UNITS OFF]" %}
            {%- endif %}
          {%- elif mamour_wifi_home and eric_wifi_not_home %}
            {%- set message_header = "T° [MAMOUR] en [WIFI/!?]" %}
            {%- if clims_alimentees %}
              {%- if mode == 'heat' %}
                {%- set message_mode = "Chambre " ~ temp_diff ~ "° - Salon/Bureau " ~ temp_cible ~ "° [HEAT]" %}
              {%- elif mode == 'cool' %}
                {%- set message_mode = "Chambre " ~ temp_diff ~ "° - Salon/Bureau " ~ temp_cible ~ "° [COOL]" %}
              {%- elif mode == 'fan_only' %}
                {%- set message_mode = "Chambre [FAN ONLY] - Salon/Bureau [FAN ONLY]" %}
              {%- endif %}
            {%- else %}
              {%- set message_mode = "[UNITS OFF]" %}
            {%- endif %}
          {%- elif eric_wifi_home and mamour_network == 'cellular' %}
            {%- set message_header = "T° [ERIC] en [WIFI/CELL]" %}
            {%- if clims_alimentees %}
              {%- if mode == 'heat' %}
                {%- set message_mode = "Chambre " ~ temp_diff ~ "° - Salon/Bureau " ~ temp_cible ~ "° [HEAT]" %}
              {%- elif mode == 'cool' %}
                {%- set message_mode = "Chambre " ~ temp_diff ~ "° - Salon/Bureau " ~ temp_cible ~ "° [COOL]" %}
              {%- elif mode == 'fan_only' %}
                {%- set message_mode = "Chambre [FAN ONLY] - Salon/Bureau [FAN ONLY]" %}
              {%- endif %}
            {%- else %}
              {%- set message_mode = "[UNITS OFF]" %}
            {%- endif %}
          {%- elif eric_wifi_home and mamour_wifi_not_home %}
            {%- set message_header = "T° [ERIC] en [WIFI/!?]" %}
            {%- if clims_alimentees %}
              {%- if mode == 'heat' %}
                {%- set message_mode = "Chambre " ~ temp_diff ~ "° - Salon/Bureau " ~ temp_cible ~ "° [HEAT]" %}
              {%- elif mode == 'cool' %}
                {%- set message_mode = "Chambre " ~ temp_diff ~ "° - Salon/Bureau " ~ temp_cible ~ "° [COOL]" %}
              {%- elif mode == 'fan_only' %}
                {%- set message_mode = "Chambre [FAN ONLY] - Salon/Bureau [FAN ONLY]" %}
              {%- endif %}
            {%- else %}
              {%- set message_mode = "[UNITS OFF]" %}
            {%- endif %}
          {%- elif mamour_wifi_home and eric_wifi_home %}
            {%- set message_header = "T° [2] en [WIFI]" %}
            {%- if clims_alimentees %}
              {%- if mode == 'heat' %}
                {%- set message_mode = "Chambre " ~ temp_diff ~ "° - Salon/Bureau " ~ temp_cible ~ "° [HEAT]" %}
              {%- elif mode == 'cool' %}
                {%- set message_mode = "Chambre " ~ temp_diff ~ "° - Salon/Bureau " ~ temp_cible ~ "° [COOL]" %}
              {%- elif mode == 'fan_only' %}
                {%- set message_mode = "Chambre [FAN ONLY] - Salon/Bureau [FAN ONLY]" %}
              {%- endif %}
            {%- else %}
              {%- set message_mode = "[UNITS OFF]" %}
            {%- endif %}
          {%- else %}
            {%- set message_header = "T° Scénario non géré" %}
            {%- set message_mode = "Vérifiez les capteurs de présence" %}
          {%- endif %}
          {# --- Construction du message final --- #}
          {{ message_header }}
          {{ message_tendance }}
          {{ message_mode }}
        {%- endif %}
      availability: >
        {{ states('sensor.poco_x7_pro_mamour_network_type') not in ['unknown', 'unavailable'] and
            states('sensor.poco_x7_pro_network_type') not in ['unknown', 'unavailable'] and
            states('sensor.th_balcon_nord_temperature') not in ['unknown', 'unavailable'] }}
