- sensor:
    - name: "Message Clim personnalisé 21h00 <-> 6h00"
      unique_id: message_clim_personnalise_21h00_6h00
      state: >
        {# --- Vérification des dépendances critiques --- #}
        {%- if states('sensor.poco_x7_pro_mamour_network_type') in ['unknown', 'unavailable'] or
              states('sensor.poco_x7_pro_network_type') in ['unknown', 'unavailable'] or
              states('sensor.th_balcon_nord_temperature') in ['unknown', 'unavailable'] or
              states('sensor.groupe_clim') in ['unknown', 'unavailable'] or
              states('sensor.presence_clim') in ['unknown', 'unavailable'] %}
          En attente des capteurs...
        {%- else %}
          {# --- Définition des variables --- #}
          {%- set tendance = states('sensor.th_balcon_nord_temperature_trend') %}
          {%- set temp_ext = states('sensor.th_balcon_nord_temperature') | float %}
          {%- set temp_cible = states('sensor.temperature_cible') | float %}
          {%- set temp_diff = states('sensor.temperature_differentielle') | float %}
          {%- set temp_eco = states('sensor.temperature_eco_hiver') | float %}
          {%- set mode = states('sensor.mode_ete_hiver') %}
          {%- set prise_salon = is_state('switch.clim_salon_nous', 'on') %}
          {%- set prise_bureau = is_state('switch.clim_du_bureau_nous', 'on') %}
          {%- set prise_chambre = is_state('switch.clim_chambre_nous', 'on') %}
          {%- set clims_alimentees = prise_salon or prise_bureau or prise_chambre %}
          {%- set groupe = states('sensor.groupe_clim') %}
          {%- set presence = states('sensor.presence_clim') %}

          {# --- Message de tendance --- #}
          {%- if tendance == 'increasing' %}
            {%- set message_tendance = "T°Ext Up >>> " ~ temp_ext ~ "°" %}
          {%- elif tendance == 'decreasing' %}
            {%- set message_tendance = "T°Ext Down <<< " ~ temp_ext ~ "°" %}
          {%- else %}
            {%- set message_tendance = "Temp. stable " ~ temp_ext ~ "°" %}
          {%- endif %}

          {# --- Header basé sur Presence Clim --- #}
          {%- set message_header = "T° " ~ presence %}

          {# --- Logique principale pour 20h-6h (priorité à la chambre) --- #}
          {%- if not clims_alimentees %}
            {%- set message_mode = "[UNITS OFF]" %}

          {%- else %}
            {%- if 'groupe_1' in groupe %}
              {# ABSENT (les 2 en CELL ou WIFI_!?), on reste en éco sur les 3 clims #}
              {%- if mode == 'heat' %}
                {%- set message_mode = "3 clim " ~ temp_eco ~ "° [éCO HEAT]" %}
              {%- elif mode == 'cool' %}
                {%- set message_mode = "3 clim " ~ temp_cible ~ "° [COOL]" %}
              {%- elif mode == 'fan_only' %}
                {%- set message_mode = "3 clim [FAN ONLY]" %}
              {%- else %}
                {%- set message_mode = "Mode clim inconnu" %}
              {%- endif %}

            {%- elif 'groupe_2' in groupe %}
              {# MAMOUR AT HOME => Chambre prioritaire #}
              {%- if mode == 'heat' %}
                {%- set message_mode = "Chambre " ~ temp_diff ~ "° - Salon/Bureau " ~ temp_cible ~ "° [HEAT]" %}
              {%- elif mode == 'cool' %}
                {%- set message_mode = "Chambre " ~ temp_diff ~ "° - Salon/Bureau " ~ temp_cible ~ "° [COOL]" %}
              {%- elif mode == 'fan_only' %}
                {%- set message_mode = "Chambre [FAN ONLY] - Salon/Bureau [FAN ONLY]" %}
              {%- else %}
                {%- set message_mode = "Mode clim inconnu" %}
              {%- endif %}

            {%- elif 'groupe_3' in groupe %}
              {# ERIC AT HOME => Chambre prioritaire aussi la nuit #}
              {%- if mode == 'heat' %}
                {%- set message_mode = "Chambre " ~ temp_diff ~ "° - Salon/Bureau " ~ temp_cible ~ "° [HEAT]" %}
              {%- elif mode == 'cool' %}
                {%- set message_mode = "Chambre " ~ temp_diff ~ "° - Salon/Bureau " ~ temp_cible ~ "° [COOL]" %}
              {%- elif mode == 'fan_only' %}
                {%- set message_mode = "Chambre [FAN ONLY] - Salon/Bureau [FAN ONLY]" %}
              {%- else %}
                {%- set message_mode = "Mode clim inconnu" %}
              {%- endif %}

            {%- elif 'groupe_4' in groupe %}
              {# MAMOUR & ERIC AT HOME => Chambre prioritaire, salon/bureau en cible #}
              {%- if mode == 'heat' %}
                {%- set message_mode = "Chambre " ~ temp_diff ~ "° - Salon/Bureau " ~ temp_cible ~ "° [HEAT]" %}
              {%- elif mode == 'cool' %}
                {%- set message_mode = "Chambre " ~ temp_diff ~ "° - Salon/Bureau " ~ temp_cible ~ "° [COOL]" %}
              {%- elif mode == 'fan_only' %}
                {%- set message_mode = "Chambre [FAN ONLY] - Salon/Bureau [FAN ONLY]" %}
              {%- else %}
                {%- set message_mode = "Mode clim inconnu" %}
              {%- endif %}

            {%- else %}
              {%- set message_mode = "Scénario groupe non géré" %}
            {%- endif %}
          {%- endif %}

          {# --- Construction du message final --- #}
          {{ message_header }}
          {{ message_tendance }}
          {{ message_mode }}
        {%- endif %}
      availability: >
        {{ states('sensor.poco_x7_pro_mamour_network_type') not in ['unknown', 'unavailable'] and
          states('sensor.poco_x7_pro_network_type') not in ['unknown', 'unavailable'] and
          states('sensor.th_balcon_nord_temperature') not in ['unknown', 'unavailable'] and
          states('sensor.groupe_clim') not in ['unknown', 'unavailable'] and
          states('sensor.presence_clim') not in ['unknown', 'unavailable'] }}
