
#========================================================================
#
# TOTAUX ENERGIE
#
# ÉNERGIE — Totaux (quotidien / mensuel / puissance instantanée)
#
#========================================================================

# =========================================================================
# CAPTEUR: CONSO. CLIM/RAD TOTAL QUOTIDIEN (Corrigé pour correspondre aux unique_id)
# =========================================================================

- sensor:
  - name: "Conso. Clim. Rad. Total QUOTIDIEN"
    unique_id: conso_clim_rad_total_quotidien
    device_class: energy
    unit_of_measurement: "kWh"
    icon: mdi:flash-outline
    state: >
      {% set entities = [
        'sensor.clim_salon_quotidien', 
        'sensor.radiateur_elec_cuisine_quotidien', 
        'sensor.clim_du_bureau_quotidien',
        'sensor.radiateur_sdb_quotidien', 
        'sensor.seche_serv_sdb_quotidien', 
        'sensor.clim_chambre_quotidien'
      ] %}
      
      {% set total_conso = namespace(value=0) %}
      
      {% for entity in entities %}
        {% set total_conso.value = total_conso.value + states(entity) | float(0) %}
      {% endfor %}
      
      {{ total_conso.value | round(2) }}

#========================================================================
# TOTAUX QUOTIDIEN MEAN
#========================================================================

- sensor:
  - name: "Conso. Clim. Rad. Total 24h Mean"
    unique_id: conso_clim_rad_total_24h_kwh
    device_class: energy
    unit_of_measurement: "kWh"
    icon: mdi:flash-outline
    state: >
      {{ (states('sensor.clim_salon_mean_24h_kwh') | float(0) +
        states('sensor.radiateur_cuisine_mean_24h_kwh') | float(0) +
        states('sensor.clim_bureau_mean_24h_kwh') | float(0) +
        states('sensor.rad_sdb_nous_neam_24h_kwh') | float(0) +
        states('sensor.rad_sdb_ikea_mean_24h_kwh') | float(0) +
        states('sensor.clim_chambre_mean_24h_kwh') | float(0)) | round(2) }}

