#========================================================================
#
# TOTAUX ENERGIE
#
# ÉNERGIE — Totaux (quotidien / mensuel / puissance instantanée)
#
#========================================================================

#========================================================================
# TOTAUX QUOTIDIEN (mean 24h)
#========================================================================

- sensor:
  - name: "Clim. Rad. Total mean 24h kWh"
    unique_id: clim_rad_total_mean_24h_kwh
    device_class: energy
    unit_of_measurement: "kWh"
    icon: mdi:flash-outline
    state: >
      {{ (states('sensor.clim_salon_mean_24h_kwh') | float(0) +
        states('sensor.radiateur_cuisine_mean_24h_kwh') | float(0) +
        states('sensor.clim_bureau_mean_24h_kwh') | float(0) +
        states('sensor.soufflant_sdb_mean_24h_kwh') | float(0) +
        states('sensor.seche_serv_mean_24h_kwh') | float(0) +
        states('sensor.clim_chambre_mean_24h_kwh') | float(0)) | round(3) }}

