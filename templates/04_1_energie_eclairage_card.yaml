      unique_id: "eclairage_hue_white_lamp_entree_annuel"
      device_class: energy
      unit_of_measurement: kWh
      icon: mdi:flash-outline
      state: >
        {% set s = states('sensor.eclairage_hue_white_lamp_entree_annuel_um') %}
        {{ s | float(0) | round(3) if is_number(s) else 0.00 }}
