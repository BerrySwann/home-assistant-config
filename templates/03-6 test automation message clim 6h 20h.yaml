- sensor:
  - name: "Message Clim personnalisé 6h 20h"
    unique_id: message_clim_personnalise_6h_20h
    state: >
      {%- set mamour_network = states('sensor.ne2213_mamour_network_type') %}
      {%- set mamour_wifi = states('sensor.ne2213_mamour_wi_fi_connection') %}
      {%- set eric_network = states('sensor.poco_x7_pro_network_type') %}
      {%- set eric_wifi = states('sensor.poco_x7_pro_wi_fi_connection') %}
      {%- set home_ssid = "Freebox_GG" %}
      {%- set tendance = states('sensor.th_balcon_nord_temperature_trend') %}
      {%- set temp_ext = states('sensor.th_balcon_nord_temperature') | float %}
      {%- set temp_cible = states('sensor.temperature_cible') | float %}
      {%- set temp_diff = states('sensor.temperature_differentielle') | float %}
      {%- set temp_eco = states('sensor.temperature_eco_hiver') | float %}
      {%- set mode_ete_hiver = states('sensor.mode_ete_hiver') %}
      {%- set prise_salon = is_state('switch.clim_salon_nous', 'on') %}
      {%- set prise_bureau = is_state('switch.clim_du_bureau_nous', 'on') %}
      {%- set prise_chambre = is_state('switch.clim_chambre_nous', 'on') %}
      {%- set clims_alimentees = prise_salon or prise_bureau or prise_chambre %}

      {# --- Vérification de la présence réelle à la maison (garde-fou SSID) --- #}
      {%- set mamour_at_home = (mamour_network == 'wifi' and mamour_wifi == home_ssid) %}
      {%- set eric_at_home = (eric_network == 'wifi' and eric_wifi == home_ssid) %}

      {# --- Logique d'origine conservée --- #}
      {%- if mamour_network == 'cellular' and eric_network == 'cellular' %}
        {%- set message_header = "Clim [2] en [CELLULAR]" %}
      {%- elif mamour_at_home and eric_network == 'cellular' %}
        {%- set message_header = "Clim [MAMOUR] en [WIFI]" %}
      {%- elif mamour_network == 'cellular' and eric_at_home %}
        {%- set message_header = "Clim [ERIC] en [WIFI]" %}
      {%- elif mamour_at_home and eric_at_home %}
        {%- set message_header = "Clim [2] en [WIFI]" %}
      {%- else %}
        {%- set message_header = "Aucun message pertinent actuellement" %}
      {%- endif %}

      {# --- Détermination du message de tendance --- #}
      {%- if tendance == 'increasing' %}
        {%- set message_tendance = "T°Ext Up >>> " ~ temp_ext ~ "°" %}
      {%- elif tendance == 'decreasing' %}
        {%- set message_tendance = "T°Ext Down <<< " ~ temp_ext ~ "°" %}
      {%- else %}
        {%- set message_tendance = "Temp. stable " ~ temp_ext ~ "°" %}
      {%- endif %}

      {# --- Détermination du message de mode (Heat/Cool/Fan) --- #}
      {# ---MODE HEAT --- #}

      {%- if mode_ete_hiver == 'heat' %}
        {%- if mamour_network == 'cellular' and eric_network == 'cellular' %}
          {%- if clims_alimentees %}
            {%- set message_mode = "Les 3 Clim " ~ temp_eco ~ "° (éCO Heat)" %}
          {%- else %}
            {%- set message_mode = "Les 3 Clim " ~ temp_eco ~ "° (Units OFF)" %}
          {%- endif %}
        {%- elif mamour_at_home and eric_network == 'cellular' %}
          {%- if clims_alimentees %}
            {%- set message_mode = "Salon " ~ temp_diff ~ "° - Bureau & Chambre " ~ temp_cible ~ "° (Heat)" %}
          {%- else %}
            {%- set message_mode = "Les 3 Clim " ~ temp_eco ~ "° (Units OFF)" %}
          {%- endif %}
        {%- elif mamour_network == 'cellular' and eric_at_home %}
          {%- if clims_alimentees %}
            {%- set message_mode = "Bureau " ~ temp_diff ~ "° - Salon & Chambre " ~ temp_cible ~ "° (Heat)" %}
          {%- else %}
            {%- set message_mode = "Les 3 Clim " ~ temp_eco ~ "° (Units OFF)" %}
          {%- endif %}
        {%- elif mamour_at_home and eric_at_home %}
          {%- if clims_alimentees %}
            {%- set message_mode = "Salon & Bureau " ~ temp_diff ~ "° - Chambre " ~ temp_cible ~ "° (Heat)" %}
          {%- else %}
            {%- set message_mode = "Les 3 Clim " ~ temp_eco ~ "° (Units OFF)" %}
          {%- endif %}
        {%- endif %}

      {# ---MODE COOL --- #}
      {%- elif mode_ete_hiver == 'cool' %}
        {%- if mamour_network == 'cellular' and eric_network == 'cellular' %}
          {%- if clims_alimentees %}
            {%- set message_mode = "Les 3 Clim " ~ temp_cible ~ "° (Cool)" %}
          {%- else %}
            {%- set message_mode = "Les 3 Clim " ~ temp_eco ~ "° (Units OFF)" %}
          {%- endif %}
        {%- elif mamour_at_home and eric_network == 'cellular' %}
          {%- if clims_alimentees %}
            {%- set message_mode = "Salon " ~ temp_diff ~ "° - Bureau & Chambre " ~ temp_cible ~ "° (Cool)" %}
          {%- else %}
            {%- set message_mode = "Les 3 Clim " ~ temp_eco ~ "° (Units OFF)" %}
          {%- endif %}
        {%- elif mamour_network == 'cellular' and eric_at_home %}
          {%- if clims_alimentees %}
            {%- set message_mode = "Bureau " ~ temp_diff ~ "° - Salon & Chambre " ~ temp_cible ~ "° (Cool)" %}
          {%- else %}
            {%- set message_mode = "Les 3 Clim " ~ temp_eco ~ "° (Units OFF)" %}
          {%- endif %}
        {%- elif mamour_at_home and eric_at_home %}
          {%- if clims_alimentees %}
            {%- set message_mode = "Salon & Bureau " ~ temp_diff ~ "° - Chambre " ~ temp_cible ~ "° (Cool)" %}
          {%- else %}
            {%- set message_mode = "Les 3 Clim " ~ temp_eco ~ "° (Units OFF)" %}
          {%- endif %}
        {%- endif %}

      {# ---MODE FAN_ONLY --- #}
      {%- elif mode_ete_hiver == 'fan_only' %}
        {%- if clims_alimentees %}
          {%- set message_mode = "Les 3 Clim (Fan)" %}
        {%- else %}
          {%- set message_mode = "Les 3 Clim " ~ temp_eco ~ "° (Units OFF)" %}
        {%- endif %}
      {%- endif %}

      {# --- Construction du message final --- #}
      {{ message_header }} 
      {{ message_tendance }} 
      {{ message_mode }}
