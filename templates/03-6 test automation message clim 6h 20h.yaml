sensor:
  - name: "Message Clim personnalisé 6h <-> 20h"
    unique_id: message_clim_personnalise_6h_20h
    state: >
      {# --- Définition des variables de base --- #}
      {%- set home_ssid = "Freebox_GG" %}
      {%- set mamour_network = states('sensor.ne2213_mamour_network_type') %}
      {%- set mamour_wifi = states('sensor.ne2213_mamour_wi_fi_connection') %}
      {%- set eric_network = states('sensor.poco_x7_pro_network_type') %}
      {%- set eric_wifi = states('sensor.poco_x7_pro_wi_fi_connection') %}
      {%- set tendance = states('sensor.th_balcon_nord_temperature_trend') %}
      {%- set temp_ext = states('sensor.th_balcon_nord_temperature') | float %}
      {%- set temp_cible = states('sensor.temperature_cible') | float %}
      {%- set temp_diff = states('sensor.temperature_differentielle') | float %}
      {%- set temp_eco = states('sensor.temperature_eco_hiver') | float %}
      {%- set mode = states('sensor.mode_ete_hiver') %}
      {%- set prise_salon = is_state('switch.clim_salon_nous', 'on') %}
      {%- set prise_bureau = is_state('switch.clim_du_bureau_nous', 'on') %}
      {%- set prise_chambre = is_state('switch.clim_chambre_nous', 'on') %}
      {%- set clims_alimentees = prise_salon or prise_bureau or prise_chambre %}

      {# --- Vérification des états invalides --- #}
      {%- if mamour_network in ['unknown', 'unavailable'] or mamour_wifi in ['unknown', 'unavailable'] %}
        {%- set mamour_at_home = false %}
      {%- else %}
        {%- set mamour_at_home = (mamour_network == 'wifi' and mamour_wifi == home_ssid) %}
      {%- endif %}
      {%- if eric_network in ['unknown', 'unavailable'] or eric_wifi in ['unknown', 'unavailable'] %}
        {%- set eric_at_home = false %}
      {%- else %}
        {%- set eric_at_home = (eric_network == 'wifi' and eric_wifi == home_ssid) %}
      {%- endif %}

      {# --- Détermination des scénarios de présence --- #}
      {%- set both_cellular = (mamour_network == 'cellular' and eric_network == 'cellular') %}
      {%- set both_wifi_not_home = (mamour_network == 'wifi' and mamour_wifi != home_ssid and eric_network == 'wifi' and eric_wifi != home_ssid) %}
      {%- set mamour_wifi_home = (mamour_network == 'wifi' and mamour_wifi == home_ssid) %}
      {%- set eric_wifi_home = (eric_network == 'wifi' and eric_wifi == home_ssid) %}
      {%- set mamour_wifi_not_home = (mamour_network == 'wifi' and mamour_wifi != home_ssid) %}
      {%- set eric_wifi_not_home = (eric_network == 'wifi' and eric_wifi != home_ssid) %}

      {# --- Message de tendance --- #}
      {%- if tendance == 'increasing' %}
        {%- set message_tendance = "T°Ext Up >>> " ~ temp_ext ~ "°" %}
      {%- elif tendance == 'decreasing' %}
        {%- set message_tendance = "T°Ext Down <<< " ~ temp_ext ~ "°" %}
      {%- else %}
        {%- set message_tendance = "Temp. stable " ~ temp_ext ~ "°" %}
      {%- endif %}

      {# --- Logique principale --- #}
      {%- if both_cellular %}
        {# 2 en cellular #}
        {%- set message_header = "Clim [2] en [CELLULAR]" %}
        {%- if clims_alimentees %}
          {%- if mode == 'heat' %}
            {%- set message_mode = "3 clim " ~ temp_eco ~ "° (éCO Heat)" %}
          {%- else %}
            {%- set message_mode = "3 clim " ~ temp_cible ~ "° (Cool)" %}
          {%- endif %}
        {%- else %}
          {%- set message_mode = "(Units OFF)" %}
        {%- endif %}
      {%- elif both_wifi_not_home %}
        {# 2 en wifi mais pas Freebox_GG #}
        {%- set message_header = "Clim [2] en [WIFI_?!]" %}
        {%- if clims_alimentees %}
          {%- if mode == 'heat' %}
            {%- set message_mode = "3 clim " ~ temp_eco ~ "° (éCO Heat)" %}
          {%- else %}
            {%- set message_mode = "3 clim " ~ temp_cible ~ "° (Cool)" %}
          {%- endif %}
        {%- else %}
          {%- set message_mode = "(Units OFF)" %}
        {%- endif %}
      {%- elif mamour_wifi_home and eric_network == 'cellular' %}
        {# Mamour en wifi Freebox_GG, Eric en cellular #}
        {%- set message_header = "Clim [MAMOUR] en [WIFI/CELL]" %}
        {%- if clims_alimentees %}
          {%- if mode == 'heat' %}
            {%- set message_mode = "Salon " ~ temp_diff ~ "° - Bureau & Chambre " ~ temp_cible ~ "° (Heat)" %}
          {%- else %}
            {%- set message_mode = "Salon " ~ temp_diff ~ "° - Bureau & Chambre " ~ temp_cible ~ "° (Cool)" %}
          {%- endif %}
        {%- else %}
          {%- set message_mode = "(Units OFF)" %}
        {%- endif %}
      {%- elif mamour_wifi_home and eric_wifi_not_home %}
        {# Mamour en wifi Freebox_GG, Eric en wifi mais pas Freebox_GG #}
        {%- set message_header = "Clim [MAMOUR] en [WIFI/!?]" %}
        {%- if clims_alimentees %}
          {%- if mode == 'heat' %}
            {%- set message_mode = "Salon " ~ temp_diff ~ "° - Bureau & Chambre " ~ temp_cible ~ "° (Heat)" %}
          {%- else %}
            {%- set message_mode = "Salon " ~ temp_diff ~ "° - Bureau & Chambre " ~ temp_cible ~ "° (Cool)" %}
          {%- endif %}
        {%- else %}
          {%- set message_mode = "(Units OFF)" %}
        {%- endif %}
      {%- elif eric_wifi_home and mamour_network == 'cellular' %}
        {# Eric en wifi Freebox_GG, Mamour en cellular #}
        {%- set message_header = "Clim [ERIC] en [WIFI/CELL]" %}
        {%- if clims_alimentees %}
          {%- if mode == 'heat' %}
            {%- set message_mode = "Bureau " ~ temp_diff ~ "° - Salon & Chambre " ~ temp_cible ~ "° (Heat)" %}
          {%- else %}
            {%- set message_mode = "Bureau " ~ temp_diff ~ "° - Salon & Chambre " ~ temp_cible ~ "° (Cool)" %}
          {%- endif %}
        {%- else %}
          {%- set message_mode = "(Units OFF)" %}
        {%- endif %}
      {%- elif eric_wifi_home and mamour_wifi_not_home %}
        {# Eric en wifi Freebox_GG, Mamour en wifi mais pas Freebox_GG #}
        {%- set message_header = "Clim [ERIC] en [WIFI/!?]" %}
        {%- if clims_alimentees %}
          {%- if mode == 'heat' %}
            {%- set message_mode = "Bureau " ~ temp_diff ~ "° - Salon & Chambre " ~ temp_cible ~ "° (Heat)" %}
          {%- else %}
            {%- set message_mode = "Bureau " ~ temp_diff ~ "° - Salon & Chambre " ~ temp_cible ~ "° (Cool)" %}
          {%- endif %}
        {%- else %}
          {%- set message_mode = "(Units OFF)" %}
        {%- endif %}
      {%- elif mamour_wifi_home and eric_wifi_home %}
        {# 2 en wifi Freebox_GG #}
        {%- set message_header = "Clim [2] en [WIFI]" %}
        {%- if clims_alimentees %}
          {%- if mode == 'heat' %}
            {%- set message_mode = "Salon & Bureau " ~ temp_diff ~ "° - Chambre " ~ temp_cible ~ "° (Heat)" %}
          {%- else %}
            {%- set message_mode = "Salon & Bureau " ~ temp_diff ~ "° - Chambre " ~ temp_cible ~ "° (Cool)" %}
          {%- endif %}
        {%- else %}
          {%- set message_mode = "(Units OFF)" %}
        {%- endif %}
      {%- else %}
        {# Cas par défaut (non couvert) #}
        {%- set message_header = "Scénario non géré" %}
        {%- set message_mode = "Vérifiez les capteurs de présence" %}
      {%- endif %}

      {# --- Construction du message final --- #}
      {{ message_header }}
      {{ message_tendance }}
      {{ message_mode }}
