- sensor:
  - name: "Message Clim personnalisé 6h 20h"
    unique_id: message_clim_personnalise_6h_20h
    state: >
      {# --- Détection de présence via input_boolean --- #}
      {%- set mamour_at_home = is_state('input_boolean.mamour_at_home', 'on') %}
      {%- set eric_at_home = is_state('input_boolean.eric_at_home', 'on') %}

      {# --- Notification pour la détection de présence --- #}
      {%- if mamour_at_home and eric_at_home %}
        {%- set presence = "2_WIFI" %}
        {%- service notify.notify(message="[Présence] Mamour et Eric sont à la maison (Wi-Fi)") %}
      {%- elif mamour_at_home and not eric_at_home %}
        {%- set presence = "MAMOUR_WIFI" %}
        {%- service notify.notify(message="[Présence] Seul Mamour est à la maison (Wi-Fi)") %}
      {%- elif not mamour_at_home and eric_at_home %}
        {%- set presence = "ERIC_WIFI" %}
        {%- service notify.notify(message="[Présence] Seul Eric est à la maison (Wi-Fi)") %}
      {%- else %}
        {%- set presence = "CELLULAR" %}
        {%- service notify.notify(message="[Présence] Personne n'est à la maison (mode CELLULAR)") %}
      {%- endif %}

      {# --- Récupération des autres données --- #}
      {%- set tendance = states('sensor.th_balcon_nord_temperature_trend') %}
      {%- set temp_ext = states('sensor.th_balcon_nord_temperature') | float %}
      {%- set temp_cible = states('sensor.temperature_cible') | float %}
      {%- set temp_diff = states('sensor.temperature_differentielle') | float %}
      {%- set temp_eco = states('sensor.temperature_eco_hiver') | float %}
      {%- set mode_ete_hiver = states('sensor.mode_ete_hiver') %}
      {%- set prise_salon = is_state('switch.clim_salon_nous', 'on') %}
      {%- set prise_bureau = is_state('switch.clim_du_bureau_nous', 'on') %}
      {%- set prise_chambre = is_state('switch.clim_chambre_nous', 'on') %}
      {%- set clims_alimentees = prise_salon or prise_bureau or prise_chambre %}

      {# --- Notification pour la tendance --- #}
      {%- if tendance == 'increasing' %}
        {%- set message_tendance = "T°Ext Up >>> " ~ temp_ext ~ "°" %}
        {%- service notify.notify(message="[Tendance] Température extérieure en hausse : " ~ temp_ext ~ "°") %}
      {%- elif tendance == 'decreasing' %}
        {%- set message_tendance = "T°Ext Down <<< " ~ temp_ext ~ "°" %}
        {%- service notify.notify(message="[Tendance] Température extérieure en baisse : " ~ temp_ext ~ "°") %}
      {%- else %}
        {%- set message_tendance = "Temp. stable " ~ temp_ext ~ "°" %}
        {%- service notify.notify(message="[Tendance] Température extérieure stable : " ~ temp_ext ~ "°") %}
      {%- endif %}

      {# --- Détermination du message de mode (Heat/Cool/Fan) --- #}
      {%- if mode_ete_hiver == 'heat' %}
        {%- if presence == "CELLULAR" %}
          {%- if clims_alimentees %}
            {%- set message_mode = "Les 3 Clim " ~ temp_eco ~ "° (éCO Heat)" %}
            {%- service notify.notify(message="[Mode HEAT] Les 3 Clim en mode éCO : " ~ temp_eco ~ "°") %}
          {%- else %}
            {%- set message_mode = "Les 3 Clim " ~ temp_eco ~ "° (Units OFF)" %}
            {%- service notify.notify(message="[Mode HEAT] Les 3 Clim éteintes (Units OFF)") %}
          {%- endif %}
        {%- elif presence == "MAMOUR_WIFI" %}
          {%- if clims_alimentees %}
            {%- set message_mode = "Salon " ~ temp_diff ~ "° - Bureau & Chambre " ~ temp_cible ~ "° (Heat)" %}
            {%- service notify.notify(message="[Mode HEAT] Salon à " ~ temp_diff ~ "°, Bureau & Chambre à " ~ temp_cible ~ "°") %}
          {%- else %}
            {%- set message_mode = "Les 3 Clim " ~ temp_eco ~ "° (Units OFF)" %}
            {%- service notify.notify(message="[Mode HEAT] Les 3 Clim éteintes (Units OFF)") %}
          {%- endif %}
        {%- elif presence == "ERIC_WIFI" %}
          {%- if clims_alimentees %}
            {%- set message_mode = "Bureau " ~ temp_diff ~ "° - Salon & Chambre " ~ temp_cible ~ "° (Heat)" %}
            {%- service notify.notify(message="[Mode HEAT] Bureau à " ~ temp_diff ~ "°, Salon & Chambre à " ~ temp_cible ~ "°") %}
          {%- else %}
            {%- set message_mode = "Les 3 Clim " ~ temp_eco ~ "° (Units OFF)" %}
            {%- service notify.notify(message="[Mode HEAT] Les 3 Clim éteintes (Units OFF)") %}
          {%- endif %}
        {%- elif presence == "2_WIFI" %}
          {%- if clims_alimentees %}
            {%- set message_mode = "Salon & Bureau " ~ temp_diff ~ "° - Chambre " ~ temp_cible ~ "° (Heat)" %}
            {%- service notify.notify(message="[Mode HEAT] Salon & Bureau à " ~ temp_diff ~ "°, Chambre à " ~ temp_cible ~ "°") %}
          {%- else %}
            {%- set message_mode = "Les 3 Clim " ~ temp_eco ~ "° (Units OFF)" %}
            {%- service notify.notify(message="[Mode HEAT] Les 3 Clim éteintes (Units OFF)") %}
          {%- endif %}
        {%- endif %}

      {%- elif mode_ete_hiver == 'cool' %}
        {%- if presence == "CELLULAR" %}
          {%- if clims_alimentees %}
            {%- set message_mode = "Les 3 Clim " ~ temp_cible ~ "° (Cool)" %}
            {%- service notify.notify(message="[Mode COOL] Les 3 Clim à " ~ temp_cible ~ "°") %}
          {%- else %}
            {%- set message_mode = "Les 3 Clim " ~ temp_eco ~ "° (Units OFF)" %}
            {%- service notify.notify(message="[Mode COOL] Les 3 Clim éteintes (Units OFF)") %}
          {%- endif %}
        {%- elif presence == "MAMOUR_WIFI" %}
          {%- if clims_alimentees %}
            {%- set message_mode = "Salon " ~ temp_diff ~ "° - Bureau & Chambre " ~ temp_cible ~ "° (Cool)" %}
            {%- service notify.notify(message="[Mode COOL] Salon à " ~ temp_diff ~ "°, Bureau & Chambre à " ~ temp_cible ~ "°") %}
          {%- else %}
            {%- set message_mode = "Les 3 Clim " ~ temp_eco ~ "° (Units OFF)" %}
            {%- service notify.notify(message="[Mode COOL] Les 3 Clim éteintes (Units OFF)") %}
          {%- endif %}
        {%- elif presence == "ERIC_WIFI" %}
          {%- if clims_alimentees %}
            {%- set message_mode = "Bureau " ~ temp_diff ~ "° - Salon & Chambre " ~ temp_cible ~ "° (Cool)" %}
            {%- service notify.notify(message="[Mode COOL] Bureau à " ~ temp_diff ~ "°, Salon & Chambre à " ~ temp_cible ~ "°") %}
          {%- else %}
            {%- set message_mode = "Les 3 Clim " ~ temp_eco ~ "° (Units OFF)" %}
            {%- service notify.notify(message="[Mode COOL] Les 3 Clim éteintes (Units OFF)") %}
          {%- endif %}
        {%- elif presence == "2_WIFI" %}
          {%- if clims_alimentees %}
            {%- set message_mode = "Salon & Bureau " ~ temp_diff ~ "° - Chambre " ~ temp_cible ~ "° (Cool)" %}
            {%- service notify.notify(message="[Mode COOL] Salon & Bureau à " ~ temp_diff ~ "°, Chambre à " ~ temp_cible ~ "°") %}
          {%- else %}
            {%- set message_mode = "Les 3 Clim " ~ temp_eco ~ "° (Units OFF)" %}
            {%- service notify.notify(message="[Mode COOL] Les 3 Clim éteintes (Units OFF)") %}
          {%- endif %}
        {%- endif %}

      {%- elif mode_ete_hiver == 'fan_only' %}
        {%- if clims_alimentees %}
          {%- set message_mode = "Les 3 Clim (Fan)" %}
          {%- service notify.notify(message="[Mode FAN] Les 3 Clim en mode ventilation") %}
        {%- else %}
          {%- set message_mode = "Les 3 Clim " ~ temp_eco ~ "° (Units OFF)" %}
          {%- service notify.notify(message="[Mode FAN] Les 3 Clim éteintes (Units OFF)") %}
        {%- endif %}
      {%- endif %}

      {# --- Notification pour le message final --- #}
      {%- set message_final = message_header ~ " | " ~ message_tendance ~ " | " ~ message_mode %}
      {%- service notify.notify(message="[CLIM] " ~ message_final) %}

      {# --- Retour du message pour l'affichage --- #}
      {{ message_header }} {{ message_tendance }} {{ message_mode }}
