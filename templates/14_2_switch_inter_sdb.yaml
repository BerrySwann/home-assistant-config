- switch:
      - name: "Interrupteur Radiateur Salle de Bain" 
        unique_id: switch_radiateur_sdb_inter
        
        # Le plus sûr est d'utiliser 'state' comme un Template Sensor
        state: "{{ is_state('input_boolean.inter_radiateur_salle_de_bain', 'on') }}" 
        
        turn_on:
          # CORRECTION CLÉ : Ajout de la clé 'sequence:' pour encapsuler l'action.
          sequence:
            - service: input_boolean.turn_on
              target:
                entity_id: input_boolean.inter_radiateur_salle_de_bain
              
        turn_off:
          # CORRECTION CLÉ : Ajout de la clé 'sequence:'
          sequence:
            - service: input_boolean.turn_off
              target:
                entity_id: input_boolean.inter_radiateur_salle_de_bain
            
        icon: > 
          {% if is_state('input_boolean.inter_radiateur_salle_de_bain', 'on') %}
            mdi:radiator
          {% else %}
            mdi:radiator-off
          {% endif %}