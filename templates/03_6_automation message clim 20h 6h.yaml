- sensor:
  - name: "Message Clim personnalisé 20h <-> 6h en pause"
    unique_id: message_clim_personnalise_20h_6h_en_pause
    state: >
      {% set mamour = states('sensor.poco_x7_pro_mamour_network_type') %}
      {% set eric = states('sensor.poco_x7_pro_network_type') %}
      {% set tendance = states('sensor.th_balcon_nord_temperature_trend') %}
      {% set temp_ext = states('sensor.th_balcon_nord_temperature') | float %}
      {% set temp_cible = states('sensor.temperature_cible') | float %}
      {% set temp_diff = states('sensor.temperature_differentielle') | float %}
      {% set temp_eco = states('sensor.temperature_eco_hiver') | float %}
      {% set mode_ete_hiver = states('sensor.mode_ete_hiver') %}
      {% set prise_salon = is_state('switch.clim_salon_nous', 'on') %}
      {% set prise_bureau = is_state('switch.clim_du_bureau_nous', 'on') %}
      {% set prise_chambre = is_state('switch.clim_chambre_nous', 'on') %}
      {% set clims_alimentees = prise_salon or prise_bureau or prise_chambre %}

      {% if mamour == 'cellular' and eric == 'cellular' %}
        Clim [2] en [CELLULAR]
        {% if mode_ete_hiver == 'heat' %}
          {% if clims_alimentees %}
            {% if tendance == 'increasing' %}
              T°Ext Up >>> {{ temp_ext }}° Les 3 Clim {{ temp_eco }}° (éCO Heat)
            {% elif tendance == 'decreasing' %}
              T°Ext Down <<< {{ temp_ext }}° Les 3 Clim {{ temp_eco }}° (éCO Heat)
            {% else %}
              Temp. stable {{ temp_ext }}° Les 3 Clim {{ temp_eco }}° (éCO Heat)
            {% endif %}
          {% else %}
          
            {% if tendance == 'increasing' %}
              T°Ext Up >>> {{ temp_ext }}° [Clim OFF]
            {% elif tendance == 'decreasing' %}
              T°Ext Down <<< {{ temp_ext }}° [Clim OFF]
            {% else %}
              Temp. stable {{ temp_ext }}° [Clim OFF]
            {% endif %}
          
          {% endif %}
        {% elif mode_ete_hiver == 'cool' %}
          {% if clims_alimentees %}
            {% if tendance == 'increasing' %}
              T°Ext Up >>> {{ temp_ext }}° Les 3 Clim {{ temp_cible }}° (Cool)
            {% elif tendance == 'decreasing' %}
              T°Ext Down <<< {{ temp_ext }}° Les 3 Clim {{ temp_cible }}° (Cool)
            {% else %}
              Temp. stable {{ temp_ext }}° Les 3 Clim {{ temp_cible }}° (Cool)
            {% endif %}
          {% else %}

            {% if tendance == 'increasing' %}
              T°Ext Up >>> {{ temp_ext }}° [Clim OFF]
            {% elif tendance == 'decreasing' %}
              T°Ext Down <<< {{ temp_ext }}° [Clim OFF]
            {% else %}
              Temp. stable {{ temp_ext }}° [Clim OFF]
            {% endif %}
          
          {% endif %}
        {% else %} {# mode_ete_hiver == 'fan_only' #}
          {% if clims_alimentees %}
            {% if tendance == 'increasing' %}
              T°Ext Up >>> {{ temp_ext }}° Les 3 Clim (Fan)
            {% elif tendance == 'decreasing' %}
              T°Ext Down <<< {{ temp_ext }}° Les 3 Clim (Fan)
            {% else %}
              Temp. stable {{ temp_ext }}° Les 3 Clim (Fan)
            {% endif %}
          {% else %}
          
            {% if tendance == 'increasing' %}
              T°Ext Up >>> {{ temp_ext }}° [Clim OFF]
            {% elif tendance == 'decreasing' %}
              T°Ext Down <<< {{ temp_ext }}° [Clim OFF]
            {% else %}
              Temp. stable {{ temp_ext }}° [Clim OFF]
            {% endif %}
          
          {% endif %}
        {% endif %}
      {% elif (mamour == 'wifi' and eric == 'cellular') or (mamour == 'cellular' and eric == 'wifi') or (mamour == 'wifi' and eric == 'wifi') %}
        {% if mamour == 'wifi' and eric == 'cellular' %}
          Clim [MAMOUR] en [WIFI]
        {% elif mamour == 'cellular' and eric == 'wifi' %}
          Clim [ERIC] en [WIFI]
        {% else %}
          Clim [2] en [WIFI]
        {% endif %}
        {% if clims_alimentees %}
          {% if mode_ete_hiver == 'heat' %}
            {% if tendance == 'increasing' %}
              T°Ext Up >>> {{ temp_ext }}° Chambre {{ temp_diff }}° - Salon & Bureau {{ temp_cible }}° (Heat)
            {% elif tendance == 'decreasing' %}
              T°Ext Down <<< {{ temp_ext }}° Chambre {{ temp_diff }}° - Salon & Bureau {{ temp_cible }}° (Heat)
            {% else %}
              Temp. stable {{ temp_ext }}° Chambre {{ temp_diff }}° - Salon & Bureau {{ temp_cible }}° (Heat)
            {% endif %}
          {% elif mode_ete_hiver == 'cool' %}
            {% if tendance == 'increasing' %}
              T°Ext Up >>> {{ temp_ext }}° Chambre {{ temp_diff }}° - Salon & Bureau {{ temp_cible }}° (Cool)
            {% elif tendance == 'decreasing' %}
              T°Ext Down <<< {{ temp_ext }}° Chambre {{ temp_diff }}° - Salon & Bureau {{ temp_cible }}° (Cool)
            {% else %}
              Temp. stable {{ temp_ext }}° Chambre {{ temp_diff }}° - Salon & Bureau {{ temp_cible }}° (Cool)
            {% endif %}
          {% else %} {# mode_ete_hiver == 'fan_only' #}
            {% if tendance == 'increasing' %}
              T°Ext Up >>> {{ temp_ext }}° Chambre {{ temp_diff }}° - Salon & Bureau (Fan)
            {% elif tendance == 'decreasing' %}
              T°Ext Down <<< {{ temp_ext }}° Chambre {{ temp_diff }}° - Salon & Bureau (Fan)
            {% else %}
              Temp. stable {{ temp_ext }}° Chambre {{ temp_diff }}° - Salon & Bureau (Fan)
            {% endif %}
          {% endif %}
        {% else %}
        
            {% if tendance == 'increasing' %}
              T°Ext Up >>> {{ temp_ext }}° [Clim OFF]
            {% elif tendance == 'decreasing' %}
              T°Ext Down <<< {{ temp_ext }}° [Clim OFF]
            {% else %}
              Temp. stable {{ temp_ext }}° [Clim OFF]
            {% endif %}
          
        {% endif %}
      {% else %}
        Aucun message pertinent actuellement.
      {% endif %}
