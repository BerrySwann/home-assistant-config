- sensor:
    # ┌───────────────────────────────────┐
    # │ 1. TEMPS                          │
    # └───────────────────────────────────┘
    # --- current_hour ---
    - name: "Current Hour"
      unique_id: current_hour
      unit_of_measurement: ""
      state: "{{ now().hour }}"

