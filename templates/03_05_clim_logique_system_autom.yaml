#========================================================================
# -=<( SYSTEM CLIM - LOGIQUE COMPLETE )>=-
#========================================================================

- sensor:
  # --- DÉTECTION DU MODE GÉNÉRAL ---
  - name: "Mode Été/Hiver"
    unique_id: mode_ete_hiver
    state: >
      {% set temp_ext = states('sensor.th_balcon_nord_temperature') | float(-999) %}
      {% set temp_hors_gel = states('sensor.seuil_non_chauffage_bas') | float(-999) %}
      {% if temp_ext == -999 or temp_hors_gel == -999 %}
        ERREUR
      {% elif temp_ext < temp_hors_gel %}
        heat
      {% elif temp_hors_gel <= temp_ext <= 25 %}
        fan_only
      {% else %}
        cool
      {% endif %}

  # --- CONSIGNES DYNAMIQUES (Le coeur de la modification) ---
  - name: "Consigne de Base"
    unique_id: consigne_de_base
    unit_of_measurement: "°C"
    # Hiver: 18° / Été: 28°
    state: >
      {% if states('sensor.mode_ete_hiver') == 'cool' %} 28 {% else %} 18 {% endif %}

  - name: "Temperature différentielle"
    unique_id: temperature_differentielle
    unit_of_measurement: "°C"
    # Hiver: 19° / Été: 27°
    state: >
      {% if states('sensor.mode_ete_hiver') == 'cool' %} 27 {% else %} 19 {% endif %}

  # --- PARAMÈTRES FIXES ---
  - name: "Temperature éCO. Hiver"
    unique_id: temperature_eco_hiver
    unit_of_measurement: "°C"
    state: "17"

  - name: "Seuil non chauffage bas"
    unique_id: seuil_non_chauffage_bas
    unit_of_measurement: "°C"
    state: "15"

  # --- DELTAS ---
  - name: "Delta_1"
    unique_id: delta_1
    state: "1"
    unit_of_measurement: "°C"

  - name: "Delta_2"
    unique_id: delta_2
    state: "2"
    unit_of_measurement: "°C"

  - name: "Delta_3"
    unique_id: delta_3
    state: "3"
    unit_of_measurement: "°C"

  - name: "Delta_5"
    unique_id: delta_5
    state: "5"
    unit_of_measurement: "°C"

  - name: "Delta_7"
    unique_id: delta_7
    state: "7"
    unit_of_measurement: "°C"

  # --- MOTEUR DE CALCUL : CIBLE ---
  - name: "Temperature Cible"
    unique_id: temperature_cible
    unit_of_measurement: "°C"
    state: >
      {% set temp_ext = states('sensor.th_balcon_nord_temperature') | float | int %}
      {% set consigne_de_base = states('sensor.consigne_de_base') | int %}
      {% set delta_1 = states('sensor.delta_1') | int %}
      {% set delta_2 = states('sensor.delta_2') | int %}
      {% set delta_5 = states('sensor.delta_5') | int %}
      {% set delta_7 = states('sensor.delta_7') | int %}
      
      {% if temp_ext < 10 %}
        {{ consigne_de_base + delta_2 | int }}
      {% elif temp_ext < 12 %}
        {{ consigne_de_base + delta_1 | int}}
      {% elif temp_ext > 40 %}
        {{ temp_ext - delta_7 | int }}
      {% elif temp_ext > 32 %}
        {{ temp_ext - delta_5 | int }}
      {% else %}
        {{ consigne_de_base | int }}
      {% endif %}

  # --- MOTEUR DE CALCUL : CONFORT JOUR ---
  - name: "Temperature confort Jour"
    unique_id: temperature_confort_jour
    unit_of_measurement: "°C"
    state: >
      {% set temp_diff = states('sensor.temperature_differentielle') | int %}
      {% set consigne_de_base = states('sensor.consigne_de_base') | int %}
      {% set temp_cible = states('sensor.temperature_cible') | int %}
      {{ (temp_diff + (temp_cible - consigne_de_base)) | round(1) | int }}

  # --- MOTEUR DE CALCUL : CONFORT NUIT (Corrigé) ---
  - name: "Temperature confort nuit"
    unique_id: temperature_confort_nuit
    unit_of_measurement: "°C"
    state: >
      {% set temp_ext = states('sensor.th_balcon_nord_temperature') | int %}
      {% set temp_diff = states('sensor.temperature_differentielle') | int %}
      {% set consigne_de_base = states('sensor.consigne_de_base') | int %}
      {% set temp_cible = states('sensor.temperature_cible') | int %}
      {% set delta_1 = states('sensor.delta_1') | int %}
      {% set delta_2 = states('sensor.delta_2') | int %}
      {% set delta_3 = states('sensor.delta_3') | int %}
      {% set delta_5 = states('sensor.delta_5') | int %}
      {% set delta_7 = states('sensor.delta_7') | int %}

      {% if temp_ext < 10 %}
        {{ ((temp_diff + (temp_cible - consigne_de_base)) - delta_3) | int }}
      {% elif temp_ext < 12 %}
        {{ ((temp_diff + (temp_cible - consigne_de_base)) - delta_2) | int }}
      {# --- CORRECTION ICI : On teste 40 AVANT 32 --- #}
      {% elif temp_ext > 40 %}
        {{ temp_ext - delta_7 | int }}
      {% elif temp_ext > 32 %}
        {{ temp_ext - delta_5 | int }}
      {% else %}
        {{ (temp_diff + (temp_cible - consigne_de_base)) | int }}
      {% endif %}

  # --- CALCUL : ÉCO HIVER CORRIGÉ ---
  - name: "Temperature éCO. Hiver Corrigé"
    unique_id: temperature_eco_hiver_corrige
    unit_of_measurement: "°C"
    state: >
      {% set temp_ext = states('sensor.th_balcon_nord_temperature') | int %}
      {% set temp_eco = states('sensor.temperature_eco_hiver') | int %}
      {% set delta_1 = states('sensor.delta_1') | int %}
      {% set delta_2 = states('sensor.delta_2') | int %}
      {% if temp_ext < 10 %}
        {{ (temp_eco + delta_1) | int }}
      {% else %}
        {{ temp_eco | int }}
      {% endif %}

  # --- MOYENNES ET DELTAS INTERNES ---
  - name: "Température moyenne intérieure"
    unique_id: temperature_moyenne_interieure
    unit_of_measurement: "°C"
    icon: "mdi:home-thermometer"
    state: >
      {{ (states('sensor.th_salon_temperature') | float(0) +
          states('sensor.th_cellier_temperature') | float(0) +
          states('sensor.th_cuisine_temperature') | float(0) +
          states('sensor.th_bureau_temperature') | float(0) +
          states('sensor.th_salle_de_bain_temperature') | float(0) +
          states('sensor.th_chambre_temperature') | float(0)) / 6 | round(1) }}

  - name: "Temperature Delta (valeur)"
    unique_id: temperature_delta_value
    unit_of_measurement: "°C"
    state: >
      {{ (states('sensor.th_balcon_nord_temperature') | float(0) -
          states('sensor.temperature_moyenne_interieure') | float(0)) | round(1) }}

  - name: "Température Delta"
    unique_id: temperature_delta
    state: >
      Te {{ states('sensor.th_balcon_nord_temperature') | float(0) | round(1) }}°C 
      T̄i {{ states('sensor.temperature_moyenne_interieure') | float(0) | round(1) }}°C 
      ΔT = {{ (states('sensor.th_balcon_nord_temperature') | float(0) - states('sensor.temperature_moyenne_interieure') | float(0)) | round(1) }}°C

- sensor:
  - name: "Delta ADEME Recommandé"
    unique_id: delta_ademe_recommande
    unit_of_measurement: "°C"
    icon: "mdi:delta"
    state: >
      {# Calcul : (T° Confort Cible) - (T° Extérieure) #}
      {{ (states('sensor.temperature_confort') | float(0) - 
          states('sensor.th_balcon_nord_temperature') | float(0)) | round(1) }}