#============================================================================
# PUISSANCE DE CROISIÈRE (Watts) - MOYENNE RÉELLE JOUR & MOIS
#============================================================================

- sensor:
    # --- BOX INTERNET ---
    - name: "Box Internet Puissance Moyenne Jour"
      unique_id: box_internet_avg_watts_daily
      unit_of_measurement: "W"
      device_class: power
      state: >
        {% set conso = states('sensor.prise_box_internet_ikea_daily') | float(0) %}
        {% set h = now().hour + (now().minute / 60) %}
        {{ ((conso * 1000) / h if h > 0.1 else 0) | round(1) }}

    - name: "Box Internet Puissance Moyenne Mois"
      unique_id: box_internet_avg_watts_monthly
      unit_of_measurement: "W"
      device_class: power
      state: >
        {% set conso = states('sensor.prise_box_internet_ikea_monthly') | float(0) %}
        {% set hm = ((now().day - 1) * 24) + now().hour + (now().minute / 60) %}
        {{ ((conso * 1000) / hm if hm > 0.1 else 0) | round(1) }}

