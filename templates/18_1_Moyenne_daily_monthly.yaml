#============================================================================
# MOYENNES HORAIRES (kWh/h) - JOUR & MOIS
#============================================================================

- sensor:
    # --- BOX INTERNET ---
    - name: "Box Internet Moyenne Horaire Jour"
      unique_id: box_internet_avg_hour_daily
      unit_of_measurement: "kWh/h"
      state: >
        {% set conso = states('sensor.prise_box_internet_ikea_daily') | float(0) %}
        {% set heures = now().hour + (now().minute / 60) %}
        {{ (conso / heures if heures > 0.1 else 0) | round(4) }}

    - name: "Box Internet Moyenne Horaire Mois"
      unique_id: box_internet_avg_hour_monthly
      unit_of_measurement: "kWh/h"
      state: >
        {% set conso = states('sensor.prise_box_internet_ikea_monthly') | float(0) %}
        {% set h_mois = ((now().day - 1) * 24) + now().hour + (now().minute / 60) %}
        {{ (conso / h_mois if h_mois > 0.1 else 0) | round(4) }}

