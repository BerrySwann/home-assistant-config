# ╭────────────────────────────────────────────────────────────────────────╮
# │ SENSOR : SÉRIE 18. PUISSANCE MOYENNE (W)                               │
# ╰────────────────────────────────────────────────────────────────────────╯

- sensor:
    # ==========================================================================
    # 1. PÔLE CHAUFFAGE / CLIM
    # ==========================================================================

    # ┌───────────────────────────────────┐
    # │ 4. SALON                          │
    # └───────────────────────────────────┘
    # --- clim_salon_avg_watts_daily ---
    - name: "Clim Salon Avg Watts Daily"
      unique_id: clim_salon_avg_watts_daily
      unit_of_measurement: "W"
      device_class: power
      state: >
        {% set conso = states('sensor.clim_salon_daily') | float(0) %}
        {% set h = now().hour + (now().minute / 60) %}
        {{ ((conso * 1000) / h if h > 0.1 else 0) | round(1) }}

    # --- clim_salon_avg_watts_monthly ---
    - name: "Clim Salon Avg Watts Monthly"
      unique_id: clim_salon_avg_watts_monthly
      unit_of_measurement: "W"
      device_class: power
      state: >
        {% set conso = states('sensor.clim_salon_monthly') | float(0) %}
        {% set hm = ((now().day - 1) * 24) + now().hour + (now().minute / 60) %}
        {{ ((conso * 1000) / hm if hm > 0.1 else 0) | round(1) }}

