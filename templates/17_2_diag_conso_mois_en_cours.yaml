# - [L6-8] Ajout du titre secondaire (Boîte ASCII carrée 37 car).
# - [L9,23,36,48,59,69,82,95] Ajout des titres tertiaires (slugs).
# - [Global] Standardisation de l'indentation et regroupement logique.