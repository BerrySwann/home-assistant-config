#========================================================================
# TOTAUX ÉCLAIRAGE (DIAGNOSTIC)
#========================================================================

#--- TOTAL QUOTIDIEN ---
- sensor:
  - name: "Conso. Eclairage Total QUOTIDIEN"
    unique_id: conso_eclairage_total_quotidien
    device_class: energy
    unit_of_measurement: "kWh"
    icon: mdi:lightbulb-on-outline
    state: >
      {{ (states('sensor.eclairage_salon_5_quotidien') | float(0) +
        states('sensor.eclairage_cuisine_1_quotidien') | float(0) +
        states('sensor.eclairage_appart_2_quotidien') | float(0) +
        states('sensor.eclairage_bureau_5_quotidien') | float(0) +
        states('sensor.eclairage_sdb_2_quotidien') | float(0) +
        states('sensor.eclairage_chambre_4_quotidien') | float(0)) | round(3) }}

#--- TOTAL MENSUEL ---
  - name: "Conso. Eclairage Total MENSUEL"
    unique_id: conso_eclairage_total_mensuel
    device_class: energy
    unit_of_measurement: "kWh"
    icon: mdi:lightbulb-on-outline
    state: >
      {{ (states('sensor.eclairage_salon_5_mensuel') | float(0) +
        states('sensor.eclairage_cuisine_1_mensuel') | float(0) +
        states('sensor.eclairage_appart_2_mensuel') | float(0) +
        states('sensor.eclairage_bureau_5_mensuel') | float(0) +
        states('sensor.eclairage_sdb_2_mensuel') | float(0) +
        states('sensor.eclairage_chambre_4_mensuel') | float(0)) | round(3) }}