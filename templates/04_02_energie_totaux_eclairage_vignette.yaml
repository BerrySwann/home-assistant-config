      unique_id: eclairage_cuisine_total_quotidien
      device_class: energy
      unit_of_measurement: kWh
      state: >
        {{ states('sensor.eclairage_hue_white_lamp_cuisine_quotidien') | float(0) | round(3) }}

    # ┌───────────────────────────────────────────────────────────────────┐
    # │ 6. COULOIR (1 Ampoule)                                            │
    # └───────────────────────────────────────────────────────────────────┘
    - name: "Eclairage Couloir Total Quotidien"
      unique_id: eclairage_couloir_total_quotidien
      device_class: energy
      unit_of_measurement: kWh
      state: >
        {{ states('sensor.eclairage_hue_white_lamp_couloir_quotidien') | float(0) | round(3) }}

    # ┌───────────────────────────────────────────────────────────────────┐
    # │ 7. BUREAU (5 Ampoules)                                            │
    # └───────────────────────────────────────────────────────────────────┘
    - name: "Eclairage Bureau Total Quotidien"
      unique_id: eclairage_bureau_total_quotidien
      device_class: energy
      unit_of_measurement: kWh
      state: >
        {% set sensors = [
          states('sensor.eclairage_hue_play_1_pc_bureau_quotidien'),
          states('sensor.eclairage_hue_play_2_pc_bureau_quotidien'),
          states('sensor.eclairage_hue_play_3_pc_bureau_quotidien'),
          states('sensor.eclairage_lampe_bureau_1_hue_quotidien'),
          states('sensor.eclairage_lampe_bureau_2_hue_quotidien')
        ] %}
        {{ sensors | map('float', 0) | sum | round(3) }}

    # ┌───────────────────────────────────────────────────────────────────┐
    # │ 8. SDB (2 Ampoules)                                               │
    # └───────────────────────────────────────────────────────────────────┘
    - name: "Eclairage SdB Total Quotidien"
      unique_id: eclairage_sdb_total_quotidien
      device_class: energy
      unit_of_measurement: kWh
      state: >
        {% set sensors = [
          states('sensor.eclairage_relais_lumiere_sdb_sonoff_quotidien'),
          states('sensor.eclairage_lampe_salle_de_bain_hue_quotidien')
        ] %}
        {{ sensors | map('float', 0) | sum | round(3) }}

    # ┌───────────────────────────────────────────────────────────────────┐
    # │ 9. CHAMBRE (4 Ampoules)                                           │
    # └───────────────────────────────────────────────────────────────────┘
    - name: "Eclairage Chambre Total Quotidien"
      unique_id: eclairage_chambre_total_quotidien
      device_class: energy
      unit_of_measurement: kWh
      state: >
        {% set sensors = [
          states('sensor.eclairage_hue_white_lamp_chambre_1_quotidien'),
          states('sensor.eclairage_hue_white_lamp_chambre_2_quotidien'),
          states('sensor.eclairage_hue_color_candle_chambre_eric_quotidien'),
          states('sensor.eclairage_hue_color_candle_chambre_gege_quotidien')
        ] %}
        {{ sensors | map('float', 0) | sum | round(3) }}

