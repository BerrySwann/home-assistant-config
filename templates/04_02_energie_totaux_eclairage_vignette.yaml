# ╭────────────────────────────────────────────────────────────────────────────────────────╮
# │ TEMPLATES : SÉRIE 04_02. ÉNERGIE — TOTAUX ÉCLAIRAGE (PYRAMIDE : LAMPES > ZONES > TOTAL)│
# ╰────────────────────────────────────────────────────────────────────────────────────────╯

- sensor:
  #--- TOTAL QUOTIDIEN ---
  - name: "Conso. Eclairage Total QUOTIDIEN"
    unique_id: conso_eclairage_total_quotidien
    device_class: energy
    unit_of_measurement: "kWh"
    icon: mdi:lightbulb-on-outline
    state: >
      {{ (states('sensor.eclairage_salon_5_quotidien') | float(0) +
        states('sensor.eclairage_cuisine_1_quotidien') | float(0) +
        states('sensor.eclairage_appart_2_quotidien') | float(0) +
        states('sensor.eclairage_bureau_5_quotidien') | float(0) +
        states('sensor.eclairage_sdb_2_quotidien') | float(0) +
        states('sensor.eclairage_chambre_4_quotidien') | float(0)) | round(3) }}

  #--- TOTAL MENSUEL ---
  - name: "Conso. Eclairage Total MENSUEL"
    unique_id: conso_eclairage_total_mensuel
    device_class: energy
    unit_of_measurement: "kWh"
    icon: mdi:lightbulb-on-outline
    state: >
      {{ (states('sensor.eclairage_salon_5_mensuel') | float(0) +
        states('sensor.eclairage_cuisine_1_mensuel') | float(0) +
        states('sensor.eclairage_appart_2_mensuel') | float(0) +
        states('sensor.eclairage_bureau_5_mensuel') | float(0) +
        states('sensor.eclairage_sdb_2_mensuel') | float(0) +
        states('sensor.eclairage_chambre_4_mensuel') | float(0)) | round(3) }}

    # ╭────────────────────────────────────────────────────────────────────────────────────────╮
    # │SYNTHÈSE PAR PIÈCE - QUOTIDIEN                                                          │
    # ╰────────────────────────────────────────────────────────────────────────────────────────╯
    # ┌───────────────────────────────────────────────────────────────────┐
    # │ 1. ENTRÉE (1 Ampoule)                                             │
    # └───────────────────────────────────────────────────────────────────┘
- sensor:
    - name: eclairage_entree_total_quotidien
      unique_id: eclairage_entree_total_quotidien
      device_class: energy
      unit_of_measurement: kWh
      state: >
        {{ states('sensor.eclairage_hue_white_lamp_entree_quotidien') | float(0) | round(3) }}
    # ┌───────────────────────────────────────────────────────────────────┐
    # │ 4. SALON (Somme des 5 lampes)                                     │
    # └───────────────────────────────────────────────────────────────────┘
    - name: eclairage_salon_total_quotidien
      unique_id: eclairage_salon_total_quotidien
      device_class: energy
      unit_of_measurement: kWh
      state: >
        {% set sensors = [
          states('sensor.eclairage_hue_white_lamp_table_salon_quotidien'),
          states('sensor.eclairage_hue_ambiance_lamp_salon_1_quotidien'),
          states('sensor.eclairage_hue_ambiance_lamp_salon_2_quotidien'),
          states('sensor.eclairage_hue_ambiance_lamp_salon_3_quotidien'),
          states('sensor.eclairage_hue_color_candle_salon_1_quotidien')
        ] %}
        {{ sensors | map('float', 0) | sum | round(3) }}

    # ┌───────────────────────────────────────────────────────────────────┐
    # │ 5. CUISINE (1 Ampoule)                                            │
    # └───────────────────────────────────────────────────────────────────┘
    - name: eclairage_cuisine_total_quotidien
      unique_id: eclairage_cuisine_total_quotidien
      device_class: energy
      unit_of_measurement: kWh
      state: >
        {{ states('sensor.eclairage_hue_white_lamp_cuisine_quotidien') | float(0) | round(3) }}

    # ┌───────────────────────────────────────────────────────────────────┐
    # │ 6. COULOIR (1 Ampoule)                                            │
    # └───────────────────────────────────────────────────────────────────┘
    - name: eclairage_couloir_total_quotidien
      unique_id: eclairage_couloir_total_quotidien
      device_class: energy
      unit_of_measurement: kWh
      state: >
        {{ states('sensor.eclairage_hue_white_lamp_couloir_quotidien') | float(0) | round(3) }}

    # ┌───────────────────────────────────────────────────────────────────┐
    # │ 7. BUREAU (5 Ampoules)                                            │
    # └───────────────────────────────────────────────────────────────────┘
    - name: eclairage_bureau_total_quotidien
      unique_id: eclairage_bureau_total_quotidien
      device_class: energy
      unit_of_measurement: kWh
      state: >
        {% set sensors = [
          states('sensor.eclairage_hue_play_1_pc_bureau_quotidien'),
          states('sensor.eclairage_hue_play_2_pc_bureau_quotidien'),
          states('sensor.eclairage_hue_play_3_pc_bureau_quotidien'),
          states('sensor.eclairage_lampe_bureau_1_hue_quotidien'),
          states('sensor.eclairage_lampe_bureau_2_hue_quotidien')
        ] %}
        {{ sensors | map('float', 0) | sum | round(3) }}

    # ┌───────────────────────────────────────────────────────────────────┐
    # │ 8. SDB (2 Ampoules)                                               │
    # └───────────────────────────────────────────────────────────────────┘
    - name: eclairage_salle_de_bain_total_quotidien
      unique_id: eclairage_salle_de_bain_total_quotidien
      device_class: energy
      unit_of_measurement: kWh
      state: >
        {% set sensors = [
          states('sensor.eclairage_relais_lumiere_sdb_sonoff_quotidien'),
          states('sensor.eclairage_lampe_salle_de_bain_hue_quotidien')
        ] %}
        {{ sensors | map('float', 0) | sum | round(3) }}

    # ┌───────────────────────────────────────────────────────────────────┐
    # │ 9. CHAMBRE (4 Ampoules)                                           │
    # └───────────────────────────────────────────────────────────────────┘
    - name: eclairage_chambre_total_quotidien
      unique_id: eclairage_chambre_total_quotidien
      device_class: energy
      unit_of_measurement: kWh
      state: >
        {% set sensors = [
          states('sensor.eclairage_hue_white_lamp_chambre_1_quotidien'),
          states('sensor.eclairage_hue_white_lamp_chambre_2_quotidien'),
          states('sensor.eclairage_hue_color_candle_chambre_eric_quotidien'),
          states('sensor.eclairage_hue_color_candle_chambre_gege_quotidien')
        ] %}
        {{ sensors | map('float', 0) | sum | round(3) }}

    # ╭────────────────────────────────────────────────────────────────────────────────────────╮
    # │SYNTHÈSE PAR PIÈCE - MENSUEL                                                            │
    # ╰────────────────────────────────────────────────────────────────────────────────────────╯
    # ┌───────────────────────────────────────────────────────────────────┐
    # │ 1. ENTRÉE (1 Ampoule)                                             │
    # └───────────────────────────────────────────────────────────────────┘
- sensor:
    - name: eclairage_entree_total_mensuel
      unique_id: eclairage_entree_total_mensuel
      device_class: energy
      unit_of_measurement: kWh
      state: >
        {{ states('sensor.eclairage_hue_white_lamp_entree_mensuel') | float(0) | round(3) }}

    # ┌───────────────────────────────────────────────────────────────────┐
    # │ 4. SALON (Somme des 5 lampes)                                     │
    # └───────────────────────────────────────────────────────────────────┘
    - name: eclairage_salon_total_mensuel
      unique_id: eclairage_salon_total_mensuel
      device_class: energy
      unit_of_measurement: kWh
      state: >
        {% set sensors = [
          states('sensor.eclairage_hue_white_lamp_table_salon_mensuel'),
          states('sensor.eclairage_hue_ambiance_lamp_salon_1_mensuel'),
          states('sensor.eclairage_hue_ambiance_lamp_salon_2_mensuel'),
          states('sensor.eclairage_hue_ambiance_lamp_salon_3_mensuel'),
          states('sensor.eclairage_hue_color_candle_salon_1_mensuel')
        ] %}
        {{ sensors | map('float', 0) | sum | round(3) }}

    # ┌───────────────────────────────────────────────────────────────────┐
    # │ 5. CUISINE (1 Ampoule)                                            │
    # └───────────────────────────────────────────────────────────────────┘
    - name: eclairage_cuisine_total_mensuel
      unique_id: eclairage_cuisine_total_mensuel
      device_class: energy
      unit_of_measurement: kWh
      state: >
        {{ states('sensor.eclairage_hue_white_lamp_cuisine_mensuel') | float(0) | round(3) }}

    # ┌───────────────────────────────────────────────────────────────────┐
    # │ 6. COULOIR (1 Ampoule)                                            │
    # └───────────────────────────────────────────────────────────────────┘
    - name: eclairage_couloir_total_mensuel
      unique_id: eclairage_couloir_total_mensuel
      device_class: energy
      unit_of_measurement: kWh
      state: >
        {{ states('sensor.eclairage_hue_white_lamp_couloir_mensuel') | float(0) | round(3) }}

    # ┌───────────────────────────────────────────────────────────────────┐
    # │ 7. BUREAU (5 Ampoules)                                            │
    # └───────────────────────────────────────────────────────────────────┘
    - name: eclairage_bureau_total_mensuel
      unique_id: eclairage_bureau_total_mensuel
      device_class: energy
      unit_of_measurement: kWh
      state: >
        {% set sensors = [
          states('sensor.eclairage_hue_play_1_pc_bureau_mensuel'),
          states('sensor.eclairage_hue_play_2_pc_bureau_mensuel'),
          states('sensor.eclairage_hue_play_3_pc_bureau_mensuel'),
          states('sensor.eclairage_lampe_bureau_1_hue_mensuel'),
          states('sensor.eclairage_lampe_bureau_2_hue_mensuel')
        ] %}
        {{ sensors | map('float', 0) | sum | round(3) }}

    # ┌───────────────────────────────────────────────────────────────────┐
    # │ 8. SDB (2 Ampoules)                                               │
    # └───────────────────────────────────────────────────────────────────┘
    - name: eclairage_salle_de_bain_total_mensuel
      unique_id: eclairage_salle_de_bain_total_mensuel
      device_class: energy
      unit_of_measurement: kWh
      state: >
        {% set sensors = [
          states('sensor.eclairage_relais_lumiere_sdb_sonoff_mensuel'),
          states('sensor.eclairage_lampe_salle_de_bain_hue_mensuel')
        ] %}
        {{ sensors | map('float', 0) | sum | round(3) }}

    # ┌───────────────────────────────────────────────────────────────────┐
    # │ 9. CHAMBRE (4 Ampoules)                                           │
    # └───────────────────────────────────────────────────────────────────┘
    - name: eclairage_chambre_total_mensuel
      unique_id: eclairage_chambre_total_mensuel
      device_class: energy
      unit_of_measurement: kWh
      state: >
        {% set sensors = [
          states('sensor.eclairage_hue_white_lamp_chambre_1_mensuel'),
          states('sensor.eclairage_hue_white_lamp_chambre_2_mensuel'),
          states('sensor.eclairage_hue_color_candle_chambre_eric_mensuel'),
          states('sensor.eclairage_hue_color_candle_chambre_gege_mensuel')
        ] %}
        {{ sensors | map('float', 0) | sum | round(3) }}

    # ┌───────────────────────────────────────────────────────────────────┐
    # │ 10. AUTRE : GRAND TOTAL APPARTEMENT (SOMME DES PIÈCES CI-DESSUS)  │
    # └───────────────────────────────────────────────────────────────────┘
- sensor:
    # ==========================================
    # GRAND TOTAL ÉCLAIRAGE APPART. - QUOTIDIEN
    # ==========================================
    - name: "eclairage_appart_total_quotidien"
      unique_id: "eclairage_appart_total_quotidien"
      device_class: energy
      unit_of_measurement: kWh
      icon: mdi:lightbulb-group
      state: >
        {% set sensors = [
          states('sensor.eclairage_entree_total_quotidien'),
          states('sensor.eclairage_salon_total_quotidien'),
          states('sensor.eclairage_cuisine_total_quotidien'),
          states('sensor.eclairage_couloir_total_quotidien'),
          states('sensor.eclairage_bureau_total_quotidien'),
          states('sensor.eclairage_salle_de_bain_total_quotidien'),
          states('sensor.eclairage_chambre_total_quotidien')
        ] %}
        {{ sensors | map('float', 0) | sum | round(3) }}

    # ==========================================
    # GRAND TOTAL ÉCLAIRAGE APPART. - MENSUEL
    # ==========================================
    - name: "eclairage_appart_total_mensuel"
      unique_id: "eclairage_appart_total_mensuel"
      device_class: energy
      unit_of_measurement: kWh
      icon: mdi:lightbulb-group-outline
      state: >
        {% set sensors = [
          states('sensor.eclairage_entree_total_mensuel'),
          states('sensor.eclairage_salon_total_mensuel'),
          states('sensor.eclairage_cuisine_total_mensuel'),
          states('sensor.eclairage_couloir_total_mensuel'),
          states('sensor.eclairage_bureau_total_mensuel'),
          states('sensor.eclairage_salle_de_bain_total_mensuel'),
          states('sensor.eclairage_chambre_total_mensuel')
        ] %}
        {{ sensors | map('float', 0) | sum | round(3) }}