# ╭────────────────────────────────────────────────────────────────────────────────────────╮
# │ TEMPLATES : SÉRIE 04_02. ÉNERGIE — TOTAUX ÉCLAIRAGE (PYRAMIDE : LAMPES > ZONES > TOTAL)│
# ╰────────────────────────────────────────────────────────────────────────────────────────╯
    # ┌────────────────────────────────────────────────────────────────────────┐
    # │ TOTAL 2x LAMPES APPART. - QUOTIDIEN (1. ENTRÉE + 6. COULOIR)           │
    # └────────────────────────────────────────────────────────────────────────┘
- sensor:
    - name: "2x Lampes Appart Total Quotidien"
      unique_id: "2x_lampes_appart_total_quotidien"
      device_class: energy
      unit_of_measurement: kWh
      icon: mdi:lightbulb-group
      state: >
        {% set sensors = [
          states('sensor.eclairage_entree_total_quotidien'),
          states('sensor.eclairage_couloir_total_quotidien')
        ] %}
        {{ sensors | map('float', 0) | sum | round(3) }}
    # ┌────────────────────────────────────────────────────────────────────────┐
    # │ TOTAL 2x LAMPES APPART. - MENSUEL (1. ENTRÉE + 6. COULOIR)             │
    # └────────────────────────────────────────────────────────────────────────┘
- sensor:
    - name: "2x Lampes Appart Total Mensuel"
      unique_id: "2x_lampes_appart_total_mensuel"
      device_class: energy
      unit_of_measurement: kWh
      icon: mdi:lightbulb-group
      state: >
        {% set sensors = [
          states('sensor.eclairage_entree_total_mensuel'),
          states('sensor.eclairage_couloir_total_mensuel')
        ] %}
        {{ sensors | map('float', 0) | sum | round(3) }}
# ╭────────────────────────────────────────────────────────────────────────────────────────╮
# │ SYNTHÈSE PAR PIÈCE - QUOTIDIEN                                                         │
# ╰────────────────────────────────────────────────────────────────────────────────────────╯
    # ┌───────────────────────────────────────────────────────────────────┐
    # │ 1. ENTRÉE (1 Ampoule)                                             │
    # └───────────────────────────────────────────────────────────────────┘
- sensor:
    - name: "Eclairage Entrée Total Quotidien"
      unique_id: eclairage_entree_total_quotidien
      device_class: energy
      unit_of_measurement: kWh
      state: >
        {{ states('sensor.eclairage_hue_white_lamp_entree_quotidien') | float(0) | round(3) }}
    # ┌───────────────────────────────────────────────────────────────────┐
    # │ 4. SALON (Somme des 5 lampes)                                     │
    # └───────────────────────────────────────────────────────────────────┘
    - name: "Eclairage Salon Total Quotidien"
      unique_id: eclairage_salon_total_quotidien
      device_class: energy
      unit_of_measurement: kWh
      state: >
        {% set sensors = [
          states('sensor.eclairage_hue_white_lamp_table_salon_quotidien'),
          states('sensor.eclairage_hue_ambiance_lamp_salon_1_quotidien'),
          states('sensor.eclairage_hue_ambiance_lamp_salon_2_quotidien'),
          states('sensor.eclairage_hue_ambiance_lamp_salon_3_quotidien'),
          states('sensor.eclairage_hue_color_candle_salon_1_quotidien')
        ] %}
        {{ sensors | map('float', 0) | sum | round(3) }}

    # ┌───────────────────────────────────────────────────────────────────┐
    # │ 5. CUISINE (1 Ampoule)                                            │
    # └───────────────────────────────────────────────────────────────────┘
