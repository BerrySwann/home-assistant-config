# ╭──────────────────────────────────────────────────────────────────────────╮
# │ SENSOR : PÔLE 1. DURÉE D'UTILISATION [DUT] (TOTAL SALLE DE BAIN)         │
# ╰──────────────────────────────────────────────────────────────────────────╯
    # ┌───────────────────────────────────┐
    # │ 8. SDB                            │
    # └───────────────────────────────────┘

    # --- dut_sdb_total ---
    # Durée totale d'utilisation (Soufflant + Sèche-Serviettes)
    - name: "DUT SdB Total"
      unique_id: dut_sdb_total
      unit_of_measurement: "h"
      icon: mdi:clock-outline
      state: >
        {% set soufflant = states('sensor.dut_sdb_soufflant') | float(0) %}
        {% set seche_serv = states('sensor.dut_sdb_seche_serviettes') | float(0) %}
        {{ (soufflant + seche_serv) | round(2) }}

# ╭──────────────────────────────────────────────────────────────────────────╮
# │ SENSOR : PÔLE 1. PERFORMANCE THERMIQUE                                   │
# ╰──────────────────────────────────────────────────────────────────────────╯
    # ┌───────────────────────────────────┐
    # │ 4. SALON                          │
    # └───────────────────────────────────┘
    # --- performance_thermique_salon ---
    # --- 4. SALON (25.88 m²) ---
    - name: "Performance Thermique Salon"
      unique_id: performance_thermique_salon
      unit_of_measurement: "pts"
      state: >
        {% set watts = states('sensor.clim_salon_nous_power') | float(0) %}
        {% set dut = states('sensor.dut_clim_salon') | float(0) %}
        {% set surface = 25.88 %}
        {% set delta_t = (states('sensor.temperature_salon') | float(0)) - (states('sensor.th_balcon_nord_temperature') | float(0)) %}
        {% if delta_t > 0 and surface > 0 %}
          {{ ((watts * dut) / (surface * delta_t)) | round(1) }}
        {% else %} 0 {% endif %}

    # ┌───────────────────────────────────┐
    # │ 5. CUISINE                        │
    # └───────────────────────────────────┘
    # --- performance_thermique_cuisine ---
    # --- 5. CUISINE (10.59 m²) ---
    - name: "Performance Thermique Cuisine"
      unique_id: performance_thermique_cuisine
      unit_of_measurement: "pts"
      state: >
        {% set watts = states('sensor.radiateur_elec_cuisine_power') | float(0) %}
        {% set dut = states('sensor.dut_radiateur_cuisine') | float(0) %}
        {% set surface = 10.59 %}
        {% set delta_t = (states('sensor.temperature_cuisine') | float(0)) - (states('sensor.th_balcon_nord_temperature') | float(0)) %}
        {% if delta_t > 0 and surface > 0 %}
          {{ ((watts * dut) / (surface * delta_t)) | round(1) }}
        {% else %} 0 {% endif %}

    # ┌───────────────────────────────────┐
    # │ 7. BUREAU                         │
    # └───────────────────────────────────┘
    # --- performance_thermique_bureau ---
    # --- 7. BUREAU (10.55 m²) ---
    - name: "Performance Thermique Bureau"
      unique_id: performance_thermique_bureau
      unit_of_measurement: "pts"
      state: >
        {% set watts = states('sensor.clim_du_bureau_nous_power') | float(0) %}
        {% set dut = states('sensor.dut_clim_bureau') | float(0) %}
        {% set surface = 10.55 %}  {# Mis à jour de 6.86 à 10.55 #}
        {% set delta_t = (states('sensor.temperature_bureau') | float(0)) - (states('sensor.th_balcon_nord_temperature') | float(0)) %}
        {% if delta_t > 0 and surface > 0 %}
          {{ ((watts * dut) / (surface * delta_t)) | round(1) }}
        {% else %} 0 {% endif %}

    # ┌───────────────────────────────────┐
    # │ 8. SDB                            │
    # └───────────────────────────────────┘
    # --- dut_sdb_total ---
    # Durée totale d'utilisation (Soufflant + Sèche-Serviettes)
    # --- 8. SDB (3.13 m²) ---
    - name: "Performance Thermique SdB"
      unique_id: performance_thermique_sdb
      unit_of_measurement: "pts"
      state: >
        {% set watts = (states('sensor.prise_radiateur_salle_de_bain_nous_power') | float(0)) + (states('sensor.prise_radiateur_salle_de_bain_inspelning_ikea_power') | float(0)) %}
        {% set dut = states('sensor.dut_sdb_total') | float(0) %}
        {% set surface = 3.13 %} {# Mis à jour à 3.13 #}
        {% set delta_t = (states('sensor.th_salle_de_bain_temperature') | float(0)) - (states('sensor.th_balcon_nord_temperature') | float(0)) %}
        {% if delta_t > 0 and surface > 0 %}
          {{ ((watts * dut) / (surface * delta_t)) | round(1) }}
        {% else %} 0 {% endif %}

    # ┌───────────────────────────────────┐
    # │ 9. CHAMBRE                        │
    # └───────────────────────────────────┘
    # --- performance_thermique_chambre ---
    # --- 9. CHAMBRE (11.26 m²) ---
    - name: "Performance Thermique Chambre"
      unique_id: performance_thermique_chambre
      unit_of_measurement: "pts"
      state: >
        {% set watts = states('sensor.clim_chambre_nous_power') | float(0) %}
        {% set dut = states('sensor.dut_clim_chambre') | float(0) %}
        {% set surface = 11.26 %}
        {% set delta_t = (states('sensor.temperature_chambre') | float(0)) - (states('sensor.th_balcon_nord_temperature') | float(0)) %}
        {% if delta_t > 0 and surface > 0 %}
          {{ ((watts * dut) / (surface * delta_t)) | round(1) }}
        {% else %} 0 {% endif %}