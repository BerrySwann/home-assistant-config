# ╭──────────────────────────────────────────────────────────────────────────╮
# │ SENSOR : PÔLE 1. DURÉE D'UTILISATION [DUT] (TOTAL SALLE DE BAIN)         │
# ╰──────────────────────────────────────────────────────────────────────────╯
    # ┌───────────────────────────────────┐
    # │ 8. SDB                            │
    # └───────────────────────────────────┘

    # --- dut_sdb_total ---
    # Durée totale d'utilisation (Soufflant + Sèche-Serviettes)
    - name: "DUT SdB Total"
      unique_id: dut_sdb_total
      unit_of_measurement: "h"
      icon: mdi:clock-outline
      state: >
        {% set soufflant = states('sensor.dut_sdb_soufflant') | float(0) %}
        {% set seche_serv = states('sensor.dut_sdb_seche_serviettes') | float(0) %}
        {{ (soufflant + seche_serv) | round(2) }}

# ╭──────────────────────────────────────────────────────────────────────────╮
# │ SENSOR : PERFORMANCE THERMIQUE — MODÈLE PHYSIQUE W/(m²·°C)               │
# │ VERSION COMPLÈTE : Toutes les pièces + Total + DPE                       │
# ╰──────────────────────────────────────────────────────────────────────────╯

- sensor:
    # ┌────────────────────────────────────────────────────────────────────┐
    # │ PERFORMANCES PAR PIÈCE (Formule : W_moy / Surface × ΔT)           │
    # └────────────────────────────────────────────────────────────────────┘

    # --- SALON (25.88 m²) ---
    - name: "Performance Thermique Salon (25.88 m²)"
      unique_id: performance_thermique_salon
      unit_of_measurement: "pts"
      icon: mdi:hvac
      state: >
        {% set watts_moy = states('sensor.clim_salon_avg_watts_daily') | float(0) %}
        {% set delta_t = (states('sensor.th_salon_temperature') | float(0) - states('sensor.th_balcon_nord_temperature') | float(0)) | abs %}
        {% if delta_t > 0.5 and watts_moy > 0.1 %}
          {{ (watts_moy / (25.88 * delta_t)) | round(2) }}
        {% else %} 0 {% endif %}
      availability: "{{ is_number(states('sensor.clim_salon_avg_watts_daily')) }}"

    # --- CUISINE (10.59 m²) ---
    - name: "Performance Thermique Cuisine (10.59 m²)"
      unique_id: performance_thermique_cuisine
      unit_of_measurement: "pts"
      icon: mdi:radiator
      state: >
        {% set watts_moy = states('sensor.radiateur_cuisine_avg_watts_daily') | float(0) %}
        {% set delta_t = (states('sensor.th_cuisine_temperature') | float(0) - states('sensor.th_balcon_nord_temperature') | float(0)) | abs %}
        {% if delta_t > 0.5 and watts_moy > 0.1 %}
          {{ (watts_moy / (10.59 * delta_t)) | round(2) }}
        {% else %} 0 {% endif %}
      availability: "{{ is_number(states('sensor.radiateur_cuisine_avg_watts_daily')) }}"

    # --- BUREAU (10.55 m²) ---
    - name: "Performance Thermique Bureau (10.55 m²)"
      unique_id: performance_thermique_bureau
      unit_of_measurement: "pts"
      icon: mdi:hvac
      state: >
        {% set watts_moy = states('sensor.clim_bureau_avg_watts_daily') | float(0) %}
        {% set delta_t = (states('sensor.th_bureau_temperature') | float(0) - states('sensor.th_balcon_nord_temperature') | float(0)) | abs %}
        {% if delta_t > 0.5 and watts_moy > 0.1 %}
          {{ (watts_moy / (10.55 * delta_t)) | round(2) }}
        {% else %} 0 {% endif %}
      availability: "{{ is_number(states('sensor.clim_bureau_avg_watts_daily')) }}"

    # --- SDB (3.13 m²) ---
    - name: "Performance Thermique SdB (3.13 m²)"
      unique_id: performance_thermique_sdb
      unit_of_measurement: "pts"
      icon: mdi:water-boiler
      state: >
        {% set w_soufflant = states('sensor.soufflant_sdb_avg_watts_daily') | float(0) %}
        {% set w_seche = states('sensor.seche_serviette_sdb_avg_watts_daily') | float(0) %}
        {% set watts_moy = w_soufflant + w_seche %}
        {% set delta_t = (states('sensor.th_salle_de_bain_temperature') | float(0) - states('sensor.th_balcon_nord_temperature') | float(0)) | abs %}
        {% if delta_t > 0.5 and watts_moy > 0.1 %}
          {{ (watts_moy / (3.13 * delta_t)) | round(2) }}
        {% else %} 0 {% endif %}
      availability: >
          {{ is_number(states('sensor.soufflant_sdb_avg_watts_daily')) and 
            is_number(states('sensor.seche_serviette_sdb_avg_watts_daily')) }}

      # --- CHAMBRE (11.26 m²) ---
    - name: "Performance Thermique Chambre (11.26 m²)"
      unique_id: performance_thermique_chambre
      unit_of_measurement: "pts"
      icon: mdi:hvac
      state: >
        {% set watts_moy = states('sensor.clim_chambre_avg_watts_daily') | float(0) %}
        {% set delta_t = (states('sensor.th_chambre_temperature') | float(0) - states('sensor.th_balcon_nord_temperature') | float(0)) | abs %}
        {% if delta_t > 0.5 and watts_moy > 0.1 %}
          {{ (watts_moy / (11.26 * delta_t)) | round(2) }}
        {% else %} 0 {% endif %}
      availability: "{{ is_number(states('sensor.clim_chambre_avg_watts_daily')) }}"

    # ┌────────────────────────────────────────────────────────────────────┐
    # │ PERFORMANCE TOTALE (Moyenne 24h glissante)                        │
    # └────────────────────────────────────────────────────────────────────┘

    # --- TOTAL HABITAT (75 m²) ---
    - name: "Performance Thermique Totale Stable"
      unique_id: performance_thermique_totale_stable
      unit_of_measurement: "pts"
      icon: mdi:chart-line
      state: >
        {% set w_moy = states('sensor.conso_clim_rad_moyenne_24h') | float(0) %}
        {% set delta_moy = states('sensor.temperature_delta_moyenne_24h') | float(0) | abs %}
        {% if delta_moy > 0.5 and w_moy > 2 %}
          {{ (w_moy / (75.0 * delta_moy)) | round(2) }}
        {% else %} 0 {% endif %}
      availability: >
        {{  is_number(states('sensor.conso_clim_rad_moyenne_24h')) and 
            is_number(states('sensor.temperature_delta_moyenne_24h')) }}

    # ┌────────────────────────────────────────────────────────────────────┐
    # │ CLASSIFICATION DPE (Basée sur coefficient thermique)              │
    # └────────────────────────────────────────────────────────────────────┘

    # --- CLASSE ÉNERGÉTIQUE DPE ---
    - name: "Classe Énergétique DPE"
      unique_id: classe_energetique_dpe
      icon: mdi:gauge
      state: >
        {% set p = states('sensor.performance_thermique_totale_stable') | float(0) %}
        {% if p <= 0 %} "N/A"
        {% elif p <= 0.5 %} "A"
        {% elif p <= 1.5 %} "B"
        {% elif p <= 2.5 %} "C"
        {% elif p <= 4.0 %} "D"
        {% elif p <= 6.0 %} "E"
        {% elif p <= 8.5 %} "F"
        {% else %} "G"
        {% endif %}
      attributes:
        score_pts: "{{ states('sensor.performance_thermique_totale_stable') | float(0) }}"
        interpretation: >
          {% set p = states('sensor.performance_thermique_totale_stable') | float(0) %}
          {% if p <= 0.5 %} "Excellent"
          {% elif p <= 1.5 %} "Très bon"
          {% elif p <= 2.5 %} "Bon"
          {% elif p <= 4.0 %} "Moyen"
          {% elif p <= 6.0 %} "Passable"
          {% elif p <= 8.5 %} "Mauvais"
          {% else %} "Très mauvais"
          {% endif %}
        couleur_dpe: >
          {% set p = states('sensor.performance_thermique_totale_stable') | float(0) %}
          {% if p <= 0.5 %} "#008055"
          {% elif p <= 1.5 %} "#2FB044"
          {% elif p <= 2.5 %} "#BED100"
          {% elif p <= 4.0 %} "#FFD100"
          {% elif p <= 6.0 %} "#FFB300"
          {% elif p <= 8.5 %} "#F44336"
          {% else %} "#8B0000"
          {% endif %}
        formule: "Performance = Puissance_moyenne / (Surface × ΔT)"
        surface_totale: "75 m²"
        unite: "W/(m²·°C)"

