# ╭──────────────────────────────────────────────────────────────────────────╮
# │ SENSOR : PÔLE 1. DURÉE D'UTILISATION [DUT] (TOTAL SALLE DE BAIN)         │
# ╰──────────────────────────────────────────────────────────────────────────╯
    # ┌───────────────────────────────────┐
    # │ 8. SDB                            │
    # └───────────────────────────────────┘

    # --- dut_sdb_total ---
    # Durée totale d'utilisation (Soufflant + Sèche-Serviettes)
    - name: "DUT SdB Total"
      unique_id: dut_sdb_total
      unit_of_measurement: "h"
      icon: mdi:clock-outline
      state: >
        {% set soufflant = states('sensor.dut_sdb_soufflant') | float(0) %}
        {% set seche_serv = states('sensor.dut_sdb_seche_serviettes') | float(0) %}
        {{ (soufflant + seche_serv) | round(2) }}

# ╭──────────────────────────────────────────────────────────────────────────╮
# │ SENSOR : PÔLE 1. PERFORMANCE THERMIQUE (FORMULE: W×DUT / S×ΔT)           │
# ╰──────────────────────────────────────────────────────────────────────────╯
    # ┌───────────────────────────────────┐
    # │ 4. SALON (25.88 m²)               │
    # └───────────────────────────────────┘
    # --- performance_thermique_salon ---
    - name: "Performance Thermique Salon (25.88 m²)"
      unique_id: performance_thermique_salon
      unit_of_measurement: "pts"
      state: >
        {% set watts = states('sensor.clim_salon_nous_power') | float(0) %}
        {% set dut = states('sensor.dut_clim_salon') | float(0) %}
        {% set surface = 25.88 %}
        {% set t_int = states('sensor.th_salon_temperature') | float(0) %}
        {% set t_ext = states('sensor.th_balcon_nord_temperature') | float(0) %}
        {% set delta_t = (t_int - t_ext) | abs %} {# "[L...] modif - Ajout abs() pour gérer clim été" #}
        {% if delta_t > 0.5 and surface > 0 and watts > 5 %} {# "[L...] modif - delta_t > 0.5 au lieu de > 0" #}
          {{ ((watts * dut) / (surface * delta_t)) | round(1) }}
        {% else %} 0 {% endif %}

    # ┌───────────────────────────────────┐
    # │ 5. CUISINE (10.59 m²)             │
    # └───────────────────────────────────┘
    # --- performance_thermique_cuisine ---
    - name: "Performance Thermique Cuisine (10.59 m²)"
      unique_id: performance_thermique_cuisine
      unit_of_measurement: "pts"
      state: >
        {% set watts = states('sensor.radiateur_cuisine_power') | float(0) %}
        {% set dut = states('sensor.dut_radiateur_cuisine') | float(0) %}
        {% set surface = 10.59 %}
        {% set t_int = states('sensor.th_cuisine_temperature') | float(0) %}
        {% set t_ext = states('sensor.th_balcon_nord_temperature') | float(0) %}
        {% set delta_t = (t_int - t_ext) | abs %} {# "[L...] modif - Ajout abs() pour gérer clim été" #}
        {% if delta_t > 0.5 and surface > 0 and watts > 5 %} {# "[L...] modif - delta_t > 0.5 au lieu de > 0" #}
          {{ ((watts * dut) / (surface * delta_t)) | round(1) }}
        {% else %} 0 {% endif %}

    # ┌───────────────────────────────────┐
    # │ 7. BUREAU (10.55 m²)              │
    # └───────────────────────────────────┘
    # --- performance_thermique_bureau ---
    - name: "Performance Thermique Bureau (10.55 m²)"
      unique_id: performance_thermique_bureau
      unit_of_measurement: "pts"
      state: >
        {% set watts = states('sensor.clim_bureau_nous_power') | float(0) %}
        {% set dut = states('sensor.dut_clim_bureau') | float(0) %}
        {% set surface = 10.55 %}
        {% set t_int = states('sensor.th_bureau_temperature') | float(0) %}
        {% set t_ext = states('sensor.th_balcon_nord_temperature') | float(0) %}
        {% set delta_t = (t_int - t_ext) | abs %} {# "[L...] modif - Ajout abs() pour gérer clim été" #}
        {% if delta_t > 0.5 and surface > 0 and watts > 5 %} {# "[L...] modif - delta_t > 0.5 au lieu de > 0" #}
          {{ ((watts * dut) / (surface * delta_t)) | round(1) }}
        {% else %} 0 {% endif %}

    # ┌───────────────────────────────────┐
    # │ 8. SDB (3.13 m²)                  │ # "[L253] modif - Correction surface 3.96→3.13 (réel)"
    # └───────────────────────────────────┘
    # --- performance_thermique_sdb ---
    - name: "Performance Thermique SdB (3.13 m²)"
      unique_id: performance_thermique_sdb
      unit_of_measurement: "pts"
      state: >
        {# 1. Calcul de l'énergie totale réelle (P1*D1 + P2*D2) pour éviter l'erreur mathématique #}
        {% set p1 = states('sensor.prise_soufflant_salle_de_bain_nous_power') | float(0) %}
        {% set d1 = states('sensor.dut_sdb_soufflant') | float(0) %}
        
        {% set p2 = states('sensor.prise_seche_serviette_salle_de_bain_nous_power') | float(0) %}
        {% set d2 = states('sensor.dut_sdb_seche_serviettes') | float(0) %}

        {% set energie_totale_wh = (p1 * d1) + (p2 * d2) %}

        {# 2. Paramètres d'environnement #}
        {% set surface = 3.13 %}
        {% set t_int = states('sensor.th_salle_de_bain_temperature') | float(0) %}
        {% set t_ext = states('sensor.th_balcon_nord_temperature') | float(0) %}
        {% set delta_t = (t_int - t_ext) | abs %}

        {# 3. Calcul de performance avec sécurité #}
        {% if delta_t > 0.5 and surface > 0 and energie_totale_wh > 0 %}
          {{ (energie_totale_wh / (surface * delta_t)) | round(1) }}
        {% else %}
          0
        {% endif %}
      availability: >
        {{ states('sensor.th_salle_de_bain_temperature') | is_number and 
            states('sensor.th_balcon_nord_temperature') | is_number }}

    # ┌───────────────────────────────────┐
    # │ 9. CHAMBRE (11.26 m²)             │
    # └───────────────────────────────────┘
    # --- performance_thermique_chambre ---
    - name: "Performance Thermique Chambre (11.26 m²)"
      unique_id: performance_thermique_chambre
      unit_of_measurement: "pts"
      state: >
        {% set watts = states('sensor.clim_chambre_nous_power') | float(0) %}
        {% set dut = states('sensor.dut_clim_chambre') | float(0) %}
        {% set surface = 11.26 %}
        {% set t_int = states('sensor.th_chambre_temperature') | float(0) %}
        {% set t_ext = states('sensor.th_balcon_nord_temperature') | float(0) %}
        {% set delta_t = (t_int - t_ext) | abs %} {# "[L...] modif - Ajout abs() pour gérer clim été" #}
        {% if delta_t > 0.5 and surface > 0 and watts > 5 %} {# "[L...] modif - delta_t > 0.5 au lieu de > 0" #}
          {{ ((watts * dut) / (surface * delta_t)) | round(1) }}
        {% else %} 0 {% endif %}

    # ┌───────────────────────────────────┐
    # │ 10. TOTAL HABITAT (75m²)          │
    # └───────────────────────────────────┘
    # --- dut_brut_total ---
    - name: "DUT Brut Total"
      unique_id: dut_brut_total
      unit_of_measurement: "pts"
      icon: mdi:sigma
      state: >
        {# 1. Récupération et conversion numérique de chaque DUT #}
        {% set d1 = states('sensor.dut_clim_salon') | float(0) %}
        {% set d2 = states('sensor.dut_radiateur_cuisine') | float(0) %}
        {% set d3 = states('sensor.dut_clim_bureau') | float(0) %}
        {% set d4 = states('sensor.dut_soufflant_sdb') | float(0) %}
        {% set d5 = states('sensor.dut_sdb_seche_serviettes') | float(0) %}
        {% set d6 = states('sensor.dut_clim_chambre') | float(0) %}
        
        {# 2. Addition brute de toutes les valeurs #}
        {{ (d1 + d2 + d3 + d4 + d5 + d6) | round(2) }}

    # ┌───────────────────────────────────┐
    # │ 10. TOTAL HABITAT (75m²)          │
    # └───────────────────────────────────┘
    #--- performance_thermique_totale (Version Réaliste DEP) ---
    - name: "Performance Thermique Totale"
      unique_id: performance_thermique_totale
      unit_of_measurement: "pts"
      icon: mdi:home-thermometer
      state: >
        {# 1. ÉNERGIE TOTALE CONSOMMÉE AUJOURD'HUI (en Wh) #}
        {# On multiplie les kWh par 1000 pour avoir des Wh #}
        {% set energy_wh = states('sensor.conso_clim_rad_total_quotidien') | float(0) * 1000 %}

        {# 2. PARAMÈTRES (Surface totale de l'enveloppe et Delta T) #}
        {% set surface = 75.0 %}
        {% set delta = states('sensor.temperature_delta_valeur') | float(0) | abs %}

        {# 3. CALCUL #}
        {% if delta > 0.5 and energy_wh > 0 %}
          {{ (energy_wh / (surface * delta)) | round(2) }}
        {% else %}
          0
        {% endif %}

    #--- performance_thermique_totale_stable (VERSION RÉELLE) ---
    - name: "Performance Thermique Totale Stable"
      unique_id: performance_thermique_totale_stable
      unit_of_measurement: "pts"
      state: >
        {# 1. Énergie totale du jour en Wh (on prend tes kWh * 1000) #}
        {% set energy_wh = states('sensor.conso_clim_rad_total_quotidien') | float(0) * 1000 %}

        {# 2. Delta T moyen sur 24h et surface réelle #}
        {% set delta_moy = states('sensor.temperature_delta_moyenne_24h') | float(0) | abs %}
        {% set surface = 75.0 %}

        {# 3. Calcul : Wh / (m² * ΔT) #}
        {% if delta_moy > 0.5 and energy_wh > 0 %}
          {{ (energy_wh / (surface * delta_moy)) | round(1) }}
        {% else %}
          {{ states('sensor.performance_thermique_totale_stable') | float(0) }}
        {% endif %}

# ╭──────────────────────────────────────────────────────────────────────────╮
# │       D.P.E.             --- CLASSE ÉNERGÉTIQUE DPE ---                  │
# ╰──────────────────────────────────────────────────────────────────────────╯

# --- classe_energetique_dpe ---
    - name: "Classe Énergétique DPE"
      unique_id: classe_energetique_dpe
      icon: mdi:gauge
      state: >
        {# Utilisation de la moyenne stable pour éviter les sauts de lettre #}
        {% set p = states('sensor.performance_thermique_totale_stable') | float(0) %}
        {% if p <= 0 %} "N/A"
        {% elif p <= 0.5 %} "A"     {# "[L431] modif - Alignement seuils DPE avec graphique" #}
        {% elif p <= 1.5 %} "B"
        {% elif p <= 2.5 %} "C"
        {% elif p <= 4.0 %} "D"     {# "[L...] modif - 3.5→4.0" #}
        {% elif p <= 6.0 %} "E"     {# "[L...] modif - 7.0→6.0" #}
        {% elif p <= 8.5 %} "F"     {# "[L...] modif - 10.0→8.5" #}
        {% else %} "G"
        {% endif %}
      attributes:
        score_pts: "{{ states('sensor.performance_thermique_totale_stable') | float(0) }}"
        interpretation: > 
          {% set p = states('sensor.performance_thermique_totale_stable') | float(0) %}
          {% if p <= 0.5 %} "Excellent"
          {% elif p <= 1.5 %} "Très bon"
          {% elif p <= 2.5 %} "Bon"
          {% elif p <= 4.0 %} "Moyen"
          {% elif p <= 6.0 %} "Passable"
          {% elif p <= 8.5 %} "Mauvais"
          {% else %} "Très mauvais"
          {% endif %}
        couleur_dpe: >
          {% set p = states('sensor.performance_thermique_totale_stable') | float(0) %}
          {% if p <= 0.5 %} "#008055"     {# "[L...] modif - Seuil 1.5→0.5" #}
          {% elif p <= 1.5 %} "#2FB044"   {# A→B #}
          {% elif p <= 2.5 %} "#BED100"   {# B→C #}
          {% elif p <= 4.0 %} "#FFD100"   {# "[L...] modif - C→D 3.5→4.0" #}
          {% elif p <= 6.0 %} "#FFB300"   {# "[L...] modif - D→E 5.0→6.0" #}
          {% elif p <= 8.5 %} "#F44336"   {# "[L...] modif - E→F 7.0→8.5" #}
          {% else %} "#8B0000"            {# F→G #}
          {% endif %}
        formule: "Performance = (Watts × DUT) / (Surface × ΔT)" 
        surface_totale: "75 m²"
        unite: "W·h / (m²·°C)"

# ═══════════════════════════════════════════════════════════════════════════
