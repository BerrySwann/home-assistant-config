# - [2026-02-08] [L253] FIX CRITIQUE : Surface SdB 3.96→3.13 m² (erreur +26%)
# - [2026-02-08] [L269] FIX : Correction surface SdB dans calcul (1.96×1.58=3.13)
# - [2026-02-08] [L...] AMÉLIO : Ajout abs() sur delta_t (gestion clim été)
# - [2026-02-08] [L...] AMÉLIO : delta_t > 0 → delta_t > 0.5 (seuil cohérent)
# - [2026-02-08] [L431] FIX : Seuils DPE alignés avec graphique (A≤0.5, D≤4.0, E≤6.0, F≤8.5)
