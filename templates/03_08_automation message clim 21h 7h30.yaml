Le fait que ce sensor soit à True signifie une chose simple : Home Assistant a réussi à obtenir une réponse HTTP en contactant l'adresse https://erodi-ha.com/a0d7b954_vscode/ingress.

Voici précisément ce que cela veut dire et, surtout, ce que cela ne veut pas dire :

Ce que "True" confirme :
L'Addon est démarré : Si l'addon VS Code était éteint, l'URL renverrait une erreur (502 Bad Gateway) et le sensor passerait à False.

Le réseau fonctionne : Ton Mini-PC arrive à sortir sur Internet, atteindre ton domaine erodi-ha.com, et revenir vers lui-même.

Le certificat SSL est valide : Puisque tu es en HTTPS, le sensor vérifie que la connexion est sécurisée.

Ce que "True" ne peut PAS savoir :
Si tu es connecté : Le sensor reçoit un "OK" du serveur, mais il ne sait pas si un humain a ouvert la page. C'est comme appeler un hôtel : la réception décroche (True), mais cela ne dit pas si la chambre est occupée.

Si tu as fermé ton onglet : Même si tu fermes ton navigateur, l'addon reste "allumé" sur le Mini-PC. L'URL reste donc accessible, et le sensor restera à True.

Pourquoi c'est important pour ton automatisation ?
C'est là que le bât blesse : si tu n'utilises que ce sensor, ton automatisation ne se déclenchera jamais pour inactivité, car tant que l'addon tourne, le sensor reste à True.

C'est pour cela que dans le code que nous avons fait ensemble, j'ai ajouté le deuxième déclencheur (le CPU) :

