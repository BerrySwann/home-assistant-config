Pour voir ce qui "bouffe" ton électricité et tes ressources en arrière-plan, nous allons utiliser la puissance du terminal de Home Assistant.

1. La méthode "Directe" (Ligne de commande)
Si tu veux la liste immédiatement, ouvre ton terminal HA (Add-on "Terminal & SSH") et tape cette commande :

Bash
top -b -n 1 | head -n 30
Ce que ça fait : Ça te donne les 30 processus les plus gourmands en temps réel. Tu y verras passer node (pour VS Code), python3 (pour Home Assistant) et les différents containers Docker.

2. La méthode "Champion" : Ton propre sensor de processus
Si tu veux avoir cette liste directement dans ton interface Home Assistant ou la recevoir sur ton Poco X7 Pro quand le CPU dépasse 10%, voici comment créer un capteur de "Top Processus".

Ajoute ceci dans ton sensors.yaml :

YAML
- platform: command_line
  name: "Top Processus CPU"
  unique_id: top_cpu_processes
  # On liste les 5 processus les plus gourmands avec leur nom et % CPU
  command: "ps -eo pcpu,comm --sort=-pcpu | head -n 6 | tail -n 5"
  scan_interval: 60
  value_template: "Actif" # L'état du sensor
  json_attributes:
    - command
