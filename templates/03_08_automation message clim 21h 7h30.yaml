sensor.ping_https_vscode



Ping HTTPS VSCode

True

friendly_name: Ping HTTPS VSCode



donc une petite automation pour ci-dessus



si false notify plus bouton a coché "coupe VSC" ou "Tjrs en cours"

C'est parfait ! Si ton sensor affiche True, cela signifie que l'URL répond. Par contre, attention : comme on en a discuté, ce sensor risque de rester à True tant que l'addon est allumé (car il voit la page de login ou l'entrée de l'Ingress).

Mais testons la logique : s'il passe à False (ce qui arrivera si l'addon plante ou si le tunnel erodi-ha.com est coupé), voici l'automatisation avec les boutons pour ton Poco X7 Pro.

L'automatisation avec boutons actionnables
YAML
alias: "VS Code - Alerte Connexion"
description: "Notifie si l'accès HTTPS VS Code est perdu ou inactif"
trigger:
  - platform: state
    entity_id: sensor.ping_https_vscode
    to: "False" # Se déclenche quand le ping échoue
    for:
      minutes: 5
action:
  - action: notify.mobile_app_poco_x7_pro
    data:
      title: "⚠️ VS Code - Statut"
      message: "Le capteur HTTPS est passé à False. Que faire ?"
      data:
        actions:
          - action: "STOP_VSCODE"
            title: "Couper VSC"
          - action: "KEEP_VSCODE"
            title: "Tjrs en cours"

  # On attend de voir si tu cliques sur "Couper VSC"
  - wait_for_trigger:
      - platform: event
        event_type: mobile_app_notification_action
        event_data:
          action: "STOP_VSCODE"
    timeout: "00:10:00"
    continue_on_timeout: false

  # Si tu as cliqué sur le bouton "Couper VSC"
  - action: hassio.addon_stop
    data:
      addon: a0d7b954_vscode
Comment ça fonctionne sur ton Poco :
Si le sensor passe à False, tu reçois une notification avec deux boutons.

Si tu cliques sur "Couper VSC", l'addon s'arrête immédiatement sur ton mini-PC.

Si tu cliques sur "Tjrs en cours" (ou si tu ne fais rien), l'automatisation s'arrête là et ne coupe rien.

