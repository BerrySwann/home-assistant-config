4. **unknown**

title: Moniteur Système

Si tes entités affichent "unknown", c'est que l'intégration Glances est installée en tant qu'Add-on, mais qu'elle n'est pas encore "connectée" au tableau de bord de Home Assistant.

Voici les 2 étapes pour corriger ça et voir tes processus :

Étape 1 : Activer les capteurs dans l'intégration
Par défaut, Home Assistant désactive les capteurs de processus pour ne pas surcharger la base de données. Il faut les réveiller :

Va dans Paramètres > Appareils et services.

Cherche la carte Glances et clique sur "X entités".

Cherche les entités qui s'appellent top_process ou Process 0 Name.

Si elles sont marquées comme "Désactivées par l'intégration" :

Clique sur l'entité.

Clique sur la roue crantée (Paramètres).

Coche "Activé" et valide.

Attends 30 secondes que les données remontent.

Étape 2 : Vérifier les bons noms d'entités
Le nom exact des entités varie selon la version. Retourne dans tes Outils de développement > États et tape glances dans le filtre pour copier le nom exact.

Voici le code Markdown mis à jour avec les noms les plus courants (vérifie si chez toi c'est sensor.glances_process_0 ou sensor.glances_top_process) :

YAML
type: markdown
content: >
  ### 🖥️ Ressources Mini-PC
  **Charge globale :** {{ states('sensor.glances_cpu_used_percent') | default('0') }}%
  **Mémoire vive :** {{ states('sensor.glances_memory_used_percent') | default('0') }}%

  ---
  ### 📊 Top Processus
  {% if states('sensor.glances_top_process') != 'unknown' %}
    1. **{{ states('sensor.glances_top_process') }}**
    2. **{{ states('sensor.glances_top_process_2') }}**
    3. **{{ states('sensor.glances_top_process_3') }}**
    4. **{{ states('sensor.glances_top_process_4') }}**
  {% else %}
    ⚠️ Capteurs à activer dans l'intégration Glances
  {% endif %}
title: Moniteur Système
Pourquoi c'est "unknown" ?
L'Add-on est éteint : Vérifie dans la partie "Add-ons" que Glances est bien démarré.

L'intégration n'est pas faite : L'Add-on et l'Intégration sont deux choses différentes. L'Add-on fait tourner le moteur, l'Intégration crée les capteurs.

Version du capteur : Parfois, Glances regroupe le nom et le % dans la même entité.

