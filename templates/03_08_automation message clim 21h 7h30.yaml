C'est une excellente idée. On va ajouter une condition horaire (après 20h00) et surveiller la charge globale de ton Mini-PC x86 via sensor.system_monitor_utilisation_du_processeur.

L'idée est la suivante : si après 20h ton processeur travaille encore trop (plus de 10%), c'est peut-être que VS Code ou un autre processus consomme des ressources inutilement.

Voici le code mis à jour. J'ai intégré le nouveau sensor et la contrainte de temps :

