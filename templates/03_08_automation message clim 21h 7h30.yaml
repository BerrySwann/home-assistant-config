sensor.glances_top_process_3 (Le n°3)

Option 2 : La carte "Tableau de Bord" (Le niveau Pro)
Si tu veux un affichage qui ressemble vraiment à un terminal de pro sur ton téléphone, utilise une Carte Markdown. Elle va lister les processus les uns sous les autres.

Copie ce code dans une carte Markdown :

YAML
type: markdown
content: >
  ### 🖥️ Ressources Mini-PC
  **Charge globale :** {{ states('sensor.glances_cpu_load') }}%
  **Mémoire vive :** {{ states('sensor.glances_ram_usage') }}%

  ---
  ### 📊 Top Processus
  1. **{{ states('sensor.glances_top_process') }}**
  2. **{{ states('sensor.glances_top_process_2') }}**
  3. **{{ states('sensor.glances_top_process_3') }}**
  4. **{{ states('sensor.glances_top_process_4') }}**
title: Moniteur Système
Pourquoi c'est mieux que d'ouvrir l'Add-on ?
Vitesse : En un clic sur ton application Home Assistant, tu vois tout.

Lisibilité : Sur le Poco X7 Pro, l'interface Glances originale est parfois écrite trop petit. Ici, c'est du texte natif Home Assistant, donc très lisible.

Actions : Tu peux placer juste en dessous de cette liste ton bouton "Restart VS Code" pour agir immédiatement si tu vois que c'est lui qui squatte le haut de la liste.

Comment faire si tu ne vois pas ces entités ?
Si dans tes entités tu ne vois pas sensor.glances_top_process, c'est que tu dois les activer dans l'intégration :

Va dans Paramètres > Appareils et services.

Clique sur Intégrations > Glances.

Clique sur "XX entités".

Cherche celles qui concernent les "Process" et vérifie qu'elles ne sont pas "Désactivées" (si elles sont grisées, clique dessus et fais "Activer").

Est-ce que tu veux que je te donne le code pour ajouter un bouton "Tuer le processus le plus gourmand" juste en dessous de cette liste ?



