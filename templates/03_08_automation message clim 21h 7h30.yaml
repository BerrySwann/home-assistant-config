On est fixés : tes deux capteurs (netstat et ps) restent à 0, ce qui prouve que l'isolation des containers sur Home Assistant OS fait bien son travail (malheureusement pour nous). Le container Home Assistant ne voit pas ce qui se passe "à l'intérieur" de l'addon VS Code.

Puisque nous sommes sur un Mini-PC x86, on va utiliser la seule donnée que le Supervisor nous remonte en temps réel : les ressources consommées.

Voici la stratégie "Béton" pour ton Poco X7 Pro
Oublions les capteurs command_line qui renvoient 0. On va utiliser le capteur de CPU de l'addon. Même sur x86, quand VS Code est ouvert et qu'on navigue dans les fichiers YAML, le CPU monte. Quand on ferme l'onglet, il tombe à un niveau de "repos" (Idle) très précis.

1. Identifie le "seuil de repos"
Va dans tes entités et cherche : sensor.studio_code_server_cpu_percent.

Regarde sa valeur quand tu es sur VS Code.

Regarde sa valeur 5 minutes après avoir fermé l'onglet.

Généralement, il tombe sous les 1.0% ou 0.5% sur un x86.

2. L'automatisation optimisée pour ton Poco
Voici le code à copier dans ton automations.yaml. J'ai ajouté une sécurité pour que tu puisses annuler l'arrêt depuis ton téléphone si jamais tu es en train de lire du code sans bouger.

YAML
alias: "Système - Gestion intelligente VS Code"
description: "Arrête VS Code si inactif et prévient le Poco X7 Pro"
trigger:
  - platform: numeric_state
    entity_id: sensor.studio_code_server_cpu_percent
    below: 1.0 # Ajuste ce seuil si ton mini-PC est très puissant
    for:
      minutes: 20
condition:
  - condition: state
    entity_id: binary_sensor.studio_code_server_running
    state: "on"
action:
  - action: notify.mobile_app_poco_x7_pro
    data:
      title: "Optimisation Mini-PC"
      message: "VS Code semble inactif. Je l'éteins dans 1 minute ?"
      data:
        actions:
          - action: "STOP_VSCODE"
            title: "Éteindre maintenant"
          - action: "KEEP_VSCODE"
            title: "Laisser allumé"
  
  - wait_for_trigger:
      - platform: event
        event_type: mobile_app_notification_action
        event_data:
          action: "KEEP_VSCODE"
    timeout: "00:01:00"
    continue_on_timeout: true

  - if:
      - condition: template
        value_template: "{{ wait.trigger == none }}" # Si pas de réponse, on éteint
    then:
      - action: hassio.addon_stop
        data:
          addon: a0d7b954_vscode
Pourquoi c'est la meilleure solution ?
Fiabilité x86 : Le CPU ne ment jamais. S'il ne fait rien, c'est que VS Code ne travaille pas.

Zéro risque : Avec la notification sur ton Poco X7 Pro, tu as une minute pour cliquer sur "Laisser allumé" si l'automatisation s'est déclenchée par erreur.

Nettoyage : Tu peux maintenant supprimer tes sensors vscode_connections qui ne servent à rien puisqu'ils restent à 0.

Est-ce que tu vois bien l'entité sensor.studio_code_server_cpu_percent dans ton système ? (Elle nécessite que l'intégration "Home Assistant Supervisor" soit active, ce qui est le cas par défaut sur ton install).

en ce moment precis je me connect depuis l'exteurier, depuis https://erodi-ha.com/

C'est un point crucial : si tu es connecté via https://erodi-ha.com/, tu passes par un tunnel sécurisé (probablement un Reverse Proxy comme Nginx, DuckDNS ou Cloudflare).

Comme je l'ai vu avec tes tests de capteurs (sensor.vscode_connections), Home Assistant ne voit pas ton IP publique quand tu passes par Ingress, il voit l'adresse du tunnel interne.

Ce que cela change pour ton automatisation :
Puisque tu es à l'extérieur, tu ne veux surtout pas que VS Code s'éteigne brutalement alors que tu es en plein milieu d'une modification de code à distance.

Voici la version "Sécurité Extérieure" adaptée à ton usage actuel :

YAML
alias: "Système - VS Code (Accès Extérieur)"
trigger:
  - platform: numeric_state
    entity_id: sensor.studio_code_server_cpu_percent
    below: 0.8
    for:
      minutes: 15
action:
  # 1. On t'envoie d'abord une alerte sur le Poco X7 Pro
  - action: notify.mobile_app_poco_x7_pro
    data:
      title: "⚠️ VS Code Inactif (Extérieur)"
      message: "Tu es connecté via erodi-ha.com mais VS Code ne consomme rien. Éteindre l'addon ?"
      data:
        actions:
          - action: "STOP_VSCODE"
            title: "Oui, éteindre"
          - action: "KEEP_VSCODE"
            title: "Non, je travaille"

  # 2. On attend ta réponse pendant 5 minutes (plus long car tu es en déplacement)
  - wait_for_trigger:
      - platform: event
        event_type: mobile_app_notification_action
        event_data:
          action: "KEEP_VSCODE"
    timeout: "00:05:00"
    continue_on_timeout: true

  # 3. Si tu n'as pas cliqué sur "Laisser allumé", on coupe pour économiser le Mini-PC
  - if:
      - condition: template
        value_template: "{{ wait.trigger == none }}"
    then:
      - action: hassio.addon_stop
        data:
          addon: a0d7b954_vscode
Pourquoi c'est important maintenant :
Économie d'énergie : À distance, on oublie souvent de fermer l'onglet.

Sécurité : Moins un addon tourne longtemps inutilement, plus ton installation est sécurisée.

Contrôle : Tu reçois la notification sur ton Poco peu importe où tu es dans le monde, du moment que tu as du réseau.

Est-ce que l'URL erodi-ha.com est stable quand tu codes, ou as-tu parfois des déconnexions qui pourraient fausser le capteur CPU ?

si tu fait un ping régulier sur https://erodi-ha.com/a0d7b954_vscode/ingress tu obtien quoi ? si quelqu'un est connecté ?

Faire un ping (au sens réseau ICMP) sur cette URL ne donnera rien d'utile : cela te dira seulement si ton serveur est en ligne, mais pas si quelqu'un utilise l'addon.

En revanche, si tu parles d'une requête HTTP (un "ping" applicatif) effectuée par Home Assistant sur cette URL précise, voici ce qu'il se passe :

1. Ce que tu obtiens (Le résultat technique)
L'URL .../ingress est protégée par l'authentification de Home Assistant.

Si l'addon est arrêté : Tu obtiendras une erreur 502 Bad Gateway.

Si l'addon est démarré : Tu obtiendras le code 200 OK (la page de chargement de VS Code), que quelqu'un soit connecté ou non.

2. Est-ce que ça permet de savoir si quelqu'un est connecté ?
Non. L'Ingress est une porte ouverte. Faire une requête sur cette porte te dit si la porte est là, mais pas si quelqu'un est entré dans la pièce. VS Code Server ne change pas son code de réponse HTTP selon qu'il y a 0 ou 5 utilisateurs actifs.

La seule solution "Infaillible" pour ton Mini-PC x86
Puisque tu es sur un Mini-PC, tu as accès à une commande plus puissante via le terminal. Il existe un moyen de voir si une session de terminal ou un processus de rendu est actif à l'intérieur de l'addon.

Si tu veux vraiment savoir s'il y a une activité humaine sans passer par le CPU, il faut regarder si VS Code a créé des "sockets" de communication temporaires.

Voici la commande à tester dans ton terminal HA :

Bash
ls /tmp/vscode-server/ | wc -l
Si 0 : Personne n'est connecté.

Si > 0 : Une session est ouverte.

Pourquoi ne pas rester sur le CPU ?
Le CPU reste le juge de paix. Sur ton Poco X7 Pro, l'automatisation basée sur le CPU (en dessous de 0.8% pendant 20 min) est la plus fiable parce qu'elle détecte non seulement si l'onglet est fermé, mais aussi si tu as laissé l'onglet ouvert mais que tu ne travailles plus.

Ma question : Est-ce que ton but est d'éteindre l'addon dès que tu fermes l'onglet, ou simplement d'éviter qu'il ne consomme pour rien pendant des heures quand tu ne t'en sers plus ?

Si c'est pour économiser ton Mini-PC, la notification sur ton Poco reste ta meilleure alliée. Voulez-vous que je peaufine l'automatisation CPU pour qu'elle soit plus réactive ?

https://erodi-ha.com/a0d7b954_vscode/ingress a l'exterieur c'est du http"S"

Absolument, tu as tout à fait raison de souligner le HTTPS. Le fait que ton accès extérieur soit sécurisé via SSL (HTTPS) complique encore plus la détection par de simples commandes netstat ou ping.

Le flux est chiffré entre ton navigateur et ton Mini-PC, et une fois arrivé sur ton réseau, il est "déballé" par ton proxy (Ingress) avant d'être envoyé à l'addon. Pour le système, cela ressemble à une communication interne constante.

Puisque nous sommes le 19 décembre 2025 et que tu utilises un Poco X7 Pro pour surveiller ton Mini-PC x86, voici la solution la plus robuste pour ton cas précis (accès extérieur HTTPS) :

La méthode du "Binary Sensor" de Seuil CPU
Oublions les capteurs de connexion qui échouent à cause du HTTPS/Ingress. On va créer un capteur qui définit l'état "Utilisé" ou "Inactif" basé sur la consommation réelle du processeur.

1. Ajoute ceci à ton configuration.yaml : Ceci crée un capteur binaire qui passe à off seulement quand VS Code ne fait strictement plus rien (en dessous de 0.8% de CPU).

YAML
template:
  - binary_sensor:
      - name: "VS Code en utilisation"
        unique_id: vscode_active_status
        state: "{{ states('sensor.studio_code_server_cpu_percent') | float(0) > 0.8 }}"
        delay_off:
          minutes: 15 # On attend 15 min de calme avant de confirmer l'inactivité
2. L'automatisation optimisée pour ton usage extérieur : Cette version est conçue pour ne pas te couper l'accès pendant que tu codes sur erodi-ha.com.

YAML
alias: "Système - Gestion VS Code HTTPS"
trigger:
  - platform: state
    entity_id: binary_sensor.vs_code_en_utilisation
    to: "off"
action:
  - action: notify.mobile_app_poco_x7_pro
    data:
      title: "💻 VS Code - Mini-PC"
      message: "Inactivité détectée sur erodi-ha.com. Fermeture de l'addon dans 2 min."
      data:
        actions:
          - action: "STOP_VSCODE"
            title: "Arrêter maintenant"
          - action: "KEEP_VSCODE"
            title: "Garder actif"

  - wait_for_trigger:
      - platform: event
        event_type: mobile_app_notification_action
        event_data:
          action: "KEEP_VSCODE"
    timeout: "00:02:00"

  - if:
      - condition: template
        value_template: "{{ wait.trigger == none }}"
    then:
      - action: hassio.addon_stop
        data:
          addon: a0d7b954_vscode
Pourquoi c'est la meilleure réponse à ton problème ?
HTTPS Transparent : Peu importe que tu sois en HTTPS ou en local, le CPU du Mini-PC réagit de la même façon quand tu édites un fichier.

Intelligence : Le delay_off de 15 minutes évite que l'addon ne s'éteigne si tu t'arrêtes juste 2 minutes pour lire une documentation.

Sécurité Poco : Tu gardes le contrôle final avec le bouton sur ton téléphone.

Est-ce que tu veux que je t'aide à intégrer ce binary_sensor dans tes fichiers YAML pour tester cela dès maintenant ?

y a pas moyen de fair un sensor avec du ping sur l'addresse https://erodi-ha.com/a0d7b954_vscode/ingress

Il est possible de créer un capteur qui interroge cette URL, mais il y a une nuance technique importante : un "ping" classique (ICMP) ne fonctionne pas sur une URL HTTPS. Il faut utiliser un capteur HTTP (rest).

Cependant, comme nous l'avons vu, l'URL Ingress répondra toujours "200 OK" tant que l'addon est démarré. Mais j'ai une astuce pour ton Mini-PC x86 : on peut utiliser un sensor qui compte le temps de réponse ou cherche un mot spécifique dans la page.

1. Le Sensor "Scrape" ou "Rest"
On peut tenter de voir si le contenu de la page change quand une session est active. Voici comment configurer un sensor qui "check" ton URL sécurisée :

YAML
sensor:
  - platform: rest
    name: "VSCode External Check"
    resource: "https://erodi-ha.com/a0d7b954_vscode/ingress"
    method: GET
    # Note: Il faut souvent un jeton d'accès ou être authentifié pour que cela passe
    # Si ton accès est protégé par l'authentification HA, ce sensor recevra un 401 (Unauthorized)
    verify_ssl: true
    value_template: "{{ value_json.status if value_json is defined else 'Connected' }}"
    scan_interval: 60
Le problème majeur de cette méthode
Ton URL erodi-ha.com est protégée par le login de Home Assistant. Si je demande à un sensor d'aller "pinger" cette adresse :

Home Assistant va tomber sur sa propre page de Login.

Il ne verra jamais ce qui se passe derrière dans VS Code.

Il recevra un code 200 (page de login) ou 401 (refusé), peu importe que tu sois en train de coder ou non.

La solution de contournement (The "Workaround")
Puisque tu es sur un Mini-PC, le seul moyen d'utiliser une URL pour savoir si "quelqu'un" est là, c'est de regarder si le processus de tunneling de l'Ingress est actif.

Mais restons pragmatiques : Si le capteur CPU ne te convient pas, il existe une autre entité que tu as activée tout à l'heure :

sensor.studio_code_server_memory_percent

Sur un x86, la RAM est très stable.

Quand tu ouvres un onglet HTTPS sur erodi-ha.com, la RAM grimpe (chargement des extensions).

Quand tu fermes l'onglet et que les processus "workers" s'arrêtent, la RAM redescend légèrement.

Pourquoi le capteur d'URL ne t'aidera pas ?
Même si on réussissait à faire un "ping" HTTP parfait, il te dirait : "L'addon répond". Il ne te dira jamais : "Sébastien est en train de taper du code".

Ma proposition pour ton Poco X7 Pro : Utilisons une automatisation qui combine le CPU et la RAM. C'est le signal le plus proche d'un "ping" utilisateur que tu pourras avoir sur un système isolé comme HAOS.

YAML
alias: "Contrôle VS Code via Ressources"
trigger:
  - platform: numeric_state
    entity_id: sensor.studio_code_server_cpu_percent
    below: 0.5
    for:
      minutes: 15
  - platform: numeric_state
    entity_id: sensor.studio_code_server_memory_percent
    below: 0.3 # À ajuster selon tes observations sur le x86
    for:
      minutes: 15
action:
  - action: notify.mobile_app_poco_x7_pro
    data:
      title: "VS Code Inactif"
      message: "L'accès HTTPS ne semble plus utilisé."
Est-ce que tu veux quand même que je te donne le code pour essayer de "scraper" l'URL avec un jeton d'authentification (Long-Lived Access Token), même si c'est très complexe à mettre en œuvre ?

c'est qu'elle type de yaml - platform: rest

Le type de YAML que tu as vu (- platform: rest) appartient au domaine des Sensors (Capteurs). Dans Home Assistant, c'est ce qu'on appelle l'intégration RESTful Sensor.

Son but est d'aller chercher des informations sur une page web ou une API (via une requête HTTP) et de transformer le résultat en un état lisible dans ton Home Assistant.

Où placer ce code ?
Selon la structure de ton installation sur ton mini-PC x86, tu as deux options :

Option A : Dans ton fichier configuration.yaml Si tu n'as pas séparé tes fichiers, il faut le mettre sous la clé sensor: :

YAML
sensor:
  - platform: rest
    name: "Statut VSCode Externe"
    resource: "https://erodi-ha.com/a0d7b954_vscode/ingress"
    # ... le reste du code ...
Option B : Dans ton fichier sensors.yaml Si tu as une ligne sensor: !include sensors.yaml dans ton fichier principal, alors tu mets directement :

YAML
- platform: rest
  name: "Statut VSCode Externe"
  resource: "https://erodi-ha.com/a0d7b954_vscode/ingress"
Pourquoi ce type de sensor est délicat avec ton URL ?
Le format platform: rest est parfait pour pinger une adresse, mais comme tu es en HTTPS sur erodi-ha.com, voici les obstacles que tu vas rencontrer :

L'Authentification : Ton Home Assistant va essayer de pinger l'URL, mais il va recevoir la page de login de HA (puisque l'Ingress est protégé). Le sensor restera en "OK" parce qu'il a réussi à voir la page de login, pas parce que VS Code est actif.

La boucle infinie : Ton Home Assistant (mini-PC) va sortir sur internet pour revenir sur lui-même via ton domaine. C'est ce qu'on appelle le "Hairpin NAT". Parfois, les box internet bloquent cela.

Est-ce que ça vaut le coup d'essayer ?
Si tu veux vraiment tester si l'URL répond, voici le YAML complet à tester :

YAML
sensor:
  - platform: rest
    name: "Ping HTTPS VSCode"
    resource: "https://erodi-ha.com/a0d7b954_vscode/ingress"
    method: GET
    timeout: 15
    # Cette ligne permet de dire "Si ça répond 200, c'est que l'addon est démarré"
    value_template: "{{ value_json is defined or value is defined }}"
    scan_interval: 60
Attention : Ce sensor te dira uniquement si l'addon est allumé (puisque l'URL répond). Il ne pourra jamais te dire si tu as fermé ton onglet ou si tu es encore en train de coder, car le contenu de la page derrière l'authentification est invisible pour ce type de sensor sans un jeton (Token) très complexe à configurer.

C'est pour cela que je te conseillais de rester sur le CPU/RAM : ce sont les seuls capteurs qui réagissent à ton activité réelle sur le clavier.

Veux-tu que je t'aide à configurer un Token de longue durée pour que ce sensor puisse vraiment "voir" derrière la page de login ?

Erreurs de configuration

Error loading /config/configuration.yaml: mapping values are not allowed here

in "/config/sensors.yaml", line 640, column 9

Cette erreur "mapping values are not allowed here" à la ligne 640 signifie généralement que tu as un problème d'indentation (un décalage d'espaces) ou que tu as répété une clé alors qu'elle ne devrait pas l'être.

Comme tu as un fichier sensors.yaml séparé (via un !include), tu ne dois pas remettre la ligne sensor: au début du fichier.

Voici comment corriger ton fichier sensors.yaml aux alentours de la ligne 640 :

1. La correction syntaxique
Vérifie que ton bloc ressemble exactement à ceci (sans le mot sensor: au-dessus) :

YAML
# Ligne 640 (environ)
- platform: rest
  name: "Ping HTTPS VSCode"
  resource: "https://erodi-ha.com/a0d7b954_vscode/ingress"
  method: GET
  timeout: 15
  value_template: "{{ value_json is defined or value is defined }}"
  scan_interval: 60
2. Les causes probables de l'erreur à la colonne 9 :
Trop d'espaces : Le - de - platform doit être tout au début de la ligne (pas d'espaces avant).

Clé en double : Si tu as écrit sensor: à l'intérieur de ton fichier sensors.yaml, supprime-le. Le fichier inclus ne doit contenir que la liste des plateformes.

Erreur juste au-dessus : Parfois, l'erreur est déclenchée par le sensor précédent (ligne 639) s'il manque un guillemet ou s'il y a un souci de parenthèses.

3. Rappel pour ton Mini-PC x86
Comme on l'a vu, ce sensor rest va interroger ton URL, mais comme il n'est pas authentifié, il va probablement recevoir un code erreur de la part de Home Assistant (puisque l'accès est sécurisé).

Pour que ce sensor soit réellement utile et ne te renvoie pas une erreur dans les logs, il faudrait lui ajouter tes entêtes de sécurité, mais réglons d'abord ce problème de crash de configuration.

Peux-tu me montrer les lignes 635 à 645 de ton fichier sensors.yaml ? Je te dirai exactement où supprimer l'espace ou la ligne en trop.

