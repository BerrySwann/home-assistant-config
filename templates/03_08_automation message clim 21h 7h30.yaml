celui la je crois que j'ai fait une modif mais je sais plus laquel

On va remettre tout ça au propre. En regardant tes deux automatisations, il y a un conflit potentiel et une petite erreur de logique dans la deuxième.

Voici l'analyse et la version "propre" fusionnée (car avoir deux automatisations qui font presque la même chose peut créer des bugs de notification sur ton Poco).

Ce qui cloche dans tes versions actuelles :
La confusion des Actions : Dans la première, tu utilises STOP_VSCODE / KEEP_VSCODE. Dans la deuxième, c'est STOP_VSC / KEEP_VSC. Si tu te trompes de bouton, l'automation ne saura pas quoi faire.

Le Timeout de la 2ème : Tu as mis un if qui cherche l'action STOP_VSC, mais si le délai de 5 minutes expire (timeout), wait.trigger devient none, et ton if va planter (provoquer une erreur) car il ne pourra pas lire .event.data.action.

Le Sensor Ping : Comme on l'a vu, sensor.ping_https_vscode ne passe à False que si l'addon crashe. Donc ta deuxième automatisation ne se déclenchera quasiment jamais.

La Solution : L'automatisation "Unique" (Fusionnée)
C'est beaucoup plus simple d'avoir une seule règle qui surveille tout pour ton Mini-PC.

YAML
alias: "VS Code - Gestion Intelligente"
description: "Surveille le CPU et le Ping pour gérer VS Code sur le Mini-PC"
triggers:
  # Trigger 1 : Inactivité CPU (Le plus fiable sur x86)
  - trigger: numeric_state
    entity_id: sensor.studio_code_server_cpu_percent
    below: 0.8
    for:
      minutes: 15
    id: "inactif"
  
  # Trigger 2 : Coupure réseau ou crash de l'addon
  - trigger: state
    entity_id: sensor.ping_https_vscode
    to: "False"
    for:
      minutes: 5
    id: "panne"

actions:
  # 1. Envoi de la notification sur le Poco X7 Pro
  - action: notify.mobile_app_poco_x7_pro
    data:
      title: "💻 VS Code : Statut {{ trigger.id }}"
      message: "L'activité est nulle ou l'accès est coupé. On éteint l'addon ?"
      data:
        actions:
          - action: "STOP_VSC"
            title: "Oui, éteindre"
          - action: "KEEP_VSC"
            title: "Tjrs en cours"

  # 2. On attend ta réponse
  - wait_for_trigger:
      - trigger: event
        event_type: mobile_app_notification_action
        event_data:
          action: "STOP_VSC"
      - trigger: event
        event_type: mobile_app_notification_action
        event_data:
          action: "KEEP_VSC"
    timeout: "00:05:00"
    continue_on_timeout: true

  # 3. Logique de décision sécurisée
  - if:
      - condition: template
        # On n'éteint QUE si tu as explicitement cliqué sur STOP
        value_template: "{{ wait.trigger is not none and wait.trigger.event.data.action == 'STOP_VSC' }}"
    then:
      - action: hassio.addon_stop
        data:
          addon: a0d7b954_vscode
      - action: notify.mobile_app_poco_x7_pro
        data:
          message: "VS Code a été arrêté proprement sur le Mini-PC."
    else:
      # Si tu as cliqué sur "Tjrs en cours" OU si tu n'as pas répondu (timeout)
      - stop: "L'addon reste allumé par sécurité."
Pourquoi cette version est meilleure pour toi :
Identifiant de Trigger (id) : Dans le titre de la notification sur ton Poco, tu verras marqué "Statut inactif" ou "Statut panne". Tu sauras exactement pourquoi l'alerte s'est lancée.

Sécurité Totale : Le if est protégé. Si tu ne réponds pas au bout de 5 minutes, il ne se passe rien. On ne coupe jamais VS Code par erreur si tu as laissé ton téléphone dans une autre pièce.

Nettoyage : Tu n'as plus qu'une seule automatisation à gérer.

Est-ce que tu veux que je t'aide à remplacer tes deux anciennes automatisations par celle-ci ? (Il faudra bien supprimer les anciennes pour éviter que ton téléphone ne sonne deux fois).

alors ou je reçoi ce stop ?

Tu reçois ce stop (et la demande de confirmation) directement sur ton Poco X7 Pro sous forme de notification enrichie.

Voici comment cela se passe concrètement pour toi :

1. Où le stop est-il déclenché ?
Le "stop" n'est pas une action physique, c'est une commande dans le code de ton Mini-PC.

Quand le CPU descend sous 0.8%, ton Mini-PC lance l'automatisation.

Il envoie alors un signal via internet (ton accès extérieur) vers les serveurs de Home Assistant, qui le redirigent vers ton smartphone.

2. L'affichage sur ton Poco X7 Pro
Sur ton téléphone, tu vas voir une notification apparaître en haut de ton écran. Pour voir les boutons "Couper" ou "Tjrs en cours", tu dois faire un geste :

Sur Android (Poco) : Tu dois faire glisser la notification vers le bas (ou cliquer sur la petite flèche à côté de la notification) pour faire apparaître les deux boutons.

3. Le choix est entre tes mains
Si tu cliques sur "Couper VSC" : Ton téléphone renvoie un signal à ton Mini-PC, qui exécute alors la commande hassio.addon_stop. L'addon s'arrête vraiment.

Si tu cliques sur "Tjrs en cours" : L'automatisation s'arrête sur le Mini-PC sans rien toucher.

Attention au "Else" (Sinon)
Dans ton code actuel, si tu ne réponds pas du tout à la notification (par exemple si tu as posé ton téléphone et que tu es parti faire autre chose), l'automatisation atteint le else: - stop.

Cela signifie que rien ne sera coupé. C'est une sécurité que nous avons mise pour éviter que VS Code ne s'éteigne pendant que tu codes si jamais tu as simplement oublié ton téléphone dans une autre pièce.

Est-ce que tu as déjà reçu une notification de test sur ton Poco pour vérifier que les boutons s'affichent bien ? Si tu veux, je peux te donner un petit script pour tester l'envoi immédiat de cette notification.

plutot que faire un stop un reset ou restart est possible

Oui, c'est tout à fait possible et c'est même une excellente idée si ton but est de "nettoyer" la mémoire de ton Mini-PC sans pour autant fermer complètement l'accès.

Au lieu de faire un addon_stop, on utilise l'action hassio.addon_restart.

Voici comment modifier l'automatisation pour qu'elle propose un redémarrage. J'ai ajusté la logique pour que, si tu ne réponds pas (timeout), elle redémarre l'addon au lieu de ne rien faire.

YAML
alias: "VS Code - Maintenance Ressources"
description: "Redémarre ou coupe VS Code selon l'activité"
triggers:
  - trigger: numeric_state
    entity_id: sensor.studio_code_server_cpu_percent
    below: 0.8
    for:
      minutes: 15
  - trigger: state
    entity_id: sensor.ping_https_vscode
    to: "False"
    for:
      minutes: 5

actions:
  - action: notify.mobile_app_poco_x7_pro
    data:
      title: "💻 VS Code - Optimisation"
      message: "Inactivité détectée. Que faire ?"
      data:
        actions:
          - action: "RESTART_VSC"
            title: "Redémarrer (Reset)"
          - action: "STOP_VSC"
            title: "Couper (Stop)"
          - action: "KEEP_VSC"
            title: "Tjrs en cours"

  - wait_for_trigger:
      - trigger: event
        event_type: mobile_app_notification_action
        event_data:
          action: "RESTART_VSC"
      - trigger: event
        event_type: mobile_app_notification_action
        event_data:
          action: "STOP_VSC"
      - trigger: event
        event_type: mobile_app_notification_action
        event_data:
          action: "KEEP_VSC"
    timeout: "00:05:00"
    continue_on_timeout: true

  - choose:
      # Cas 1 : Tu as cliqué sur Redémarrer (ou tu n'as pas répondu au bout de 5 min)
      - conditions:
          - condition: template
            value_template: "{{ wait.trigger == none or wait.trigger.event.data.action == 'RESTART_VSC' }}"
        sequence:
          - action: hassio.addon_restart
            data:
              addon: a0d7b954_vscode
          - action: notify.mobile_app_poco_x7_pro
            data:
              message: "VS Code a été redémarré pour libérer le CPU."

      # Cas 2 : Tu as cliqué sur Couper
      - conditions:
          - condition: template
            value_template: "{{ wait.trigger.event.data.action == 'STOP_VSC' }}"
        sequence:
          - action: hassio.addon_stop
            data:
              addon: a0d7b954_vscode

      # Cas 3 : Tu as cliqué sur "Tjrs en cours"
      - conditions:
          - condition: template
            value_template: "{{ wait.trigger.event.data.action == 'KEEP_VSC' }}"
        sequence:
          - stop: "L'utilisateur continue."
Ce qui change avec cette version :
L'action addon_restart : Elle va vider la RAM et stopper les processus fantômes de ton Mini-PC x86, puis relancer l'addon tout seul.

Choix par défaut (Sécurité) : Si tu es occupé et que tu ne réponds pas à ton Poco X7 Pro, l'automatisation choisit de redémarrer l'addon après 5 minutes. C'est le meilleur compromis : ça nettoie les ressources, mais l'addon reste disponible si tu reviens sur ton PC plus tard.

Flexibilité : Tu as maintenant trois options sur ton téléphone.

