Top Processus Direct

friendly_name: Top Processus Direct

C'est parfait, ton entité est bien créée ! Mais comme tu peux le voir, l'État est actuellement vide ou n'affiche rien à côté du nom. C'est parce que la commande ps dans Home Assistant OS (qui est un environnement bridé) peut se comporter différemment selon la version.

Si l'état est vide, c'est que la commande awk ou le tri n'a pas retourné de texte.

On va corriger la commande pour qu'elle parle enfin
Remplace ton code dans configuration.yaml par celui-ci. J'ai simplifié la commande pour qu'elle soit compatible avec le moteur BusyBox (le Linux léger de HAOS) :

YAML
command_line:
  - sensor:
      name: "Top Processus Direct"
      unique_id: top_process_direct
      # On prend les processus, on trie par CPU, on prend la 1ère ligne (après les titres)
      command: "ps -eo pcpu,comm | sort -nr | head -n 1"
      # On extrait uniquement le nom (le texte après le chiffre du CPU)
      value_template: >
        {% if value is defined and value | length > 0 %}
          {{ value.split(' ')[-1] }}
        {% else %}
          Recherche...
        {% endif %}
      scan_interval: 10
Pourquoi c'est mieux comme ça ?
Compatibilité : On n'utilise plus awk qui peut parfois bugger dans les sensors HA. On utilise le moteur de template de HA (split) pour découper le texte.

Sécurité : Si le système ne renvoie rien pendant une seconde, le sensor affichera "Recherche..." au lieu de rester vide.

