En général, ce qui tourne en arrière-plan sur ton installation et consomme après 20h, c'est :

Processus	Origine probable	Pourquoi il consomme ?
node	VS Code / Zigbee2MQTT	Extensions VS Code ou gros réseau Zigbee.
python3	HA Core	Automatisations complexes ou intégrations qui "pollent" trop souvent.
observer	Supervisor	Surveillance des containers Docker.
ffmpeg	Caméras	Si tu as des caméras qui enregistrent ou détectent du mouvement.
