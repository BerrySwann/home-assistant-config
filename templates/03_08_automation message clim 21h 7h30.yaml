En résumé :
Sensor = True : "Le serveur VS Code est vivant et joignable sur le web."

Sensor = False : "Le serveur est crashé ou l'adresse erodi-ha.com est inaccessible."

Le CPU, lui, est le seul qui sait si Sébastien est devant son écran ou non.

Est-ce que tu veux que je t'aide à ajuster le seuil du CPU (le 0.8) en regardant la valeur actuelle de ton sensor quand tu ne touches à rien ?

pour tant j'ai coupé le pc portable donc devrais etre a false

C'est une erreur logique très fréquente dans la compréhension du fonctionnement de Home Assistant et de ses Add-ons.

Le fait que tu coupes ton PC portable ne fera pas passer le sensor à False. Voici pourquoi :

1. Le "Ping" vient du Mini-PC, pas du portable
Ton sensor sensor.ping_https_vscode est exécuté par ton Mini-PC x86.

Le Mini-PC envoie une requête HTTP vers erodi-ha.com.

Le serveur (ton Mini-PC lui-même via ton tunnel) répond : "Oui, je suis là et l'addon VS Code est allumé".

Le PC portable n'est qu'un spectateur. Que tu l'éteignes, que tu le jettes par la fenêtre ou que tu coupes le Wi-Fi, le Mini-PC, lui, voit toujours que l'addon tourne sur son propre système.

2. L'addon est un "Serveur" permanent
Contrairement à un logiciel comme Word sur ton portable qui s'arrête quand tu fermes le PC, l'Addon VS Code sur Home Assistant est un serveur. Il reste "en ligne" 24h/24 tant que tu ne lui as pas donné l'ordre explicite de s'arrêter (via le bouton STOP dans l'interface ou une automatisation).

Comment vraiment savoir que tu as coupé ton portable ?
Puisque le "Ping" sur l'URL ne marche pas pour détecter ton départ, voici les deux seules vraies solutions pour ton cas :

Solution A : Surveiller ton PC portable (si c'est un Windows/Mac) Tu peux installer l'application HASS.Agent (sur Windows) ou utiliser l'intégration Ping (ICMP) sur l'adresse IP locale de ton portable.

Le trigger : Si l'IP du portable n'est plus joignable pendant 5 minutes.

L'action : "Voulez-vous couper VS Code ?" sur ton Poco.

Solution B : Le CPU (La plus simple) C'est celle qu'on a mise dans l'automatisation.

Quand ton portable est allumé et que tu codes, le CPU de l'addon sur le Mini-PC bouge (ex: 5% ou 10%).

Dès que tu éteins ton portable, le CPU de l'addon retombe à son niveau "mort" (0.1% ou 0.2%).

C'est ce passage à 0.1% qui doit déclencher ton alerte sur le Poco.

Conclusion sur ton sensor actuel
Ton sensor.ping_https_vscode à True veut dire : "La porte de VS Code est ouverte sur internet". Il ne veut pas dire : "Quelqu'un est en train de regarder par la porte".

Est-ce que tu veux qu'on ajoute un sensor de "Ping" (ICMP) sur l'adresse IP locale de ton PC portable pour que l'automatisation soit liée à l'état réel de ton ordinateur ?

le ping il le fait toutes les x minutes non ? donc a un moment donné si il n'y a pas quelqu'un connecté ca pass a false ?

C'est là que réside toute la subtilité : Non, il ne passera jamais à False, même si personne n'est connecté, et même si tu attends 10 ans.

Voici pourquoi, pour que tu puisses bien visualiser le mécanisme :

L'analogie du téléphone
Imagine que VS Code est un téléphone fixe installé dans ton salon (ton Mini-PC).

Le Ping, c'est ton Home Assistant qui appelle ce numéro toutes les minutes pour voir si ça sonne.

Si le téléphone sonne (l'addon est allumé), le sensor dit True.

Si personne ne décroche (tu as éteint ton portable), le téléphone continue de sonner.

Pour le Ping, tant que ça sonne, le résultat est True. Le Ping ne se demande pas si quelqu'un va décrocher, il veut juste savoir si la ligne est active.

Pourquoi ça reste à True ?
L'indépendance : L'addon est un serveur autonome. Il ne "sent" pas si ton portable est allumé ou éteint. Il attend juste une connexion.

L'URL Ingress : L'adresse https://erodi-ha.com/... pointe vers ton Mini-PC. Tant que ton Mini-PC est branché à l'électricité et que l'addon est "Start" dans le Supervisor, l'URL répondra "Oui, je suis là".

Comment faire pour que ça passe à False ?
Le sensor passera à False uniquement si :

Tu cliques manuellement sur "Stop" dans l'addon.

Ton Mini-PC n'a plus d'internet (ou est éteint).

L'addon plante (crash).

La solution pour ton besoin
Puisque ton but est de savoir quand tu n'es plus là, tu dois changer ton "fusil d'épaule". On ne peut pas détecter ton absence via l'URL de VS Code.

On peut par contre le détecter de deux autres façons :

Option 1 (La plus fiable) : Utiliser la consommation CPU. Quand tu fermes ton portable, l'activité de l'addon chute. C'est le seul signal qui change.

Option 2 (La plus précise) : Créer un sensor qui fait un "Ping" sur l'adresse IP de ton PC portable.

Portable allumé -> True.

Portable éteint -> False.

Automation : Si Portable = False depuis 5 min ET VS Code = On, alors envoie une notif sur le Poco X7 Pro.

Est-ce que tu veux que je te donne le code pour faire un Ping sur l'IP de ton portable à la place de l'URL ? (Il faudra juste que tu me donnes l'adresse IP locale de ton portable, par exemple 192.168.1.XX).

pourtant j'au trouvé l'add-on VSCode coupé en rentrant a la maison

Si tu as retrouvé l'addon VS Code coupé en rentrant, c'est très probablement parce que l'une de tes automatisations (celle qu'on a construite ou une ancienne) a fonctionné, ou parce que le système a manqué de ressources.

Voici les 3 scénarios possibles qui expliquent pourquoi il s'est éteint alors que ton portable était fermé :

1. L'automatisation par le CPU (Le plus probable)
Si tu as déjà activé l'automatisation basée sur le CPU, voici ce qui s'est passé :

Tu as fermé ton portable.

L'addon n'avait plus rien à faire, donc son CPU est descendu sous 0.8%.

Au bout de 15 ou 20 minutes (selon le délai choisi), Home Assistant a déclenché l'arrêt.

C'est la preuve que le CPU est le seul vrai capteur d'inactivité, car comme on l'a vu, le "Ping" sur l'URL, lui, n'aurait jamais donné l'ordre de couper.

2. Le "Crash" par manque de RAM
Même sur un Mini-PC x86, si tu as beaucoup d'addons (Plex, AdGuard, etc.), Home Assistant peut décider de tuer un processus trop gourmand s'il a besoin de mémoire pour le système principal (le Core).

VS Code est souvent la première cible car c'est lui qui consomme le plus de RAM en tâche de fond.

3. La mise à jour automatique
Si tu as activé l'option "Mise à jour automatique" dans les paramètres de l'addon VS Code, celui-ci s'arrête pour s'installer et redémarre. Parfois, s'il y a une erreur de configuration après la mise à jour, il reste sur "Off".

Comment vérifier ce qu'il s'est passé ?
Pour en avoir le cœur net, regarde dans Home Assistant :

Va dans Paramètres > Automatisations.

Cherche ton automatisation "VS Code".

Regarde l'Historique (ou les "Traces") : Tu verras si c'est elle qui a envoyé la commande addon_stop et à quelle heure.

Ce qu'il faut retenir pour ton Poco X7 Pro
Si l'addon s'est coupé tout seul sans que tu reçoives de notification sur ton Poco, c'est peut-être parce que :

L'automatisation a coupé sans te demander (si tu n'as pas mis le wait_for_trigger).

Ou l'addon a crashé tout seul.

Est-ce que tu veux que je t'aide à regarder les "Logs" (journaux) de l'addon pour voir si c'est un arrêt propre ou un crash ? Pour cela, il faut aller dans l'addon VS Code et cliquer sur l'onglet "Journal".

