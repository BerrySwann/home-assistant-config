Pourquoi ton script est la clé :
Ton script nous a donné le "chemin" (/sys/class/thermal/thermal_zone1/temp). C'est comme si on avait trouvé le branchement direct sur le moteur de ton mini-PC.

Dis-moi, est-ce que tu arrives à créer ce sensor cpu_temp_direct ? Une fois qu'il est là, on pourra même s'en servir dans ton automatisation de 20h : si la température dépasse 65°C le soir, on coupe VS Code d'office !

avec ce genre de truc /sys/class/thermal/thermal_zone1/temp y a pas moyen de voir le procesus

Hélas non, les fichiers dans /sys/class/thermal/ ne servent qu'à lire des sondes physiques (température, voltage, vitesse ventilo). Ils ne savent pas ce qu'est un "logiciel".

Par contre, puisque tu aimes fouiller dans le système (le dossier /proc), il existe un moyen très puissant de voir les processus en ligne de commande sans passer par Glances. Sur ton Mini-PC x86, tout se passe dans le dossier /proc.

Comment voir les processus "à la main"
Pour voir quel processus consomme, on utilise la commande ps ou top. Pour transformer cela en sensor Home Assistant (comme ton script de température), voici le code à mettre dans ton configuration.yaml :

YAML
command_line:
  - sensor:
      name: "Top Processus Direct"
      unique_id: top_process_direct
      # Cette commande liste le nom du processus (comm) qui consomme le plus de CPU
      command: "ps -ao pcpu,comm --sort=-pcpu | head -n 2 | tail -n 1 | awk '{print $2}'"
      value_template: "{{ value }}"
      scan_interval: 10
Pourquoi c'est mieux que Glances pour toi ?
Zéro "Unknown" : Ça interroge directement le noyau Linux de ton Mini-PC.

Ultra Rapide : Pas d'intégration lourde, c'est juste une lecture de texte.

Précis : Si VS Code (nommé node) consomme, tu verras écrit node instantanément dans ton entité.

