sensor.vscode_connections



VSCode Connections

0

unit_of_measurement: conn

friendly_name: VSCode Connections

Le résultat est sans appel : ton capteur affiche 0 alors que tu es probablement en train de me parler avec Home Assistant ouvert (et peut-être VS Code dans un onglet).

Pourquoi le capteur affiche 0 ?
Sur Home Assistant OS (ton mini-PC x86), l'addon Studio Code Server utilise l'Ingress. Dans ce mode, le trafic passe par un socket Unix ou un bridge Docker interne que netstat sur le port 1337 ne voit pas forcément depuis le container Home Assistant.

La solution : Changer de méthode de détection
Puisque le réseau est "masqué" par le proxy Ingress, on va utiliser la présence du processus de session directement sur ton mini-PC.

Remplace la ligne command: de ton sensor par celle-ci :

YAML
command_line:
  - sensor:
      name: "VSCode Connections"
      unique_id: visual_code_serveur_connections
      # On compte les processus "code-server" actifs qui gèrent l'interface
      command: "ps -ef | grep 'node' | grep 'code-server' | grep -v 'grep' | wc -l"
      value_template: "{{ value | int }}"
      scan_interval: 60
      unit_of_measurement: "proc"
Comment vérifier si ça marche :
VS Code fermé : Le chiffre devrait être bas (souvent 1 ou 2 processus de fond "maître").

VS Code ouvert (via ton URL Ingress) : Le chiffre doit augmenter (souvent +2 ou +3 processus par session active).

L'alternative ultime : Le sensor de l'Addon
Si tu as installé l'intégration Home Assistant Supervisor, tu as peut-être déjà des capteurs natifs. Regarde dans tes entités si tu as :

sensor.studio_code_server_cpu_percent

sensor.studio_code_server_memory_percent

Si le CPU est à 0.0% pendant 15 minutes, c'est que personne ne tape de code. C'est parfois plus simple et plus fiable que de compter les processus.

Est-ce que tu peux regarder dans tes entités si tu vois le sensor.studio_code_server_cpu_percent ? Si oui, on bascule l'automatisation de ton Poco X7 Pro là-dessus, c'est du béton armé.

