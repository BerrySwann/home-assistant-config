ca te parle ?



#!/bin/sh



# Fonction pour convertir les millidegrés en °C

to_celsius() {

  echo "scale=1; $1 / 1000" | bc

}



# Boucle infinie pour actualiser les températures

while true; do

  clear  # Efface l'écran à chaque itération

  echo "====================================="

  echo " TEMPÉRATURES DU MINI-PC $(date +'%Y-%m-%d %H:%M:%S')"

  echo "====================================="



  # Carte mère

  echo -e "\n📥 Carte mère (acpitz):"

  if [ -f "/sys/class/thermal/thermal_zone0/temp" ]; then

    echo "  • $(to_celsius $(cat /sys/class/thermal/thermal_zone0/temp)) °C"

  else

    echo "  • Non détecté"

  fi



  # CPU (Package)

  echo -e "\n🖥️ CPU (x86_pkg_temp):"

  if [ -f "/sys/class/thermal/thermal_zone1/temp" ]; then

    echo "  • Package: $(to_celsius $(cat /sys/class/thermal/thermal_zone1/temp)) °C"

  fi



  # Cœurs CPU

  echo -e "\n🔧 Cœurs CPU:"

  if [ -d "/sys/devices/platform/coretemp.0/hwmon/hwmon1" ]; then

    echo "  • Core 0: $(to_celsius $(cat /sys/devices/platform/coretemp.0/hwmon/hwmon1/temp2_input 2>/dev/null || echo "N/A")) °C"

    echo "  • Core 1: $(to_celsius $(cat /sys/devices/platform/coretemp.0/hwmon/hwmon1/temp3_input 2>/dev/null || echo "N/A")) °C"

    echo "  • Core 2: $(to_celsius $(cat /sys/devices/platform/coretemp.0/hwmon/hwmon1/temp4_input 2>/dev/null || echo "N/A")) °C"

    echo "  • Core 3: $(to_celsius $(cat /sys/devices/platform/coretemp.0/hwmon/hwmon1/temp5_input 2>/dev/null || echo "N/A")) °C"

  else

    echo "  • Cœurs CPU: Non détectés"

  fi



  # Pause de 2 secondes avant la prochaine actualisation

  sleep 2

done

Oh que oui, ça me parle ! C'est un script shell (.sh) typique pour Linux qui va lire directement les fichiers "système" (/sys/class/thermal/...) de ton Mini-PC x86.

C'est la méthode la plus pure pour obtenir la température, car elle ne dépend d'aucun addon : elle interroge directement le matériel.

Pourquoi ce script est intéressant pour toi ?
Le script confirme que sur ton mini-PC, les températures se trouvent dans :

thermal_zone0 : La carte mère.

thermal_zone1 : Le CPU (Package).

Comment l'utiliser pour ton tableau de bord (Poco X7 Pro)
Puisque tu as du mal avec les entités Glances qui restent en unknown, on peut utiliser la logique de ton script pour créer un sensor direct dans Home Assistant. C'est du "sur-mesure".

Ajoute ceci dans ton fichier configuration.yaml (sous la section command_line que nous avons vue) :

YAML
command_line:
  - sensor:
      name: "CPU Temperature Direct"
      unique_id: cpu_temp_direct
      # On divise par 1000 pour passer des millidegrés aux degrés
      command: "cat /sys/class/thermal/thermal_zone1/temp"
      unit_of_measurement: "°C"
      value_template: "{{ (value | float / 1000) | round(1) }}"
      scan_interval: 30
