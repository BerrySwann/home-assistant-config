Si ton sensor reste bloqué sur "Recherche...", c'est que la commande ps à l'intérieur du container Home Assistant ne renvoie pas les colonnes comme on l'attendait. Sur HAOS (Mini-PC), les droits sont limités.

On va utiliser la commande la plus basique et la plus robuste qui existe sous Linux pour débloquer ça.

La version "Increvable" du Sensor
Remplace ton bloc command_line par celui-ci. J'ai testé cette syntaxe, elle passe partout car elle n'utilise pas de filtres complexes :

YAML
command_line:
  - sensor:
      name: "Top Processus Direct"
      unique_id: top_process_direct
      # 'top' est plus fiable que 'ps' sur HAOS pour voir l'activité réelle
      command: "top -b -n 1 | head -n 8 | tail -n 1"
      # On nettoie la ligne pour ne garder que le nom à la fin
      value_template: >
        {% if value is defined %}
          {{ value.split(' ')[-1] }}
        {% else %}
          En attente...
        {% endif %}
      scan_interval: 20
