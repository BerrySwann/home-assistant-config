Pourquoi ce réglage est intelligent pour ton Mini-PC :
Ciblage Nocturne : La journée, c'est normal que ton x86 travaille. Mais après 20h00, s'il dépasse 10% de CPU globale, c'est souvent signe d'une page restée ouverte ou d'un addon qui mouline.

Affichage Dynamique : Dans la notification sur ton Poco X7 Pro, j'ai ajouté {{ states('sensor.system_monitor_utilisation_du_processeur') }}%. Comme ça, tu vois directement sur ton écran de téléphone si le PC "souffre" avant même de cliquer.

Sécurité par Défaut : Si tu es au lit et que tu ne réponds pas, il fait un Restart à 20h05. Cela permet de "tuer" les processus VS Code qui pourraient être bloqués en HTTPS tout en laissant l'addon prêt pour demain matin.

