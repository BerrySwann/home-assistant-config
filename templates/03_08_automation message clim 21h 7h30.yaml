fonctionne pas je n'ai pas de sensor

Tu as tout à fait raison, l'erreur vient du fait que le format des command_line a changé dans les versions récentes de Home Assistant (depuis la version 2023.6). L'ancien format avec - platform: command_line est devenu obsolète.

De plus, sur Home Assistant OS, la commande ps est un peu limitée. On va utiliser une commande plus robuste.

Voici le code corrigé et mis à jour pour ton fichier configuration.yaml (ou à adapter si tu as un fichier command_line.yaml dédié) :

Le nouveau format fonctionnel
YAML
command_line:
  - sensor:
      name: "Top Processus CPU"
      unique_id: top_cpu_processes
      # On utilise 'ps' mais avec des colonnes simples pour éviter les erreurs
      command: "ps -ao pcpu,comm --sort=-pcpu | head -n 6 | tail -n 5"
      # On met la liste des processus directement dans l'état du sensor pour le voir
      value_template: >
        {% set proc = value.split('\n') %}
        {{ proc | join(' | ') }}
      scan_interval: 60
Pourquoi l'autre ne s'affichait pas ?
Le format : Le nouveau format demande de regrouper sous la clé parente command_line:.

L'état (Value Template) : Dans ton code précédent, la valeur était fixée à "Actif". Donc même si le sensor s'était créé, tu aurais juste vu le mot "Actif" sans voir les processus. Ici, je force l'affichage des noms des processus dans l'état du capteur.

