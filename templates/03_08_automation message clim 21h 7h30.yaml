Alors là, c'est très surprenant ! Ce que tu vois dans l'état ('s/.*"default_branch"...) n'est pas un nom de processus, c'est un morceau de code (une expression régulière) qui semble provenir d'un autre script ou d'une erreur de copier-coller dans ton fichier YAML.

Le système essaie d'exécuter une commande de "recherche de branche Git" au lieu de chercher les processus du Mini-PC.

On va faire un "Reset complet" de ce sensor pour qu'il t'affiche enfin la vérité. On va utiliser une commande radicale qui ne peut pas se tromper.

La correction "Force Brute"
Remplace tout ton bloc command_line par celui-ci. J'ai simplifié au maximum pour éviter que HA n'aille chercher des infos ailleurs :

YAML
command_line:
  - sensor:
      name: "Top Processus Direct"
      unique_id: top_process_direct
      # Commande ultra-simple : liste les processus, trie par CPU, prend le premier
      command: "ps -eo pcpu,comm | sort -rn | head -n 1"
      # On prend toute la ligne brute pour voir ce qui sort
      value_template: "{{ value | truncate(50) }}"
      scan_interval: 10
Pourquoi tu avais ce message bizarre ?
Le message 's/.*"default_branch"... ressemble à un reste de capteur qui surveille GitHub ou une mise à jour d'addon. Si tu l'as encore après avoir enregistré et redémarré, c'est que tu as peut-être deux fois l'ID top_process_direct dans tes fichiers YAML.

Comment vérifier sur ton Poco X7 Pro :
Enregistre le fichier configuration.yaml.

Va dans Outils de développement > YAML > Vérifier la configuration.

Si c'est vert, clique sur Recharger les entités de ligne de commande.

L'état devrait maintenant ressembler à : 12.5 node ou 5.0 python3.

Une fois que c'est fixé :
Dès que tu vois un chiffre et un nom (ex: node), ton moniteur est prêt. Tu pourras enfin savoir si, à 20h, c'est VS Code qui te "bouffe" tes watts.

Est-ce que l'état a changé après cette modification ? Si tu as toujours le message "default_branch", dis-le moi, on cherchera où ce code est caché dans tes fichiers.

Serait-ce le moment de fusionner ce nouveau capteur dans ta notification du soir ? Serait-ce utile pour toi ?

rreurs de configuration

Error loading /config/configuration.yaml: while parsing a block collection

in "/config/command_line.yaml", line 2, column 1

expected <block end>, but found '?'

in "/config/command_line.yaml", line 226, column 1

Cette erreur indique un problème de structure (indentation) dans ton fichier command_line.yaml. Le message expected <block end>, but found '?' signifie généralement que Home Assistant s'attendait à ce qu'une liste se termine, mais il est tombé sur un nouvel élément mal placé ou un caractère invisible.

Vu que ton fichier fait au moins 226 lignes, il y a probablement un mélange entre l'ancien format et le nouveau, ou une erreur de copier-coller à la fin du fichier.

La solution : Nettoyer ton command_line.yaml
Pour un fichier séparé appelé depuis configuration.yaml par command_line: !include command_line.yaml, tu ne dois pas remettre le mot command_line: au début du fichier.

Voici comment ton fichier doit être structuré (en commençant par le haut) :

YAML
# NE PAS METTRE "command_line:" ici
- sensor:
    name: "Top Processus Direct"
    unique_id: top_process_direct
    command: "ps -eo pcpu,comm | sort -rn | head -n 1"
    value_template: "{{ value | truncate(50) }}"
    scan_interval: 10

# ... tes autres sensors à la suite ...
- sensor:
    name: "Un autre capteur"
    command: "..."
Ce qu'il faut vérifier à la ligne 226 :
L'alignement : Assure-toi que tous tes - sensor: commencent bien à la colonne 1 (tout à gauche).

Le tiret : Vérifie qu'il n'y a pas un tiret - orphelin ou un espace en trop avant le mot sensor.

Les guillemets : Si tu as copié le code avec le symbole 's/.*"default_branch"..., vérifie qu'il n'y a pas une citation non fermée qui "casse" la lecture du fichier jusqu'à la ligne 226.

Conseil de "Champion" pour corriger :
Vérifie ton fichier configuration.yaml.

Si tu as : command_line: !include command_line.yaml

Alors, dans command_line.yaml, chaque capteur doit commencer par - sensor:.

