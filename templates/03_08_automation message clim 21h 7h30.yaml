Enregistre ton fichier.

Va dans Outils de développement > YAML > Vérifier la configuration.

Si c'est OK, clique sur Redémarrer (ou recharge les "Entités de ligne de commande").

Cherche l'entité sensor.top_processus_cpu dans tes états.

