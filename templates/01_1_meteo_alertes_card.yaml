    # --- niveau_alerte_meteo ---
    - name: 'Niveau alerte meteo'
      unique_id: niveau_alerte_meteo
      state: >-
        {% set al = states('binary_sensor.meteoalarm') %}
        {% if al == 'off' %}
          {% set al = 'Vert' %}
        {% elif '1' in al %}
          {% set al = 'Vert' %}
        {% elif '2' in al %}
          {% set al = 'Jaune' %}
        {% elif '3' in al %}
          {% set al = 'Orange' %}
        {% elif '4' in al %}
          {% set al = 'Rouge' %}
        {% else %}
          {% set al = 'unknown' %}
        {% endif %}
        {{ al }}
      attributes:
        Date: >-
          {% set dt = state_attr('binary_sensor.meteoalarm', 'urgency') %}
          {% if dt == 'Future' %}
            {% set val = 'Demain' %}
          {% else %}
            {% set val = dt %}
          {% endif %}
          {{ val }}
        Vent Violent: "{{ states('sensor.alerte_vent_violent') }}"
        Inondation: "{{ states('sensor.alerte_inondation') }}"
        Orages: "{{ states('sensor.alerte_orages') }}"
        Pluie Inondation: "{{ states('sensor.alerte_pluie_inondation') }}"
        Neige Verglas: "{{ states('sensor.alerte_neige_verglas') }}"
        Grand Froid: "{{ states('sensor.alerte_grand_froid') }}"
        Canicule: "{{ states('sensor.alerte_canicule') }}"
        Vagues Submersion: "{{ states('sensor.alerte_vagues_submersion') }}"
      icon: mdi:alert-outline
# annotations_log:
# - [Standard] Application de la boîte ASCII 74 car. arrondie avec '#' obligatoire.
# - [Standard] Application de la boîte ASCII 37 car. carrée pour la section 10. AUTRE.
# - [Standard] Ajout des titres tertiaires # --- slug --- pour chaque sensor.
# - [Modif] Nettoyage des unique_id (suppression du préfixe 'sensor.' superflu).
# - [Intégrité] Aucun sensor omis, maintien de toute la logique Jinja2.