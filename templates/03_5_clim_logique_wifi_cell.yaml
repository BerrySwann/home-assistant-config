- sensor:
    - name: "Groupe Clim"
      unique_id: groupe_clim
      state: >
        {% set ssid = "Freebox_GG" %}
        {% set mamour_ssid = states('sensor.poco_x7_pro_mamour_wi_fi_connection') | string %}
        {% set mamour_net_type = states('sensor.poco_x7_pro_mamour_network_type') | string %}
        {% set eric_ssid = states('sensor.poco_x7_pro_wi_fi_connection') | string %}
        {% set eric_net_type = states('sensor.poco_x7_pro_network_type') | string %}

        {# Cas 1: Les deux en cellular #}
        {% if eric_net_type == "cellular" and mamour_net_type == "cellular" %}
          groupe_1

        {# Cas 2: Les deux en wifi mais pas sur Freebox_GG #}
        {% elif eric_net_type == "wifi" and eric_ssid != ssid and mamour_net_type == "wifi" and mamour_ssid != ssid %}
          groupe_1

        {# Cas 3: [Mamour] en wifi (pas Freebox_GG) et [Eric] en cellular #}
        {% elif mamour_net_type == "wifi" and mamour_ssid != ssid and eric_net_type == "cellular" %}
          groupe_1

        {# Cas 4: [Mamour] en cellular et [Eric] en wifi (pas Freebox_GG) #}
        {% elif mamour_net_type == "cellular" and eric_net_type == "wifi" and eric_ssid != ssid %}
          groupe_1

        {# Cas 5: [Eric] en wifi (pas Freebox_GG) et [Mamour] en cellular #}
        {% elif eric_net_type == "wifi" and eric_ssid != ssid and mamour_net_type == "cellular" %}
          groupe_1

        {# Cas 6: [Eric] en cellular et [Mamour] en wifi (pas Freebox_GG) #}
        {% elif eric_net_type == "cellular" and mamour_net_type == "wifi" and mamour_ssid != ssid %}
          groupe_1

        {# Cas 7: [Mamour] en wifi (Freebox_GG) et [Eric] en wifi (pas Freebox_GG) #}
        {% elif mamour_net_type == "wifi" and mamour_ssid == ssid and eric_net_type == "wifi" and eric_ssid != ssid %}
          groupe_2

        {# Cas 8: [Mamour] en wifi (Freebox_GG) et [Eric] en cellular #}
        {% elif mamour_net_type == "wifi" and mamour_ssid == ssid and eric_net_type == "cellular" %}
          groupe_2

        {# Cas 9: [Eric] en wifi (Freebox_GG) et [Mamour] en wifi (pas Freebox_GG) #}
        {% elif eric_net_type == "wifi" and eric_ssid == ssid and mamour_net_type == "wifi" and mamour_ssid != ssid %}
          groupe_3

        {# Cas 10: [Eric] en wifi (Freebox_GG) et [Mamour] en cellular #}
        {% elif eric_net_type == "wifi" and eric_ssid == ssid and mamour_net_type == "cellular" %}
          groupe_3

        {# Cas 11: Les deux en wifi (Freebox_GG) #}
        {% elif mamour_net_type == "wifi" and mamour_ssid == ssid and eric_net_type == "wifi" and eric_ssid == ssid %}
          groupe_4

        {# Cas par défaut #}
        {% else %}
          groupe_1
        {% endif %}

- sensor:
    - name: "Presence Clim"
      unique_id: presence_clim
      state: >
        {% set ssid = "Freebox_GG" %}
        {% set mamour_ssid = states('sensor.poco_x7_pro_mamour_wi_fi_connection') | string %}
        {% set mamour_net_type = states('sensor.poco_x7_pro_mamour_network_type') | string %}
        {% set eric_ssid = states('sensor.poco_x7_pro_wi_fi_connection') | string %}
        {% set eric_net_type = states('sensor.poco_x7_pro_network_type') | string %}

        {# Cas 1: Les deux en cellular #}
        {% if eric_net_type == "cellular" and mamour_net_type == "cellular" %}
          [2] en [CELL]

        {# Cas 2: Les deux en wifi mais pas sur Freebox_GG #}
        {% elif eric_net_type == "wifi" and eric_ssid != ssid and mamour_net_type == "wifi" and mamour_ssid != ssid %}
          [2] en [WIFI_!?]

        {# Cas 3: [Mamour] en wifi (pas Freebox_GG) et [Eric] en cellular #}
        {% elif mamour_net_type == "wifi" and mamour_ssid != ssid and eric_net_type == "cellular" %}
          [Mamour] en [WIFI_!?/CELL]

        {# Cas 4: [Mamour] en cellular et [Eric] en wifi (pas Freebox_GG) #}
        {% elif mamour_net_type == "cellular" and eric_net_type == "wifi" and eric_ssid != ssid %}
          [Mamour] en [CELL/!WIFI_!?]

        {# Cas 5: [Eric] en wifi (pas Freebox_GG) et [Mamour] en cellular #}
        {% elif eric_net_type == "wifi" and eric_ssid != ssid and mamour_net_type == "cellular" %}
          [Eric] en [WIFI_!?/CELL]

        {# Cas 6: [Eric] en cellular et [Mamour] en wifi (pas Freebox_GG) #}
        {% elif eric_net_type == "cellular" and mamour_net_type == "wifi" and mamour_ssid != ssid %}
          [Eric] en [CELL/WIFI_!?]

        {# Cas 7: [Mamour] en wifi (Freebox_GG) et [Eric] en wifi (pas Freebox_GG) #}
        {% elif mamour_net_type == "wifi" and mamour_ssid == ssid and eric_net_type == "wifi" and eric_ssid != ssid %}
          [Mamour] en [WIFI/WIFI_!?]

        {# Cas 8: [Mamour] en wifi (Freebox_GG) et [Eric] en cellular #}
        {% elif mamour_net_type == "wifi" and mamour_ssid == ssid and eric_net_type == "cellular" %}
          [Mamour] en [WIFI/CELL]

        {# Cas 9: [Eric] en wifi (Freebox_GG) et [Mamour] en wifi (pas Freebox_GG) #}
        {% elif eric_net_type == "wifi" and eric_ssid == ssid and mamour_net_type == "wifi" and mamour_ssid != ssid %}
          [Eric] en [WIFI/WIFI_!?]

        {# Cas 10: [Eric] en wifi (Freebox_GG) et [Mamour] en cellular #}
        {% elif eric_net_type == "wifi" and eric_ssid == ssid and mamour_net_type == "cellular" %}
          [Eric] en [WIF/CELL]

        {# Cas 11: Les deux en wifi (Freebox_GG) #}
        {% elif mamour_net_type == "wifi" and mamour_ssid == ssid and eric_net_type == "wifi" and eric_ssid == ssid %}
          [2] en [WIFI]

        {# Cas par défaut #}
        {% else %}
          État indéfini
        {% endif %}
