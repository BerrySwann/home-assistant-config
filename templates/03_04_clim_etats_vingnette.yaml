# ╭──────────────────────────────────────────────────────────────────────────────╮
# │ TEMPLATES : SÉRIE 03_04. CLIM — ÉTATS (VIGNETTE)                             │
# ╰──────────────────────────────────────────────────────────────────────────────╯

- sensor:
# ┌───────────────────────────────────┐
# │ 4. SALON                          │
# └───────────────────────────────────┘

# --- clim_salon_etat ---
# État Clim Salon (RM4 Mini)
    - name: "Clim Salon État"
      unique_id: clim_salon_etat
      state: >
        {% if is_state('climate.clim_salon_rm4_mini', 'off') %}
          Off
        {% elif is_state('climate.clim_salon_rm4_mini', 'cool') %}
          Cool
        {% elif is_state('climate.clim_salon_rm4_mini', 'heat') %}
          Heat
        {% elif is_state('climate.clim_salon_rm4_mini', 'fan_only') %}
          Fan
        {% else %}
          erreur*
        {% endif %}

# ┌───────────────────────────────────┐
# │ 5. CUISINE                        │
# └───────────────────────────────────┘

# --- radiateur_cuisine_etat ---
# État Radiateur Cuisine
    - name: "Radiateur Cuisine État"
      unique_id: radiateur_cuisine_etat
      state: >
        {% if is_state('climate.radiateur_cuisine', 'off') %}
          Off
        {% elif is_state('climate.radiateur_cuisine', 'heat') %}
          Heat
        {% else %}
          erreur
        {% endif %}

# ┌───────────────────────────────────┐
# │ 7. BUREAU                         │
# └───────────────────────────────────┘

# --- clim_bureau_etat ---
# État Clim Bureau (RM4 Mini)
    - name: "Clim Bureau État"
      unique_id: clim_bureau_etat
      state: >
        {% if is_state('climate.clim_bureau_rm4_mini', 'off') %}
          Off
        {% elif is_state('climate.clim_bureau_rm4_mini', 'cool') %}
