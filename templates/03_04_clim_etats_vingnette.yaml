# ┌───────────────────────────────────┐
# │ 8. SDB                            │
# └───────────────────────────────────┘

# --- sdb_soufflant_power_etat ---
# État Radiateur Sdb (basé sur consommation)
    - name: "SdB Soufflant Power Etat"
      unique_id: sensor.sdb_soufflant_power_etat
      state: >
        {% if states('sensor.prise_radiateur_salle_de_bain_nous_power') | float (0) < 20 %}
          off
        {% elif states('sensor.prise_radiateur_salle_de_bain_nous_power') | float (0) > 20 %}
          Heat
        {% else %}
          erreur
        {% endif %}

# --- seche_serv_sdb_etat ---
# État Sèche-Serviettes Sdb (basé sur consommation)
    - name: "SdB Sèche Serviettes État"
      unique_id: sdb_seche_serviettes_etat
      state: >
        {% if states('sensor.prise_radiateur_salle_de_bain_inspelning_ikea_power') | float (0) < 20 %}
          off
        {% elif states('sensor.prise_radiateur_salle_de_bain_inspelning_ikea_power') | float (0) > 20 %}
          Heat
        {% else %}
          erreur
        {% endif %}

