- sensor:
  - name: "Radiateur Sdb État"
    unique_id: radiateur_sdb_etat
    state: >
      {% if states('sensor.prise_radiateur_salle_de_bain_nous_power') | float < 20 %}
        off
      {% elif states('sensor.prise_radiateur_salle_de_bain_nous_power') | float > 20 %}
        Heat
      {% else %}
        erreur
      {% endif %}

- sensor:
