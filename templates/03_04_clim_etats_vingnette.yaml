# CLIM — États (vignette)
- sensor:
  - name: "Mode été Hiver État"
    unique_id: mode_ete_hiver_etat
    state: >
      {% if is_state('sensor.mode_ete_hiver', 'cool') %}
        Cool
      {% elif is_state('sensor.mode_ete_hiver', 'heat') %}
        Heat
      {% elif is_state('sensor.mode_ete_hiver', 'fan_only') %}
        Fan
      {% else %}
        erreur
      {% endif %}

- sensor:
  - name: "Clim Salon État"
    unique_id: clim_salon_etat
    state: >
      {% if is_state('climate.clim_salon_rm4_mini', 'off') %}
        Off
      {% elif is_state('climate.clim_salon_rm4_mini', 'cool') %}
        Cool
      {% elif is_state('climate.clim_salon_rm4_mini', 'heat') %}
        Heat
      {% elif is_state('climate.clim_salon_rm4_mini', 'fan_only') %}
        Fan
      {% else %}
        erreur
      {% endif %}

