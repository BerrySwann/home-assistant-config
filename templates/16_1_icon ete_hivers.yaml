# ╭────────────────────────────────────────────────────────────────────────╮
# │ SENSOR : SÉRIE 16. CLIMAT — ICÔNES SAISONNIÈRES                        │
# ╰────────────────────────────────────────────────────────────────────────╯

- sensor:
    # ┌───────────────────────────────────┐
    # │ 1. STATUTS & ICÔNES               │
    # └───────────────────────────────────┘
    # --- statut_clim_hiver ---
    - name: "Statut Clim Hiver"
      unique_id: statut_clim_hiver
      state: "{{ states('sensor.groupe_clim') }}"
      icon: >
        {% if is_state('weather.vence', 'snowy') %}
          mdi:snowflake
        {% elif states('sensor.temperature_exterieure') | float(0) < 15 %}
          mdi:snowflake-thermometer
        {% elif states('sensor.temperature_exterieure') | float(0) > 21 %}
          mdi:weather-sunny
        {% elif states('sensor.temperature_exterieure') | float(0) < 32 %}
          mdi:weather-sunny-alert
        {% else %}
          mdi:weather-sunny
        {% endif %}

    # --- icon_th_balcon_nord_temperature ---
    - name: "Icône TH Balcon Nord"
      unique_id: icon_th_balcon_nord_temperature
      unit_of_measurement: "°C"
      state: "{{ states('sensor.th_balcon_nord_temperature') }}"
      icon: >
        {% set temp = states('sensor.th_balcon_nord_temperature') | float(0) %}
        {% if is_state('weather.vence', 'snowy') %}
          mdi:snowflake
        {% elif temp < 15 %}
          mdi:snowflake-thermometer
        {% elif temp >= 32 %}
          mdi:weather-sunny-alert
        {% elif temp >= 21 %}
          mdi:weather-sunny
        {% else %}
          mdi:thermometer
        {% endif %}

# ╭────────────────────────────────────────────────────────────────────────╮
# │ SENSOR : SÉRIE 16. ÉCLAIRAGE — PACK ICÔNES & INFOS (CORRIGÉ)           │
# ╰────────────────────────────────────────────────────────────────────────╯
- sensor:
    # --- Entrée ---
    - name: "Entrée Light Status"
      unique_id: entree_light_status
      state: "{{ 'Allumée' if is_state('light.entree', 'on') else 'Éteint' }}"
      icon: "{{ 'mdi:ceiling-light' if is_state('light.entree', 'on') else 'mdi:ceiling-light-outline' }}"

    # --- Salon ---
    - name: "Salon Light Status"
      unique_id: salon_light_status
      state: "{{ 'Allumée' if is_state('light.salon', 'on') else 'Éteint' }}"
      icon: "{{ 'mdi:sofa' if is_state('light.salon', 'on') else 'mdi:sofa-outline' }}"

    # --- Table ---
    - name: "Table Light Status"
      unique_id: table_light_status
      state: "{{ 'Allumée' if is_state('light.salon', 'on') else 'Éteint' }}"
      icon: "{{ 'mdi:stable-chair' if is_state('light.salon', 'on') else 'mditable-chaire' }}"

    # --- Cuisine ---
    - name: "Cuisine Light Status"
      unique_id: cuisine_light_status
      state: "{{ 'En service' if is_state('light.cuisine', 'on') else 'Éteinte' }}"
      icon: "{{ 'mdi:ceiling-light' if is_state('light.cuisine', 'on') else 'mdi:ceiling-light-outline' }}"

    # --- Bureau ---
    - name: "Bureau Light Status"
      unique_id: bureau_light_status
      state: >
        {% set etat = states('sensor.lumiere_bureau_etat') %}
        {{ etat if etat not in ['unavailable', 'unknown'] else 'Éteint' }}
      icon: >
        {% if states('sensor.lumiere_bureau_etat') in ['Allumé', 'Bureau', 'Allumé & Synchro'] %}
          hue:flourish-alt
        {% else %}
          hue:flourish
        {% endif %}

    # --- Écran PC ---
    - name: "Ecran Light Status"
      unique_id: ecran_light_status
      state: >
        {% set etat = states('sensor.lumiere_ecran_etat') %}
        {{ etat if etat not in ['unavailable', 'unknown'] else 'Éteint' }}
      icon: >
        {% set etat = states('sensor.lumiere_ecran_etat') %}
        {{ 'mdi:monitor-dashboard' if etat in ['Écran', 'Allumé', 'Synchro'] else 'mdi:monitor' }}

    # --- Salle de Bain ---
    - name: "SdB Light Status"
      unique_id: sdb_light_status
      state: "{{ 'En service' if is_state('light.lampe_salle_de_bain_hue', 'on') else 'Éteinte' }}"
      icon: "{{ 'mdi:ceiling-light' if is_state('light.lampe_salle_de_bain_hue', 'on') else 'mdi:ceiling-light-outline' }}"