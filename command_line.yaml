# ┌─────────────────────────────────────┐
# │ 10. AUTRE : RÉSEAU & SPEEDTEST      │
# └─────────────────────────────────────┘

# --- speedtest_cli_data ---
- sensor:
    name: "SpeedTest CLI Data"
    unique_id: speedtest_cli_data
    command: "/config/3rdparty/speedtest/speedtest --format=json --accept-license --accept-gdpr -s 48616"
    scan_interval: 3600
    command_timeout: 60
    value_template: >-
      {{ 
        { 
          "ping": value_json.ping.latency, 
          "download": value_json.download.bandwidth, 
          "upload": value_json.upload.bandwidth, 
          "isp": value_json.isp,
          "country": value_json.server.country,
          "location": value_json.server.location,
          "id": value_json.server.id,
          "server_name": value_json.server.name,
          "server_host": value_json.server.host
        }
        | to_json 
      }}

# ┌─────────────────────────────────────┐
# │ 10. AUTRE : GITHUB (MAINTENANCE)    │
# └─────────────────────────────────────┘

# --- backup_github_status ---
- sensor:
    name: "Backup GitHub Status"
    unique_id: backup_github_status
    command: >-
      bash -lc 'LOG=/config/.logs/ha_git_backup.log;
      if [ -s "$LOG" ] && grep -F "Backup GitHub OK:" "$LOG" >/dev/null 2>&1; then
        TS=$(grep -F "Backup GitHub OK:" "$LOG" | tail -n1 | sed -E "s/^.*OK: (.*)$/\1/");
        printf "{\"ok\":true,\"ts\":\"%s\"}\n" "$TS";
      else
        echo "{\"ok\":false,\"ts\":\"\"}";
      fi'
    scan_interval: 60
    value_template: "{{ 'OK' if value_json.ok else 'KO' }}"
    json_attributes:
      - ts

# --- git_last_weekly_tag ---
- sensor:
    name: "Git Last Weekly Tag"
    unique_id: git_last_weekly_tag
    command: "bash -lc 'cd /config && git tag --list \"weekly-*\" | sort | tail -n1 || true'"
    scan_interval: 1800

# --- backup_github_journal ---
- sensor:
    name: "backup_github_journal"
    unique_id: backup_github_journal
    command: >-
      bash -c 'LOG=/config/.logs/ha_git_backup.log;
      if [ -s "$LOG" ]; then
        OUT=$(grep -aE "✅|❌|📝|🏷️|ABANDON|error:|declined|failed|Git pull" "$LOG" | tail -n 10);
        if [ -z "$OUT" ]; then
          echo "{\"text\":\"Aucune activité pertinente trouvée\"}";
        else
          echo "{\"text\": $(echo "$OUT" | jq -Rs .)}";
        fi
      else
        echo "{\"text\":\"Fichier de log introuvable\"}";
      fi'
    value_template: "ready"
    json_attributes:
      - text
    scan_interval: 60

# --- github_default_branch ---
- sensor:
    name: "GitHub Default Branch"
    unique_id: github_default_branch
    command: >-
      bash -lc 'curl -s -H "User-Agent: HAOS" https://api.github.com/repos/BerrySwann/home-assistant-config |
      grep -m1 "\"default_branch\"" |
      sed -E '\''s/.*"default_branch":[[:space:]]*"([^"]*)".*/\1/'\'''
    scan_interval: 3600
    value_template: >-
      {{ value if value not in [None, "", "null"] else "unknown" }}

# ┌─────────────────────────────────────┐
# │ 10. AUTRE : SANTÉ SYSTÈME (MINI-PC) │
# └─────────────────────────────────────┘

# --- temperature_carte_mere_sys ---
- sensor:
    name: "Température Carte Mère (sys)"
    unique_id: temperature_carte_mere_sys
    command: "cat /sys/class/thermal/thermal_zone0/temp"
    unit_of_measurement: "°C"
    value_template: "{{ (value | float / 1000) | round(1) }}"

# --- temperature_cpu_package_sys ---
- sensor: 
    name: "Température CPU Package (sys)"
    unique_id: temperature_cpu_package_sys
    command: "cat /sys/class/thermal/thermal_zone1/temp"
    unit_of_measurement: "°C"
    icon: mdi:thermometer
    value_template: "{{ (value | float / 1000) | round(1) }}"

# --- temperature_core_0_sys ---
- sensor:
    name: "Température Core 0 (sys)"
    unique_id: temperature_core_0_sys
    command: "cat /sys/devices/platform/coretemp.0/hwmon/hwmon1/temp2_input"
    unit_of_measurement: "°C"
    value_template: "{{ (value | float / 1000) | round(1) }}"

# --- temperature_core_1_sys ---
- sensor:
    name: "Température Core 1 (sys)"
    unique_id: temperature_core_1_sys
    command: "cat /sys/devices/platform/coretemp.0/hwmon/hwmon1/temp3_input"
    unit_of_measurement: "°C"
    value_template: "{{ (value | float / 1000) | round(1) }}"

# --- temperature_core_2_sys ---
- sensor:
    name: "Température Core 2 (sys)"
    unique_id: temperature_core_2_sys
    command: "cat /sys/devices/platform/coretemp.0/hwmon/hwmon1/temp4_input"
    unit_of_measurement: "°C"
    value_template: "{{ (value | float / 1000) | round(1) }}"

# --- temperature_core_3_sys ---
- sensor:
    name: "Température Core 3 (sys)"
    unique_id: temperature_core_3_sys
    command: "cat /sys/devices/platform/coretemp.0/hwmon/hwmon1/temp5_input"
    unit_of_measurement: "°C"
    value_template: "{{ (value | float / 1000) | round(1) }}"

# ┌─────────────────────────────────────┐
# │ 10. AUTRE : VSCODE (CONNECTIONS)    │
# └─────────────────────────────────────┘

# --- visual_code_serveur_connections ---
- sensor:
    name: "VSCode Connections"
    unique_id: visual_code_serveur_connections
    command: "netstat -an | grep :1337 | grep ESTABLISHED | wc -l"
    value_template: "{{ value | int }}"
    scan_interval: 60
    unit_of_measurement: "conn"

# --- visual_code_serveur_connections_exterieur ---
- sensor:
    name: "VSCode Connections exterieur"
    unique_id: visual_code_serveur_connections_exterieur
    command: "ps -ef | grep 'node' | grep 'code-server' | grep -v 'grep' | wc -l"
    value_template: "{{ value | int }}"
    scan_interval: 60
    unit_of_measurement: "proc"

