- id: '1764957375111'
  alias: (C) (CLIM OFF) Gardien Éco (Delta T < -1 et T°Ext > Seuil Non-Chauffage)
  description: Module de sécurité ÉCO. Coupe les climatisations si elles tournent
    alors que l'air extérieur est plus chaud que le seuil de non-chauffage défini
    (sensor.seuil_non_chauffage_bas) et que le Delta est favorable.
  triggers:
  - trigger: numeric_state
    entity_id: sensor.temperature_delta_valeur
    below: -1
    for: 00:10:00
  conditions:
  - condition: time
    after: 07:30:00
    before: '21:00:00'
  - condition: template
    value_template: "{{ states('sensor.th_balcon_nord_temperature') | float(0) > \n
      \  states('sensor.seuil_non_chauffage_bas') | float(15) }}"
  - condition: numeric_state
    entity_id: sensor.th_balcon_nord_temperature
    below: 25
  - condition: or
    conditions:
    - condition: state
      entity_id: climate.clim_salon_rm4_mini
      state:
      - cool
      - heat
      - fan_only
      - dry
      - auto
    - condition: state
      entity_id: climate.clim_bureau_rm4_mini
      state:
      - cool
      - heat
      - fan_only
      - dry
      - auto
    - condition: state
      entity_id: climate.clim_chambre_rm4_mini
      state:
      - cool
      - heat
      - fan_only
      - dry
      - auto
  actions:
  - if:
    - condition: state
      entity_id: climate.clim_salon_rm4_mini
      state:
      - cool
      - heat
      - fan_only
      - dry
      - auto
    then:
    - action: climate.set_hvac_mode
      target:
        entity_id: climate.clim_salon_rm4_mini
      data:
        hvac_mode: 'off'
  - if:
    - condition: state
      entity_id: climate.clim_bureau_rm4_mini
      state:
      - cool
      - heat
      - fan_only
      - dry
      - auto
    then:
    - action: climate.set_hvac_mode
      target:
        entity_id: climate.clim_bureau_rm4_mini
      data:
        hvac_mode: 'off'
  - if:
    - condition: state
      entity_id: climate.clim_chambre_rm4_mini
      state:
      - cool
      - heat
      - fan_only
      - dry
      - auto
    then:
    - action: climate.set_hvac_mode
      target:
        entity_id: climate.clim_chambre_rm4_mini
      data:
        hvac_mode: 'off'
  - action: notify.mobile_app_poco_x7_pro_eric
    data:
      title: Delta T° < -1°C
      message: 'Les clim ont été éteinte. ({{ states(''sensor.temperature_delta_valeur'')
        }}°C) T° Ext.: ({{ states(''sensor.th_balcon_nord_temperature'') }}°C) Seuil
        réglé à: {{ states(''sensor.seuil_non_chauffage_bas'') }}°C.

        '
  mode: single
- id: '1765052018689'
  alias: Minuterie Sèche Serciettes Salle de Bain (1h)
  description: Coupe la prise si la puissance > 50W pendant 1 heure, puis la rallume.
  triggers:
  - entity_id: sensor.prise_radiateur_salle_de_bain_inspelning_ikea_power
    above: 50
    for:
      hours: 1
      minutes: 0
      seconds: 0
    trigger: numeric_state
  conditions: []
  actions:
  - target:
      entity_id: switch.prise_radiateur_salle_de_bain_inspelning_ikea
    action: switch.turn_off
  - delay: 00:01:00
  - target:
      entity_id: switch.prise_radiateur_salle_de_bain_inspelning_ikea
    action: switch.turn_on
  mode: single
- id: '1765308061437'
  alias: (E) Notification température Up ou Down de (21h00 -> 7h30)
  description: Envoie le message personnalisé de clim si le texte change, OU au début
    de la nuit à 21h00.
  triggers:
  - trigger: state
    entity_id: sensor.th_balcon_nord_temperature
  - trigger: time
    at: '21:00:00'
  conditions: []
  actions:
  - condition: time
    after: '21:00:00'
    before: 07:30:00
  - delay: 00:00:02
  - if:
    - condition: template
      value_template: "{{ states('sensor.message_clim_personnalise_21h00_7h30') in
        ['unknown', 'unavailable'] or\n   states('sensor.poco_x7_pro_mamour_wi_fi_connection')
        in ['unknown', 'unavailable'] or\n   states('sensor.poco_x7_pro_wi_fi_connection')
        in ['unknown', 'unavailable'] or\n   states('sensor.th_balcon_nord_temperature')
        in ['unknown', 'unavailable'] }}\n"
    then:
    - action: notify.mobile_app_poco_x7_pro_eric
      data:
        title: '[ANN] Erreur Capteurs'
        message: 'Erreur : Un capteur TENDANCE est indisponible ! Vérifiez les dépendances.'
    else:
    - action: notify.mobile_app_poco_x7_pro_eric
      data:
        title: '[Automa. Notif. Nuit]'
        message: '{{ states(''sensor.message_clim_personnalise_21h00_7h30'') }}'
  mode: queued
- id: '1765737181976'
  alias: HS
  description: '[PROD] Automatisation CLIM (07h30 <-> 21h00). Contrôle intelligent
    (Température/Mode) selon Présence/Réseau/Saison. SÉCURITÉ PRIORITAIRE : Fenêtres
    ouvertes, Arrêt sécurisé en cours, Prises coupées.'
  triggers:
  - alias: 'SYSTEM : Redémarrage Home Assistant'
    trigger: homeassistant
    event: start
    id: force_run
  - alias: 'HORAIRE : Démarrage 7h30'
    trigger: time
    at: 07:30:00
    id: force_run
  - alias: 'RÉSEAU : Changement Wifi <-> Cellular'
    trigger: state
    entity_id:
    - sensor.poco_x7_pro_mamour_network_type
    - sensor.poco_x7_pro_network_type
    id: force_run
  - alias: 'PRISES : Changement ON/OFF'
    trigger: state
    entity_id:
    - switch.clim_salon_nous
    - switch.clim_bureau_nous
    - switch.clim_chambre_nous
    id: force_run
  - alias: 'FENÊTRES : Ouverture (Coupure Urgence)'
    trigger: state
    entity_id:
    - binary_sensor.contact_fenetre_salon_sonoff_contact
    - binary_sensor.contact_fenetre_cuisine_sonoff_contact
    - binary_sensor.contact_fenetre_bureau_sonoff_contact
    - binary_sensor.contact_fenetre_chambre_sonoff_contact
    from: 'off'
    to: 'on'
    id: window_open
  - alias: 'FENÊTRES : Fermeture (Rétablissement)'
    trigger: state
    entity_id:
    - binary_sensor.contact_fenetre_salon_sonoff_contact
    - binary_sensor.contact_fenetre_cuisine_sonoff_contact
    - binary_sensor.contact_fenetre_bureau_sonoff_contact
    - binary_sensor.contact_fenetre_chambre_sonoff_contact
    from: 'on'
    to: 'off'
    id: window_close
  - alias: 'ENVIRONNEMENT : Températures ou Mode'
    trigger: state
    entity_id:
    - sensor.th_balcon_nord_temperature
    - sensor.temperature_cible
    - sensor.mode_ete_hiver
    - sensor.temperature_confort_jour
    id: sensor_update
  conditions:
  - alias: 'SÉCURITÉ : EXÉCUTION UNIQUEMENT DE JOUR'
    condition: time
    after: 07:30:00
    before: '21:00:00'
  actions:
  - alias: 'INIT : CALCUL DES VARIABLES'
    variables:
      mode_saison: '{{ states(''sensor.mode_ete_hiver'') }}'
      groupe_presence: '{{ states(''sensor.groupe_clim'') }}'
      fenetres_ouvertes: "{{ expand('binary_sensor.contact_fenetre_salon_sonoff_contact',
        \n          'binary_sensor.contact_fenetre_cuisine_sonoff_contact', \n          'binary_sensor.contact_fenetre_bureau_sonoff_contact',
        \n          'binary_sensor.contact_fenetre_chambre_sonoff_contact') \n      |
        selectattr('state', 'eq', 'on') | list | count > 0 }}\n"
      temp_eco_c: '{{ states(''sensor.temperature_eco_hiver_corrige'') | float(17)
        }}'
      temp_cible: '{{ states(''sensor.temperature_cible'') | float(0) }}'
      temp_confort: '{{ states(''sensor.temperature_confort_jour'') | float(19) }}'
      t_salon_target: '{{ temp_cible + 1 if states(''sensor.mode_ete_hiver'') == ''heat''
        else temp_cible }}'
      t_bureau_target: '{{ temp_cible }}'
      t_chambre_target: '{{ temp_cible }}'
  - alias: 'LOGIQUE : SÉCURITÉ VS STANDARD'
    choose:
    - alias: 'URGENCE : FENÊTRE OUVERTE'
      conditions:
      - condition: template
        value_template: '{{ fenetres_ouvertes }}'
      sequence:
      - alias: 'ACTION : ARRÊT FORCE'
        action: climate.set_hvac_mode
        target:
          entity_id:
          - climate.clim_salon_rm4_mini
          - climate.clim_bureau_rm4_mini
          - climate.clim_chambre_rm4_mini
        data:
          hvac_mode: 'off'
      - alias: 'NOTIF : ALERTE FENÊTRE'
        action: notify.mobile_app_poco_x7_pro_eric
        data:
          title: CLIM COUPÉE
          message: "{% set fenetres = [\n  'binary_sensor.contact_fenetre_salon_sonoff_contact',\n
            \ 'binary_sensor.contact_fenetre_cuisine_sonoff_contact',\n  'binary_sensor.contact_fenetre_bureau_sonoff_contact',\n
            \ 'binary_sensor.contact_fenetre_chambre_sonoff_contact'\n] %} {% set
            ouverts = expand(*fenetres) | selectattr('state', 'eq', 'on') | list %}
            {% set messages = namespace(list=[]) %} {% if ouverts | length > 0 %}\n
            \ {% for fenetre in ouverts %}\n    {% set nom_complet = fenetre.name
            | string %}\n    {% set piece_nettoye = nom_complet | regex_findall_index(find='fenetre
            (.+)', index=0, ignorecase=True) | regex_replace(find=' \\(IKEA\\).*',
            replace='', ignorecase=True) | trim %}\n    {% set piece_lower = piece_nettoye
            | lower %}\n    {% set article = 'du' if piece_lower == 'bureau' or piece_lower
            == 'salon' else 'de la' %}\n    {% set messages.list = messages.list +
            [\"La fenêtre \" ~ article ~ \" \" ~ piece_lower | upper ~ \" a été ouverte\"]
            %}\n  {% endfor %}\n  {{ messages.list | join('\\n') }}\n{% else %}\n
            \ Aucune fenêtre n'est actuellement ouverte.\n{% endif %}\n"
    default:
    - alias: 'VÉRIFICATION : HORAIRE'
      choose:
      - conditions:
        - condition: time
          after: 07:30:00
          before: '21:00:00'
        sequence:
        - alias: 'CALCUL : DÉFINITION CIBLES PAR PIÈCE'
          choose:
          - alias: 'SCÉNARIO : ABSENT (ECO/CIBLE)'
            conditions:
            - condition: template
              value_template: '{{ ''groupe_1'' in groupe_presence }}'
            sequence:
            - variables:
                t_salon_target: '{{ temp_eco_c if mode_saison == ''heat'' else temp_cible
                  }}'
                t_bureau_target: '{{ temp_eco_c if mode_saison == ''heat'' else temp_cible
                  }}'
                t_chambre_target: '{{ temp_eco_c if mode_saison == ''heat'' else temp_cible
                  }}'
          - alias: 'SCÉNARIO : MAMOUR (SALON CONFORT)'
            conditions:
            - condition: template
              value_template: '{{ ''groupe_2'' in groupe_presence }}'
            sequence:
            - variables:
                t_salon_target: '{{ temp_confort + 1 if mode_saison == ''heat'' else
                  temp_confort }}'
          - alias: 'SCÉNARIO : ERIC (BUREAU CONFORT)'
            conditions:
            - condition: template
              value_template: '{{ ''groupe_3'' in groupe_presence }}'
            sequence:
            - variables:
                t_bureau_target: '{{ temp_confort }}'
          - alias: 'SCÉNARIO : TOUS (SALON+BUREAU CONFORT)'
            conditions:
            - condition: template
              value_template: '{{ ''groupe_4'' in groupe_presence }}'
            sequence:
            - variables:
                t_salon_target: '{{ temp_confort + 1 if mode_saison == ''heat'' else
                  temp_confort }}'
                t_bureau_target: '{{ temp_confort }}'
        - alias: 'ACTION : ENVOI COMMANDES PAR PIÈCE'
          parallel:
          - alias: LOGIQUE SALON
            choose:
            - alias: 'Conditions Salon : Prise ON et Sécurité OFF'
              conditions:
              - condition: state
                entity_id: switch.clim_salon_nous
                state: 'on'
              - condition: state
                entity_id: input_boolean.clim_salon_arret_securise_en_cours
                state: 'off'
              sequence:
              - action: climate.set_temperature
                target:
                  entity_id: climate.clim_salon_rm4_mini
                data:
                  hvac_mode: "{% if trigger.id == 'sensor_update' and is_state('climate.clim_salon_rm4_mini',
                    'off') %}\n  off\n{% else %}\n  {{ mode_saison }}\n{% endif %}\n"
                  temperature: '{{ t_salon_target }}'
              - action: climate.set_fan_mode
                target:
                  entity_id: climate.clim_salon_rm4_mini
                data:
                  fan_mode: auto
          - alias: LOGIQUE BUREAU
            choose:
            - alias: 'Conditions Bureau : Prise ON et Sécurité OFF'
              conditions:
              - condition: state
                entity_id: switch.clim_bureau_nous
                state: 'on'
              - condition: state
                entity_id: input_boolean.clim_bureau_arret_securise_en_cours
                state: 'off'
              sequence:
              - action: climate.set_temperature
                target:
                  entity_id: climate.clim_bureau_rm4_mini
                data:
                  hvac_mode: "{% if trigger.id == 'sensor_update' and is_state('climate.clim_bureau_rm4_mini',
                    'off') %}\n  off\n{% else %}\n  {{ mode_saison }}\n{% endif %}\n"
                  temperature: '{{ t_bureau_target }}'
              - action: climate.set_fan_mode
                target:
                  entity_id: climate.clim_bureau_rm4_mini
                data:
                  fan_mode: auto
          - alias: LOGIQUE CHAMBRE
            choose:
            - alias: 'Conditions Chambre : Prise ON et Sécurité OFF'
              conditions:
              - condition: state
                entity_id: switch.clim_chambre_nous
                state: 'on'
              - condition: state
                entity_id: input_boolean.clim_chambre_arret_securise_en_cours
                state: 'off'
              sequence:
              - action: climate.set_temperature
                target:
                  entity_id: climate.clim_chambre_rm4_mini
                data:
                  hvac_mode: "{% if trigger.id == 'sensor_update' and is_state('climate.clim_chambre_rm4_mini',
                    'off') %}\n  off\n{% else %}\n  {{ mode_saison }}\n{% endif %}\n"
                  temperature: '{{ t_chambre_target }}'
              - action: climate.set_fan_mode
                target:
                  entity_id: climate.clim_chambre_rm4_mini
                data:
                  fan_mode: auto
        - alias: DÉLAI DE SÉCURITÉ
          delay: 00:00:02
        - alias: 'NOTIF : ETAT'
          action: notify.mobile_app_poco_x7_pro_eric
          data:
            title: '[AJ] {{ states(''sensor.presence_clim'') }}'
            message: "{%- if 'groupe_1' in groupe_presence and mode_saison == 'heat'
              %}\n  [éCO HEAT] Les 3 Clims à : {{ temp_eco_c }}° (Absent)\n{% else
              %}\n  Mode : {{ mode_saison | upper }}\n  Salon: {{ t_salon_target }}°
              | Bureau: {{ t_bureau_target }}° | Chambre: {{ t_chambre_target }}°\n{%
              endif %}\n"
  mode: queued
- id: '1766136605271'
  alias: Système - Économie Énergie VS Code
  description: Coupe VS Code après 20h si le CPU dépasse 10% pour économiser l'électricité
  triggers:
  - trigger: numeric_state
    entity_id: sensor.system_monitor_utilisation_du_processeur
    above: 10
    for:
      minutes: 10
  - trigger: numeric_state
    entity_id: sensor.studio_code_server_cpu_percent
    below: 0.8
    for:
      minutes: 15
  conditions:
  - condition: time
    after: '20:00:00'
    before: 07:00:00
  - condition: state
    entity_id: binary_sensor.studio_code_server_running
    state: 'on'
  actions:
  - action: notify.mobile_app_poco_x7_pro_eric
    data:
      title: "\U0001F50B Alerte Énergie - Mini-PC"
      message: Il est {{ now().strftime('%H:%M') }}. Le CPU global est à {{ states('sensor.system_monitor_utilisation_du_processeur')
        }}%.  On coupe VS Code pour économiser ?
      data:
        actions:
        - action: STOP_VSC
          title: Oui, couper
        - action: KEEP_VSC
          title: Non, je travaille encore
  - wait_for_trigger:
    - trigger: event
      event_type: mobile_app_notification_action
      event_data:
        action: STOP_VSC
    - trigger: event
      event_type: mobile_app_notification_action
      event_data:
        action: KEEP_VSC
    timeout: 00:05:00
    continue_on_timeout: true
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ wait.trigger == none or wait.trigger.event.data.action
          == ''STOP_VSC'' }}'
      sequence:
      - action: hassio.addon_stop
        data:
          addon: a0d7b954_vscode
      - action: notify.mobile_app_poco_x7_pro_eric
        data:
          message: VS Code éteint automatiquement (Économie d'énergie).
    - conditions:
      - condition: template
        value_template: '{{ wait.trigger.event.data.action == ''KEEP_VSC'' }}'
      sequence:
      - stop: L'utilisateur code encore, on laisse tourner.
- id: '1766234836333'
  alias: DIAG - Enregistrement Journalier (6 Postes)
  triggers:
  - trigger: time_pattern
    minutes: /15
  actions:
  - action: notify.send_message
    target:
      entity_id: notify.file
    data:
      message: '{% set p1 = states(''sensor.diag_poste_1_hygiene_quotidien'') | float(0)
        | round(2) %} {% set p2 = states(''sensor.diag_poste_2_cuisson_quotidien'')
        | float(0) | round(2) %} {% set p3 = states(''sensor.diag_poste_3_froid_quotidien'')
        | float(0) | round(2) %} {% set p4 = states(''sensor.diag_poste_4_chauffage_quotidien'')
        | float(0) | round(2) %} {% set p5 = states(''sensor.diag_poste_5_multimedia_quotidien'')
        | float(0) | round(2) %} {% set p6 = states(''sensor.diag_poste_6_lumiere_quotidien'')
        | float(0) | round(2) %} {% set ext = states(''sensor.th_balcon_nord_temperature'')
        | float(0) %} {% set t = now().strftime(''%d/%m %H:%M'') %}

        {{t}} | Hyg:{{p1}} | Cuis:{{p2}} | Froid:{{p3}} | Chauff:{{p4}} | Multi:{{p5}}
        | Lum:{{p6}} | Ext:{{ext}}°C

        '
- id: '1766234836334'
  alias: Système - Watchdog Piles (HUE/IKEA/SONOFF)
  description: Vérification 3x/jour basée sur les groupes de la vue synthétique
  triggers:
  - trigger: time
    at: 08:00:00
  - trigger: time
    at: '14:00:00'
  - trigger: time
    at: '20:00:00'
  actions:
  - variables:
      low_batt: "{% set sensors = expand('group.hue_devices', 'group.ikea_devices',
        'group.sonoff_devices') %} {% set ns = namespace(ids=[]) %} {% for s in sensors
        %}\n  {% if s.state | is_number and s.state | int <= 11 %}\n    {% set ns.ids
        = ns.ids + [s.entity_id] %}\n  {% endif %}\n{% endfor %} {{ ns.ids }}\n"
  - if:
    - condition: template
      value_template: '{{ low_batt | count > 0 }}'
    then:
    - action: notify.mobile_app_poco_x7_pro_eric
      data:
        title: Alerte Pile Faible (<11%)
        message: "{% for id in low_batt %}\n  - {{ state_attr(id, 'friendly_name')
          }} : {{ states(id) }}%\n{% endfor %}\n"
        data:
          tag: alert-batterie
          color: '#f44336'
- id: '1766658095181'
  alias: D - Watchdog Sécurité Radiateur SDB
  description: Reset physique si T > 24°C, uniquement si la prise est alimentée
  triggers:
  - trigger: state
    entity_id: sensor.th_salle_de_bain_temperature
  conditions:
  - condition: state
    entity_id: switch.prise_radiateur_salle_de_bain_nous
    state: 'on'
  - condition: state
    entity_id: input_boolean.inter_radiateur_salle_de_bain
    state: 'on'
  - condition: numeric_state
    entity_id: sensor.th_salle_de_bain_temperature
    above: 24
  - condition: template
    value_template: "{{ (states('sensor.th_salle_de_bain_temperature') | float) >=
      \n   (trigger.from_state.state | float + 0.5) }}\n"
  actions:
  - action: notify.mobile_app_poco_x7_pro_eric
    data:
      title: ⚠️ Watchdog SDB
      message: Dérive thermique détectée à {{ states('sensor.th_salle_de_bain_temperature')
        }}°C. Reset IR lancé.
  - repeat:
      count: 2
      sequence:
      - action: remote.send_command
        target:
          entity_id: remote.radiateur_sdb_rm4_mini
        data:
          command: on_off
          device: radiateur_sdb
          num_repeats: 1
      - delay: '00:00:01.0'
- id: '1766678478256'
  alias: 'Bureau : Coupure Smart PC (Groupes Présence)'
  description: Coupe la prise si le PC est éteint ET que je ne suis plus dans les
    groupes de présence
  triggers:
  - trigger: numeric_state
    entity_id: sensor.prise_bureau_pc_ikea_power
    below: 50
    for:
      minutes: 10
  conditions:
  - condition: state
    entity_id: switch.hue_smart_eco_pc_bureau
    state: 'on'
  - condition: template
    value_template: '{{ (now() - states.switch.hue_smart_eco_pc_bureau.last_changed).total_seconds()
      > 900 }}'
  actions:
  - action: switch.turn_off
    target:
      entity_id: switch.hue_smart_eco_pc_bureau
  - action: notify.mobile_app_poco_x7_pro_eric
    data:
      title: ÉCO PC Bureau
      message: Prise coupée.
  mode: single
- id: '1766680176801'
  alias: 'Bureau : Allumage Manu PC (MQTT) Poussoir (IKEA TRADFRI)'
  description: Allume la prise PC dès que le bouton IKEA envoie le signal ON via MQTT
  triggers:
  - topic: zigbee2mqtt/Poussoir (IKEA TRADFRI)/action
    payload: 'on'
    trigger: mqtt
  actions:
  - target:
      entity_id: switch.hue_smart_eco_pc_bureau
    action: switch.turn_on
  mode: single
- id: '1766693057961'
  alias: 'Gestion TV Chambre : Coupure Totale + Notif'
  description: Allumage auto à 21h ou manuel via RODRET.  Extinction totale (TV +
    Accessoires) avec notification sur Poco.
  triggers:
  - id: bouton_mqtt
    trigger: mqtt
    topic: zigbee2mqtt/Inter TV Chambre (IKEA RODRET)
  - id: allumage_auto
    trigger: time
    at: '21:00:00'
  - id: extinction_conso
    trigger: numeric_state
    entity_id: sensor.prise_tv_chambre_nous_device_power
    below: 5
    for:
      minutes: 2
  actions:
  - choose:
    - conditions:
      - or:
        - condition: template
          value_template: '{{ trigger.id == ''bouton_mqtt'' and trigger.payload_json.action
            == ''on'' }}'
        - condition: trigger
          id: allumage_auto
      sequence:
      - action: switch.turn_on
        target:
          entity_id: switch.prise_tv_chambre_nous
      - action: light.turn_on
        target:
          entity_id: light.hue_smart_tv_chambre
    - conditions:
      - or:
        - condition: template
          value_template: '{{ trigger.id == ''bouton_mqtt'' and trigger.payload_json.action
            == ''off'' }}'
        - condition: trigger
          id: extinction_conso
      sequence:
      - action: light.turn_off
        target:
          entity_id: light.hue_smart_tv_chambre
      - action: switch.turn_off
        target:
          entity_id: switch.prise_tv_chambre_nous
      - action: notify.mobile_app_poco_x7_pro_eric
        data:
          title: Économie d'énergie TV
          message: Pôle multimédia coupé (veille détectée). Bonne nuit !
          data:
            icon: mdi:power-plug-off
            tag: notif_tv_chambre
  mode: restart
