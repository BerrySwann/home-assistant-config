  description: '[TEST] Automatisation pour contrôler de [06h00 <-> 20h00] les climatiseurs
    en fonction de la température intérieure/extérieure [DELTA] et du type de réseau
    des portables [WIFI/CELLULAR]. (SAUF) L''état des fenêtres [OUVERTE(S)/FERMÉE(S)]
    qui sont contrôlées 24h sur 24.'
  triggers:
  - alias: Prises clim Ext. de "ON" à "OFF"
    trigger: state
    entity_id:
    - switch.clim_salon_nous
    - switch.clim_du_bureau_nous
    - switch.clim_chambre_nous
    from:
    - 'on'
    - 'off'
  - alias: Prises clim Ext. de "OFF" à "ON"
    trigger: state
    entity_id:
    - switch.clim_salon_nous
    - switch.clim_du_bureau_nous
    - switch.clim_chambre_nous
    from:
    - 'off'
    - 'on'
  - alias: Changement d'état des fenêtres 'off' -> 'on'
    entity_id:
    - binary_sensor.contact_fenetre_salon_ikea_contact
    - binary_sensor.contact_fenetre_cuisine_ikea_contact
    - binary_sensor.contact_fenetre_bureau_ikea_contact
    - binary_sensor.contact_fenetre_chambre_ikea_contact
    from:
    - 'off'
    to:
    - 'on'
    trigger: state
    for:
      hours: 0
      minutes: 0
      seconds: 2
  - alias: Changement d'état des fenêtres 'on' -> 'off'
    entity_id:
    - binary_sensor.contact_fenetre_salon_ikea_contact
    - binary_sensor.contact_fenetre_cuisine_ikea_contact
    - binary_sensor.contact_fenetre_bureau_ikea_contact
    - binary_sensor.contact_fenetre_chambre_ikea_contact
    from:
    - 'on'
    to:
    - 'off'
    trigger: state
    for:
      hours: 0
      minutes: 0
      seconds: 2
  - alias: Changement de réseau de Mamour 'wifi' -> 'cellular'
    entity_id: sensor.poco_x7_pro_mamour_network_type
    from: wifi
    to: cellular
    trigger: state
  - alias: Changement de réseau de Mamour 'cellular' -> 'wifi'
    entity_id: sensor.poco_x7_pro_mamour_network_type
    from: cellular
    to: wifi
    trigger: state
  - alias: Changement de réseau d'Eric 'wifi' -> 'cellular'
    entity_id: sensor.poco_x7_pro_network_type
    from: wifi
    to: cellular
    trigger: state
  - alias: Changement de réseau d'Eric 'cellular' -> 'wifi'
    entity_id: sensor.poco_x7_pro_network_type
    from: cellular
    to: wifi
    trigger: state
  - alias: Changement d'état des climatiseurs à 'heat'
    trigger: state
    entity_id:
    - climate.clim_salon_rm4_mini
    - climate.clim_bureau_rm4_mini
    - climate.clim_chambre_rm4_mini
    to: heat
  - alias: Changement d'état des climatiseurs à 'cool'
    trigger: state
    entity_id:
    - climate.clim_salon_rm4_mini
    - climate.clim_bureau_rm4_mini
    - climate.clim_chambre_rm4_mini
    to: cool
  - alias: Changement d'état des climatiseurs à 'fan_only'
    trigger: state
    entity_id:
    - climate.clim_salon_rm4_mini
    - climate.clim_bureau_rm4_mini
    - climate.clim_chambre_rm4_mini
    to: fan_only
  - trigger: state
    entity_id:
    - sensor.temperature_cible
  - trigger: state
    entity_id:
    - sensor.mode_ete_hiver
  - trigger: time
    at: 06:00:00
  conditions: []
  actions:
  - alias: SI UNE FENÊTRES EST OUVERTES OU TOUTES FERMÉES
    choose:
    - alias: SI UNE OU PLUSIEURS FENÊTRES SONT OUVERTES (condition OR)
      conditions:
      - condition: or
        conditions:
        - condition: state
          entity_id: binary_sensor.contact_fenetre_salon_ikea_contact
          state: 'on'
        - condition: state
          entity_id: binary_sensor.contact_fenetre_cuisine_ikea_contact
          state: 'on'
        - condition: state
          entity_id: binary_sensor.contact_fenetre_bureau_ikea_contact
          state: 'on'
        - condition: state
          entity_id: binary_sensor.contact_fenetre_chambre_ikea_contact
          state: 'on'
      sequence:
      - alias: COUPER CLIMATISATIONS
        action: climate.set_hvac_mode
        target:
          entity_id:
          - climate.clim_salon_rm4_mini
          - climate.clim_bureau_rm4_mini
          - climate.clim_chambre_rm4_mini
        data:
          hvac_mode: 'off'
      - alias: NOTIFICATION FENETRE OUVERTE
        data:
          title: CLIM DÉSACTIVÉES
          message: "{% if trigger.entity_id == 'binary_sensor.contact_fenetre_salon_ikea_contact'
            and is_state('binary_sensor.contact_fenetre_salon_ikea_contact', 'on')
            %}\n  La fenêtre du Salon a été ouverte.\n{% elif trigger.entity_id ==
            'binary_sensor.contact_fenetre_cuisine_ikea_contact' and is_state('binary_sensor.contact_fenetre_cuisine_ikea_contact',
            'on') %}\n  La fenêtre de la Cuisine a été ouverte.\n{% elif trigger.entity_id
            == 'binary_sensor.contact_fenetre_bureau_ikea_contact' and is_state('binary_sensor.contact_fenetre_bureau_ikea_contact',
            'on') %}\n  La fenêtre du Bureau a été ouverte.\n{% elif trigger.entity_id
            == 'binary_sensor.contact_fenetre_chambre_ikea_contact' and is_state('binary_sensor.contact_fenetre_chambre_ikea_contact',
            'on') %}\n  La fenêtre de la Chambre a été ouverte.\n{% endif %}\n  {%
            if states('sensor.nbre_de_fenetres_ouvertes') == '4' %}\n    Toutes les
            fenêtres sont ouvertes.\n  {% endif %}\n"
        action: notify.mobile_app_poco_x7_pro
    - alias: SI TOUTES LES FENÊTRES SONT FERMÉES (condition AND)
      conditions:
      - condition: and
        conditions:
        - condition: state
          entity_id: binary_sensor.contact_fenetre_salon_ikea_contact
          state: 'off'
        - condition: state
          entity_id: binary_sensor.contact_fenetre_cuisine_ikea_contact
          state: 'off'
        - condition: state
          entity_id: binary_sensor.contact_fenetre_bureau_ikea_contact
          state: 'off'
        - condition: state
          entity_id: binary_sensor.contact_fenetre_chambre_ikea_contact
          state: 'off'
      sequence:
      - alias: INITIALISATION VARIABLES
        variables:
          groupe: '{{ states(''sensor.groupe_clim'') }}'
          mode: '{{ states(''sensor.mode_ete_hiver'') }}'
          temp_eco: '{{ states(''sensor.temperature_eco_hiver'') | float }}'
          temp_cible: '{{ states(''sensor.temperature_cible'') | float }}'
          temp_diff: '{{ states(''sensor.temperature_differentielle'') | float }}'
          consigne_base: '{{ states(''sensor.consigne_de_base'') | float }}'
          fenetres_fermees: '{{ states(''sensor.nbre_de_fenetres_fermees'') | int
            }}'
          pris_clim: "{{ is_state('switch.clim_salon_nous', 'on') and\n   is_state('switch.clim_du_bureau_nous',
            'on') and\n   is_state('switch.clim_chambre_nous', 'on') }}\n"
          presence: '{{ states(''sensor.presence_clim'') }}'
      - alias: CONDITIONS PRINCIPALES
        choose:
        - alias: ETAPES VERIF FENÊTRES, PRISES ET HORAIRES
          conditions:
          - alias: PRISES CLIM ALLUMÉES
            condition: template
            value_template: '{{ pris_clim }}'
          - alias: PLAGE HORAIRE 6H-20H
            condition: time
            after: 06:00:00
            before: '20:00:00'
          sequence:
          - alias: BRANCHES DE GROUPES de 1 à 4
            choose:
            - alias: GROUPE 1 (ABSENT)
              conditions:
              - alias: GROUPE 1 DÉTECTÉ
                condition: template
                value_template: '{{ ''groupe_1'' in groupe }}'
              sequence:
              - alias: MODES DE SAISON GROUPE 1
                choose:
                - alias: MODE HEAT
                  conditions:
                  - alias: HEAT ACTIVÉ
                    condition: state
                    entity_id: sensor.mode_ete_hiver
                    state: heat
                  sequence:
                  - alias: RÉGLER TEMPÉRATURE HEATING
                    action: climate.set_temperature
                    target:
                      entity_id:
                      - climate.clim_salon_rm4_mini
                      - climate.clim_bureau_rm4_mini
                      - climate.clim_chambre_rm4_mini
                    data:
                      hvac_mode: heat
                      temperature: '{{ temp_eco }}'
                  - alias: RÉGLER MODE VENTILATION AUTO
                    action: climate.set_fan_mode
                    target:
                      entity_id:
                      - climate.clim_salon_rm4_mini
                      - climate.clim_bureau_rm4_mini
                      - climate.clim_chambre_rm4_mini
                    data:
                      fan_mode: auto
                  - alias: NOTIFICATION GROUPE 1 - HEAT
                    data:
                      title: '{{ presence }}'
                      message: 'Les 3 Clim en mode: {{ mode | upper }} -> {{ temp_eco
                        }}°.'
                    action: notify.mobile_app_poco_x7_pro
                - alias: MODE COOL
                  conditions:
                  - alias: COOL ACTIVÉ
                    condition: state
                    entity_id: sensor.mode_ete_hiver
                    state: cool
                  sequence:
                  - alias: RÉGLER TEMPÉRATURE COOLING
                    action: climate.set_temperature
                    target:
                      entity_id:
                      - climate.clim_salon_rm4_mini
                      - climate.clim_bureau_rm4_mini
                      - climate.clim_chambre_rm4_mini
                    data:
                      hvac_mode: cool
                      temperature: '{{ temp_cible }}'
                  - alias: RÉGLER MODE VENTILATION AUTO
                    action: climate.set_fan_mode
                    target:
                      entity_id:
                      - climate.clim_salon_rm4_mini
                      - climate.clim_bureau_rm4_mini
                      - climate.clim_chambre_rm4_mini
                    data:
                      fan_mode: auto
                  - alias: NOTIFICATION GROUPE 1 COOL/FAN
                    action: notify.mobile_app_poco_x7_pro
                    data:
                      title: '{{ presence }}'
                      message: 'Les 3 Clim en mode: {{ mode | upper }} -> {{ temp_cible
                        }}°.'
                - alias: MODE FAN ONLY
                  conditions:
                  - alias: FAN ONLY ACTIVÉ
                    condition: state
                    entity_id: sensor.mode_ete_hiver
                    state: fan_only
                  sequence:
                  - alias: RÉGLER MODE VENTILATION FAN_ONLY
                    action: climate.set_fan_mode
                    target:
                      entity_id:
                      - climate.clim_salon_rm4_mini
                      - climate.clim_bureau_rm4_mini
                      - climate.clim_chambre_rm4_mini
                    data:
                      fan_mode: auto
                  - alias: NOTIFICATION GROUPE 1 COOL/FAN
                    action: notify.mobile_app_poco_x7_pro
                    data:
                      title: '{{ presence }}'
                      message: 'Les 3 Clim en mode: {{ mode | upper }} -> {{ temp_cible
                        }}°.'
            - alias: GROUPE 2 - MAMOUR AT HOME
              conditions:
              - alias: GROUPE 2 DÉTECTÉ
                condition: template
                value_template: '{{ ''groupe_2'' in groupe }}'
              sequence:
              - alias: RÉGLAGE TEMP DIFFÉRENTIÉE SUR SALON
                action: climate.set_temperature
                target:
                  entity_id: climate.clim_salon_rm4_mini
                data:
                  hvac_mode: '{{ mode }}'
                  temperature: '{{ (temp_diff + (temp_cible - consigne_base)) | round(1)
                    }}'
              - alias: RÉGLAGE TEMP CIBLE SUR BUREAU ET CHAMBRE
                action: climate.set_temperature
                target:
                  entity_id:
                  - climate.clim_bureau_rm4_mini
                  - climate.clim_chambre_rm4_mini
                data:
                  hvac_mode: '{{ mode }}'
                  temperature: '{{ temp_cible }}'
              - alias: MODE VENTILATION AUTO
                action: climate.set_fan_mode
                target:
                  entity_id:
                  - climate.clim_salon_rm4_mini
                  - climate.clim_bureau_rm4_mini
                  - climate.clim_chambre_rm4_mini
                data:
                  fan_mode: auto
              - alias: NOTIFICATION GROUPE 2
                action: notify.mobile_app_poco_x7_pro
                data:
                  title: '{{ presence }}'
                  message: 'Mode: {{ mode | upper }}<br> Salon: {{ (temp_diff + (temp_cible
                    - consigne_base)) | round(1) }}°<br> Bureau & Chambre: {{ temp_cible
                    }}°'
            - alias: GROUPE 3 - ERIC AT HOME
              conditions:
              - alias: GROUPE 3 DÉTECTÉ
                condition: template
                value_template: '{{ ''groupe_3'' in groupe }}'
              sequence:
              - alias: RÉGLAGE TEMP DIFFÉRENTIÉE SUR BUREAU
                action: climate.set_temperature
                target:
                  entity_id: climate.clim_bureau_rm4_mini
                data:
                  hvac_mode: '{{ mode }}'
                  temperature: '{{ (temp_diff + (temp_cible - consigne_base)) | round(1)
                    }}'
              - alias: RÉGLAGE TEMP CIBLE SUR SALON ET CHAMBRE
                action: climate.set_temperature
                target:
                  entity_id:
                  - climate.clim_salon_rm4_mini
                  - climate.clim_chambre_rm4_mini
                data:
                  hvac_mode: '{{ mode }}'
                  temperature: '{{ temp_cible }}'
              - alias: MODE VENTILATION AUTO
                action: climate.set_fan_mode
                target:
                  entity_id:
                  - climate.clim_salon_rm4_mini
                  - climate.clim_bureau_rm4_mini
                  - climate.clim_chambre_rm4_mini
                data:
                  fan_mode: auto
              - alias: NOTIFICATION GROUPE 3
                data:
                  title: '{{ presence }}'
                  message: 'Mode: {{ mode | upper }}<br> Bureau: {{ (temp_diff + (temp_cible
                    - consigne_base)) | round(1) }}°<br> Salon & Chambre: {{ temp_cible
                    }}°'
                action: notify.mobile_app_poco_x7_pro
            - alias: GROUPE 4 - MAMOUR & ERIC AT HOME
              conditions:
              - alias: GROUPE 4 DÉTECTÉ
                condition: template
                value_template: '{{ ''groupe_4'' in groupe }}'
              sequence:
              - alias: RÉGLER TEMPÉRATURE DIFFÉRENTIÉE SALON ET BUREAU
                action: climate.set_temperature
                target:
                  entity_id:
                  - climate.clim_salon_rm4_mini
                  - climate.clim_bureau_rm4_mini
                data:
                  hvac_mode: '{{ mode }}'
                  temperature: '{{ (temp_diff + (temp_cible - consigne_base)) | round(1)
                    }}'
              - alias: RÉGLER TEMPÉRATURE CIBLE CHAMBRE
                action: climate.set_temperature
                target:
                  entity_id: climate.clim_chambre_rm4_mini
                data:
                  hvac_mode: '{{ mode }}'
                  temperature: '{{ temp_cible }}'
              - alias: MODE VENTILATION AUTO
                action: climate.set_fan_mode
                target:
                  entity_id:
                  - climate.clim_salon_rm4_mini
                  - climate.clim_bureau_rm4_mini
                  - climate.clim_chambre_rm4_mini
                data:
                  fan_mode: auto
              - alias: NOTIFICATION GROUPE 4
                data:
                  title: '{{ presence }}'
                  message: 'Mode: {{ mode | upper }}<br> Salon & Bureau: {{ (temp_diff
                    + (temp_cible - consigne_base)) | round(1) }}°<br> Chambre: {{
                    temp_cible }}°'
                action: notify.mobile_app_poco_x7_pro
  mode: queued
- id: '1763214110999'
  alias: (B - 0) [ TEST 2025-11-15 ] Automatisation pour contrôler de [20h00 <-> 06h00]
    les climatiseurs en fonction de la température intérieure/extérieure [DELTA] et
    du type de réseau des portables [WIFI/CELLULAR].
  description: 'Automatisation pour contrôler de [20h00 <-> 06h00] les climatiseurs
    en fonction de la température intérieure/extérieure [DELTA] et du type de réseau
    des portables [WIFI/CELLULAR]. '
  triggers:
  - alias: Prises clim Ext. de "ON" à "OFF"
    trigger: state
    entity_id:
    - switch.clim_salon_nous
    - switch.clim_du_bureau_nous
    - switch.clim_chambre_nous
    from:
    - 'on'
    - 'off'
  - alias: Prises clim Ext. de "OFF" à "ON"
    trigger: state
    entity_id:
    - switch.clim_salon_nous
    - switch.clim_du_bureau_nous
    - switch.clim_chambre_nous
    from:
    - 'off'
    - 'on'
  - alias: Changement d'état des fenêtres 'on' -> 'off'
    entity_id:
    - binary_sensor.contact_fenetre_salon_ikea_contact
    - binary_sensor.contact_fenetre_cuisine_ikea_contact
    - binary_sensor.contact_fenetre_bureau_ikea_contact
    - binary_sensor.contact_fenetre_chambre_ikea_contact
    from:
    - 'on'
    to:
    - 'off'
    trigger: state
    for:
      hours: 0
      minutes: 0
      seconds: 2
  - alias: Changement de réseau de Mamour 'wifi' -> 'cellular'
    entity_id: sensor.poco_x7_pro_mamour_network_type
    from: wifi
    to: cellular
    trigger: state
  - alias: Changement de réseau de Mamour 'cellular' -> 'wifi'
    entity_id: sensor.poco_x7_pro_mamour_network_type
    from: cellular
    to: wifi
    trigger: state
  - alias: Changement de réseau d'Eric 'wifi' -> 'cellular'
    entity_id: sensor.poco_x7_pro_network_type
    from: wifi
    to: cellular
    trigger: state
  - alias: Changement de réseau d'Eric 'cellular' -> 'wifi'
    entity_id: sensor.poco_x7_pro_network_type
    from: cellular
    to: wifi
    trigger: state
  - alias: Changement d'état des climatiseurs à 'heat'
    trigger: state
    entity_id:
    - climate.clim_salon_rm4_mini
    - climate.clim_bureau_rm4_mini
    - climate.clim_chambre_rm4_mini
    to: heat
  - alias: Changement d'état des climatiseurs à 'cool'
    trigger: state
    entity_id:
    - climate.clim_salon_rm4_mini
    - climate.clim_bureau_rm4_mini
    - climate.clim_chambre_rm4_mini
    to: cool
  - alias: Changement d'état des climatiseurs à 'fan_only'
    trigger: state
    entity_id:
    - climate.clim_salon_rm4_mini
    - climate.clim_bureau_rm4_mini
    - climate.clim_chambre_rm4_mini
    to: fan_only
  - trigger: state
    entity_id:
    - sensor.temperature_cible
  - trigger: state
    entity_id:
    - sensor.mode_ete_hiver
  - trigger: time
    at: '20:00:00'
  actions:
  - alias: INITIALISATION VARIABLES
    variables:
      groupe: '{{ states(''sensor.groupe_clim'') }}'
      mode: '{{ states(''sensor.mode_ete_hiver'') }}'
      temp_eco: '{{ states(''sensor.temperature_eco_hiver'') | float }}'
      temp_cible: '{{ states(''sensor.temperature_cible'') | float }}'
      temp_diff: '{{ states(''sensor.temperature_differentielle'') | float }}'
      consigne_base: '{{ states(''sensor.consigne_de_base'') | float }}'
      fenetres_fermees: '{{ states(''sensor.nbre_de_fenetres_fermees'') | int }}'
      pris_clim: "{{ is_state('switch.clim_salon_nous', 'on') and\n   is_state('switch.clim_du_bureau_nous',
        'on') and\n   is_state('switch.clim_chambre_nous', 'on') }}\n"
      presence: '{{ states(''sensor.presence_clim'') }}'
  - alias: CONDITIONS PRINCIPALES
    choose:
    - alias: ETAPES VERIF FENÊTRES, PRISES ET HORAIRES
      conditions:
      - alias: FENÊTRES FERMÉES
        condition: numeric_state
        entity_id: sensor.nbre_de_fenetres_fermees
        above: 3.9
      - alias: PRISES CLIM ALLUMÉES
        condition: template
        value_template: '{{ pris_clim }}'
      - alias: PLAGE HORAIRE 20H-6H
        condition: time
        after: '20:00:00'
        before: 06:00:00
      sequence:
      - alias: GROUPE 1 (ABSENT)
        if:
        - condition: template
          value_template: '{{ groupe == ''groupe_1'' }}'
        then:
        - alias: MODES DE SAISON GROUPE 1
          choose:
          - alias: MODE HEAT
            conditions:
            - condition: state
              entity_id: sensor.mode_ete_hiver
              state: heat
            sequence:
            - alias: RÉGLER TEMPÉRATURE HEATING
              target:
                entity_id:
                - climate.clim_salon_rm4_mini
                - climate.clim_bureau_rm4_mini
                - climate.clim_chambre_rm4_mini
              data:
                hvac_mode: heat
                temperature: '{{ temp_eco }}'
              action: climate.set_temperature
            - alias: RÉGLER MODE VENTILATION AUTO
              target:
                entity_id:
                - climate.clim_salon_rm4_mini
                - climate.clim_bureau_rm4_mini
                - climate.clim_chambre_rm4_mini
              data:
                fan_mode: auto
              action: climate.set_fan_mode
            - alias: NOTIFICATION GROUPE 1 - HEAT
              data:
                title: '{{ presence }}'
                message: 'Les 3 Clim en mode: {{ mode | upper }} -> {{ temp_eco }}°.'
              action: notify.mobile_app_poco_x7_pro
          - alias: MODE COOL
            conditions:
            - condition: state
              entity_id: sensor.mode_ete_hiver
              state: cool
            sequence:
            - alias: RÉGLER TEMPÉRATURE COOLING
              target:
                entity_id:
                - climate.clim_salon_rm4_mini
                - climate.clim_bureau_rm4_mini
                - climate.clim_chambre_rm4_mini
              data:
                hvac_mode: cool
                temperature: '{{ temp_cible }}'
              action: climate.set_temperature
            - alias: RÉGLER MODE VENTILATION AUTO
              target:
                entity_id:
                - climate.clim_salon_rm4_mini
                - climate.clim_bureau_rm4_mini
                - climate.clim_chambre_rm4_mini
              data:
                fan_mode: auto
              action: climate.set_fan_mode
            - alias: NOTIFICATION GROUPE 1 COOL/FAN
              data:
                title: '{{ presence }}'
                message: 'Les 3 Clim en mode: {{ mode | upper }} -> {{ temp_cible
                  }}°.'
              action: notify.mobile_app_poco_x7_pro
          - alias: MODE FAN ONLY
            conditions:
            - condition: state
              entity_id: sensor.mode_ete_hiver
              state: fan_only
            sequence:
            - alias: RÉGLER MODE VENTILATION FAN_ONLY
              target:
                entity_id:
                - climate.clim_salon_rm4_mini
                - climate.clim_bureau_rm4_mini
                - climate.clim_chambre_rm4_mini
              data:
                fan_mode: auto
              action: climate.set_fan_mode
            - alias: NOTIFICATION GROUPE 1 COOL/FAN
              data:
                title: '{{ presence }}'
                message: 'Les 3 Clim en mode: {{ mode | upper }} -> {{ temp_cible
                  }}°.'
              action: notify.mobile_app_poco_x7_pro
      - alias: GROUPE 2, 3, 4 (PRÉSENCE)
        if:
        - condition: template
          value_template: '{{ groupe in [''groupe_2'', ''groupe_3'', ''groupe_4'']
            }}'
        then:
        - alias: RÉGLAGE TEMPÉRATURE SELON PRÉSENCE (SALON, BUREAU, CHAMBRE)
          target:
            entity_id: climate.clim_salon_rm4_mini
          data:
            hvac_mode: '{{ mode }}'
            temperature: '{{ temp_cible }}'
          action: climate.set_temperature
        - alias: RÉGLAGE TEMPÉRATURE BUREAU
          target:
            entity_id: climate.clim_bureau_rm4_mini
          data:
            hvac_mode: '{{ mode }}'
            temperature: '{{ temp_cible }}'
          action: climate.set_temperature
        - alias: RÉGLAGE TEMPÉRATURE CHAMBRE
          target:
            entity_id: climate.clim_chambre_rm4_mini
          data:
            hvac_mode: '{{ mode }}'
            temperature: '{{ (temp_diff + (temp_cible - consigne_base)) | round(1)
              }}'
          action: climate.set_temperature
        - alias: GESTION VENTILATION FAN_ONLY SPÉCIFIQUE
          choose:
          - conditions:
            - condition: state
              entity_id: sensor.mode_ete_hiver
              state: fan_only
            sequence:
            - alias: VENTILATION SALON QUIET
              target:
                entity_id: climate.clim_salon_rm4_mini
              data:
                fan_mode: quiet
              action: climate.set_fan_mode
            - alias: VENTILATION BUREAU ET CHAMBRE BREEZE
              target:
                entity_id:
                - climate.clim_bureau_rm4_mini
                - climate.clim_chambre_rm4_mini
              data:
                fan_mode: breeze
              action: climate.set_fan_mode
        - alias: NOTIFICATION PRÉSENCE ET RÉGLAGES APPLIQUÉS
          data:
            title: '[N]-> {{ presence }}'
            message: 'Mode: {{ mode | upper }}<br> Chambre: {{ (temp_diff + (temp_cible
              - consigne_base)) | round(1) }}°<br> Salon & Bureau: {{ temp_cible }}°'
          action: notify.mobile_app_poco_x7_pro
  mode: queued
- id: '1763661737799'
  alias: A - Demarrage Radiateur Salle de Bain
  description: Allumage prise + radiateur quand input_boolean passe à ON
  triggers:
  - entity_id: input_boolean.inter_radiateur_salle_de_bain
    to: 'on'
    trigger: state
  actions:
  - delay: '00:00:00.4'
  - target:
      entity_id: switch.prise_radiateur_salle_de_bain_nous
    action: switch.turn_on
  - delay: '00:00:00.4'
  - target:
      entity_id: remote.radiateur_sdb_rm4_mini
    data:
      command: on_off
      device: radiateur_sdb
      num_repeats: 1
    action: remote.send_command
  - delay: '00:00:00.4'
  - target:
      entity_id: remote.radiateur_sdb_rm4_mini
    data:
      command: 1000w
      device: radiateur_sdb
      num_repeats: 2
    action: remote.send_command
  - delay: '00:00:00.4'
  - target:
      entity_id: remote.radiateur_sdb_rm4_mini
    data:
      command: swing
      device: radiateur_sdb
      num_repeats: 1
    action: remote.send_command
