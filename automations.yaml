      action: climate.set_fan_mode
    - data:
        title: Clim [2] en [CELLULAR]
        message: "{% if trigger.entity_id == 'sensor.ne2213_mamour_network_type' or
          trigger.entity_id == 'sensor.poco_x7_pro_network_type' %}\n  Les 3 Clim
          {{ states('sensor.temperature_cible') | float }}°\n{% endif %}"
      action: notify.mobile_app_poco_x7_pro
  - alias: SI MAMOUR EN WIFI
    if:
    - condition: and
      conditions:
      - condition: time
        after: 06:00:00
        before: '20:00:00'
      - condition: state
