- id: '1750309185567'
  alias: (H) [ CLIM DEBUG ] Force clims -> sensor.mode_ete_hiver
  description: Vérifie toutes les minutes si les clims sont alignées avec 'sensor.mode_ete_hiver'
    et que leurs interrupteurs associés sont allumés. Si non, force le mode HVAC à
    'sensor.mode_ete_hiver' et notifie uniquement les changements.
  triggers:
  - minutes: /1
    trigger: time_pattern
  - entity_id:
    - climate.clim_salon_rm4_mini
    - climate.clim_bureau_rm4_mini
    - climate.clim_chambre_rm4_mini
    trigger: state
  conditions:
  - condition: and
    conditions:
    - condition: template
      value_template: '{{ states(''climate.clim_salon_rm4_mini'') != ''off''}}'
    - condition: template
      value_template: '{{ states(''climate.clim_bureau_rm4_mini'') != ''off''}}'
    - condition: template
      value_template: '{{ states(''climate.clim_chambre_rm4_mini'') != ''off''}} '
  actions:
  - delay: 00:00:05
  - variables:
      target_clims: "{% set target_clims = [] %} {% if states('climate.clim_salon_rm4_mini')
        != states('sensor.mode_ete_hiver')\n      and states('switch.clim_salon_nous')
        == 'on' %}\n  {% set target_clims = target_clims + ['climate.clim_salon_rm4_mini']
        %}\n{% endif %} {% if states('climate.clim_bureau_rm4_mini') != states('sensor.mode_ete_hiver')\n
        \     and states('switch.clim_du_bureau_nous') == 'on' %}\n  {% set target_clims
        = target_clims + ['climate.clim_bureau_rm4_mini'] %}\n{% endif %} {% if states('climate.clim_chambre_rm4_mini')
        != states('sensor.mode_ete_hiver')\n      and states('switch.clim_chambre_nous')
        == 'on' %}\n  {% set target_clims = target_clims + ['climate.clim_chambre_rm4_mini']
        %}\n{% endif %} {{ target_clims }}\n"
      target_clims_names: "{% set names = [] %} {% if 'climate.clim_salon_rm4_mini'
        in target_clims %}\n  {% set names = names + ['Salon'] %}\n{% endif %} {%
        if 'climate.clim_bureau_rm4_mini' in target_clims %}\n  {% set names = names
        + ['Bureau'] %}\n{% endif %} {% if 'climate.clim_chambre_rm4_mini' in target_clims
        %}\n  {% set names = names + ['Chambre'] %}\n{% endif %} {{ names | join(',
        ') }}\n"
  - if:
    - condition: template
      value_template: '{{ target_clims | length > 0 }}'
    then:
    - target:
        entity_id: '{{ target_clims }}'
      data:
        hvac_mode: '{{ states(''sensor.mode_ete_hiver'') }}'
      action: climate.set_hvac_mode
    - data:
        title: DEBUG CLIM
        message: 'Force -> {{ states(''sensor.mode_ete_hiver'') }} pour : {{ target_clims_names
          }}

          '
      action: notify.mobile_app_poco_x7_pro
- id: '1751912898399'
  alias: (A - 3) (6h00 -> 20h00) [ TEST 2025-08-03 ] Automatisation pour contrôler
    de [06h00 <-> 20h00] les climatiseurs en fonction de la température intérieure/extérieure
    [DELTA] et du type de réseau des portables [WIFI/CELLULAR]. (SAUF) L'état des
    fenêtres [OUVERTE(S)/FERMÉE(S)] qui sont contrôlées 24h sur 24.
  description: Automatisation pour contrôler de [06h00 <-> 20h00] les climatiseurs
    en fonction de la température intérieure/extérieure [DELTA] et du type de réseau
    des portables [WIFI/CELLULAR]. (SAUF) L'état des fenêtres [OUVERTE(S)/FERMÉE(S)]
    qui sont contrôlées 24h sur 24.
  triggers:
  - alias: Changement d'état des fenêtres 'off' -> 'on'
    entity_id:
    - binary_sensor.contact_fenetre_salon_ikea_contact
    - binary_sensor.contact_fenetre_cuisine_ikea_contact
    - binary_sensor.contact_fenetre_bureau_ikea_contact
    - binary_sensor.contact_fenetre_chambre_ikea_contact
    from: 'off'
    to: 'on'
    trigger: state
  - alias: Changement d'état des fenêtres 'on' -> 'off'
    entity_id:
    - binary_sensor.contact_fenetre_salon_ikea_contact
    - binary_sensor.contact_fenetre_cuisine_ikea_contact
    - binary_sensor.contact_fenetre_bureau_ikea_contact
    - binary_sensor.contact_fenetre_chambre_ikea_contact
    from: 'on'
    to: 'off'
    trigger: state
  - alias: Changement de réseau de Mamour 'wifi' -> 'cellular'
    entity_id: sensor.poco_x7_pro_mamour_network_type
    from: wifi
    to: cellular
    trigger: state
  - alias: Changement de réseau de Mamour 'cellular' -> 'wifi'
    entity_id: sensor.poco_x7_pro_mamour_network_type
    from: cellular
    to: wifi
    trigger: state
  - alias: Changement de réseau d'Eric 'wifi' -> 'cellular'
    entity_id: sensor.poco_x7_pro_network_type
    from: wifi
    to: cellular
    trigger: state
  - alias: Changement de réseau d'Eric 'cellular' -> 'wifi'
    entity_id: sensor.poco_x7_pro_network_type
    from: cellular
    to: wifi
    trigger: state
  - alias: Changement d'état des climatiseurs à 'heat'
    trigger: state
    entity_id:
    - climate.clim_salon_rm4_mini
    - climate.clim_bureau_rm4_mini
    - climate.clim_chambre_rm4_mini
    to: heat
  - alias: Changement d'état des climatiseurs à 'cool'
    trigger: state
    entity_id:
    - climate.clim_salon_rm4_mini
    - climate.clim_bureau_rm4_mini
    - climate.clim_chambre_rm4_mini
    to: cool
  - alias: Changement d'état des climatiseurs à 'fan_only'
    trigger: state
    entity_id:
    - climate.clim_salon_rm4_mini
    - climate.clim_bureau_rm4_mini
    - climate.clim_chambre_rm4_mini
    to: fan_only
  - trigger: state
    entity_id:
    - sensor.temperature_cible
  - trigger: time
    at: 06:00:00
  conditions: []
  actions:
  - alias: SI UNE FENÊTRES EST OUVERTES OU TOUTES FERMÉES
    choose:
    - alias: SI UNE OU PLUSIEURS FENÊTRES SONT OUVERTES (condition OR)
      conditions:
      - condition: or
        conditions:
        - condition: state
          entity_id: binary_sensor.contact_fenetre_salon_ikea_contact
          state: 'on'
        - condition: state
          entity_id: binary_sensor.contact_fenetre_cuisine_ikea_contact
          state: 'on'
        - condition: state
          entity_id: binary_sensor.contact_fenetre_bureau_ikea_contact
          state: 'on'
        - condition: state
          entity_id: binary_sensor.contact_fenetre_chambre_ikea_contact
          state: 'on'
      sequence:
      - target:
          entity_id:
          - climate.clim_salon_rm4_mini
          - climate.clim_bureau_rm4_mini
          - climate.clim_chambre_rm4_mini
        data:
          hvac_mode: 'off'
        action: climate.set_hvac_mode
      - action: notify.mobile_app_poco_x7_pro
        data:
          title: Clim. DÉSACTIVÉES
          message: "{% if trigger.entity_id == 'binary_sensor.contact_fenetre_salon_ikea_contact'
            and is_state('binary_sensor.contact_fenetre_salon_ikea_contact', 'on')
            %}\n  La fenêtre du Salon a été ouverte.\n{% elif trigger.entity_id ==
            'binary_sensor.contact_fenetre_cuisine_ikea_contact' and is_state('binary_sensor.contact_fenetre_cuisine_ikea_contact',
            'on') %}\n  La fenêtre de la Cuisine a été ouverte.\n{% elif trigger.entity_id
            == 'binary_sensor.contact_fenetre_bureau_ikea_contact' and is_state('binary_sensor.contact_fenetre_bureau_ikea_contact',
            'on') %}\n  La fenêtre du Bureau a été ouverte.\n{% elif trigger.entity_id
            == 'binary_sensor.contact_fenetre_chambre_ikea_contact' and is_state('binary_sensor.contact_fenetre_chambre_ikea_contact',
            'on') %}\n  La fenêtre de la Chambre a été ouverte.\n{% endif %}\n  {%
            if states('sensor.nbre_de_fenetres_ouvertes') == '4' %}\n    Toutes les
            fenêtres sont ouvertes.\n  {% endif %}\n"
    - alias: SI TOUTES LES FENÊTRES SONT FERMÉES (condition AND)
      conditions:
      - condition: and
        conditions:
        - condition: state
          entity_id: binary_sensor.contact_fenetre_salon_ikea_contact
          state: 'off'
        - condition: state
          entity_id: binary_sensor.contact_fenetre_cuisine_ikea_contact
          state: 'off'
        - condition: state
          entity_id: binary_sensor.contact_fenetre_bureau_ikea_contact
          state: 'off'
        - condition: state
          entity_id: binary_sensor.contact_fenetre_chambre_ikea_contact
          state: 'off'
      sequence:
      - target:
          entity_id:
          - climate.clim_salon_rm4_mini
          - climate.clim_bureau_rm4_mini
          - climate.clim_chambre_rm4_mini
        data:
          hvac_mode: '{{ states(''sensor.mode_ete_hiver'') }}'
        action: climate.set_hvac_mode
      - target:
          entity_id:
          - climate.clim_salon_rm4_mini
          - climate.clim_bureau_rm4_mini
          - climate.clim_chambre_rm4_mini
        data:
          fan_mode: auto
        action: climate.set_fan_mode
  - alias: SI 2 PORTABLES EN CELLULAR
    if:
    - condition: and
      conditions:
      - condition: time
        after: 06:00:00
        before: '20:00:00'
      - condition: state
        entity_id: binary_sensor.contact_fenetre_salon_ikea_contact
        state: 'off'
      - condition: state
        entity_id: binary_sensor.contact_fenetre_cuisine_ikea_contact
        state: 'off'
      - condition: state
        entity_id: binary_sensor.contact_fenetre_bureau_ikea_contact
        state: 'off'
      - condition: state
        entity_id: binary_sensor.contact_fenetre_chambre_ikea_contact
        state: 'off'
      - condition: state
        entity_id: sensor.poco_x7_pro_mamour_network_type
        state: cellular
      - condition: state
        entity_id: sensor.poco_x7_pro_network_type
        state: cellular
    then:
    - target:
        entity_id: climate.clim_salon_rm4_mini
      data:
        temperature: '{{ states(''sensor.temperature_cible'') | float }}'
        hvac_mode: '{{ states(''sensor.mode_ete_hiver'') }}'
      action: climate.set_temperature
    - target:
        entity_id: climate.clim_salon_rm4_mini
      data:
        fan_mode: auto
      action: climate.set_fan_mode
    - target:
        entity_id: climate.clim_bureau_rm4_mini
      data:
        temperature: '{{ states(''sensor.temperature_cible'') | float }}'
        hvac_mode: '{{ states(''sensor.mode_ete_hiver'') }}'
      action: climate.set_temperature
    - target:
        entity_id: climate.clim_bureau_rm4_mini
      data:
        fan_mode: auto
      action: climate.set_fan_mode
    - target:
        entity_id: climate.clim_chambre_rm4_mini
      data:
        temperature: '{{ states(''sensor.temperature_cible'') | float }}'
        hvac_mode: '{{ states(''sensor.mode_ete_hiver'') }}'
      action: climate.set_temperature
    - target:
        entity_id: climate.clim_chambre_rm4_mini
      data:
        fan_mode: auto
      action: climate.set_fan_mode
    - data:
        title: Clim [2] en [CELLULAR]
        message: "{% if trigger.entity_id == 'sensor.poco_x7_pro_mamour_network_type'
          or trigger.entity_id == 'sensor.poco_x7_pro_network_type' %}\n  Les 3 Clim
          {{ states('sensor.temperature_cible') | float }}°\n{% endif %}"
      action: notify.mobile_app_poco_x7_pro
  - alias: SI MAMOUR EN WIFI
    if:
