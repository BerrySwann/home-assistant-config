- id: '1758298361594'
  alias: (D) Notification température Up ou Down de (7h30 -> 21h00)
  description: 'Envoie le message personnalisé de clim si le texte change, OU au réveil
    à 07h30.

    '
  triggers:
  - trigger: state
    entity_id: sensor.th_balcon_nord_temperature
  - trigger: time
    at: 07:30:00
  conditions: []
  actions:
  - condition: time
    after: 07:30:00
    before: '21:00:00'
  - delay: 00:00:02
  - if:
    - condition: template
      value_template: "{{ states('sensor.message_clim_personnalise_7h30_21h00') in
        ['unknown', 'unavailable'] or\n   states('sensor.poco_x7_pro_mamour_wi_fi_connection')
        in ['unknown', 'unavailable'] or\n   states('sensor.poco_x7_pro_wi_fi_connection')
        in ['unknown', 'unavailable'] or\n   states('sensor.th_balcon_nord_temperature')
        in ['unknown', 'unavailable'] }}\n"
    then:
    - action: notify.mobile_app_poco_x7_pro_eric
      data:
        title: '[ANJ] Erreur Capteurs'
        message: 'Un capteur (Température, Wifi ou Message) est indisponible. Vérifiez
          les entités.

          '
    else:
    - action: notify.mobile_app_poco_x7_pro_eric
      data:
        title: '[Automa. Notif. Jrs]'
        message: '{{ states(''sensor.message_clim_personnalise_7h30_21h00'') }}'
  mode: queued
- id: db_purge_mariadb_repack
  alias: DB Purge MariaDB + Repack
  description: Ménage nocturne pour réduire la taille de la base de données
  triggers:
  - at: 00:30:00
    trigger: time
  actions:
  - data:
      keep_days: 7
      repack: true
    action: recorder.purge
  mode: single
- id: '1760088843808'
  alias: (L) (DEBUG) Notifier les changements de message clim (Mobile)
  description: ''
  triggers:
  - entity_id: sensor.message_clim_personnalise_7h30_21h00
    trigger: state
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ ''CELLULAR'' in trigger.to_state.state }}'
      sequence:
      - data:
          message: '[Présence] Personne n''est à la maison (mode CELLULAR/WIFI_?!)'
        action: notify.mobile_app_poco_x7_pro_eric
    - conditions:
      - condition: template
        value_template: '{{ ''MAMOUR'' in trigger.to_state.state }}'
      sequence:
      - data:
          message: '[Présence] Seul Mamour est à la maison (Wi-Fi)'
        action: notify.mobile_app_poco_x7_pro_eric
    - conditions:
      - condition: template
        value_template: '{{ ''ERIC'' in trigger.to_state.state }}'
      sequence:
      - data:
          message: '[Présence] Seul Eric est à la maison (Wi-Fi)'
        action: notify.mobile_app_poco_x7_pro_eric
    - conditions:
      - condition: template
        value_template: '{{ ''Clim [2] en [WIFI]'' in trigger.to_state.state }}'
      sequence:
      - data:
          message: '[Présence] Mamour et Eric sont à la maison (Wi-Fi)'
        action: notify.mobile_app_poco_x7_pro_eric
    - conditions:
      - condition: template
        value_template: '{{ ''Up >>>'' in trigger.to_state.state }}'
      sequence:
      - variables:
          temp_ext: '{{ trigger.to_state.state.split(''|'')[1].split(''Up >>>'')[1].split(''°'')[0].strip()
            }}'
      - data:
          message: '[Tendance] Température extérieure en hausse : {{ temp_ext }}°'
        action: notify.mobile_app_poco_x7_pro_eric
    - conditions:
      - condition: template
        value_template: '{{ ''Down <<<'' in trigger.to_state.state }}'
      sequence:
      - variables:
          temp_ext: '{{ trigger.to_state.state.split(''|'')[1].split(''Down <<<'')[1].split(''°'')[0].strip()
            }}'
      - data:
          message: '[Tendance] Température extérieure en baisse : {{ temp_ext }}°'
        action: notify.mobile_app_poco_x7_pro_eric
    - conditions:
      - condition: template
        value_template: '{{ ''stable'' in trigger.to_state.state }}'
      sequence:
      - variables:
          temp_ext: '{{ trigger.to_state.state.split(''|'')[1].split(''°'')[0].split(''stable
            '')[1].strip() }}'
      - data:
          message: '[Tendance] Température extérieure stable : {{ temp_ext }}°'
        action: notify.mobile_app_poco_x7_pro_eric
    - conditions:
      - condition: template
        value_template: '{{ ''Heat'' in trigger.to_state.state }}'
      sequence:
      - variables:
          message_part: '{{ trigger.to_state.state.split(''|'')[2] }}'
      - data:
          message: '[Mode] Chauffage activé : {{ message_part }}'
        action: notify.mobile_app_poco_x7_pro_eric
    - conditions:
      - condition: template
        value_template: '{{ ''Cool'' in trigger.to_state.state }}'
      sequence:
      - variables:
          message_part: '{{ trigger.to_state.state.split(''|'')[2] }}'
      - data:
          message: '[Mode] Rafraîchissement activé : {{ message_part }}'
        action: notify.mobile_app_poco_x7_pro_eric
    - conditions:
      - condition: template
        value_template: '{{ ''Fan'' in trigger.to_state.state }}'
      sequence:
      - data:
          message: '[Mode] Ventilation activée'
        action: notify.mobile_app_poco_x7_pro_eric
- id: '1760723744000'
  alias: (J) Synchro & Notif Clim si Prise Coupée
  description: Met à jour l'état du thermostat et notifie proprement si la prise est
    coupée.
  triggers:
  - trigger: state
    entity_id:
    - switch.clim_salon_nous
    - switch.clim_bureau_nous
    - switch.clim_chambre_nous
    from: 'on'
    to: 'off'
  actions:
  - action: climate.set_hvac_mode
    data:
      hvac_mode: 'off'
    target:
      entity_id: "{% if trigger.entity_id == 'switch.clim_salon_nous' %}\n  climate.clim_salon_rm4_mini\n{%
        elif trigger.entity_id == 'switch.clim_bureau_nous' %}\n  climate.clim_bureau_rm4_mini\n{%
        elif trigger.entity_id == 'switch.clim_chambre_nous' %}\n  climate.clim_chambre_rm4_mini\n{%
        endif %}\n"
  - if:
    - condition: time
      after: 07:30:00
      before: '21:00:00'
    then:
    - action: notify.mobile_app_poco_x7_pro_eric
      data:
        title: CLIM COUPÉE
        message: "{% set piece = 'inconnue' %} \n{% if 'salon' in trigger.entity_id
          %}\n  {% set piece = 'du Salon' %}\n{% elif 'bureau' in trigger.entity_id
          %}\n  {% set piece = 'du Bureau' %}\n{% elif 'chambre' in trigger.entity_id
          %}\n  {% set piece = 'de la Chambre' %}\n{% endif %} \nLa prise extérieure
          {{ piece }} vient d'être éteinte.\n"
  mode: parallel
- id: '1761235548897'
  alias: Gestion Optimisée du Store Bureau
  description: 'Priorité Sommeil et Anti-Reflet. Sécurité : Bloque tout mouvement
    si la fenêtre est ouverte.'
  triggers:
  - id: reveil
    trigger: time
    at: 07:00:00
  - trigger: state
    entity_id: sensor.th_balcon_nord_temperature
  - trigger: sun
    event: sunset
  - id: fenetre
    trigger: state
    entity_id: binary_sensor.contact_fenetre_bureau_sonoff_contact
    to: 'off'
  conditions:
  - alias: Si la fenêtre est ouverte, on ne touche à rien
    condition: state
    entity_id: binary_sensor.contact_fenetre_bureau_sonoff_contact
    state: 'off'
  actions:
  - choose:
    - alias: 'SCÉNARIO A : Ouverture Travail'
      conditions:
      - condition: time
        after: 07:00:00
      - condition: sun
        before: sunset
      - condition: numeric_state
        entity_id: sensor.th_balcon_nord_temperature
        above: 18
        below: 25
      - condition: numeric_state
        entity_id: cover.store_bureau
        attribute: current_position
        below: 1
      sequence:
      - action: cover.open_cover
        target:
          entity_id: cover.store_bureau
    - alias: 'SCÉNARIO B : Fermeture Chaleur'
      conditions:
      - condition: numeric_state
        entity_id: sensor.th_balcon_nord_temperature
        above: 25
      - condition: sun
        before: sunset
      sequence:
      - action: cover.close_cover
        target:
          entity_id: cover.store_bureau
    - alias: 'SCÉNARIO C : Fermeture Nuit'
      conditions:
      - condition: sun
        after: sunset
      sequence:
      - action: cover.close_cover
        target:
          entity_id: cover.store_bureau
  mode: single
- id: '1761236981200'
  alias: Gestion Optimisée du Store Salon
  description: 'SÉCURITÉ BALCON : Bloque tout mouvement si la fenêtre est ouverte.'
  triggers:
  - id: re-evaluation
    trigger: state
    entity_id:
    - sensor.th_balcon_nord_temperature
    - sensor.groupe_clim
  - id: fenetre
    trigger: state
    entity_id: binary_sensor.contact_fenetre_salon_sonoff_contact
  - id: matin
    trigger: sun
    event: sunrise
  - id: soir
    trigger: sun
    event: sunset
  conditions:
  - alias: Si la fenêtre est ouverte, on ne touche à rien (Personne sur le balcon)
    condition: state
    entity_id: binary_sensor.contact_fenetre_salon_sonoff_contact
    state: 'off'
  actions:
  - choose:
    - alias: 'SCÉNARIO A : Ouverture'
      conditions:
      - condition: sun
        after: sunrise
        before: sunset
      - condition: numeric_state
        entity_id: sensor.th_balcon_nord_temperature
        above: 17
        below: 34
      - condition: not
        conditions:
        - condition: state
          entity_id: sensor.groupe_clim
          state: groupe_1
      - condition: numeric_state
        entity_id: cover.store_salon
        attribute: current_position
        below: 1
      sequence:
      - action: cover.open_cover
        target:
          entity_id: cover.store_salon
    - alias: 'SCÉNARIO B : Canicule (T > 34°C)'
      conditions:
      - condition: numeric_state
        entity_id: sensor.th_balcon_nord_temperature
        above: 34
      - condition: sun
        after: sunrise
        before: sunset
      sequence:
      - choose:
        - alias: 'G1 ou G3 : Fermeture Totale'
          conditions:
          - condition: state
            entity_id: sensor.groupe_clim
            state:
            - groupe_1
            - groupe_3
          sequence:
          - action: cover.close_cover
            target:
              entity_id: cover.store_salon
        - alias: 'G2 ou G4 : Position 50%'
          conditions:
          - condition: state
            entity_id: sensor.groupe_clim
            state:
            - groupe_2
            - groupe_4
          sequence:
          - action: cover.set_cover_position
            target:
              entity_id: cover.store_salon
            data:
              position: 50
    - alias: 'SCÉNARIO C : Fermeture Nuit'
      conditions:
      - condition: sun
        after: sunset
      sequence:
      - action: cover.close_cover
        target:
          entity_id: cover.store_salon
    - alias: 'SCÉNARIO D : Froid (T < 17°C + Absence)'
      conditions:
      - condition: numeric_state
        entity_id: sensor.th_balcon_nord_temperature
        below: 17
      - condition: state
        entity_id: sensor.groupe_clim
        state: groupe_1
      - condition: sun
        after: sunrise
        before: sunset
      sequence:
      - action: cover.close_cover
        target:
          entity_id: cover.store_salon
  mode: single
- id: '1763661737799'
  alias: A - Démarrage Radiateur Salle de Bain
  description: 'Allumage sécurisé : adapte la puissance ou refuse si > 24°C'
  triggers:
  - trigger: state
    entity_id: input_boolean.inter_radiateur_salle_de_bain
    to: 'on'
  conditions:
  - condition: numeric_state
    entity_id: sensor.th_salle_de_bain_temperature
    below: 24
  actions:
  - action: switch.turn_on
    target:
      entity_id: switch.prise_radiateur_salle_de_bain_nous
  - delay: '00:00:01.0'
  - action: remote.send_command
    target:
      entity_id: remote.radiateur_sdb_rm4_mini
    data:
      command: on_off
      device: radiateur_sdb
      num_repeats: 1
  - delay: '00:00:00.6'
  - choose:
    - conditions:
      - condition: numeric_state
        entity_id: sensor.th_salle_de_bain_temperature
        above: 21.9
      sequence:
      - action: remote.send_command
        target:
          entity_id: remote.radiateur_sdb_rm4_mini
        data:
          command: 1000w
          device: radiateur_sdb
          num_repeats: 1
    - conditions:
      - condition: numeric_state
        entity_id: sensor.th_salle_de_bain_temperature
        below: 22
      sequence:
      - action: remote.send_command
        target:
          entity_id: remote.radiateur_sdb_rm4_mini
        data:
          command: 1000w
          device: radiateur_sdb
          num_repeats: 2
  - delay: '00:00:00.6'
  - action: climate.set_hvac_mode
    data:
      hvac_mode: heat
    target:
      entity_id: climate.soufflant_salle_de_bain
- id: '1763755093414'
  alias: Bouton IKEA RODRET - Gestion ON/OFF (JSON)
  description: ''
  triggers:
  - topic: zigbee2mqtt/Inter Radiateur Salle de Bain (IKEA RODRET)
    trigger: mqtt
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.payload_json.action == ''on'' }}'
      sequence:
      - target:
          entity_id: input_boolean.inter_radiateur_salle_de_bain
        action: input_boolean.turn_on
    - conditions:
      - condition: template
        value_template: '{{ trigger.payload_json.action == ''off'' }}'
      sequence:
      - target:
          entity_id: input_boolean.inter_radiateur_salle_de_bain
        action: input_boolean.turn_off
- id: '1763755874751'
  alias: B - Gestion Résistances Radiateur SDB
  description: Baisse à 1000W au-delà de 22.9°C et repasse à 2000W sous 20.9°C
  triggers:
  - trigger: numeric_state
    entity_id: sensor.th_salle_de_bain_temperature
    above: 22.9
    for:
      minutes: 1
    id: temp_23
  - trigger: numeric_state
    entity_id: sensor.th_salle_de_bain_temperature
    below: 20.9
    for:
      minutes: 1
    id: temp_21
  conditions:
  - condition: state
    entity_id: input_boolean.inter_radiateur_salle_de_bain
    state: 'on'
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: temp_23
      sequence:
      - action: remote.send_command
        target:
          entity_id: remote.radiateur_sdb_rm4_mini
        data:
          command: 1000w
          device: radiateur_sdb
          num_repeats: 1
    - conditions:
      - condition: trigger
        id: temp_21
      sequence:
      - action: remote.send_command
        target:
          entity_id: remote.radiateur_sdb_rm4_mini
        data:
          command: 1000w
          device: radiateur_sdb
          num_repeats: 2
      - delay: '00:00:00.4'
      - action: remote.send_command
        target:
          entity_id: remote.radiateur_sdb_rm4_mini
        data:
          command: swing
          device: radiateur_sdb
          num_repeats: 1
  mode: single
- id: '1763827578680'
  alias: A - Chauffage Cuisine (entre 4h45 & 7h LMMJ ou 5:45h & 8h VSD avec T° 19,9°
    <-> 20.5°)
  description: Allume ou éteint le chauffage selon la température (19,9° <-> 20.5°)
    aux conditions (entre 4h45 et 7h LMMJ & 5h45 et 8h00 VSD / 19,9° <-> 20.5°) et
    si Eric OU Mamour at HOME
  triggers:
  - at: 04:45:00
    trigger: time
  - at: 05:45:00
    trigger: time
  - at: 07:00:00
    trigger: time
  - at: 08:00:00
    trigger: time
  - entity_id: sensor.th_cuisine_temperature
    below: 19.9
    trigger: numeric_state
  - entity_id: sensor.th_cuisine_temperature
    above: 20.5
    trigger: numeric_state
  conditions:
  - condition: and
    conditions:
    - condition: or
      conditions:
      - condition: zone
        entity_id: person.eric
        zone: zone.home
      - condition: zone
        entity_id: person.mamour
        zone: zone.home
    - condition: or
      conditions:
      - condition: and
        conditions:
        - condition: time
          after: 04:45:00
          before: 07:00:01
          weekday:
          - mon
          - tue
          - wed
          - thu
      - condition: and
        conditions:
        - condition: time
          after: 05:45:00
          before: 08:00:01
          weekday:
          - fri
          - sat
          - sun
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ now().hour == 7 and now().minute == 0 and now().second
          == 0 }}

          '
      - condition: time
        weekday:
        - mon
        - tue
        - wed
        - thu
      sequence:
      - type: turn_off
        device_id: 2fbb8bc530fc3e526a8cf5e808de76a2
        entity_id: 66a2c8ea314f57c47f4accdc5d611779
        domain: switch
      - data:
          message: /!\ RADIATEUR est "OFF" FORCE /!\
        action: notify.mobile_app_poco_x7_pro_eric
      - action: notify.mobile_app_poco_x7_pro_eric
        data:
          message: /!\ RADIATEUR est "OFF" FORCE /!\
    - conditions:
      - condition: template
        value_template: '{{ now().hour == 8 and now().minute == 0 and now().second
          == 0 }}

          '
      - condition: time
        weekday:
        - fri
        - sat
        - sun
      sequence:
      - type: turn_off
        device_id: 2fbb8bc530fc3e526a8cf5e808de76a2
        entity_id: 66a2c8ea314f57c47f4accdc5d611779
        domain: switch
      - data:
          message: /!\ RADIATEUR est "OFF" FORCE /!\
        action: notify.mobile_app_poco_x7_pro_eric
      - action: notify.mobile_app_poco_x7_pro_eric
        data:
          message: /!\ RADIATEUR est "OFF" FORCE /!\
    - conditions:
      - condition: numeric_state
        entity_id: sensor.th_cuisine_temperature
        below: 19.9
      sequence:
      - data:
          hvac_mode: heat
        action: climate.set_hvac_mode
        target:
          entity_id: climate.radiateur_cuisine
      - data:
          message: /!\ RADIATEUR est "ON" /!\
        action: notify.mobile_app_poco_x7_pro_eric
      - action: notify.mobile_app_poco_x7_pro_eric
        data:
          message: /!\ RADIATEUR est "ON" /!\
    - conditions:
      - condition: numeric_state
        entity_id: sensor.th_cuisine_temperature
        above: 20.5
      sequence:
      - data:
          hvac_mode: 'off'
        action: climate.set_hvac_mode
        target:
          entity_id: climate.radiateur_cuisine
      - data:
          message: /!\ RADIATEUR est "OFF" /!\
        action: notify.mobile_app_poco_x7_pro_eric
      - action: notify.mobile_app_poco_x7_pro_eric
        data:
          message: /!\ RADIATEUR est "OFF" /!\
  mode: single
