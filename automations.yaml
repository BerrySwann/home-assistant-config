- id: '1723884947865'
  alias: Raspberry CPU Fan PWM 6 States
  description: Règle la vitesse du ventilateur du Raspberry en fonction de la température
    du CPU
  triggers:
  - event: start
    id: HomeAssistant_Start
    trigger: homeassistant
  - entity_id: sensor.system_monitor_temperature_du_processeur
    above: 30
    id: above_30
    trigger: numeric_state
  - entity_id: sensor.system_monitor_temperature_du_processeur
    above: 40
    id: above_40
    trigger: numeric_state
  - entity_id: sensor.system_monitor_temperature_du_processeur
    above: 50
    id: above_50
    trigger: numeric_state
  - entity_id: sensor.system_monitor_temperature_du_processeur
    above: 60
    id: above_60
    trigger: numeric_state
  - entity_id: sensor.system_monitor_temperature_du_processeur
    above: 70
    id: above_70
    trigger: numeric_state
  - entity_id: sensor.system_monitor_temperature_du_processeur
    below: 30
    id: below_30
    trigger: numeric_state
  - entity_id: sensor.system_monitor_temperature_du_processeur
    below: 40
    id: below_40
    trigger: numeric_state
  - entity_id: sensor.system_monitor_temperature_du_processeur
    below: 50
    id: below_50
    trigger: numeric_state
  - entity_id: sensor.system_monitor_temperature_du_processeur
    below: 60
    id: below_60
    trigger: numeric_state
  - entity_id: sensor.system_monitor_temperature_du_processeur
    below: 70
    id: below_70
    trigger: numeric_state
  conditions: []
  actions:
  - alias: Régler la vitesse du ventilateur de l'unité centrale au démarrage
    if:
    - condition: trigger
      id: HomeAssistant_Start
    then:
    - data:
        percentage: 100
      target:
        entity_id: fan.rpi_cooling_fan
      action: fan.turn_on
  - alias: Régler la vitesse du ventilateur en fonction de la température
    if:
    - condition: numeric_state
      entity_id: sensor.system_monitor_temperature_du_processeur
      below: 30
    then:
    - data:
        percentage: 30
      target:
        entity_id: fan.rpi_cooling_fan
      action: fan.set_percentage
    else:
    - if:
      - condition: numeric_state
        entity_id: sensor.system_monitor_temperature_du_processeur
        below: 40
      then:
      - data:
          percentage: 40
        target:
          entity_id: fan.rpi_cooling_fan
        action: fan.set_percentage
      else:
      - if:
        - condition: numeric_state
          entity_id: sensor.system_monitor_temperature_du_processeur
          below: 50
        then:
        - data:
            percentage: 50
          target:
            entity_id: fan.rpi_cooling_fan
          action: fan.set_percentage
        else:
        - if:
          - condition: numeric_state
            entity_id: sensor.system_monitor_temperature_du_processeur
            below: 60
          then:
          - data:
              percentage: 65
            target:
              entity_id: fan.rpi_cooling_fan
            action: fan.set_percentage
          else:
          - if:
            - condition: numeric_state
              entity_id: sensor.system_monitor_temperature_du_processeur
              below: 70
            then:
            - data:
                percentage: 85
              target:
                entity_id: fan.rpi_cooling_fan
              action: fan.set_percentage
            else:
            - data:
                percentage: 100
              target:
                entity_id: fan.rpi_cooling_fan
              action: fan.set_percentage
  mode: single
- id: '1724004593132'
  alias: Notification de la foudre
  description: ''
  triggers:
  - entity_id:
    - sensor.blitzortung_lightning_counter
    trigger: state
  conditions:
  - condition: numeric_state
    entity_id: sensor.blitzortung_lightning_counter
    above: 0
  actions:
  - target:
      entity_id: sensor.blitzortung_lightning_localisation
    action: homeassistant.update_entity
    data: {}
  - action: notify.mobile_app_poco_x7_pro
    metadata: {}
    data:
      title: /!\ Attention foudre /!\
      message: '{% set distance = states(''sensor.blitzortung_lightning_distance'')
        | float %} {% set localisation = states(''sensor.blitzortung_lightning_localisation'')
        %} {% set azimuth = states(''sensor.blitzortung_lightning_azimuth'') | float
        %} {% set impactCount = states(''sensor.blitzortung_lightning_counter'') |
        int %} {% set timeSinceLastLightning = states(''input_text.dernier_impact_de_foudre_temps_ecoule'')
        %} {% set city = None %} {% if localisation and localisation != ''0'' %}   {%
        set location = state_attr(''sensor.blitzortung_lightning_localisation'', ''features'')
        %}   {% if location and location[0] and location[0].properties and location[0].properties.geocoding
        and location[0].properties.geocoding.city %}     {% set city = location[0].properties.geocoding.city
        %}   {% endif %} {% endif %} {% if distance > 0 %}   {% if city %}     {%
        set message = ''Un éclair a été détecté à '' ~ distance ~ '' Km de la maison
        à '' ~ city ~ ''.'' %}   {% elif azimuth is not none %}     {% if 348.75 <=
        azimuth or azimuth < 11.25 %}       {% set message = ''Un éclair a été détecté
        à '' ~ distance ~ '' Km de la maison au nord.'' %}     {% elif 11.25 <= azimuth
        < 33.75 %}       {% set message = ''Un éclair a été détecté à '' ~ distance
        ~ '' Km de la maison au nord-nord-est.'' %}     {% elif 33.75 <= azimuth <
        56.25 %}       {% set message = ''Un éclair a été détecté à '' ~ distance
        ~ '' Km de la maison au nord-est.'' %}     {% elif 56.25 <= azimuth < 78.75
        %}       {% set message = ''Un éclair a été détecté à '' ~ distance ~ " Km
        de la maison à l''est-nord-est." %}     {% elif 78.75 <= azimuth < 101.25
        %}       {% set message = ''Un éclair a été détecté à '' ~ distance ~ " Km
        de la maison à l''est." %}     {% elif 101.25 <= azimuth < 123.75 %}       {%
        set message = ''Un éclair a été détecté à '' ~ distance ~ " Km de la maison
        à l''est-sud-est." %}     {% elif 123.75 <= azimuth < 146.25 %}       {% set
        message = ''Un éclair a été détecté à '' ~ distance ~ '' Km de la maison au
        sud-est.'' %}     {% elif 146.25 <= azimuth < 168.75 %}       {% set message
        = ''Un éclair a été détecté à '' ~ distance ~ '' Km de la maison au sud-sud-est.''
        %}     {% elif 168.75 <= azimuth < 191.25 %}       {% set message = ''Un éclair
        a été détecté à '' ~ distance ~ '' Km de la maison au sud.'' %}     {% elif
        191.25 <= azimuth < 213.75 %}       {% set message = ''Un éclair a été détecté
        à '' ~ distance ~ '' Km de la maison au sud-sud-ouest.'' %}     {% elif 213.75
        <= azimuth < 236.25 %}       {% set message = ''Un éclair a été détecté à
        '' ~ distance ~ '' Km de la maison au sud-ouest.'' %}     {% elif 236.25 <=
        azimuth < 258.75 %}       {% set message = ''Un éclair a été détecté à ''
        ~ distance ~ " Km de la maison à l''ouest-sud-ouest." %}     {% elif 258.75
        <= azimuth < 281.25 %}       {% set message = ''Un éclair a été détecté à
        '' ~ distance ~ " Km de la maison à l''\ouest." %}     {% elif 281.25 <= azimuth
        < 303.75 %}       {% set message = ''Un éclair a été détecté à '' ~ distance
        ~ " Km de la maison à l''ouest-nord-ouest." %}     {% elif 303.75 <= azimuth
        < 326.25 %}       {% set message = ''Un éclair a été détecté à '' ~ distance
        ~ '' Km de la maison au nord-ouest.'' %}     {% elif 326.25 <= azimuth < 348.75
        %}       {% set message = ''Un éclair a été détecté à '' ~ distance ~ '' Km
        de la maison au nord-nord-ouest.'' %}     {% endif %}   {% else %}     {%
        set message = ''Un éclair a été détecté à '' ~ distance ~ '' Km de la maison.''
        %}   {% endif %} {% else %}   {% set message = ''Pas d\''impact de foudre
        détecté.'' %} {% endif %} {{ message }}<br>{{ timeSinceLastLightning }}. {%
        if impactCount > 0 %}   <strong>{{ impactCount }}</strong> impact(s) détecté(s)
        {% endif %}'
  - delay:
      hours: 0
      minutes: 1
      seconds: 0
      milliseconds: 0
  mode: single
- id: '1724604435795'
  alias: Alerte Météo France actualisation des "CARTES"
  description: ''
  triggers:
  - event: start
    id: Start
    trigger: homeassistant
  - at: 06:32:00
    id: Heure632
    trigger: time
  - at: '16:32:00'
    id: Heure1632
    trigger: time
  - minutes: /5
    id: Toutesles5minutes
    trigger: time_pattern
  conditions:
  - condition: or
    conditions:
    - condition: trigger
      id:
      - Start
    - condition: trigger
      id:
      - Heure632
    - condition: trigger
      id:
      - Heure1632
    - condition: and
      conditions:
      - condition: trigger
        id:
        - Toutesles5minutes
      - condition: state
        entity_id: sensor.meteo_france_alertes_image_today
        state: unavailable
      alias: 5minutesETtoday
    - condition: and
      conditions:
      - condition: trigger
        id:
        - Toutesles5minutes
      - condition: state
        entity_id: sensor.meteo_france_alertes_image_tomorrow
        state: unavailable
      alias: 5minutesETtomorrow
  actions:
  - data: {}
    target:
      entity_id: sensor.meteo_france_alertes_image_today
    action: homeassistant.update_entity
  - data: {}
    target:
      entity_id:
      - sensor.meteo_france_alertes_image_tomorrow
    action: homeassistant.update_entity
  - delay:
      hours: 0
      minutes: 0
      seconds: 5
      milliseconds: 0
  - alias: Répéter MAJ Today
    repeat:
      count: 1
      sequence:
      - if:
        - condition: state
          entity_id: sensor.meteo_france_alertes_image_today
          state: unavailable
        then:
        - target:
            entity_id: sensor.meteo_france_alertes_image_today
          data: {}
          action: homeassistant.update_entity
        - delay:
            hours: 0
            minutes: 0
            seconds: 5
            milliseconds: 0
  - alias: Répéter MAJ Tomorrow
    repeat:
      count: 1
      sequence:
      - if:
        - condition: state
          entity_id: sensor.meteo_france_alertes_image_tomorrow
          state: unavailable
        then:
        - data: {}
          target:
            entity_id: sensor.meteo_france_alertes_image_tomorrow
          action: homeassistant.update_entity
        - delay:
            hours: 0
            minutes: 0
            seconds: 5
            milliseconds: 0
  - data: {}
    target:
      entity_id:
      - camera.mf_alerte_today
      - camera.mf_alerte_tomorrow
    action: homeassistant.update_entity
  mode: single
