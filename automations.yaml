- id: '1754491576463'
  alias: (I) [CLIM 'off' en demi-saison si delta T̄i < -1 et T°Ext > 15]
  description: 'Éteint toutes les climatisations si le delta (intérieur - extérieur)
    est < -1°C pendant 10 minutes, que la température extérieure est > 15°C, et que
    les 3 prises extérieures sont ON. Gère la répartition équilibrée des modes (cool/heat)
    et la consommation électrique. Et entre 8h et 17h.

    '
  triggers:
  - entity_id: sensor.temperature_delta_valeur
    below: -1
    for: 00:10:00
    trigger: numeric_state
  - trigger: state
    entity_id:
    - sensor.th_balcon_nord_temperature
  conditions:
  - condition: and
    conditions:
    - condition: time
      after: 06:00:00
      before: '20:00:00'
      weekday:
      - mon
      - tue
      - wed
      - thu
      - fri
      - sat
      - sun
    - condition: template
      value_template: '{{ states(''sensor.th_balcon_nord_temperature'') | float >
        states(''sensor.temperature_hors_gel_hiver'') | float }}'
    - condition: state
      entity_id: switch.clim_salon_nous
      state: 'on'
    - condition: state
      entity_id: switch.clim_du_bureau_nous
      state: 'on'
    - condition: state
      entity_id: switch.clim_chambre_nous
      state: 'on'
    - condition: template
      value_template: '{{ states(''climate.clim_salon_rm4_mini'') != ''off''}}'
    - condition: template
      value_template: '{{ states(''climate.clim_bureau_rm4_mini'') != ''off''}}'
    - condition: template
      value_template: '{{ states(''climate.clim_chambre_rm4_mini'') != ''off''}} '
  actions:
  - data:
      hvac_mode: 'off'
    target:
      entity_id:
      - climate.clim_salon_rm4_mini
      - climate.clim_bureau_rm4_mini
      - climate.clim_chambre_rm4_mini
    action: climate.set_hvac_mode
  - data:
      title: Delta T° < -1°C
      message: Les clim ont été éteinte. ({{ states('sensor.temperature_delta_valeur')
        }}°C)
    action: notify.mobile_app_poco_x7_pro
  mode: queued
