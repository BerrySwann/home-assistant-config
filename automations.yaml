- id: '1724004593132'
  alias: Notification de la foudre
  description: ''
  triggers:
  - entity_id:
    - sensor.blitzortung_lightning_counter
    trigger: state
  conditions:
  - condition: numeric_state
    entity_id: sensor.blitzortung_lightning_counter
    above: 0
  actions:
  - target:
      entity_id: sensor.blitzortung_lightning_localisation
    action: homeassistant.update_entity
    data: {}
  - action: notify.mobile_app_poco_x7_pro_eric
    metadata: {}
    data:
      title: /!\ Attention foudre /!\
      message: '{% set distance = states(''sensor.blitzortung_lightning_distance'')
        | float %} {% set localisation = states(''sensor.blitzortung_lightning_localisation'')
        %} {% set azimuth = states(''sensor.blitzortung_lightning_azimuth'') | float
        %} {% set impactCount = states(''sensor.blitzortung_lightning_counter'') |
        int %} {% set timeSinceLastLightning = states(''input_text.dernier_impact_de_foudre_temps_ecoule'')
        %} {% set city = None %} {% if localisation and localisation != ''0'' %}   {%
        set location = state_attr(''sensor.blitzortung_lightning_localisation'', ''features'')
        %}   {% if location and location[0] and location[0].properties and location[0].properties.geocoding
        and location[0].properties.geocoding.city %}     {% set city = location[0].properties.geocoding.city
        %}   {% endif %} {% endif %} {% if distance > 0 %}   {% if city %}     {%
        set message = ''Un éclair a été détecté à '' ~ distance ~ '' Km de la maison
        à '' ~ city ~ ''.'' %}   {% elif azimuth is not none %}     {% if 348.75 <=
        azimuth or azimuth < 11.25 %}       {% set message = ''Un éclair a été détecté
        à '' ~ distance ~ '' Km de la maison au nord.'' %}     {% elif 11.25 <= azimuth
        < 33.75 %}       {% set message = ''Un éclair a été détecté à '' ~ distance
        ~ '' Km de la maison au nord-nord-est.'' %}     {% elif 33.75 <= azimuth <
        56.25 %}       {% set message = ''Un éclair a été détecté à '' ~ distance
        ~ '' Km de la maison au nord-est.'' %}     {% elif 56.25 <= azimuth < 78.75
        %}       {% set message = ''Un éclair a été détecté à '' ~ distance ~ " Km
        de la maison à l''est-nord-est." %}     {% elif 78.75 <= azimuth < 101.25
        %}       {% set message = ''Un éclair a été détecté à '' ~ distance ~ " Km
        de la maison à l''est." %}     {% elif 101.25 <= azimuth < 123.75 %}       {%
        set message = ''Un éclair a été détecté à '' ~ distance ~ " Km de la maison
        à l''est-sud-est." %}     {% elif 123.75 <= azimuth < 146.25 %}       {% set
        message = ''Un éclair a été détecté à '' ~ distance ~ '' Km de la maison au
        sud-est.'' %}     {% elif 146.25 <= azimuth < 168.75 %}       {% set message
        = ''Un éclair a été détecté à '' ~ distance ~ '' Km de la maison au sud-sud-est.''
        %}     {% elif 168.75 <= azimuth < 191.25 %}       {% set message = ''Un éclair
        a été détecté à '' ~ distance ~ '' Km de la maison au sud.'' %}     {% elif
        191.25 <= azimuth < 213.75 %}       {% set message = ''Un éclair a été détecté
        à '' ~ distance ~ '' Km de la maison au sud-sud-ouest.'' %}     {% elif 213.75
        <= azimuth < 236.25 %}       {% set message = ''Un éclair a été détecté à
        '' ~ distance ~ '' Km de la maison au sud-ouest.'' %}     {% elif 236.25 <=
        azimuth < 258.75 %}       {% set message = ''Un éclair a été détecté à ''
        ~ distance ~ " Km de la maison à l''ouest-sud-ouest." %}     {% elif 258.75
        <= azimuth < 281.25 %}       {% set message = ''Un éclair a été détecté à
        '' ~ distance ~ " Km de la maison à l''\ouest." %}     {% elif 281.25 <= azimuth
        < 303.75 %}       {% set message = ''Un éclair a été détecté à '' ~ distance
        ~ " Km de la maison à l''ouest-nord-ouest." %}     {% elif 303.75 <= azimuth
        < 326.25 %}       {% set message = ''Un éclair a été détecté à '' ~ distance
        ~ '' Km de la maison au nord-ouest.'' %}     {% elif 326.25 <= azimuth < 348.75
        %}       {% set message = ''Un éclair a été détecté à '' ~ distance ~ '' Km
        de la maison au nord-nord-ouest.'' %}     {% endif %}   {% else %}     {%
        set message = ''Un éclair a été détecté à '' ~ distance ~ '' Km de la maison.''
        %}   {% endif %} {% else %}   {% set message = ''Pas d\''impact de foudre
        détecté.'' %} {% endif %} {{ message }}<br>{{ timeSinceLastLightning }}. {%
        if impactCount > 0 %}   <strong>{{ impactCount }}</strong> impact(s) détecté(s)
        {% endif %}'
  - delay:
      hours: 0
      minutes: 1
      seconds: 0
      milliseconds: 0
  mode: single
- id: '1724604435795'
  alias: Alerte Météo France actualisation des "CARTES"
  description: ''
  triggers:
  - event: start
    id: Start
    trigger: homeassistant
  - at: 06:32:00
    id: Heure632
    trigger: time
  - at: '16:32:00'
    id: Heure1632
    trigger: time
  - minutes: /5
    id: Toutesles5minutes
    trigger: time_pattern
  conditions:
  - condition: or
    conditions:
    - condition: trigger
      id:
      - Start
    - condition: trigger
      id:
      - Heure632
    - condition: trigger
      id:
      - Heure1632
    - condition: and
      conditions:
      - condition: trigger
        id:
        - Toutesles5minutes
      - condition: state
        entity_id: sensor.meteo_france_alertes_image_today
        state: unavailable
      alias: 5minutesETtoday
    - condition: and
      conditions:
      - condition: trigger
        id:
        - Toutesles5minutes
      - condition: state
        entity_id: sensor.meteo_france_alertes_image_tomorrow
        state: unavailable
      alias: 5minutesETtomorrow
  actions:
  - data: {}
    target:
      entity_id: sensor.meteo_france_alertes_image_today
    action: homeassistant.update_entity
  - data: {}
    target:
      entity_id:
      - sensor.meteo_france_alertes_image_tomorrow
    action: homeassistant.update_entity
  - delay:
      hours: 0
      minutes: 0
      seconds: 5
      milliseconds: 0
  - alias: Répéter MAJ Today
    repeat:
      count: 1
      sequence:
      - if:
        - condition: state
          entity_id: sensor.meteo_france_alertes_image_today
          state: unavailable
        then:
        - target:
            entity_id: sensor.meteo_france_alertes_image_today
          data: {}
          action: homeassistant.update_entity
        - delay:
            hours: 0
            minutes: 0
            seconds: 5
            milliseconds: 0
  - alias: Répéter MAJ Tomorrow
    repeat:
      count: 1
      sequence:
      - if:
        - condition: state
          entity_id: sensor.meteo_france_alertes_image_tomorrow
          state: unavailable
        then:
        - data: {}
          target:
            entity_id: sensor.meteo_france_alertes_image_tomorrow
          action: homeassistant.update_entity
        - delay:
            hours: 0
            minutes: 0
            seconds: 5
            milliseconds: 0
  - data: {}
    target:
      entity_id:
      - camera.mf_alerte_today
      - camera.mf_alerte_tomorrow
    action: homeassistant.update_entity
  mode: single
- id: '1736451378096'
  alias: B - Chauffage Cuisine Vacances
  description: 'Allume ou éteint le chauffage selon la température entre 6h00 et 8h30
    la semaine '
  triggers:
  - at: 06:00:00
    trigger: time
  - entity_id:
    - sensor.th_cuisine_temperature
    below: 19.9
    trigger: numeric_state
  - entity_id:
    - sensor.th_cuisine_temperature
    above: 20.5
    trigger: numeric_state
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: zone
        entity_id: person.eric
        zone: zone.home
      - condition: time
        after: 06:00:00
        before: 08:30:00
        weekday:
        - mon
        - tue
        - wed
        - thu
        - fri
        - sat
        - sun
      - condition: numeric_state
        entity_id: sensor.th_cuisine_temperature
        below: 19.9
      sequence:
      - action: climate.set_hvac_mode
        metadata: {}
        data:
          hvac_mode: heat
        target:
          entity_id: climate.radiateur_cuisine
      - action: notify.alexa_media_echo_dot_cuisine
        metadata: {}
        data:
          message: Le chauffage de la Cuisine est en fonctionnement
      - action: notify.mobile_app_poco_x7_pro_eric
        metadata: {}
        data:
          message: /!\ Chauffage Cuisine "ON" /!\
    - conditions:
      - condition: zone
        entity_id: person.eric
        zone: zone.home
      - condition: time
        after: 06:00:00
        before: 08:30:00
        weekday:
        - mon
        - tue
        - wed
        - thu
        - fri
        - sat
        - sun
      - condition: numeric_state
        entity_id: sensor.th_cuisine_temperature
        above: 20.5
      sequence:
      - action: climate.set_hvac_mode
        metadata: {}
        data:
          hvac_mode: 'off'
        target:
          entity_id: climate.radiateur_cuisine
      - action: notify.alexa_media_echo_dot_cuisine
        metadata: {}
        data:
          message: Le chauffage de la Cuisine est à l'arrêt
      - action: notify.mobile_app_poco_x7_pro_eric
        metadata: {}
        data:
          message: /!\ Chauffage Cuisine "OFF" /!\
  mode: single
- id: '1742931674050'
  alias: Mettre à jour le temps du dernier impact de foudre
  description: Met à jour le temps du dernier impact de foudre lorsque le capteur
    change.
  triggers:
  - entity_id: sensor.blitzortung_lightning_counter
    trigger: state
  conditions:
  - condition: template
    value_template: '{{ states(''sensor.blitzortung_lightning_counter'') | int > 0
      }}'
  actions:
  - target:
      entity_id: input_datetime.dernier_eclair
    data:
      datetime: '{{ now().isoformat() }}'
    action: input_datetime.set_datetime
  mode: single
- id: '1742992851566'
  alias: Mettre à jour le texte du temps écoulé
  description: Met à jour le texte du temps écoulé depuis le dernier impact de foudre
    toutes les minutes.
  triggers:
  - trigger: time_pattern
    seconds: /30
  actions:
  - target:
      entity_id: input_text.dernier_impact_de_foudre_temps_ecoule
    data:
      value: "{% set last_lightning = states('input_datetime.dernier_eclair') %} {%
        if last_lightning not in ['unknown', 'unavailable', 'none', ''] %}\n  {% set
        last_lightning_ts = as_timestamp(last_lightning) %}\n  {% set now = as_timestamp(now())
        %}\n  {% set time_since_last = now - last_lightning_ts %}\n  {% set minutes
        = ((time_since_last % 3600) // 60) | int %}\n  {% set hours = ((time_since_last
        // 3600) % 24) | int %}\n  {% set days = (time_since_last // 86400) | int
        %}\n  {% if days > 0 %}\n    Dernier impact de foudre il y a {{ days }} jours,
        {{ hours }} heures et {{ minutes }} minutes\n  {% elif hours > 0 %}\n    Dernier
        impact de foudre il y a {{ hours }} heures et {{ minutes }} minutes\n  {%
        else %}\n    Dernier impact de foudre il y a {{ minutes }} minutes\n  {% endif
        %}\n{% else %}\n  Dernier impact de foudre : Inconnu\n{% endif %}"
    action: input_text.set_value
  mode: single
