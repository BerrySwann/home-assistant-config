- id: '1760723744000'
  alias: (J) [CLIM OFF] SI [PRISES] EXTÉRIEURES SONT [OFF]
  description: Éteint chaque climatiseur intérieur 1 minute après que sa prise extérieure
    associée soit coupée. Envoie des notifications uniquement entre 6h00 et 20h00,
    avec un délai d'1 heure entre chaque notification.
  triggers:
  - entity_id:
    - switch.clim_salon_nous
    - switch.clim_du_bureau_nous
    - switch.clim_chambre_nous
    from: 'on'
    to: 'off'
    for:
      hours: 0
      minutes: 1
      seconds: 0
    trigger: state
  - minutes: /1
    trigger: time_pattern
  conditions: []
  actions:
  - alias: SI UNE DES 3 CLIM SONT COUPEE
    sequence:
    - if:
      - condition: state
        entity_id: switch.clim_salon_nous
        state: 'off'
      then:
      - target:
          entity_id: climate.clim_salon_rm4_mini
        data:
          hvac_mode: 'off'
        alias: Éteindre clim salon
        action: climate.set_hvac_mode
      - if:
        - condition: and
          conditions:
          - condition: time
            after: 06:00:00
            before: '20:00:00'
          - condition: template
            value_template: '{% set last_notif = state_attr(''automation.k_clim_off_si_prise_clim_exterieur_off'',
              ''last_notification_salon'') | default(0) %} {{ (as_timestamp(now())
              - as_timestamp(last_notif)) > 3600 }}

              '
        then:
        - data:
            title: '[CLIM] SALON [OFF]'
            message: '[PRISE CLIM] ext. [SALON] est [OFF] depuis 1 min.'
          alias: Notification clim salon éteinte
          action: notify.mobile_app_poco_x7_pro
        - target:
            entity_id: automation.k_clim_off_si_prise_clim_exterieur_off
          data:
            variable: last_notification_salon
            value: '{{ now().isoformat() }}'
          action: automation.set_value
      alias: PRISE CLIM SALON
    - if:
      - condition: state
        entity_id: switch.clim_du_bureau_nous
        state: 'off'
      then:
      - target:
          entity_id: climate.clim_bureau_rm4_mini
        data:
          hvac_mode: 'off'
        alias: Éteindre clim bureau
        action: climate.set_hvac_mode
      - if:
        - condition: and
          conditions:
          - condition: time
            after: 06:00:00
            before: '20:00:00'
          - condition: template
            value_template: '{% set last_notif = state_attr(''automation.k_clim_off_si_prise_clim_exterieur_off'',
              ''last_notification_bureau'') | default(0) %} {{ (as_timestamp(now())
              - as_timestamp(last_notif)) > 3600 }}

              '
        then:
        - data:
            title: '[CLIM] BUREAU [OFF]'
            message: '[PRISE CLIM] ext. [BUREAU] est [OFF] depuis 1 min.'
          alias: Notification clim bureau éteinte
          action: notify.mobile_app_poco_x7_pro
        - target:
            entity_id: automation.k_clim_off_si_prise_clim_exterieur_off
          data:
            variable: last_notification_bureau
            value: '{{ now().isoformat() }}'
          action: automation.set_value
      alias: PRISE CLIM BUREAU
    - if:
      - condition: state
        entity_id: switch.clim_chambre_nous
        state: 'off'
      then:
      - target:
          entity_id: climate.clim_chambre_rm4_mini
        data:
          hvac_mode: 'off'
        alias: Éteindre clim chambre
        action: climate.set_hvac_mode
      - if:
        - condition: and
          conditions:
          - condition: time
            after: 06:00:00
            before: '20:00:00'
          - condition: template
            value_template: '{% set last_notif = state_attr(''automation.k_clim_off_si_prise_clim_exterieur_off'',
              ''last_notification_chambre'') | default(0) %} {{ (as_timestamp(now())
              - as_timestamp(last_notif)) > 3600 }}

              '
        then:
        - data:
            title: '[CLIM] CHAMBRE [OFF]'
            message: '[PRISE CLIM] ext. [CHAMBRE] est [OFF] depuis 1 min.'
          alias: Notification clim chambre éteinte
          action: notify.mobile_app_poco_x7_pro
        - target:
            entity_id: automation.k_clim_off_si_prise_clim_exterieur_off
          data:
            variable: last_notification_chambre
            value: '{{ now().isoformat() }}'
          action: automation.set_value
      alias: PRISE CLIM CHAMBRE
  mode: queued
- id: '1760805587570'
  alias: (A - 1) [ARRET 2025-11-09] Automatisation pour contrôler de [06h00 <-> 20h00]
    les climatiseurs en fonction de la température intérieure/extérieure [DELTA] et
    du type de réseau des portables [WIFI/CELLULAR]. (SAUF) L'état des fenêtres [OUVERTE(S)/FERMÉE(S)]
    qui sont contrôlées 24h sur 24.
  description: '[TEST] Automatisation pour contrôler de [06h00 <-> 20h00] les climatiseurs
    en fonction de la température intérieure/extérieure [DELTA] et du type de réseau
    des portables [WIFI/CELLULAR]. (SAUF) L''état des fenêtres [OUVERTE(S)/FERMÉE(S)]
    qui sont contrôlées 24h sur 24.'
  triggers:
  - alias: Changement d'état des fenêtres 'off' -> 'on'
    entity_id:
    - binary_sensor.contact_fenetre_salon_ikea_contact
    - binary_sensor.contact_fenetre_cuisine_ikea_contact
    - binary_sensor.contact_fenetre_bureau_ikea_contact
    - binary_sensor.contact_fenetre_chambre_ikea_contact
    from: 'off'
    to: 'on'
    trigger: state
  - alias: Changement d'état des fenêtres 'on' -> 'off'
    entity_id:
    - binary_sensor.contact_fenetre_salon_ikea_contact
    - binary_sensor.contact_fenetre_cuisine_ikea_contact
    - binary_sensor.contact_fenetre_bureau_ikea_contact
    - binary_sensor.contact_fenetre_chambre_ikea_contact
    from: 'on'
    to: 'off'
    trigger: state
  - alias: Changement de réseau de Mamour 'wifi' -> 'cellular'
    entity_id: sensor.poco_x7_pro_mamour_network_type
    from: wifi
    to: cellular
    trigger: state
  - alias: Changement de réseau de Mamour 'cellular' -> 'wifi'
    entity_id: sensor.poco_x7_pro_mamour_network_type
    from: cellular
    to: wifi
    trigger: state
  - alias: Changement de réseau d'Eric 'wifi' -> 'cellular'
    entity_id: sensor.poco_x7_pro_network_type
    from: wifi
    to: cellular
    trigger: state
  - alias: Changement de réseau d'Eric 'cellular' -> 'wifi'
    entity_id: sensor.poco_x7_pro_network_type
    from: cellular
    to: wifi
    trigger: state
  - alias: Changement d'état des climatiseurs à 'heat'
    trigger: state
    entity_id:
    - climate.clim_salon_rm4_mini
    - climate.clim_bureau_rm4_mini
    - climate.clim_chambre_rm4_mini
    to: heat
  - alias: Changement d'état des climatiseurs à 'cool'
    trigger: state
    entity_id:
    - climate.clim_salon_rm4_mini
    - climate.clim_bureau_rm4_mini
    - climate.clim_chambre_rm4_mini
    to: cool
  - alias: Changement d'état des climatiseurs à 'fan_only'
    trigger: state
    entity_id:
    - climate.clim_salon_rm4_mini
    - climate.clim_bureau_rm4_mini
    - climate.clim_chambre_rm4_mini
    to: fan_only
  - trigger: state
    entity_id:
    - sensor.temperature_cible
  - trigger: state
    entity_id:
    - sensor.mode_ete_hiver
  - trigger: numeric_state
    entity_id: sensor.temperature_delta_valeur
    below: -1
    for: 00:10:00
  - trigger: time
    at: 06:00:00
  conditions: []
  actions:
  - alias: SI UNE FENÊTRES EST OUVERTES OU TOUTES FERMÉES
    choose:
    - alias: SI UNE OU PLUSIEURS FENÊTRES SONT OUVERTES (condition OR)
      conditions:
      - condition: or
        conditions:
        - condition: state
          entity_id: binary_sensor.contact_fenetre_salon_ikea_contact
          state: 'on'
        - condition: state
          entity_id: binary_sensor.contact_fenetre_cuisine_ikea_contact
          state: 'on'
        - condition: state
          entity_id: binary_sensor.contact_fenetre_bureau_ikea_contact
          state: 'on'
        - condition: state
          entity_id: binary_sensor.contact_fenetre_chambre_ikea_contact
          state: 'on'
      sequence:
      - target:
          entity_id:
          - climate.clim_salon_rm4_mini
          - climate.clim_bureau_rm4_mini
          - climate.clim_chambre_rm4_mini
        data:
          hvac_mode: 'off'
        action: climate.set_hvac_mode
      - data:
          title: Clim. DÉSACTIVÉES
          message: "{% if trigger.entity_id == 'binary_sensor.contact_fenetre_salon_ikea_contact'
            and is_state('binary_sensor.contact_fenetre_salon_ikea_contact', 'on')
            %}\n  La fenêtre du Salon a été ouverte.\n{% elif trigger.entity_id ==
            'binary_sensor.contact_fenetre_cuisine_ikea_contact' and is_state('binary_sensor.contact_fenetre_cuisine_ikea_contact',
            'on') %}\n  La fenêtre de la Cuisine a été ouverte.\n{% elif trigger.entity_id
            == 'binary_sensor.contact_fenetre_bureau_ikea_contact' and is_state('binary_sensor.contact_fenetre_bureau_ikea_contact',
            'on') %}\n  La fenêtre du Bureau a été ouverte.\n{% elif trigger.entity_id
            == 'binary_sensor.contact_fenetre_chambre_ikea_contact' and is_state('binary_sensor.contact_fenetre_chambre_ikea_contact',
            'on') %}\n  La fenêtre de la Chambre a été ouverte.\n{% endif %}\n  {%
            if states('sensor.nbre_de_fenetres_ouvertes') == '4' %}\n    Toutes les
            fenêtres sont ouvertes.\n  {% endif %}\n"
        action: notify.mobile_app_poco_x7_pro
    - alias: SI TOUTES LES FENÊTRES SONT FERMÉES (condition AND)
      conditions:
      - condition: and
        conditions:
        - condition: state
          entity_id: binary_sensor.contact_fenetre_salon_ikea_contact
          state: 'off'
        - condition: state
          entity_id: binary_sensor.contact_fenetre_cuisine_ikea_contact
          state: 'off'
        - condition: state
          entity_id: binary_sensor.contact_fenetre_bureau_ikea_contact
          state: 'off'
        - condition: state
          entity_id: binary_sensor.contact_fenetre_chambre_ikea_contact
          state: 'off'
      sequence:
      - choose:
        - conditions:
          - condition: state
            entity_id: sensor.mode_ete_hiver
            state: heat
          - condition: template
            value_template: "{{ states('sensor.th_balcon_nord_temperature') | float
              <\n   states('sensor.temperature_hors_gel_hiver') | float }}"
          - condition: numeric_state
            entity_id: sensor.temperature_delta_valeur
            below: -1
          sequence:
          - target:
              entity_id:
              - climate.clim_salon_rm4_mini
              - climate.clim_bureau_rm4_mini
              - climate.clim_chambre_rm4_mini
            data:
              hvac_mode: heat
              temperature: '{{ states(''sensor.temperature_cible'') | float }}'
            action: climate.set_temperature
          - target:
              entity_id:
              - climate.clim_salon_rm4_mini
              - climate.clim_bureau_rm4_mini
              - climate.clim_chambre_rm4_mini
            data:
              fan_mode: auto
            action: climate.set_fan_mode
        - conditions:
          - condition: state
            entity_id: sensor.mode_ete_hiver
            state: cool
          - condition: numeric_state
            entity_id: sensor.temperature_delta_valeur
            above: -1
          sequence:
          - target:
              entity_id:
              - climate.clim_salon_rm4_mini
              - climate.clim_bureau_rm4_mini
              - climate.clim_chambre_rm4_mini
            data:
              hvac_mode: cool
              temperature: '{{ states(''sensor.temperature_cible'') | float }}'
            action: climate.set_temperature
          - target:
              entity_id:
              - climate.clim_salon_rm4_mini
              - climate.clim_bureau_rm4_mini
              - climate.clim_chambre_rm4_mini
            data:
              fan_mode: auto
            action: climate.set_fan_mode
        - conditions:
          - condition: and
            conditions:
            - condition: state
              entity_id: sensor.mode_ete_hiver
              state: fan_only
            - condition: template
              value_template: "{{ states('sensor.temperature_delta_valeur') | float
                < -1\n   and\n   states('sensor.th_balcon_nord_temperature') | float
                > states('sensor.temperature_hors_gel_hiver') | float }}"
          sequence:
          - target:
              entity_id:
              - climate.clim_salon_rm4_mini
              - climate.clim_bureau_rm4_mini
              - climate.clim_chambre_rm4_mini
            data:
              hvac_mode: 'off'
            action: climate.set_hvac_mode
          - target:
              entity_id:
              - climate.clim_salon_rm4_mini
              - climate.clim_bureau_rm4_mini
              - climate.clim_chambre_rm4_mini
            data:
              fan_mode: auto
            action: climate.set_fan_mode
          - data:
              title: Delta T° < -1°C
              message: Les clim ont été éteinte. ({{ states('sensor.temperature_delta_valeur')
                }}°C)
            action: notify.mobile_app_poco_x7_pro
  - alias: SI 2 PORTABLES EN CELLULAR
    if:
    - condition: and
      conditions:
      - condition: time
        after: 06:00:00
        before: '20:00:00'
      - condition: state
        entity_id: switch.clim_salon_nous
        state: 'on'
      - condition: state
        entity_id: switch.clim_du_bureau_nous
        state: 'on'
      - condition: state
        entity_id: switch.clim_chambre_nous
        state: 'on'
      - condition: state
        entity_id: binary_sensor.contact_fenetre_salon_ikea_contact
        state: 'off'
      - condition: state
        entity_id: binary_sensor.contact_fenetre_cuisine_ikea_contact
        state: 'off'
      - condition: state
        entity_id: binary_sensor.contact_fenetre_bureau_ikea_contact
        state: 'off'
      - condition: state
        entity_id: binary_sensor.contact_fenetre_chambre_ikea_contact
        state: 'off'
      - condition: state
        entity_id: sensor.poco_x7_pro_mamour_network_type
        state: cellular
      - condition: state
        entity_id: sensor.poco_x7_pro_network_type
        state: cellular
    then:
    - choose:
      - conditions:
        - condition: state
          entity_id: sensor.mode_ete_hiver
          state: heat
        sequence:
        - target:
            entity_id: climate.clim_salon_rm4_mini
          data:
            temperature: '{{ states(''sensor.temperature_eco_hiver'') | float }}'
            hvac_mode: '{{ states(''sensor.mode_ete_hiver'') }}'
          action: climate.set_temperature
        - target:
            entity_id: climate.clim_salon_rm4_mini
          data:
            fan_mode: auto
          action: climate.set_fan_mode
        - target:
            entity_id: climate.clim_bureau_rm4_mini
          data:
            temperature: '{{ states(''sensor.temperature_eco_hiver'') | float }}'
            hvac_mode: '{{ states(''sensor.mode_ete_hiver'') }}'
          action: climate.set_temperature
        - target:
            entity_id: climate.clim_bureau_rm4_mini
          data:
            fan_mode: auto
          action: climate.set_fan_mode
        - target:
            entity_id: climate.clim_chambre_rm4_mini
