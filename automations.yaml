- id: '1746961812704'
  alias: Z2M last_seen
  description: Surveillance des capteurs Zigbee injoignables
  triggers:
  - trigger: time
    at: 06:00:00
  - trigger: time_pattern
    minutes: /15
  conditions:
  - condition: template
    value_template: '{{ sensors != '''' and (day | int == 0 or day | int == now().isoweekday())
      }}'
  actions:
  - action: notify.mobile_app_poco_x7_pro_eric
    data:
      title: Problème capteur Zigbee
      message: 'Des capteurs Zigbee ne sont plus joignables : {{ sensors }}'
  variables:
    day: 0
    hours: 8
    exclude:
      entity_id: []
    sensors: "{% set result = namespace(sensors=[]) %} {% for state in states.sensor
      | rejectattr('attributes.device_class', 'undefined') | selectattr('attributes.device_class',
      '==', 'timestamp') %}\n  {% if 'last_seen' in state.entity_id and state.entity_id
      not in exclude.entity_id and (states(state.entity_id) == 'unavailable' or ((as_timestamp(now())
      - as_timestamp(states(state.entity_id))) > ((hours | int) * 60 * 60))) %}\n
      \   {% set result.sensors = result.sensors + [state.name | regex_replace(find='(_|
      )last seen', replace='', ignorecase=true) ~ ' (' ~ relative_time(strptime(states(state.entity_id),
      '%Y-%m-%dT%H:%M:%S%z', 'unavailable')) ~ ')'] %}\n  {% endif %}\n{% endfor %}
      {{ result.sensors | join(', ') }}"
  mode: single
- id: '1748450913123'
  alias: Automation éCO. Prises
  description: Automation basée sur le type de réseau [Wifi et Cellular] des deux
    portables - Pilotage des prises basé sur les groupes de 1 à 4 avec statut du sensor.presence_clim
  triggers:
  - entity_id: sensor.groupe_clim
    trigger: state
  conditions: []
  actions:
  - choose:
    - alias: 'Groupe 1 : Absent'
      conditions:
      - condition: state
        entity_id: sensor.groupe_clim
        state: groupe_1
      sequence:
      - target:
          entity_id:
          - switch.prise_horloge_ikea
          - light.hue_smart_salon
          - switch.ecran_p_c_3_play_hue
          - switch.hue_smart_eco_pc_bureau
          - switch.prise_tete_de_lit_chambre
        action: homeassistant.turn_off
      - action: notify.mobile_app_poco_x7_pro_eric
        data:
          message: '[5] prises [OFF]'
          title:
            '[object Object]':
    - alias: 'Groupe 2 : Mamour'
      conditions:
      - condition: state
        entity_id: sensor.groupe_clim
        state: groupe_2
      sequence:
      - target:
          entity_id:
          - switch.prise_horloge_ikea
          - light.hue_smart_salon
          - switch.ecran_p_c_3_play_hue
          - switch.prise_tete_de_lit_chambre
        action: homeassistant.turn_on
      - target:
          entity_id:
          - switch.hue_smart_eco_pc_bureau
        action: homeassistant.turn_off
      - action: notify.mobile_app_poco_x7_pro_eric
        data:
          message: '[4] prises [ON]'
          title:
            '[object Object]':
    - alias: 'Groupe 3 : Eric'
      conditions:
      - condition: state
        entity_id: sensor.groupe_clim
        state: groupe_3
      sequence:
      - target:
          entity_id:
          - switch.ecran_p_c_3_play_hue
          - switch.hue_smart_eco_pc_bureau
        action: homeassistant.turn_on
      - target:
          entity_id:
          - switch.prise_horloge_ikea
          - light.hue_smart_salon
          - switch.prise_tete_de_lit_chambre
        action: homeassistant.turn_off
      - action: notify.mobile_app_poco_x7_pro_eric
        data:
          message: '[2] prises [ON]'
          title:
            '[object Object]':
    - alias: 'Groupe 4 : Mamour & Eric'
      conditions:
      - condition: state
        entity_id: sensor.groupe_clim
        state: groupe_4
      sequence:
      - target:
          entity_id:
          - switch.prise_horloge_ikea
          - light.hue_smart_salon
          - switch.ecran_p_c_3_play_hue
          - switch.hue_smart_eco_pc_bureau
          - switch.prise_tete_de_lit_chambre
        action: homeassistant.turn_on
      - action: notify.mobile_app_poco_x7_pro_eric
        data:
          message: '[5] prises [ON]'
          title:
            '[object Object]':
  mode: queued
- id: '1750309185567'
  alias: (I) (CLIM DEBUG) Force Mode Correct & Sécurité
  description: 'WATCHDOG :  1. FORCE OFF si tentative d''allumage alors que Prise
    OFF ou Arrêt Sécurisé en cours. 2. FORCE SAISON si une clim est allumée mais dans
    le mauvais mode (ex: Cool au lieu de Heat).'
  triggers:
  - trigger: state
    entity_id:
    - climate.clim_salon_rm4_mini
    - climate.clim_bureau_rm4_mini
    - climate.clim_chambre_rm4_mini
    to:
  - trigger: state
    entity_id: sensor.mode_ete_hiver
    to:
  conditions: []
  actions:
  - delay: 00:00:02
  - alias: CALCUL DES LISTES D'ERREURS
    variables:
      mode_saison: '{{ states(''sensor.mode_ete_hiver'') }}'
      force_off_list: "{% set liste = [] %}\n{# SALON #} {% if states('climate.clim_salon_rm4_mini')
        != 'off' \n      and (is_state('switch.clim_salon_nous', 'off') or is_state('input_boolean.clim_salon_arret_securise_en_cours',
        'on')) %}\n  {% set liste = liste + ['climate.clim_salon_rm4_mini'] %}\n{%
        endif %}\n{# BUREAU : CORRIGÉ #} {% if states('climate.clim_bureau_rm4_mini')
        != 'off' \n      and (is_state('switch.clim_bureau_nous', 'off') or is_state('input_boolean.clim_bureau_arret_securise_en_cours',
        'on')) %}\n  {% set liste = liste + ['climate.clim_bureau_rm4_mini'] %}\n{%
        endif %}\n{# CHAMBRE #} {% if states('climate.clim_chambre_rm4_mini') != 'off'
        \n      and (is_state('switch.clim_chambre_nous', 'off') or is_state('input_boolean.clim_chambre_arret_securise_en_cours',
        'on')) %}\n  {% set liste = liste + ['climate.clim_chambre_rm4_mini'] %}\n{%
        endif %}\n{{ liste }}\n"
      force_mode_list: "{% set liste = [] %}\n{# SALON #} {% if states('climate.clim_salon_rm4_mini')
        not in ['off', 'unavailable', 'unknown', mode_saison] \n      and is_state('switch.clim_salon_nous',
        'on') \n      and is_state('input_boolean.clim_salon_arret_securise_en_cours',
        'off') %}\n  {% set liste = liste + ['climate.clim_salon_rm4_mini'] %}\n{%
        endif %}\n{# BUREAU : CORRIGÉ #} {% if states('climate.clim_bureau_rm4_mini')
        not in ['off', 'unavailable', 'unknown', mode_saison] \n      and is_state('switch.clim_bureau_nous',
        'on') \n      and is_state('input_boolean.clim_bureau_arret_securise_en_cours',
        'off') %}\n  {% set liste = liste + ['climate.clim_bureau_rm4_mini'] %}\n{%
        endif %}\n{# CHAMBRE #} {% if states('climate.clim_chambre_rm4_mini') not
        in ['off', 'unavailable', 'unknown', mode_saison] \n      and is_state('switch.clim_chambre_nous',
        'on') \n      and is_state('input_boolean.clim_chambre_arret_securise_en_cours',
        'off') %}\n  {% set liste = liste + ['climate.clim_chambre_rm4_mini'] %}\n{%
        endif %}\n{{ liste }}\n"
  - if:
    - condition: template
      value_template: '{{ force_off_list | length > 0 }}'
    then:
    - alias: 'NOTIF : INTERDICTION DÉMARRAGE'
      action: notify.mobile_app_poco_x7_pro_eric
      data:
        title: ⛔ SÉCURITÉ CLIM
        message: "Tentative de démarrage interdite (Prise coupée ou Arrêt en cours).
          Retour forcé à OFF pour : {% for c in force_off_list %}\n  - {{ state_attr(c,
          'friendly_name') }}\n{% endfor %}\n"
    - alias: 'ACTION : FORCER OFF'
      action: climate.set_hvac_mode
      target:
        entity_id: '{{ force_off_list }}'
      data:
        hvac_mode: 'off'
  - if:
    - condition: template
      value_template: '{{ force_mode_list | length > 0 }}'
    then:
    - alias: 'NOTIF : CORRECTION MODE'
      action: notify.mobile_app_poco_x7_pro_eric
      data:
        title: "\U0001F527 CORRECTION MODE"
        message: "Mauvais mode détecté. Correction vers {{ mode_saison | upper }}
          pour : {% for c in force_mode_list %}\n  - {{ state_attr(c, 'friendly_name')
          }}\n{% endfor %}\n"
    - alias: 'ACTION : FORCER MODE SAISON'
      action: climate.set_hvac_mode
      target:
        entity_id: '{{ force_mode_list }}'
      data:
        hvac_mode: '{{ mode_saison }}'
  mode: single
- id: '1752138633943'
  alias: (H) (CLIM) Notification de changement de mode Été/Fan/Hiver
