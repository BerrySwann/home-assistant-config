  id: '1736451378096'
  alias: B - Chauffage Cuisine Vacances
  description: 'Allume ou éteint le chauffage selon la température entre 6h00 et 8h30
    la semaine '
  triggers:
  - at: 06:00:00
    trigger: time
  - entity_id:
    - sensor.th_cuisine_temperature
    below: 19.9
    trigger: numeric_state
  - entity_id:
    - sensor.th_cuisine_temperature
    above: 20.5
    trigger: numeric_state
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: zone
        entity_id: person.eric
        zone: zone.home
      - condition: time
        after: 06:00:00
        before: 08:30:00
        weekday:
        - mon
        - tue
        - wed
        - thu
        - fri
        - sat
        - sun
      - condition: numeric_state
        entity_id: sensor.th_cuisine_temperature
        below: 19.9
      sequence:
      - action: climate.set_hvac_mode
        metadata: {}
        data:
          hvac_mode: heat
        target:
          entity_id: climate.radiateur_cuisine
      - action: notify.alexa_media_echo_dot_cuisine
        metadata: {}
        data:
          message: Le chauffage de la Cuisine est en fonctionnement
      - action: notify.mobile_app_poco_x7_pro
        metadata: {}
        data:
          message: /!\ Chauffage Cuisine "ON" /!\
    - conditions:
      - condition: zone
        entity_id: person.eric
        zone: zone.home
      - condition: time
        after: 06:00:00
        before: 08:30:00
        weekday:
        - mon
        - tue
        - wed
        - thu
        - fri
        - sat
        - sun
      - condition: numeric_state
        entity_id: sensor.th_cuisine_temperature
        above: 20.5
      sequence:
      - action: climate.set_hvac_mode
        metadata: {}
        data:
          hvac_mode: 'off'
        target:
          entity_id: climate.radiateur_cuisine
      - action: notify.alexa_media_echo_dot_cuisine
        metadata: {}
        data:
          message: Le chauffage de la Cuisine est à l'arrêt
      - action: notify.mobile_app_poco_x7_pro
        metadata: {}
        data:
          message: /!\ Chauffage Cuisine "OFF" /!\
  mode: single
- id: '1737483248264'
  alias: Gestion Optimisée du Store Bureau
  description: Gère l'ouverture et la fermeture du store du bureau en fonction de
    la température et de l'heure, avec des conditions spécifiques pour le contact
    de la fenêtre et la position du store.
  triggers:
  - at: 07:00:00
    trigger: time
  - event: sunset
    trigger: sun
  - trigger: state
    entity_id:
    - sensor.temperature_cible
  - entity_id: sensor.th_balcon_nord_temperature
    above: 18
    trigger: numeric_state
  - entity_id:
    - sensor.th_balcon_nord_temperature
    above: 25
    trigger: numeric_state
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: time
        after: 07:00:00
      - condition: sun
        before: sunset
      - condition: numeric_state
        entity_id: sensor.th_balcon_nord_temperature
        above: 18
        below: 25
      - condition: state
        entity_id: binary_sensor.contact_fenetre_bureau_ikea_contact
        state: 'off'
      - condition: numeric_state
        entity_id: cover.store_bureau
        attribute: current_position
        below: 50
      sequence:
      - target:
          entity_id: cover.store_bureau
        action: cover.open_cover
        data: {}
      alias: OUVERTURE DU STORE SI APRES 7h & 4 CONDITIONS
    - conditions:
      - condition: numeric_state
        entity_id: sensor.th_balcon_nord_temperature
        above: 24.99
      - condition: state
        entity_id: binary_sensor.contact_fenetre_bureau_ikea_contact
        state: 'off'
      - condition: numeric_state
        entity_id: cover.store_bureau
        attribute: current_position
        above: 50
      sequence:
      - target:
          entity_id: cover.store_bureau
        action: cover.close_cover
        data: {}
      alias: FERMETURE DU STORE SI T° >25°  & 2 CONDITIONS
    - conditions:
      - condition: sun
        after: sunset
      - condition: state
        entity_id: binary_sensor.contact_fenetre_bureau_ikea_contact
        state: 'off'
      sequence:
      - target:
          entity_id: cover.store_bureau
        action: cover.close_cover
        data: {}
      alias: FERMETURE DU STORE AU COUCHE DU SOLEIL  & 1 CONDITION
    default: []
  mode: single
- id: '1740857967163'
  alias: Gestion Optimisée du Store Salon
  description: Gère l'ouverture et la fermeture du store du salon en fonction de la
    température et de l'heure, avec des conditions spécifiques pour le contact de
    la fenêtre et la position du store.
  triggers:
  - minutes: /5
    trigger: time_pattern
  - entity_id: sensor.th_balcon_nord_temperature
    trigger: state
  - event: sunrise
    trigger: sun
  - event: sunset
    trigger: sun
  - entity_id:
    - sensor.poco_x7_pro_mamour_network_type
    from: cellular
    to: wifi
    trigger: state
  - entity_id:
    - sensor.poco_x7_pro_mamour_network_type
    from: wifi
    to: cellular
    trigger: state
  conditions: []
  actions:
  - choose:
    - conditions:
      - alias: OUVERTURE DU STORE AU LEVER DU SOLEIL  & 2 CONDITIONS
        condition: state
        entity_id: sensor.poco_x7_pro_mamour_network_type
        state: wifi
      - condition: state
        entity_id: sensor.poco_x7_pro_mamour_wi_fi_connection
        state: Freebox_GG
      - condition: state
        entity_id: binary_sensor.contact_fenetre_salon_ikea_contact
        state: 'off'
      - condition: sun
        after: sunrise
        before: sunset
      - condition: numeric_state
        entity_id: sensor.th_balcon_nord_temperature
        below: 34
      - condition: numeric_state
        entity_id: cover.store_salon
        above: 50
      sequence:
      - target:
          entity_id: cover.store_salon
        action: cover.open_cover
        data: {}
    - conditions:
      - alias: FERMETURE DU STORE A 50% SI T° >34°  & 3 CONDITIONS
        condition: numeric_state
        entity_id: sensor.th_balcon_nord_temperature
        above: 34
      - condition: state
        entity_id: sensor.poco_x7_pro_mamour_network_type
        state: cellular
      - condition: state
        entity_id: binary_sensor.contact_fenetre_salon_ikea_contact
        state: 'off'
      - condition: sun
        after: sunrise
        before: sunset
      sequence:
      - target:
          entity_id: cover.store_salon
        data:
          position: 50
        action: cover.set_cover_position
    - alias: FERMETURE DU STORE AU COUCHER DU SOLEIL  & 1 CONDITION
      conditions:
      - condition: sun
        after: sunset
      - condition: state
        entity_id: binary_sensor.contact_fenetre_salon_ikea_contact
        state: 'off'
      sequence:
      - target:
          entity_id: cover.store_salon
        action: cover.close_cover
        data: {}
    default: []
  mode: single
- id: '1742931674050'
  alias: Mettre à jour le temps du dernier impact de foudre
  description: Met à jour le temps du dernier impact de foudre lorsque le capteur
    change.
  triggers:
  - entity_id: sensor.blitzortung_lightning_counter
    trigger: state
  conditions:
  - condition: template
    value_template: '{{ states(''sensor.blitzortung_lightning_counter'') | int > 0
      }}'
  actions:
  - target:
      entity_id: input_datetime.dernier_eclair
    data:
      datetime: '{{ now().isoformat() }}'
