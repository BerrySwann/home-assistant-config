- id: '1746961812704'
  alias: Z2M last_seen
  description: Surveillance des capteurs Zigbee injoignables
  triggers:
  - trigger: time
    at: 06:00:00
  - trigger: time_pattern
    minutes: /15
  conditions:
  - condition: template
    value_template: '{{ sensors != '''' and (day | int == 0 or day | int == now().isoweekday())
      }}'
  actions:
  - action: notify.mobile_app_poco_x7_pro
    data:
      title: Problème capteur Zigbee
      message: 'Des capteurs Zigbee ne sont plus joignables : {{ sensors }}'
  variables:
    day: 0
    hours: 4
    exclude:
      entity_id: []
    sensors: "{% set result = namespace(sensors=[]) %} {% for state in states.sensor
      | rejectattr('attributes.device_class', 'undefined') | selectattr('attributes.device_class',
      '==', 'timestamp') %}\n  {% if 'last_seen' in state.entity_id and state.entity_id
      not in exclude.entity_id and (states(state.entity_id) == 'unavailable' or ((as_timestamp(now())
      - as_timestamp(states(state.entity_id))) > ((hours | int) * 60 * 60))) %}\n
      \   {% set result.sensors = result.sensors + [state.name | regex_replace(find='(_|
      )last seen', replace='', ignorecase=true) ~ ' (' ~ relative_time(strptime(states(state.entity_id),
      '%Y-%m-%dT%H:%M:%S%z', 'unavailable')) ~ ')'] %}\n  {% endif %}\n{% endfor %}
      {{ result.sensors | join(', ') }}"
  mode: single
- id: '1748450913123'
  alias: Automation éCO. (Prise) selon le réseau [Wifi et/ou Cellular] des 2 portables
