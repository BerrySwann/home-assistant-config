- id: '1761235548897'
  alias: '[TEST] Gestion Optimisée du Store Bureau'
  description: 'Gère l''ouverture et la fermeture du store du bureau en fonction de
    la température et de l''heure, avec des conditions spécifiques pour le contact
    de la fenêtre et la position du store.

    '
  triggers:
  - at: 07:00:00
    trigger: time
  - event: sunset
    trigger: sun
  - trigger: state
    entity_id:
    - sensor.temperature_cible
  - entity_id: sensor.th_balcon_nord_temperature
    above: 18
    below: 26
    trigger: numeric_state
  conditions: []
  actions:
  - choose:
    - alias: OUVERTURE DU STORE SI APRES 7h & CONDITIONS EN AND
      conditions:
      - condition: and
        conditions:
        - condition: time
          after: 07:00:00
        - condition: sun
          before: sunset
        - condition: numeric_state
          entity_id: sensor.th_balcon_nord_temperature
          above: 18
          below: 25
        - condition: state
          entity_id: binary_sensor.contact_fenetre_bureau_ikea_contact
          state: 'off'
        - condition: numeric_state
          entity_id: cover.store_bureau
          attribute: current_position
          above: 50
      sequence:
      - target:
          entity_id: cover.store_bureau
        action: cover.open_cover
        data: {}
    - alias: FERMETURE DU STORE SI T° >25° & CONDITIONS EN AND
      conditions:
      - condition: and
        conditions:
        - condition: numeric_state
          entity_id: sensor.th_balcon_nord_temperature
          above: 25
        - condition: state
          entity_id: binary_sensor.contact_fenetre_bureau_ikea_contact
          state: 'off'
        - condition: numeric_state
          entity_id: cover.store_bureau
          attribute: current_position
          above: 50
      sequence:
      - target:
          entity_id: cover.store_bureau
        action: cover.close_cover
        data: {}
    - alias: FERMETURE DU STORE AU COUCHER DU SOLEIL & 1 CONDITION
      conditions:
      - condition: and
        conditions:
        - condition: sun
          after: sunset
        - condition: state
          entity_id: binary_sensor.contact_fenetre_bureau_ikea_contact
          state: 'off'
      sequence:
      - target:
          entity_id: cover.store_bureau
        action: cover.close_cover
        data: {}
    default: []
  mode: single
- id: '1761236981200'
  alias: '[TEST] Gestion Optimisée du Store Salon'
  description: 'Gère l''ouverture et la fermeture du store du salon en fonction de
    la température et de l''heure, avec des conditions spécifiques pour le contact
    de la fenêtre et la position du store.

    '
  triggers:
  - minutes: /1
    trigger: time_pattern
  - entity_id: sensor.th_balcon_nord_temperature
    trigger: state
  - event: sunrise
    trigger: sun
  - event: sunset
    trigger: sun
  - entity_id:
    - sensor.poco_x7_pro_mamour_network_type
    from: cellular
    to: wifi
    trigger: state
  - entity_id:
    - sensor.poco_x7_pro_mamour_network_type
    from: wifi
    to: cellular
    trigger: state
  conditions: []
  actions:
  - choose:
    - alias: OUVERTURE DU STORE AU LEVER DU SOLEIL & CONDITIONS EN AND
      conditions:
      - condition: and
        conditions:
        - condition: state
          entity_id: sensor.poco_x7_pro_mamour_network_type
          state: wifi
        - condition: state
          entity_id: sensor.poco_x7_pro_mamour_wi_fi_connection
          state: Freebox_GG
        - condition: state
          entity_id: binary_sensor.contact_fenetre_salon_ikea_contact
          state: 'off'
        - condition: sun
          after: sunrise
          before: sunset
        - condition: numeric_state
          entity_id: sensor.th_balcon_nord_temperature
          below: 32
        - condition: state
          entity_id: cover.store_salon
          state: closed
        enabled: false
      sequence:
      - target:
          entity_id: cover.store_salon
        action: cover.open_cover
        data: {}
        enabled: false
    - alias: FERMETURE DU STORE A 50% SI T° >32° & CONDITIONS EN AND
      conditions:
      - condition: and
        conditions:
        - condition: numeric_state
          entity_id: sensor.th_balcon_nord_temperature
          above: 32
        - condition: state
          entity_id: sensor.poco_x7_pro_mamour_network_type
          state: cellular
        - condition: state
          entity_id: binary_sensor.contact_fenetre_salon_ikea_contact
          state: 'off'
        - condition: sun
          after: sunrise
          before: sunset
        enabled: false
      sequence:
      - target:
          entity_id: cover.store_salon
        data:
          position: 50
        action: cover.set_cover_position
        enabled: false
    - alias: FERMETURE DU STORE AU COUCHER DU SOLEIL & CONDITIONS EN AND
      conditions:
      - condition: and
        conditions:
        - condition: sun
          after: sunset
        - condition: state
          entity_id: binary_sensor.contact_fenetre_salon_ikea_contact
          state: 'off'
      sequence:
      - target:
          entity_id: cover.store_salon
        action: cover.close_cover
        data: {}
    default: []
  mode: single
