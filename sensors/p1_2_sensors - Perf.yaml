# ╭──────────────────────────────────────────────────────────────────────────╮
# │ SENSOR : STATISTIQUES DE PERFORMANCE THERMIQUE (MOYENNE 24H)             │
# ╰──────────────────────────────────────────────────────────────────────────╯

# ┌───────────────────────────────────┐
# │ 4. SALON                          │
# └───────────────────────────────────┘
# --- perf_salon_moy_jour ---
  - platform: statistics
    name: "Performance Salon (moy jour)"
    unique_id: perf_salon_moy_jour
    entity_id: sensor.performance_thermique_salon
    state_characteristic: mean
    max_age:
      hours: 24
    precision: 2

