git_pull:
  alias: Git_Pull
  mode: queued
  sequence:
  - action: shell_command.git_pull_ff
  - delay: 00:00:02
  - data:
      title: Git Pull
      message: Fetch/prune + pull --ff-only lancé sur /config.
    action: persistent_notification.create
  description: ''

# -----------------------------------------------------------
# Scripts Backup GitHub (CORRIGÉS : Update Journal + Status)
# -----------------------------------------------------------

git_backup_and_update:
  alias: Git Backup & Refresh
  icon: mdi:cloud-upload
  sequence:
    # ⚠️ APPEL DE LA NOUVELLE shell_command.git_backup_push_manual
    - service: shell_command.git_backup_push_manual
      data:
        custom_message: "Sauvegarde Manuelle (Dashboard)" 
    - delay:
        seconds: 8
    - target:
        entity_id: 
          - sensor.backup_github_status
          - sensor.backup_github_journal
      action: homeassistant.update_entity
    - action: persistent_notification.create
      data:
        title: Git Push
        message: "Sauvegarde Manuelle (Dashboard) terminée (Journal mis à jour)."

# Laissez le script git_backup_weekly_and_update inchangé.



git_backup_weekly_and_update:
  alias: Git Backup Weekly & Refresh
  icon: mdi:calendar-clock
  sequence:
  - action: shell_command.git_backup_push_weekly
  - delay:
      seconds: 8
  - target:
      entity_id:
        - sensor.backup_github_status
        - sensor.backup_github_journal  # <--- AJOUTÉ
    action: homeassistant.update_entity
  - action: persistent_notification.create
    data:
      title: Git Push Weekly
      message: "Sauvegarde Hebdomadaire terminée (Journal mis à jour)."