git_pull:
  alias: Git_Pull
  mode: queued
  sequence:
  - action: shell_command.git_pull_ff
  - delay: 00:00:02
  - data:
      title: Git Pull
      message: Fetch/prune + pull --ff-only lancé sur /config.
    action: persistent_notification.create
  description: ''

# -----------------------------------------------------------
# Scripts Backup GitHub (CORRIGÉS avec Notification)
# -----------------------------------------------------------

git_backup_and_update:
  alias: Git Backup & Refresh
  icon: mdi:cloud-upload
  sequence:
  - action: shell_command.git_backup_push
  - delay:
      seconds: 5
  - target:
      entity_id: sensor.backup_github_status
    action: homeassistant.update_entity
  # AJOUT DE LA NOTIFICATION ICI
  - action: persistent_notification.create
    data:
      title: Git Push
      message: "Sauvegarde vers GitHub terminée (Statut mis à jour)."

git_backup_weekly_and_update:
  alias: Git Backup Weekly & Refresh
  icon: mdi:calendar-clock
  sequence:
  - action: shell_command.git_backup_push_weekly
  - delay:
      seconds: 5
  - target:
      entity_id: sensor.backup_github_status
    action: homeassistant.update_entity
  # AJOUT DE LA NOTIFICATION ICI
  - action: persistent_notification.create
    data:
      title: Git Push Weekly
      message: "Sauvegarde Hebdomadaire terminée (Statut mis à jour)."
