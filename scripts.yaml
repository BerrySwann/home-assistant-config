git_pull:
  alias: Git_Pull
  mode: queued
  sequence:
  - action: shell_command.git_pull_ff
  - delay: 00:00:02
  - data:
      title: Git Pull
      message: Fetch/prune + pull --ff-only lancé sur /config.
    action: persistent_notification.create
  description: ''
git_backup_and_update:
  alias: Git Backup & Refresh
  icon: mdi:cloud-upload
  sequence:
  - service: shell_command.git_backup_push_manual
    data:
      custom_message: Sauvegarde Manuelle (Dashboard)
  - delay:
      seconds: 8
  - target:
      entity_id:
      - sensor.backup_github_status
      - sensor.backup_github_journal
    action: homeassistant.update_entity
  - action: persistent_notification.create
    data:
      title: Git Push
      message: Sauvegarde Manuelle (Dashboard) terminée (Journal mis à jour).
git_backup_weekly_refresh:
  alias: Git Backup Weekly & Refresh
  icon: mdi:calendar-clock
  sequence:
  - action: shell_command.git_backup_push_weekly
  - delay:
      seconds: 8
  - service: homeassistant.update_entity
    target:
      entity_id:
      - sensor.backup_github_status
      - sensor.backup_github_journal
  - service: persistent_notification.create
    data:
      title: Git Push Weekly
      message: Sauvegarde Hebdomadaire terminée (Journal mis à jour).
clim_secure_off:
  alias: Coupure Sécurisée de la Clim
  description: Éteint le thermostat, active un verrou, attend l'arrêt compresseur,
    coupe la prise. VERSION UNIFIÉE (switch.clim_bureau_nous)
  mode: single
  fields:
    piece:
      description: 'Pièce (ex: salon, bureau, chambre)'
      example: salon
      required: true
  variables:
    p: '{{ piece | lower }}'
    lock_entity: input_boolean.clim_{{ p }}_arret_securise_en_cours
    clim_entity: climate.clim_{{ p }}_rm4_mini
    switch_entity: switch.clim_{{ p }}_nous
    power_status_sensor: sensor.{{ p }}_power_status
    piece_nom: '{% if p == ''salon'' %} du Salon  {% elif p == ''bureau'' %} du Bureau  {%
      elif p == ''chambre'' %} de la Chambre  {% else %} Inconnue {% endif %}

      '
  sequence:
  - alias: Activation Sécurité
    target:
      entity_id: '{{ lock_entity }}'
    action: input_boolean.turn_on
  - alias: Arrêt Thermostat
    target:
      entity_id: '{{ clim_entity }}'
    action: climate.set_hvac_mode
    data:
      hvac_mode: 'off'
  - if:
    - condition: template
      value_template: '{{ is_state(power_status_sensor, ''off'') }}'
    then:
    - target:
        entity_id: '{{ switch_entity }}'
      action: switch.turn_off
    - action: notify.mobile_app_poco_x7_pro
      data:
        title: Prise clim extérieure
        message: La Clim {{ piece_nom }} est coupée (déjà en veille).
    else:
    - action: notify.mobile_app_poco_x7_pro
      data:
        title: ARRÊT CLIM EN COURS
        message: La Clim {{ piece_nom }} s'arrête. Attente arrêt compresseur (~ 5
          min).
    - wait_for_trigger:
      - trigger: template
        value_template: '{{ is_state(power_status_sensor, ''off'') }}'
      timeout: 00:05:00
      continue_on_timeout: true
    - if:
      - condition: template
        value_template: '{{ wait.completed }}'
      then:
      - target:
          entity_id: '{{ switch_entity }}'
        action: switch.turn_off
      - action: notify.mobile_app_poco_x7_pro
        data:
          title: CLIM À L'ARRÊT
          message: La prise de la Clim {{ piece_nom }} a été coupée.
      else:
      - action: notify.mobile_app_poco_x7_pro
        data:
          title: ERREUR ARRÊT CLIM
          message: 'ÉCHEC : Arrêt Clim {{ piece_nom }} après 5 min.  Prise maintenue
            pour sécurité.'
  - target:
      entity_id: '{{ lock_entity }}'
    action: input_boolean.turn_off
